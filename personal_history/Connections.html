ht of painting \"sections\" of the world on clear acetate, when you piled the transparencies, you would create a kind of 3 dimensions. Flip-book; looks like 2D image untill you start removing the layers, and revealing what had been hidden by an object further in the foreground. Do this to a master painting?<\/code><\/li><\/ul>\n<h4>Inducing 3D Space: Mary, Julien &amp; Katrine, Annecy &amp; Childe Hassam (p. 103)<\/h4>\n<p>There must be many ways of enducing the viewer's mind to form 3D mental precept — which is his mind's normal way of viewing the world. I always think of Mary (librarian at work) sitting at the other side of the circular lunch table <i>[Sketch of circular table and figure]<\/i> — that large flat plane took up the entire bottom half of my vision / I was very aware of the space between me &amp; her.<\/p>\n<p>Yesterday I sat on the very flat lawn and was looking at the space between Julien and Katrine's bodies, I was very aware of that distance, more so than would be possible by a drawing which included the old couple (smaller than their heads) <i>[Sketch of Julien &amp; Katrine in foreground with tiny figures behind]<\/i>. Looking at the sparkling sun on the water <code>[p. 101]<\/code> that distance was made evident by the pattern (for which word exists in French) of lights which got tighter &amp; brighter as it got farther away, but Julien &amp; the grass, Mary at the table &amp; my Chapel York painting of the flat parking lot aren't about pattern, just distance. Childe Hassam's ocean painting at the YUAG doesn't invoke distance as much as it brings attention to the texture which make the waves — the brightest lights are made by reflections on the surface texture of the paint. One would have to check this by moving the light or the painting around.<\/p>\n<h4>Flashlight Dark Room &amp; Mirror-House Space (pp. 103–103v)<\/h4>\n<p>I thought of a very dark space where the viewer would have to bring his own light — carry a flashlight. He could investigate textures, spaces by his own ray of light, the textures their own mean. — move light source = composite images. Create single illusions w/ \"place light here signs\" — but he travels w/ his light to each individual viewing spot.<\/p>\n<p>I thought of my transparent mirror sculpture w/ a hole underneath for the viewer's flashlight — force him to investigate on his own.<\/p>\n<ul><li>could create effects w/ mirrors, his light bouncing off a mirror — like walking in the mirror house at Nat'l Gallery of Art, viewer had to move into space to sound the difference btw. mirrored bed &amp; mirror chair on mirror floor.<\/li><\/ul>\n<p>I am controlling his viewing &amp; making him see, he does not see till he shines his light on an object. —<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p045.jpg", "attachments/pages/scan_1994_2_p046.jpg"]}, "1995-08-27_Weathering-Series": {"t": "Weathering Series", "d": "1995-08-27", "est": true, "w": 1995.6546, "era": "DC, Post-College", "th": ["painting-concepts", "project-list", "materiality"], "pp": ["Duchamp", "Hans Haacke", "Pollock"], "body": "<p>Next ideas:<br>continuation of painting placements - removing the artist.<br>weathering series: <s>get<\/s> make several mono-chrome <u>blue<\/u> (cobalt/cerulean/ultra marine) boards or canvases - I have not decided on the application (texture) yet - but <s>[?]<\/s> want emphasis on the material → leave each in a different environmental situation - document - prescribed (or at least documented) amount of time gather the results, &amp; frame &amp; hang together.<br>Earth, air, fire, water -<br>Duchamp's dust gathering, Hans Haacke, Pollock<\/p>", "notes": "Undated; after a rule below the 8/27 entry. \"Duchamp's dust gathering\" is Man Ray's photograph <i>Dust Breeding<\/i> (1920) of dust collecting on Duchamp's <i>Large Glass<\/i>. The top of this crop overlaps the end of <span class=\"wl\" data-note=\"1995-08-27_Jono-Laughs-Without-a-Sound\">1995 08 27_Jono Laughs Without a Sound<\/span>.", "img": ["attachments/pages/scan_1995_p093.jpg"]}, "1995-03-06_A-Way-of-Seeing-and-Missing-Katherine": {"t": "A Way of Seeing, and Missing Katherine", "d": "1995-03-06", "est": false, "w": 1995.1804, "era": "Final Semester Yale 1995", "th": ["observation", "painting", "katherine", "separation"], "pp": ["Katherine"], "body": "<p>March 6th<br>The painting classes taught a way of seeing more than they did anything else. I carry this with me every day it colors my expeience of the real world this is more powerful than the moment of seeing before a painting.<br>just like aging, beautiful weathering can't be faked. I would want to build a weathered barn - but no one can. It is better just to find it.<br>I missed katherine terribly last night. It would be so good to see her even if we are broken up.<\/p>", "notes": "", "img": ["attachments/pages/scan_1995_p042.jpg"]}, "1995-03-12_Camus-Nudite-and-Noces": {"t": "Camus' \"Nudité\" and Noces", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["literature", "body", "photography", "french", "flight"], "pp": ["Camus", "Edward Weston", "Turrell"], "body": "<p>Camus' \"nudité\" made me imagine walking naked in the desert, maybe this summer. It is funny that one is never struck by the nudity of a picture of a naked woman in the sand The naked woman is \"familiar\" centuries of depiction When I see the weston I do not think of what that model must have felt lying in the sand - how the sun felt on her skin or the sand under her body the experience is absolutely flattened.<br>Trying to include the picture taker, the me, rather than the you in the image - I did that alot this summer w/ the shadows, &amp; reflections of myself cropping up in the world - I was there feeling it It cannot exist on its own The tree<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>falling in the forest makes no noise unless I am there to hear it.<br>...\"j'aime trop la vie pour ne pas être égoïste.\" - Camus <u>Noces<\/u> p. 40<br>I read Camus and I am so excited I cannot sit still I want to jump up and experience the world - go to Algiers and see the bronzed bodies and feel my skin change color as the sun beats deeper into the month of August. His art drives one directly back into the world one almost does not care to finish the chapter, but rather if it wasn't a chilly night in early March in New Haven but rather a sunny summer day near a beach, I would drop the book and rush outside. Even so I suddenly feel excited to go for a jog.<br>à mesure qu'on avance dans le mois d'août et que le soleil grandit, le blanc des maisons se fait plus aveuglant et les peaux prennent une chaleur plus sombre. Comment alors ne pas s'identifier à ce dialogue de la pierre et de la chair <u>à la mesure du soleil et des saisons<\/u>? - Noces \"L'été à Alger\" - p. 53<br><code>[bracketed:]<\/code> \"Tout passe, sauf le souvenir\" - p. 62.<br><code>[a long arrow from the bracketed Noces passage leads to:]<\/code> Of course Turrell would rather fly a plane than make art. His art is made - each day is ripe for a new cross-wind and light situation. -<br>\"Le contraire d'un peuple civilisé, c'est un peuple créateur.\" - 64-65<br>his idea of creation is a bit (??) particular -<\/p>", "notes": "Undated; it follows on from Camus's \"nudité\" in \"Le Vent à Djémila\" (<span class=\"wl\" data-note=\"1995-03-12_Grey-Sunday-Camus-Noces-and-Quoting\">1995 03 12_Grey Sunday Camus Noces and Quoting<\/span>). \"the weston\" is probably one of Edward Weston's nudes in the dunes at Oceano (1936). The quotations are from <i>Noces<\/i> (1938). The lower part of page 53 is blank.", "img": ["attachments/pages/scan_1995_p052.jpg", "attachments/pages/scan_1995_p053.jpg"]}, "1994-07-10_Edward-Hopper-Rooms-by-the-Sea-Diagram": {"t": "Analytical Color & Angle Diagram: Edward Hopper’s *Rooms by the Sea* (1951)", "d": "1994-07-10", "est": false, "w": 1994.5247, "era": "Yale, New Haven", "th": ["color-theory", "sunlight", "tonal-painting", "yuag-study"], "pp": ["Edward Hopper", "Childe Hassam"], "body": "<ul><li><b>Artwork Studied:<\/b> Edward Hopper, <i>\"Rooms by the Sea,\"<\/i> 1951 (Yale University Art Gallery).<\/li><li><b>Diagram Annotations (Left to Right):<\/b><\/li><li><b>Upper Left &amp; Doorway:<\/b> <code>\"can see ceiling line\"<\/code>, <code>\"glazes\"<\/code>, <code>\"sharper angle\"<\/code>, <code>\"blue green\"<\/code>, <code>\"diff angle\"<\/code>, <code>\"red\"<\/code> (light/dark split on jamb), <code>\"almost horizontal\"<\/code>.<\/li><li><b>Central Sunlit Wall &amp; Floor:<\/b> <code>\"same &amp; same height\"<\/code>, <code>\"blue grey w/ purple\"<\/code> (diagonal shadow), <code>\"rather thick\"<\/code>, <code>\"pink\"<\/code>, <code>\"almost pure white\"<\/code>, <code>\"blue\"<\/code>, <code>\"yellow\"<\/code>, <code>\"grn/yl/brwn\"<\/code>, <code>\"horizontal →\"<\/code>.<\/li><li><b>Right Doorway &amp; Comparison:<\/b> <code>\"warm green blue\"<\/code>, <code>\"warm blue\"<\/code>, <code>\"purple shadow dark\"<\/code>, <code>\"cer. cobalt\"<\/code>, <code>\"green\"<\/code>, <code>\"whitest\"<\/code>, <code>\"white waves thickest paint pale pthalo\"<\/code> → <code>\"not thick like Childe Hassam's 'The West Wind, Isles of Shoals' 1904\"<\/code>.<\/li><li><b>Bottom Synthesis Notes:<\/b><\/li><li><code>- does operate tonally<\/code><\/li><li><code>- strong feeling of sunlight<\/code><\/li><li><code>- color game: if there is pure white, it is painted on top of other colors &amp; does not appear so except in top corner of sunlight near top of the door.<\/code><\/li><\/ul>", "notes": "", "img": []}, "1998-12-15_Harmonics-of-the-Bell-at-IRCAM": {"t": "Harmonics of the Bell at IRCAM", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["music", "sound-art", "project-list"], "pp": ["Groves"], "body": "<p><code>[a short line marked with ticks, like a scale]<\/code><br>① <code>[an asterisk:]<\/code> study harmonics of the bell.)<br>② - record some (instruments) built. - sounds @ ircam.<br>③ → Groves @ ircam.<\/p>", "notes": "Undated, in black ink. IRCAM is the music research institute at the Centre Pompidou in Paris. Groves is not identified.", "img": ["attachments/pages/scan_1997_2_p057.jpg"]}, "1997_p014_Langage-et-Image-Mallarme-Valery-Barthes-Twombly": {"t": "Langage et image : Mallarmé, Valéry, Barthes, Twombly", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["language", "word-and-image", "writing-process", "french", "semiotics"], "pp": ["Stéphane Mallarmé", "Paul Valéry", "Marcel Proust", "Roland Barthes", "Cy Twombly", "Jorge Luis Borges", "Guillaume Apollinaire", "Luis Prieto"], "body": "<p>language ↔ lange[?]<br>hiatus?<\/p>\n<p>Un coup de dès n'abolira jamais le hazard. - Mallarmé. 1887<\/p>\n<p>Picture poems   [→ Types of Shape ←]   - Valéry<br>Il me sembla de voir la figure d'une pensée.<\/p>\n<p>autographique - object materiel.<br>alographique - object idéale.<br>graphein - peindre, ecrire, dessiné. Anc. Grec.<\/p>\n<p>procédé litteraire -<br>l'autofiction -   Proust - mots dessinateurs.<br>Barthes → Twombly<br>↳ dessins écrivants.   Rhythme -<br>ecrire : pratique corporel de jouissance<\/p>\n<p><u>Nebuleuse du crabe<\/u>.   <u>Borges<\/u> Pierre Ménard auteur du Quichotte<br>- fictionnes<\/p>\n<p>Anphion faux Mesi - Appolinaire<br>les aventures du Baron dormeson.<br>Anphionie -   c'est toujour les autres qui meurent<br>Bellaquista[?] -   Louis Prieto - le myth de l'originale<br>Fev. '90<\/p>", "notes": "Notes from a lecture or reading, in French. \"autographique / alographique\" are Nelson Goodman's terms (compare <i>Goodman, Languages of Art<\/i>, 1994). \"Anphion faux Mesi\" is Apollinaire's story \"L'Amphion faux-messie ou histoires et aventures du baron d'Ormesan\"; \"c'est toujours les autres qui meurent\" is Duchamp's epitaph. \"Fev. '90\" seems to date Prieto's text, not this page. \"lange\" (first line) and \"Bellaquista\" are uncertain.", "img": ["attachments/pages/scan_1997_p014.jpg"]}, "1994-08-06_Letting-Go-and-Chris-Loffts-B17": {"t": "Letting Go in the Mountains & Chris Lofft's B-17", "d": "1994-08-06", "est": false, "w": 1994.597, "era": "Summer 1994, Travel and Alps", "th": ["painting-process", "play", "childhood-models"], "pp": ["Chris Lofft"], "body": "<p>I think I am way too hung up on what the artwork looks like. I would be in a much better situation if I had fun making—if I let myself go. I have been getting so hung up because I am feeling like my images are so important, rather than enjoying making them. I should run with the ideas of mixing stuff into the paint.<\/p>\n<p>Eventually I will make something which someone will fixate upon and love the way Chris Lofft fixated on the B-17 model I made. I will never know exactly what he loved about it, or why he picked it up every time he came over even very late after we were in college, but I know that plane was made at the height of my model-building activities.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p076.jpg"]}, "1998-12-15_Histoire-de-la-Ville-Premier-Cours": {"t": "Histoire de la Ville, Premier Cours", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["french", "urbanism", "coursework", "architecture"], "pp": ["Le Corbusier", "Haussmann"], "body": "<p><s>[?]<\/s> Hist. de la ville - 1ere cour<br>jamais avant notre siecle un immeuble à été construit par un seul architecte dans une si courte durée<br>ville corbusienne (vs.)<br>art = rendre phenomène + lisible<br>Odeon XVIII - patte d'oie - syntagme<br>Haussmann = système - alignement<\/p>", "notes": "Undated; notes from the first lecture of a course on the history of the city, probably at the Beaux-Arts. \"Odéon XVIII\" is the 18th-century Odéon quarter of Paris, laid out as a <i>patte d'oie<\/i> (goose-foot of radiating streets).", "img": ["attachments/pages/scan_1997_2_p066.jpg"]}, "1995-01-16_Art-Major-Meeting-Essentialism": {"t": "Art Major Meeting: Essentialism", "d": "1995-01-16", "est": false, "w": 1995.0411, "era": "Final Semester Yale 1995", "th": ["art-theory", "coursework", "aesthetics", "modernism"], "pp": ["Thomas Kuhn", "Aristotle", "Mondrian", "Koons", "Clive Bell", "Ruskin", "Benjamin", "Michelangelo", "Newman", "Tolstoy", "Duchamp", "Kandinsky", "Braque", "Picasso", "Monet", "Boccioni", "Cézanne", "Ron Jones", "Cage"], "body": "<p>1/16 1st <u>Art major meeting<\/u> -<br>\"kill'em or convert'em\"<br>\" Structure of Scientific revolution\" Thomas Koon<br>each scientific age = one pervading paradigm.<br>↳ so intell. persuasive.<br>- art governed by similar paradigms<br>we are just at the other side of a shift.<br><u>1st Essentialism<\/u> - (paradigm)<br>What is it that w/out which a work of art would cease to be?<br>or.<br>what is necessary for a work of art to exist?<br>- If <s>[?]<\/s> they are present, only those qualities are necess.<br>Arist. <u>Poetics<\/u> - essentialist<br>\"Art is immatation<br>good for 3 reasons.<br>1) Humans like it<br>2) we learn through it<br>3) It is natural.<br><code>[to the right, linked by braces and arrows:]<\/code> → to immitate or immitation?<br>} <u>process<\/u><br>→ immitating or by seeing immitation<br>\"possible to correct nature.\" - Idealized form.<br>Perfecting Representation<br><u>Mondrian<\/u>: Theosiphist - certain natural proportion &amp; harmony.<br><code>[bracketed:]<\/code> tides, season, rhythms<br>way of understanding &amp; expressing those forces.<br>↳ would paint trees - &amp; abstract &amp; distill<br>- painting actually reveals or uncovers nat. prop. - immitates<br>- one would sense same well being - ultimate correction.<br>koons - ideal commodity <code>[sketch: a small face]<\/code> - film / porn star.<br><u>Clive Bell<\/u> - Bloomsbery group - next after Ruskin<br>\"<u>Art<\/u>\" (1914) - Primary essentialism as we see modernism unfold<br>- reasonable to wonder why people have no probl. recognizing a work of art. - humans can tell the difference.<br>doesn't it make sense that art objects possess something - what is that thing? <u>Essential<\/u> quality<br>↳ same as \"aura\" of Benjamin<br>\"all <u>sensitive people<\/u> have <u>aesthetic emotion<\/u> in front of a <u>work of art<\/u>.\"<br>Clive says: significant form - can't be more specific.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>He's talking in purely abstract terms -<br>Mondrian used as an example &amp; would be happy w/ Michelangelo<br><code>[circled:]<\/code> Essentialism is temporally &amp; culturally unbounded<br>- there are no exceptions<br>significant form is <u>universal<\/u><br>Newman - subscribed. Aesthetic act = pure idea<br>interesting to read take into account where he wrote it<br>Heroics of line - <code>[circled:]<\/code> √5 reappears in the heavens line Golden Mean.<br>- other experience - passage → Parthenon.<br>- Newmann believed experience would be delivered<br>- didn't point delivers the experience - real.<br><u>Tolstoy<\/u> - the treat of fraudulence - somebody mistaking an experience<br>Bell - doesn't like descriptive painting<br>= <s>[?]<\/s> convey information rather than evoke emotion<br>Duchamp - illustration<br>- wanted to diffect aesthetic experience <s>[?]<\/s> uses mechanical drawing<br>Bell <s>[?]<\/s> | <u>Futurists<\/u> |<br>Suffered under pontilism &amp; cubism.<br>Italians left out of industrialisation<br>Ind. → kand., Brque, Picasso - reflect immense cultural change<br>Italy provided Eng. Fr. &amp; Germ. connection to past → what seemed to be being lost.<br>V. radical - Manifesto -<br><u>City rises<\/u> - no sign. form - rallying<br>(Bell) → Futr. not art - b/c social analysis.<br>Monet out too - social analysis.<br>- can't coexist Essentialism - easy no grey.<br><u>Bell<\/u> 3 Classes -<br>1) <code>[circled:]<\/code> Primitive art - only sig. form - no tech swagger → Sumaria, Egypt, S. America. honors it just incapable of living up to standard<br>2) Judgement calls<br>3) Decriptive - not<br>- Multiculturalism not part of his agenda. can't crit. him too harshly<br><u>Bell's<\/u> triangular conception <code>[sketch: a triangle with corners labelled \"Boccioni\", \"Mond\" / \"Cezanne\" and \"Cycladic\"]<\/code><br>What if you don't get your buttons pushed?<br>Either theory is essential, or it isn't - single exception &amp; entire theory collapses. → Clive would teach you - conissenship - where there can be no exceptions - assumption: artwork not defective, you are!<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>can be no exceptions. - facet reminds Ron of cavalry out west.<br>plenty of Amer. Indians exception to believing in many God's<br>\" <u>kill'em or convert'em<\/u> \" - can't have<br>exception - calls in integrity of way of life<br>↳ fuel of essentialism.<br>Bell's theory so fragile - <s>makes it<\/s> rigid, delicate.<br>Newt[?] &amp; Bell have some problem: theory so rigid that fragile.<br>there are works of art which can't be rehabilitated.<br>Bell almost predictable b/c of his milean<br>aesthetic colonialism - turn into reflection of self - reaffirm own self &amp; positions. Bell didn't think he was doing a bad thing - benevolent colonialism w/out looking @ underbelly.<br><u>Urinal<\/u> - \"deficient &amp; irrecoverable\" - Bell.<br><code>[bracketed:]<\/code> Art = Life crosses (cézanne) Essentialism.<br>↳ Duchamp.<br>→ direct attack on essentialism.<br><code>[to the right, in black pen:]<\/code> can Cage be seen as outcome of essentialism - no. outcome of Art = life / nature and is thus comparable to Duchamp<br>- sent artist, theorists etc. scrambling how do you deal w/ this exception.<br>How essentialism dismantled.<br>not artists &amp; critics - philosophers &amp; aestheticians dismantling.<\/p>", "notes": "Lecture notes from the first meeting of the art majors' seminar, in blue pen; the remark about Cage is added in black. \"Thomas Koon\" is Thomas Kuhn, <i>The Structure of Scientific Revolutions<\/i>. Newman is Barnett Newman; \"Newt\" on the third page probably means Newman too. Ron is Ron Jones, the lecturer. \"Mond\" in the triangle is Mondrian.", "img": ["attachments/pages/scan_1995_p015.jpg", "attachments/pages/scan_1995_p016.jpg", "attachments/pages/scan_1995_p017.jpg"]}, "1998-10-15_Philosophy-of-A-Life-Boden-and-Langton": {"t": "The Philosophy of A-Life: Boden and Langton", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["reading", "systems", "cognition", "technology"], "pp": ["David Kirsh", "Margaret Boden", "Christopher G. Langton", "Tommaso Toffoli", "Norman Margolus"], "body": "<p>David Kirsch - Today the earwig tomorrow man.<br><u>The Philosophy of A-life<\/u> M. Boden Oxford<br>- Intentional Act - grasping coke can.<br>- non intention act - twitching, wincing<br>In fact and enourmous amount of our lives falls into second category → going w/ the flow of what you are programmed to do only occasionally do you stop, put a halt to all this and decide what next or what have I done. -<br>___<br>Christopher G. Langton \"A-life\"<br>\"With the precipitous drop in the cost of raw computing power, computers are now available that are capable of simulating physical systems from first principles. This means that it has become possible, for example, to model turbulent flow in a fluid by simulating the motions of its constituent particles - not just by approximating changes in concentrations of particles at particular points, but actually computing their motions exactly.\" Toffoli (1984)<br>\"complex behavior need not have complex roots\" <code>[a squiggle, then, in pencil:]<\/code><br><code>[in pencil, boxed:]<\/code> \"Cellular Automata as an Alternative to (Rather than approximation) Differential Equations in Modeling Physics\" Cellular Automata: Proceedings - Los Alamos NM, March 7-11, 1983 and Margolus, N. 1987 <u>Cellular Automata machines<\/u> Cambridge MA, MIT<\/p>", "notes": "Undated. Reading notes on <i>The Philosophy of Artificial Life<\/i>, edited by Margaret Boden (Oxford, 1996), which opens with David Kirsh's \"Today the earwig, tomorrow man?\" and includes Christopher Langton's \"Artificial Life\". The pencil references are Tommaso Toffoli's 1984 paper and Toffoli and Margolus, <i>Cellular Automata Machines<\/i> (MIT Press, 1987).", "img": ["attachments/pages/scan_1997_2_p029.jpg"]}, "1998-12-15_Kitanos-A-Scene-at-the-Sea-and-Memes": {"t": "Kitano's \"A Scene at the Sea\", and Memes", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["film", "perception", "mass-culture"], "pp": ["Takeshi Kitano"], "body": "<p>I had a thought the other day watching kitano's \"a day at the sea\". the beginning's build up to his buying a surf board was quite nice. at the very beginning he is collecting trash and stops to look at the sea. we don't know that he is deaf yet but he's in another world. What blocks us from looking at the sea when we want? Many people (two men) would feel uncomfortable in that situation → \"aw - let's go to the bar, there's no point in standing<\/p>\n<p><b>Page 53 (page 52 holds only a later note):<\/b><\/p>\n<p>here like idiots\". What is the impulse that makes people act in a certain way, that you have to be in another world, deaf, etc. not to feel moved <code>[below:]<\/code> &amp; impelled. by these cultural exigencies -<br>These forces are <u>memes<\/u> I think.<\/p>", "notes": "Undated. Takeshi Kitano's film is <i>A Scene at the Sea<\/i> (<i>Ano natsu, ichiban shizukana umi<\/i>, 1991), about a deaf garbage collector who takes up surfing. The sentence runs over to the top of page 53; page 52 is the back of this leaf and has only <span class=\"wl\" data-note=\"1998-12-15_Incorporating-Other-Peoples-Seeing\">1998 12 15_Incorporating Other Peoples Seeing<\/span> at its foot.", "img": ["attachments/pages/scan_1997_2_p051.jpg", "attachments/pages/scan_1997_2_p053.jpg"]}, "1999-06-15_Quand-lEtat-Controle-les-Decideurs-de-lArt": {"t": "Quand l'État contrôle les décideurs de l'art", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["french", "politics", "criticism"], "pp": [], "body": "<p>- quand l'Etat contrôle les décideurs de art il n'y a pas place pour les gens qui sont absolument indifferent aux choix artistique de l'Etat mais qui cherchent a creé leur propre idée de ce qu'ils aiment et ce qu'ils trouvent beaux.<\/p>", "notes": "Undated. Follows on from Dubuffet's attack on cultural specialists (<span class=\"wl\" data-note=\"1998-12-15_Dubuffet-Psycho-Sites-and-the-Hydra\">1998 12 15_Dubuffet Psycho Sites and the Hydra<\/span>) and the note on indifference and anger (<span class=\"wl\" data-note=\"1998-12-15_Lindifference-et-la-Colere\">1998 12 15_Lindifference et la Colere<\/span>).", "img": ["attachments/pages/scan_1997_2_p067.jpg"]}, "1990-03-19_Papas-Postcard-from-Ouagadougou": {"t": "Papa's Postcard from Ouagadougou", "d": "1990-03-19", "est": false, "w": 1990.216, "era": "Summer 1994, Travel and Alps", "th": ["father", "letters", "landscape", "tignes"], "pp": ["Dad"], "body": "<p><code>[front: a dead, twisted tree half-buried in orange sand dunes under a deep blue sky]<\/code><\/p>\n<p><code>[back, printed:]<\/code> burkina faso / Près de la mare d'OURSI, province de l'Oudalan. / Comme une main qui appelle au secours, cet arbre mort se dresse dans le désert qui gagne lentement du terrain chaque année. <code>[up the middle:]<\/code> © Photo SWASO - COLLECTIONS DIALOGUE DE CIVILISATIONS - Autorisation N° 000MET/DTH/84 - Réf. 82/610<\/p>\n<p>Ouagadougou - B-F<br>Lundi 19 mars 1990 -<br>Marco, grand fils N°1<br>C'est la première fois que je <s>[?]<\/s> reviens à Ouaga, depuis 1971 - les choses ont bien changé - C'est un pays du Sahel au Sud du Sahara, pauvre, en plateau couvert de steppes, c'est à dire avec une végétation moyenne car il y a encore des pluies venant de l'océan au Sud. Il fait actuell^t 35°C, descendant à 28-30 la nuit! Dans les zones proches du désert au Nord, tu peux voir sur la photo qu'il y a une lutte de \"limite de territoire\" entre la steppe et le sable. La photo est presque un tableau. Je pense que ça te plaira.<br>Dans une semaine nous serons à Tignes tous ensemble (après un premier jour de ski! (et peut être avant l'arrivée de cette carte). J'attends ce moment, comme de vous revoir[?]. Je t'embrasse.<br>PA[PA]<\/p>\n<hr>\n<h4>Original Images<\/h4>", "notes": "A postcard from Marco's father, sent from Ouagadougou, Burkina Faso, on Monday 19 March 1990 and kept in the 1994 notebook. It is one of the \"constant cards\" Marco writes about on 6 August 1994 in <span class=\"wl\" data-note=\"1994-08-06_Dads-Cards-Katherines-Colors-and-Mountain-Textures\">1994 08 06_Dads Cards Katherines Colors and Mountain Textures<\/span>, next to Katherine's card (<span class=\"wl\" data-note=\"1994-06-20_Katherines-Badlands-Postcard\">1994 06 20_Katherines Badlands Postcard<\/span>). His father writes \"La photo est presque un tableau. Je pense que ça te plaira.\" The signature is cut off at the bottom of the scan; only \"PA\" shows. \"revoir\" is uncertain. The era follows the notebook it was kept in, not the 1990 date.", "img": ["attachments/pages/postcard_1990_papa_front.jpg", "attachments/pages/postcard_1990_papa_back.jpg"]}, "1995-06-01_NEA-Visual-Arts-Funding-Meeting-Notes": {"t": "NEA Visual Arts Funding: Meeting Notes", "d": "1995-06-01", "est": true, "w": 1995.4167, "era": "DC, Post-College", "th": ["politics", "economics", "public-space", "museums"], "pp": ["E. L. Doctorow", "Ned Cohn", "Cézanne", "Philip Johnson", "Nayland Blake"], "body": "<p>I wonder if it really does make sense to have nationally funded individual projects - <s>could you<\/s> artist's acceptance becomes a <s>national<\/s> political issue. Will you ever find an artist <s>would<\/s> whom <s>would<\/s> a majority of voters would find worth funding? <s>[?]<\/s> That artist's work or he/she themselves would be chosen for these political reasons.<br>Art funding has to be looked at as a general necessity - <s>[?]<\/s> <u>It is absolutely unfair to bring individual artist's up for critique<\/u>. Not look at whole idea.<br>Literature has managed to escape the type of criticism that visual arts is getting - though the writers who are funded are <u>no less controversial<\/u>.<br>Literature has blanketed the house w/ super stars.<br>Movies <s>[?]<\/s> → Stars - E.L. Doctorow etc.<br>The Art world doesn't have these national superstars to <s>[?]<\/s> attract good publicity.<br>Oct. 1 beginning of new fiscal year - no guarantee that budget will be settled.<br>If NEA gets the money, who cares about approriation. <s>[?]<\/s> grants to individuals.<br>Amendment up to cancel all fellowships <s>etc.<\/s> except Literature<br>\"If you believe that ind. artists are those who speak/define our society/culture - and you can't give <s>ind.<\/s> grants to individuals what can NEA - visual arts. do?<br>Artist's are the trunk of the tree -<br>fellowships may not be best way of funding artists.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Fellowship - awknowledgement that our society does not support the individual artist → lack of balance in our culture.<br>since '67 $45 million → into hands of ind. artists. - 4600+ artists 5000+ grants ~1000 got more than one.<br><u>Ned Cohn<\/u>.<br><u>Vis. Artist's Org<\/u> - single national funder investment in grass roots - only way for communities to engage in contemporary art.<br>- exhibiting<br>- Journals<br>- commissioned work.<br><code>[boxed:]<\/code> - <u>working facilities<\/u>. → look into these. where? list.<br>Artist's communities - live/work<br>___<br><code>[boxed, to the right:]<\/code> Contemporary art in trouble in national media. Why? ↳ how do you change this.<br>Early on NEA very aggressive in moving art (sculpture) into public places.<br>Over time more integrated.<br><s>[?]<\/s> \"Public Art\" - Artist/Architect.<br>- long term commitment of Artist to change a community<br>Vis. Artist's Public Projects<br>[ Stopped funding critics &amp; <s>[?]<\/s> artist's forums.<br>- make art not talk about it.<br>Phil. Mus. Art → Cezanne.<br>___<br>Internships @ Museums -<br>Indemnity program - $48 Million saves museums <code>[and:]<\/code> $104,000 lost over 20 yrs.<br>↳ 469 exhibitions - ↓ insurance premiums.<br>cancelled: museum purchase - for living Amer. Artists<br>- new matching outside museum funds had to match.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p><u>also cancelled<\/u><br>- Special artistic initiatives -<br>Model of isolated artist no longer viable<br>- break down bariers btw. artist institution &amp; people<br>increase contact → NEA more visible &amp; ↑ value.<br>break w/ Modernist tradition of isolation<br>- community<br>- model of artist in isolation doesn't work anymore<br>- new model can be very flexible.<br>Art thinking: different &amp; <code>[circled:]<\/code> <u>unique<\/u><br>↳ but can be talked about (?) in policeman's terms.<br>- Art = to science: as advanced?<br>- I think that art thinking is in everyone just like every other type of thinking is. <s>[?]<\/s> Art thinking has to touch people's every day life like science, tech., economics in a way that they can understand w/out understanding everything.<br>VAO - break down specialization:<br>- artist businessman &amp; can comm. to public about their work<br>- anti-thetical to specialized museums.<br>Endowment should fund events of convergence.<br>- support circumstance rather than institution.<br>empowerment of citizens to seek out their own meanings.<br>- encourage dialogue<br>make <s>art<\/s> culture engagers out of culture consumers.<br>No PR for artists -<br>Amer. society anti-intellectual. → doing nation<br>- thinking requires level of removal -<br>- Artists allowed access to projects like never since Renaissance.<br>- NEA empowering artists. everyone creative but something <code>[circled, with a line back to the circled \"unique\" above:]<\/code> unique which artists bring to table b/c of focus on creative<\/p>\n<p><b>Next page:<\/b><\/p>\n<p><u>Museum<\/u> not a \"special\" experience → it is yours. empowered person's<br>↳ panel said mission statement: to foster creative thinking - not to protect collection etc.<br><u>Accessibility<\/u> -<br><u>elevated<\/u> / pristine / perfect } experience - undermines amateur tradition<br>___<br>- Make <code>[circled:]<\/code> publicity for artist PR is a <u>major<\/u> problem<br>↳ more valuable than $25,000<br>If you give them fame, notoriety then the money will come -<br>- National judged (not curated) Whitney Biennial<br><code>[an arrow from \"publicity\":]<\/code> → Have exhibition of the NEA grantees (much cheaper)<br><u>no one knows who these grantees are<\/u> -<br>need catalogue annual publication - new artists approved by govt.!<br>PR, PR, PR! make museum attractive, big event<br><u>travelling exhibit<\/u> to different set of museums who compete for chance to get the show after a few<br><code>[with a bracket and arrow:]<\/code> attract money &amp; sponsors<br>___<br>crisis accelerating a change process.<br>2. Library - <s>exchange<\/s> catalog for museum publications make national Art information network <s>[?]<\/s> collect information and make accessible - &amp; Modeled on library loan.<br>3. Attach strings to grant that artist must communicate at some time during or after using grant money. Artist does own education.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>call to artists, ask for help. ↳ &amp; sponsors<br>- get long term ad campaign<br>big in the beginning to save yourself → but expected to be maintained if it works &amp; the NEA is saved. channel the energy of all those people who ache at the thought of NEA funding being reduced or erased.<br>More art being made now than ever since the Renaissance.<br>give true stories - kill those misconceptions not in a handout to panel members who already love the NEA.<br>tell people who have <s>never been<\/s> to the Pavillion.<br>___<br>Connected projects. <code>[boxed and circled in blue:]<\/code> artist as catalyst<br>___<br>NEA needs calling card - needs catalog publication -<br>Accessible public archive -<br>↳ can I work on this -<br>- Grass roots planning of public Arts.<br>↳ Lesson: transition from cultural consumer to participant.<br><u>get new audiences<\/u> - smart advertising<br>work of art can be potent - destroy prejudice<br>ex. Miami artist who wanted to use spanish in a mural in Philip Johnson Library when miami had anti-bilingual <u>law<\/u> - worked for 2 yrs to get books &amp; art exempt from law which was eventually repealed<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Trust in the system - group will figure it out - go <u>Nayland Blake<\/u>.<br>___<br>how 'bout the regions have one or two <u>big<\/u> $25,000 <u>grants<\/u> &amp; regular <s>[?]<\/s> $5000 state grants.<br>- <u>requirements<\/u> in the grants. exhibition etc. not just check.<\/p>", "notes": "Undated, over six pages. Notes from a meeting or panel on the National Endowment for the Arts' visual-arts programme, with Marco's own thoughts mixed in (the opening paragraphs, \"I think that art thinking is in everyone\", \"can I work on this\"). The talk of an amendment to cancel individual fellowships \"except Literature\", and of the fiscal year starting Oct. 1, fits the 1995 Congressional fight over NEA funding, when grants to individual visual artists were cut; so this is probably summer 1995, perhaps while Marco was working in Washington DC (see the DC address on <span class=\"wl\" data-note=\"1994-12-28_Inside-Cover-Addresses-and-Contacts\">1994 12 28_Inside Cover Addresses and Contacts<\/span>). Ned Cohn is not identified; \"the Pavillion\" is probably the Old Post Office Pavilion in Washington, where the NEA had its offices. The Miami mural is in the Philip Johnson–designed Miami-Dade library. The lower part of page 81 is blank.", "img": ["attachments/pages/scan_1995_p076.jpg", "attachments/pages/scan_1995_p077.jpg", "attachments/pages/scan_1995_p078.jpg", "attachments/pages/scan_1995_p079.jpg", "attachments/pages/scan_1995_p080.jpg", "attachments/pages/scan_1995_p081.jpg"]}, "1994-08-01_Wiping-Away-Teenage-Fog-and-Brigittes-Anger": {"t": "Morning Coffee Jitters, Self-Clarity & Brigitte's Anger (8/1)", "d": "1994-08-01", "est": false, "w": 1994.5833, "era": "Summer 1994, Travel and Alps", "th": ["self-clarity", "family", "sexism", "sisterhood", "french", "coffee"], "pp": ["Mr. Extrasiuz", "André", "Brigitte", "Papa"], "body": "<p><b>8/1<\/b> I have that jittery early in the morning feeling or is it that early in the morning jittery coffee feeling or the coffee early in the morning jittery feeling like I'm going to need a nap later but can't sleep now because I feel so jittery.<\/p>\n<p>Mr. Extrasiuz making a lip flapping criket whistle for which he has to lick his lips which contorts his whole face and he wiggles his ears. <i>troooo. trooo. trenenenenp<\/i> <i>tren en en cup<\/i><\/p>\n<p>It feels really good to find myself. I feel like I've wiped away the fog of teenage confusion and fads and can see or feel clearly who I am. I know what I think of my cousin André refering to \"le sex faible\" and can feel Brigitte's anger, numbed by years of acceptance when André or my father speak of Italian women or an ex-movie star that who is now in a wheel chair. I imagine it must have been quite empowering for Brigitte to be one of four sisters, but each of the men the four sisters married finds their empowerment amusing, a woman's game. Papa makes me sick when he said <i>\"Tu sais, les filles sont meilleures cette année, tu sais celles qu'on voit dans la rue.\"<\/i> <i>\"Surtout les Italiennes?\"<\/i> interjected Brigitte, <i>\"Oui plutôt\"...<\/i><\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p038.jpg"]}, "1995-04-11_Bernice-Rose-on-Joseph-Beuys": {"t": "Bernice Rose on Joseph Beuys", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["art-history", "drawing", "coursework", "sculpture"], "pp": ["Bernice Rose", "Joseph Beuys", "Mataré", "John Cage", "Leonardo", "Picasso", "Rudolf Steiner"], "body": "<p><u>Bernise Rose<\/u> - Joseph Beuys <code>[above:]<\/code> b. 1921 12 in 1933 - Hitler youth groups<br>felt &amp; fat to save his life by Tartars in Crimea.<br>1951 - started making sculpture w/ Materay labeled a degenerate artist in Hitler's time - anything that wasn't social realism<br>1955-6 - mental break down. worked in fields. 56-7<br>Thousands of drawings 47 - 61 → prof. @ Dusseldorf Acad.<br>- involved w/ fluxus. new work of John Cage.<br>d. 1986.<br>time @ Acad. - extremely politicized stud. rebellion spread from France.<br>social sculpture - everyone is an artist - everyone participant in formation of new society - act of making society = a concrete structure.<br><u>drawings<\/u> -<br>Beuys applies his theories as antidotes to Hitler supported mad-scientists.<br>creates myth of re-birth for himself → picked up in Crimea.<br>Romantic - details, particulars <code>[stacked:]<\/code> macro / micro seen in<br>- fragments, idealisation of part<br>each of his drawings is a fragment - float in space.<br>spiritual place in creative soup.<br>Materay - crystaline structures under all matter.<br>- reflection of secret order of the universe.<br>- man is the measure - Leonardo.<br>Picasso - cubism through analysis of human figure.<br>\"Drawing, 1st physical manifestation of the artist's thought\"<br><s>Leonardo<\/s> Leonardo - artist has power greater than nature he should invent.<br>Beuys chaotic energy - mind etc. through circulation warmed &amp; finds order then becomes cold &amp; solid matter.<br>Beuys alchemist - material - Iodine.<br>substance has metaphysical meaning.<br>Stiener - bees ideal social community → Bueys: wax<br>Cages idea of notation - sound in a field longer sound = longer notation.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Aesthetization of every aspect of life - under Hitler back to Rousseau and many others in Anglo-Fr. Germ. tradition.<br>aesthetic - social force not just in art.<br>In Fluxus performance EurAsia - Utopia now <s>[?]<\/s> place<br>begins to make assemblages.<br>forces of the performance.<br>drawing to explain - these are the later drawings.<br>everything to be reconciled.<br>Intuition highest overall.<\/p>", "notes": "Undated. Notes from a talk by Bernice Rose, the MoMA drawings curator, on Joseph Beuys's drawings. \"Materay\" is Ewald Mataré, Beuys's teacher at Düsseldorf (and himself labelled \"degenerate\" under the Nazis). \"Stiener\" is Rudolf Steiner, whose lectures on bees influenced Beuys. \"Iodine\" is a reading; Beuys's materials were usually felt, fat, wax and honey.", "img": ["attachments/pages/scan_1995_p068.jpg", "attachments/pages/scan_1995_p069.jpg"]}, "1995-02-27_Rons-Last-Lecture-Danto-and-Reality": {"t": "Ron's Last Lecture: Danto and Reality", "d": "1995-02-27", "est": false, "w": 1995.1546, "era": "Final Semester Yale 1995", "th": ["art-theory", "coursework", "modernism", "representation"], "pp": ["Ron Jones", "Arthur Danto", "Rembrandt", "Aristotle", "Gerhard Richter", "Jeff Koons", "Frank Stella", "Raphael"], "body": "<p><u>Ron's last lecture<\/u>: 2/27<br>Danto → beyond critique<br>Theory must precede the experience or we might not know we are standing on artistic terrain -<br>[is that so unusual - some one has to tell you that Remb. is a great painter - if you went to China or some-where where you have no idea what went into making a piece - fine porcelainous. mass produced china etc.<br>Also you must know why Mona Lisa is such a great / famous painting]<br>Artists begin to write to win back the right to make their art art.<br>Aristotle &amp; immitation -<br>There is a long way from a Gerhardt Ricter to reality.<br><u>RT<\/u>: btw. (N.T.) &amp; reality <code>[three lines in the margin]<\/code><br>\"Modernism not about immitating real forms it creates new ones.<br>New forms - new reality - <u>what isn't real<\/u><br>- Phenomena have an integrity -<br>- \"The most realistically painted <s>immitated<\/s> still far from reality\"<br>Jeff Koon's loveable huggable create cultural equilibrium -<br>Minimalism - shmo &amp; artist say the same thing description = subject<br><code>[arrows from \"description\" and \"subject\" to:]<\/code> no Theory / Theory<br>Emotion could be learned - Post-painterly Abstraction ↔ react against this.<br><u>Stella<\/u> - painting no longer has to point to its maker - self-contained.<br>artist has no decisions once the work has started<br>→ non-immitativeness is a function of reality Stella more real than Raphael.<br><code>[a curved arrow joins \"artist has no decisions\" to \"non-immitativeness\"]<\/code><br>light on the Snapple bottle. - can look like sunlight → <u>Photo flood<\/u>.<br>√ Regain the right to represent ourselves - Artists should<br>Be able to represent the <u>is<\/u> of who you are<\/p>", "notes": "Ron's last lecture of the seminar; his earlier ones are <span class=\"wl\" data-note=\"1995-01-16_Art-Major-Meeting-Essentialism\">1995 01 16_Art Major Meeting Essentialism<\/span> and <span class=\"wl\" data-note=\"1995-01-23_Games-Habits-and-Rons-Lecture-on-Wittgenstein\">1995 01 23_Games Habits and Rons Lecture on Wittgenstein<\/span>. The bracketed passage about Rembrandt and the Mona Lisa is in square brackets on the page, so it may be Marco's own aside. \"RT\" and \"N.T.\" are not explained; Danto's \"real things\" and \"non-things\" (or \"mere real things\") are possible readings.", "img": ["attachments/pages/scan_1995_p041.jpg"]}, "1995-01-27_Crary-on-Vision-and-Attention": {"t": "Crary on Vision and Attention", "d": "1995-01-27", "est": false, "w": 1995.0712, "era": "Final Semester Yale 1995", "th": ["perception", "coursework", "television", "technology"], "pp": ["Jonathan Crary", "Foucault", "Benjamin", "Kant", "Bergson", "Jameson"], "body": "<p>1/27 <u>Crary<\/u> - vision, contingent unreliable<br>map transcendant onto empirical. - Foucault<br>no longer camera obscura - the body<br>bio vs mechanosphere - eradicated.<br>perception part of density of body<br>collapse of difference interior / exterior<br>Modernism capitalism pushes distraction to new levels<br>T.V. &amp; commuter sedentary atentiveness<br>Overload of input - THE SPECTACLE - 1930 - TV &amp; broadcast radio synch sound in films<br>- medical military accelerate use of mechanical eyes. - Nazi propoganda.<br><code>[an arrow from \"Overload of input\" to:]<\/code> Benjamin 'a crisis in the nature of perception itself'<br>- shock &amp; effects → obliteration of kantian model.<br>- by 1939 Shock is passively consumed<br>deterioration of experience<br>Bergson - bind immediate perceptions to memory<br>Jamison - switching interest is historical<\/p>\n<p><b>Next page:<\/b><\/p>\n<p><u>Attention<\/u> - fund. condition<br>- specific model of Behavior - historical.<br>ADD - attention deficit disorder - pervasive describes almost anyone.<br>volitile - attention always contains poss. of disintegration<br>- possible for excess.<br>stare at any one point it will disintegrate.<br>hypnosis - extreme model of tech. of attention<br><s>[?]<\/s> trance intence refocusing attention.<br>TV management of attention<br>- certain themes undiscussible about TV<br>fixing &amp; narrowing - not communicative<br>Videodrome - 70 yrs old 15 yrs dreamless 8 yrs dreaming 12-16 - in front of TV } dramatic shift in communal consciousness.<br><u>Virtual Reality Tech<\/u> - new system<br>kinetic texture<br>sensory &amp; motor on same plane<br>- compared w/ LSD: both LSD &amp; VR introduced to US w/ involvement of military &amp; CIA → one which must be questioned<br>↳ prove to be unmanageable.<br>Immense areas of globe unaffected by what seems over whelming here - much more stratified globe<br>striated mosaic - less effective communication.<\/p>", "notes": "Notes from a lecture or talk by Jonathan Crary, author of <i>Techniques of the Observer<\/i> (1990), on vision and attention. \"Jamison\" is probably Fredric Jameson. <i>Videodrome<\/i> is David Cronenberg's 1983 film. The lower half of page 25 is blank.", "img": ["attachments/pages/scan_1995_p024.jpg", "attachments/pages/scan_1995_p025.jpg"]}, "1995-03-06_Leonard-on-Wordsworth-Ruskin-and-Reynolds": {"t": "Leonard on Wordsworth, Ruskin and Reynolds", "d": "1995-03-06", "est": true, "w": 1995.1804, "era": "Final Semester Yale 1995", "th": ["reading", "art-history", "perception", "aesthetics"], "pp": ["Wordsworth", "Ruskin", "Zeuxis", "George J. Leonard", "Reynolds", "Pericles", "Coleridge", "Kant", "Archibald Alison", "John Muir", "Leonardo"], "body": "<p>Wordsworth &amp; Ruskin: speak of conferring \"power\" on the audience their famous training for the eye. It was, in fact, a counter-training.<br>the Zeuxis parable (all those Croatian maidens compared) had become, in the 18th centuries a training for the eye.<br>But what a training. Wordsworth &amp; Ruskin would later send you out into the world with the new power to transfigure the commonplace; idealist art training would disfigure even the \"most beautiful forms\" you previously admired, train you in their \"weakness\" and \"imperfection.\" I use the word \"disfigure,\" to emphasize that ideal art did not merely leave the common place alone. Young people were being trained to look at life and find it ugly... Wordsworth and Ruskin could not let that go unchallenged. They did not. G. J. Leonard Into the Light of Things. p. 77.<br>To speed up the student's power to discover \"deformity\" in the common day, Reynolds says he knows of only \"one method\" that will \"shorten the road\": judge nature by art. Compare flawed nature with the ideal creations, in this line, of previous thinkers who themselves reached the heights by 'careful study of classical sculpture. The \"ancient sculptors\" left \"models\" of \"perfect form\" by being indefagitable in the school of nature\" - that is, indefagitable in finding fault w/ nature [I'm not sure that this is right at all - or the generalisations are far to simplified - Athenian sculpture of the age of Pericles may have sought this perfection but certainly not Hellenistic Sculpture.<br>What is frightening about this whole passage and mode of thinking (of Reynolds etc) is that it is so inclusive. It does not allow for difference. Must humanity always go through cycles of Athenian Hellenistic 1950's - 1990's<br><code>[bracketed:]<\/code> It would be Wordsworth's task, Colderidge wrote, to produce a feeling \"analogous to the supernatural by awakening the mind's attention to the \"wonders of the world before us.\"<br>Most kantian lines: Recluse &amp; TA ½ creates mind ½ perceives<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Forerunner to Wordsworth: Archibald Alison 1790 Essays on the Nature and Principles of Taste. p. 1<br>' \"Sublimity\" and even \"beauty\" are not properties of objects but \"emotions\" we have about objects. There is a difference between ordinary sight and awakened sight, for the \"simple perception\" of an object isn't enough to \"excite\" those desirable emotions (that is, beauty, sublimity) unless sight is \"accompanied with\" an \"operation of the mind\" ' Leonard p. 58.<br>'As proof that unless we \"excersize\" our \"imagination\", we don't feel the 'emotions of beauty and sublimity,\" think how much \"difference\" there is in the feelings we have at different times about \"the same objects\" In the course of making that point, Alison quite casually assumes the beauty in the simple produce of the common day and makes it our fault that we don't find it: \"In the scenery of external nature\", the beautiful and the sublime are almost constantly before us; and not a day passes, without presenting us with appearances, fitted both to charm and to elevate our minds; yet it is in general with a heedless eye that we regard them, and only in particular moments that we are sensible of their power.\"<br>I am exited by the Ruskin &amp; Muir descriptions of nature - of water. They are very much like the descriptions I would make in my journal.<br>I want to make my traveling stand &amp; put my description on the stand &amp; on the advertisement for the stand, document it all very well and present several such set ups (6) at my opening a painting, photograph and description making clear that the art work (reproductions) are less that the real thing. Have the real thing on the roof<br>Ruskin: art is \"less beautiful than the realities\" it depicts. <code>[bracketed:]<\/code> [Works ed. E.T. Cook &amp; Alex. Wedderburn 22:222]<br>We are to look <u>through<\/u> artworks, not <u>at<\/u> them.<br>Ruskin hustles us out of the artworld into the real one.<br>\"Now <s>leap<\/s> water will leap a little way, it will leap down a weir or over a stone, but it <u>tumbles<\/u> over a high fall like this; and it is when we have lost the parabolic line, and arrived at the catenary, when we have lost the <u>spring<\/u> of the fall, and arrived at the <u>plunge<\/u> of it, that we begin really to feel its weight and wildness. Where water takes its first leap from the top, it is cool, and collected, and uninteresting, and mathematical; but it is when it finds that it has got into a scrape, and has farther to go than it thought, that its character comes out; it is then that it begins to writhe, and twist, and sweep out, zone after zone, in wilder stretching as it falls; and to send down the rocket-like lance pointed, whizzing shafts at its sides, sounding for the bottom [Works Cook 3:553,554.]<br>I could have written this - the journal of an observant person Leonardo<br>→ woah ego!<\/p>", "notes": "Undated; it follows the March 6th entry on the same page. Quotations from George J. Leonard's <i>Into the Light of Things<\/i> (1994), p. 77; the story of Zeuxis painting Helen from the best features of five maidens is usually set in Croton, hence \"Croatian\" is probably \"Crotonian\". \"Recluse &amp; TA\" are probably Wordsworth's <i>The Recluse<\/i> and \"Tintern Abbey\", whose lines on \"what they half create, / And what perceive\" are the \"most Kantian\". Page 43 goes on with Leonard's chapters on Archibald Alison and Ruskin; Ruskin's waterfall passage is from <i>Modern Painters<\/i>. The traveling stand is the portable viewing stand of <span class=\"wl\" data-note=\"1995-02-27_Only-Happy-When-Working-a-Portable-Viewing-Stand\">1995 02 27_Only Happy When Working a Portable Viewing Stand<\/span>.", "img": ["attachments/pages/scan_1995_p042.jpg", "attachments/pages/scan_1995_p043.jpg"]}, "1999-06-15_Speaker-Wiring-Calculations": {"t": "Speaker Wiring Calculations", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["sound", "engineering", "technology"], "pp": [], "body": "<p><code>[pencil sketch: a speaker cone in a box, suspended by springs at the rim, with an arrow showing the cone's movement over the magnet]<\/code><br><code>[sketch: voltage and current waveforms, labelled \"V\", \"I\", \"W\"]<\/code> ↑R = either<br>- current induces mag field<br>3x speaker 8Ω 50W<br>50 = V I<br>V = 8 I<br><code>[circuit: a 50W source (\"V or A or both\") with three speakers in series]<\/code> 8Ω + 8Ω + 8Ω = 24Ω / 50W 50W 50W<br><code>[sketch: a square panel with a large circle (speaker) in it]<\/code><br>- assume changing voltage<br>↑ Resistance = ↓ current = ↓ Watt = ↓ dB<br><code>[circuit: the three speakers in parallel]<\/code> 1/R_T = 1/R₁ + 1/R₂ + 1/R₃ / R_Tot 2 2/3<br><code>[sums down the right side, working out the parallel resistance]<\/code><br><code>[circled:]<\/code> 8118 54<\/p>", "notes": "Undated pencil working for wiring three 8-ohm, 50-watt speakers in series or parallel, probably for the transducer and resonator pieces of <span class=\"wl\" data-note=\"1999-06-15_Working-on-Transducers\">1999 06 15_Working on Transducers<\/span> and <span class=\"wl\" data-note=\"1999-06-15_Bent-Aluminium-Bar-and-Resonator-Yagi-Antenna\">1999 06 15_Bent Aluminium Bar and Resonator Yagi Antenna<\/span>. The circled number may be a phone or part number. The faint text is page 81 showing through.", "img": ["attachments/pages/scan_1997_2_p082.jpg"]}, "1998-12-15_Other-Entities-Triangulation-Sketch": {"t": "Other Entities: Triangulation Sketch", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["maps", "perspective", "drawing"], "pp": [], "body": "<p><code>[sketch: a vaulted interior seen in perspective, like a church nave with ribbed vaults, a small doorway on the right; three figures with heavily scribbled heads stand in the foreground, joined by dotted lines into a triangle; each is labelled \"other entity\" or \"other entities\", and a downward arrow points to the feet of the right-hand figure]<\/code><\/p>", "notes": "Undated; a drawing only. The vaulted space may be Saint-Eustache in Paris (see <span class=\"wl\" data-note=\"1998-12-15_Video-Edit-Notes-Rainbow-Bridge-to-St-Eustache\">1998 12 15_Video Edit Notes Rainbow Bridge to St Eustache<\/span>). The dotted lines between the figures echo the \"triangulations\" of <span class=\"wl\" data-note=\"1998-12-15_Crack-of-Sky-in-a-Sky-Map-and-Triangulations\">1998 12 15_Crack of Sky in a Sky Map and Triangulations<\/span>. The page was folded at the bottom left when scanned; the drawing seems complete.", "img": ["attachments/pages/scan_1997_2_p062.jpg"]}, "1995-01-13_Uncomfortable-in-Groups": {"t": "Uncomfortable in Groups", "d": "1995-01-13", "est": false, "w": 1995.0329, "era": "Final Semester Yale 1995", "th": ["self-criticism", "friendship", "katherine", "social-alienation", "insecurity"], "pp": ["Daria", "Sarah", "Miranda", "Katherine", "Cézanne", "Amy", "Susan", "Lucia", "Ashley", "Mora", "Campbell", "Beirbaum"], "body": "<p>1/13/95 Friday (maybe it was best I didn't go biking.)<br>Why do I feel so uncomfortable in groups these days? I'm so self-conscious always feeling people <s>[?]<\/s> guessing at who I am by my appearance - v. conscious that I am white, upper-class and male. Maybe I am too sensitive to these things. I <u>am<\/u> too sensitive to these things. I don't know if it was better in high-school when I could fit into the athelete, partier, but makes-the-grades crowd. Now I don't feel studly when I go jogging. I feel like just another ex-athelete - and my high-school career was hardly remarkable - balding Yale college kid type. Mountain biking I feel good, but I was scared to go today - scared of getting mugged. There's that place at the end where I saw the stolen bike etc. Climbing I'm still too self conscious on the wall - everyone is looking at me feeling. I feel Daria keeping away from me, that's o.k. I don't think it's good to always be w/ someone, but twice now I've backed out of doing things w/ Sarah &amp; Miranda because I feel <s>[?]<\/s> they're her territory<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>but fuck they've been my friends longer thank you. I feel kind of awkward in friendships like I don't know where they stand; I have to re-ascess them. That is good too I suppose - though you risk feeling lonely falling through the gaps of the instability - is higher highs the trade off? rather than the empty false happiness \"hey how are you!\" I even reevaluated katherine recently. I came off the incredible high. There's still no doubt I am in love w/ her etc. It's just not tingling these couple of days - she was sad when I talked to her for the first time I've ever known her I think - it's scary how mutual we are: we just can't love each other the same when one of us is down. I think her project might be losing some of its novelty - no - <s>she might have questioned it, or is questioning it, or will.<\/s> I think any artistic <s>[?]<\/s> action won't get the attention or excitement it deserves. The art world is very small said Cézanne only a tiny handful can appreciate you. katherine and I see similarly - I think Amy does too but she plays the wiser than thou <s>[?]<\/s> sage - I completely respect her eye though. I just wait for her to say something. She is so powerful in her silences. I talk too much. In any group there are one or two people who <s>[?]<\/s> under stand you, maybe - I feel like Susan, Lucia and I were in the same place <s>[?]<\/s> last night.<br>\"You're weird\" Ashley said when I was talking about the attraction of the void. I know she doesn't think I am, but she was saying what most people probably think - what Mora and Campbell think, I think. Beirbaum has a heart I think he was almost crying, choked up last night talking about how much he liked the group. Susan cried one tear when I was telling her how much katherine and I were in love: drawing together etc. Funny, it felt wrote for me. I had already told Ashley and didn't even feel tingly and excited then. Why don't people ever call and invite me places? I guess I make them feel uncomfortable somehow. Maybe I don't react well, I'm not always excited to see / do the same types of things. Even Daria gets tired of trying to loosen me up.<\/p>", "notes": "\"thank you\" (for \"than you\") and \"wrote\" (for \"rote\") are as written. The three \"think\"s in \"what Mora and Campbell think, I think. Beirbaum has a heart I think\" are circled. \"Beirbaum\" could also be read \"Bierbaum\".", "img": ["attachments/pages/scan_1995_p013.jpg", "attachments/pages/scan_1995_p014.jpg"]}, "1994-07-30_Crete-de-lAiguille-Percee-Wind-Sound-Sculpture": {"t": "Crête de l'Aiguille Percée: Wind-Sound Bottle Sculpture (Page 90v)", "d": "1994-07-30", "est": false, "w": 1994.5795, "era": "Summer 1994, Travel and Alps", "th": ["alps", "tignes", "sound-sculpture", "wind", "sculpture-ideas"], "pp": [], "body": "<p>I thought of making an object which makes sound. Today on top of the <b>Crête de l'Aiguille Percée<\/b> I opened a bottle of Badoit (it was already half empty) and the wind blew across the opening &amp; made a hollow sound so...<\/p>\n<ul><li>this would need help from scientists<\/li><li>another Apfel question<\/li><li>make different ones that produce different sounds — a chord?<\/li><\/ul>", "notes": "<i>[Diagrams: Spherical hollow vessel suspended on vertical posts with directional wind vanes (<code>&lt;- wings that keep it in line w/ the wind<\/code>), revised to a circumferential lip/saucer (<code>wing should be a saucer that way wind can come from any side<\/code>), with side and perspective saucer sketches.]<\/i>", "img": ["attachments/pages/scan_1994_2_p025.jpg"]}, "1998-12-15_IAC-Piece-Random-Number-Deciders": {"t": "IAC Piece: Random Number Deciders", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["systems", "cognition", "technology", "sculpture-ideas"], "pp": [], "body": "<p>think of - <u>IAC<\/u> peice - which what?<br>- \"why\" question <code>[bracketed with the next line:]<\/code> } AI<br>- determination question<br>- understanding symbols - 0 or 1 naive physics<br>why does 0·x = 0 understand <code>[boxed:]<\/code> 0 &amp; <code>[boxed:]<\/code> 0 not just an <code>[boxed:]<\/code> x<br>- expert agents individually acting -<br><code>[sketch: a row of eight circles, the first two drawn over several times, with an arrow running through the first three]<\/code><br>10 random number deciders = 1 ?<br>create links btween them each time they randomly come up w/ the same result, builds up their similarity grouping quotient (factor) until a group decides upon a personality<br>- <u>10<\/u> patches w/ random <u>20<\/u> % ⇒ that 2 will get the same #<br>- <u>test<\/u> -<br>- each compares its results w/ the others<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>- similar results = narrows the range of their generators to the same narrower range and narrows the range of their similarity <code>[an arrow from \"similarity\" to:]<\/code> what they accept as similar -<br><code>[a bracket in the margin joins the next lines:]<\/code><br>→ Use this to determine filters on white noise<br>\"Life\"<br>any event needs a certain amount of concurrence to occur,<br><s>100<\/s> x random 1000 → need 5 to act.<br>if your chance is 1 in 100 and you do it 100x's the chance approaches <u>1 <s>[?]<\/s><\/u><br>if your chance is 1 in 200 &amp; you do it 100x's your chance approaches <u>1 in 2<\/u><br>do that twice and again 1 in 1 or 2 in 2 if you <code>[cut off at the edge]<\/code><\/p>", "notes": "Undated. \"IAC\" is not explained; it may be an institution, a show, or \"interactive\" piece. \"patches\" are probably Max patches. The probability reasoning on the second page is as written. The \"filters on white noise\" link this to <span class=\"wl\" data-note=\"1998-12-15_Breathing-Rhythms-and-White-Noise-Interaction\">1998 12 15_Breathing Rhythms and White Noise Interaction<\/span>.", "img": ["attachments/pages/scan_1997_2_p044.jpg", "attachments/pages/scan_1997_2_p045.jpg"]}, "1998-08-01_Hofstadters-Copycat": {"t": "Hofstadter's Copycat", "d": "1998-08-01", "est": true, "w": 1998.5833, "era": "Paris, Beaux-Arts", "th": ["cognition", "systems", "reading"], "pp": ["Douglas Hofstadter"], "body": "<p>The tempurature control descision in Hofstader's copycat and abc → abcd architecture in the key factor<br>xyz → wxyz<\/p>", "notes": "Undated. Douglas Hofstadter and Melanie Mitchell's Copycat program solves letter-string analogies such as \"abc → abd\"; its \"temperature\" controls how random its search is. \"abc → abcd\" and \"xyz → wxyz\" are written as given.", "img": ["attachments/pages/scan_1997_2_p004.jpg"]}, "1995-03-12_No-Time-to-Be-Vain": {"t": "No Time to Be Vain", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["yale-culture", "ego"], "pp": ["Frank Stella"], "body": "<p>I dont think that people who really have good ideas have the time to be vain. (looking @ Arch. students @ Frank Stella lect.<\/p>", "notes": "Undated; between rules, before the April 11 entry. Frank Stella gave a lecture at Yale; the date isn't given.", "img": ["attachments/pages/scan_1995_p064.jpg"]}, "1995-09-28_So-Tired": {"t": "So Tired", "d": "1995-09-28", "est": false, "w": 1995.7406, "era": "DC, Post-College", "th": ["self-awareness", "body"], "pp": [], "body": "<p>9/28 I'm <u>so<\/u> tired.<\/p>", "notes": "In blue ink, between rules.", "img": ["attachments/pages/scan_1995_p098.jpg"]}, "1995-02-12_Dance-Space-and-Mirror-Panels": {"t": "Dance Space and Mirror Panels", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["dance", "space", "mirrors", "body"], "pp": [], "body": "<p><code>[sketch: a floor plan of a long room, with measurements: \"7'\", \"7'\", \"3ft\", \"7'\", \"7'\" along the top, \"15'\", \"7.5'\" in the middle, \"30\" on each side, \"3 skinny\" at each end, \"6'5\" and \"10'9\"\" along the bottom, and \"5 mirror panels\" and \"4 mirror panels\" below; sums (\"25\", \"66.5 - 15 = 51.5\") in pencil]<\/code><br>It is so interesting how dance is so much about the intricacies of the human body - what is possible? what can these dancer's bodies do? - like wrestling (kind of - my only frame of referance) but the interaction btw. these two individuals is not about the space - go from the most neutral black space - to space w/ defined polarization - to one much larger which is again not polarized.<br>should they use the largest space? they can be <u>v. far<\/u> away from the audience &amp; then inside / amongst them<br>we can put the mirrors as far apart as we can - get reflection w/ mirror L's<br><code>[boxed, joined by a line to \"mirror L's\":]<\/code> Mon 2.30 video -<\/p>", "notes": "Undated; plans for <span class=\"wl\" data-note=\"1995-02-12_Mirandas-Dance-Curtains-and-Pavilions\">1995 02 12_Mirandas Dance Curtains and Pavilions<\/span>.", "img": ["attachments/pages/scan_1995_p036.jpg"]}, "1994-08-02_Studio-Painting-Ansel-Adams-and-Textures": {"t": "Studio Painting, Ansel Adams & Mixed Textures", "d": "1994-08-02", "est": false, "w": 1994.5861, "era": "Summer 1994, Travel and Alps", "th": ["painting-technique", "photography", "textures", "studio-practice"], "pp": ["Ansel Adams"], "body": "<p>I have now realized that all of these painting ideas require a technical prowess that I do not yet have. The technical level has to complement the idea, or the work becomes silly. Who knows, maybe I'll get there?<\/p>\n<p>I thought today that I might actually try to make a painting \"in the studio\" when I return to New Haven. In the studio the painter is aware of his relationship to the painting; nature is not present. I also thought that setting up a photograph <i>à la<\/i> Ansel Adams is similar to setting up a painting—Polaroid sketches, trying different filters.<\/p>\n<p>I was excited by my first try with textures today. I'm going to definitely try mixing anything with medium: sawdust, fine sand, dirt, grass. Gesso is a kind of adhesive—I wonder if I could glue grass, leaves, or branches onto a surface with it and then paint on it. I also thought of building a diorama-like 3D painting by layering successive levels on receding planes.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p051.jpg"]}, "1995-04-11_The-Other-Vertigo-Noces-and-Hitchcock": {"t": "The Other Vertigo: Noces and Hitchcock", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["fear", "literature", "writing-process", "film", "french"], "pp": ["Camus", "Genet", "Hitchcock", "Jimmy Stewart", "Kirk J. Schneider"], "body": "<p>Confronting the other Vertigo → wish to drop into what can never be a part of yourself.<br>- rare moments of extasy like in <u>Noces<\/u>: breathing with the world<br>writing leaves the tracings of the ephemeral flickerings of the mind → like the tracings of the wind on Camus' skin in \"Le vent a Djémila\"<br>\"l'ecriture du monde\" - perfect.<br>corps = dessin → world has taken over his powers, he is losing himself<br><code>[sketch: two small headlamps]<\/code> two beams of a headlight shine and though starting from two specific points the wash of light can meld<br><u>Noces<\/u> is a book about Unity hence the title → extatic union<br>p. 66-7. [he also talks of religion → Genet or <u>L'Etranger<\/u> → decision<br>Artist cannot simply live. self-consciousness has ripped him from this bliss.<br><code>[boxed, with a bracket in the margin:]<\/code> \"Vivre, bien sûr, c'est un peu le contraire d'exprimer.\" - p. 78. \"Le désert\".<br>↳ why can Camus <u>not simply<\/u> live like the Algerians?<br>At the opening of Hitchcock's <u>Vertigo<\/u> Scottie our protagonist starts w/ hands grasping a bar: the tenuousness of life.<br>the hands are that of the man our protagonist Scottie (Jimmy Stewart) is chasing. In the chase over the roof tops <s>Scottie<\/s> Scottie slips but manages to grasp onto a very unstable gutter. His partner reaches <s>[?]<\/s> to help him but plunges to his death \"He is in terror but at the same time transfixed. He cannot help but peer into his awesome predicament below ... Hitchcock confronts us with life's fragility, with the fear (yet fascination) with what lies beyond, and with the overwhelming danger (ie. deadliness) of tangling with that reality.<\/p>", "notes": "Undated. The <i>Noces<\/i> passages are from \"Le Vent à Djémila\" and \"Le Désert\"; see <span class=\"wl\" data-note=\"1995-03-12_Grey-Sunday-Camus-Noces-and-Quoting\">1995 03 12_Grey Sunday Camus Noces and Quoting<\/span>. The quotation about Scottie, opened but not closed, is probably from Kirk J. Schneider's article on <i>Vertigo<\/i> noted in <span class=\"wl\" data-note=\"1995-04-11_Scaffolding-Room-and-Wire-Rope\">1995 04 11_Scaffolding Room and Wire Rope<\/span>.", "img": ["attachments/pages/scan_1995_p067.jpg"]}, "1997_p027_Artist-as-Plumber": {"t": "Artist as Plumber", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["vocation", "technology", "perception", "teaching", "language"], "pp": ["Robinson Crusoe", "Lewis Carroll"], "body": "<p>Pourquoi un tel besoin de continuité?<br>c'est <u>innovation<\/u> qui est interessante<br>↳ industrielle, economique<br>nouveaux systèmes, moyens de faire.<\/p>\n<p><s>Artist<\/s> Artist as plumber.   ↳ fixer - know-how<br>Robinson Crusoe.<br>maitrisé la technologie dans laquelle on vit.<br>→ technitien comme artist   [ <u>teacher<\/u> ]<br>réparateur, dépanneur.<\/p>\n<p>→ <u>against egotism<\/u> - works not for his own glory but <u>to fix<\/u>, help you to see<br>↳ unhappy <u>perceptions<\/u><\/p>\n<p>\"<u>Sylvan<\/u> beauty of the setting\"   [ frames the world ] ←<br>↳ image creation   similar to \"slithy\" in slithy toves...<br>language, metaphor, image creation.<\/p>", "notes": "\"slithy toves\" is from Lewis Carroll's \"Jabberwocky\". Compare the bricoleur and Robinson Crusoe on pp. 9–11.", "img": ["attachments/pages/scan_1997_p027.jpg"]}, "1997_p017_La-Derniere-Piece-le-Dernier-Repas": {"t": "La Dernière Pièce : le dernier repas", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["installation", "endings", "rites-of-passage", "video", "language"], "pp": ["Albert Camus"], "body": "<p>La Dernière Pièce: le dernier repas.<br>- l'ultime<br>- succession d'étapes.<\/p>\n<p><code>[sketch: a figure standing on a crossbar at the top of a pole, ropes running out from the pole to either side; the same pole drawn again in stages, the ropes and collars sliding up and down it, with arrows]<\/code> →la fin d'une étape<br><code>[sketch: a strip of three frames with an arrow running through them]<\/code><br><code>[sketch: a crouching figure, an arrow, the figure standing upright under a bar]<\/code><br><code>[sketch: a tall tripod with a bucket or weight hanging from its top]<\/code><br><code>[sketch: a figure hanging from a line by a rope, swinging, with a wheel at the bottom]<\/code><\/p>\n<p>→ <u>Lire<\/u> textes Le vent à Djemilah<br>Images video de (macro sable)<br>- images<br>-<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Enterrer sa vie de garçon ← Dict. de<br>- Crémaillère<br>- House warming   - Graduation   - Divorce<br>- New Year   - Disolve   the last stand.<br>Last gasp, last breath, hurrah, kick the bucket<br>- throw in the towel . give up, call it quits.<br>turn over a new leaf<\/p>", "notes": "\"Le vent à Djémila\" is Camus's essay in <i>Noces<\/i> (Marco wrote about it at Yale; see the thoughts vault). The list on p. 18, of rites and expressions for endings and fresh starts, seems to belong to the same piece.", "img": ["attachments/pages/scan_1997_p017.jpg", "attachments/pages/scan_1997_p018.jpg"]}, "1998-10-15_Pulley-and-Frame-Sketches": {"t": "Pulley and Frame Sketches", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["sculpture-ideas", "engineering", "japan"], "pp": [], "body": "<p><code>[sketch: a frame of two posts on a crossbar with a box hanging from crossed cords]<\/code><br><code>[sketch: a tall frame with a funnel at the top, a lamp hanging inside it, cross-bracing and a small step; heights \"1.25m\" and \"1.25m\"]<\/code><br><code>[sketch: a pulley loop running from a funnel on a post down to a lower wheel, \"1.25m\"; labelled \"must break this loop to have gear or pulley break down\"]<\/code><br><code>[sketch: a belt loop around two wheels, \"1.25m\", feeding a funnel]<\/code><br><code>[sketch: a roller on a handle, labelled \"- like Jap. style mortaring tool\"]<\/code><br><code>[sketch: a tall narrow post]<\/code><\/p>", "notes": "Undated sketches of frames, pulleys and funnels, with heights in metres. The writing at the foot of the page belongs to <span class=\"wl\" data-note=\"1998-10-15_Dreams-Are-Like-Saga-Video-Games\">1998 10 15_Dreams Are Like Saga Video Games<\/span>.", "img": ["attachments/pages/scan_1997_2_p010.jpg"]}, "1995-01-10_Charkow-on-Carriage-and-Freshness": {"t": "Charkow on Carriage and Freshness", "d": "1995-01-10", "est": false, "w": 1995.0247, "era": "Final Semester Yale 1995", "th": ["sculpture", "painting-process", "mountain-biking", "athleticism"], "pp": ["Natalie Charkow", "Paul", "Katherine", "Susannah", "Auerbach", "Matisse"], "body": "<p>1/10/95 Natalie Charkow mentioned an Italian sculpture professor who had been a child prodigy - but was terrible. He could make a likeness of anyone in the class w/ an oval, a cylinder and a wedge - he could <s>get<\/s> capture their carriage w/ those abstract shapes. Carriage is so important to a likeness - I remember getting excited about recognizing Paul in my 1st notebook and I remember how I captured katherine somehow that 1st time I painted her in Susannah's class - <s>that<\/s> <s>were<\/s> <s>[?]<\/s> was an inspired <s>wonderful<\/s> moment or was it, I don't remember. I think they are easily equated to times in athletics when you are just <u>on<\/u>. Everything is in synch. (I had an awesome bike ride yesterday - cleared all the downhills except the last two which I walked rather than risk my luck - and rode the top trail well - what an enjoyable relief.)<br>Charkow mentioned Auerbach and Matisse as two artists who were willing to change their entire images to maintain some of the initial freshness or immediacy, <s>but<\/s> she described a movie of Matisse painting where the pose collapses on one arm, then over compensates in the other direction and then gels. I don't know if Auerbach gels - or does he just stop. It seems to me that the best moments are fleeting throughout the series not particularly the final one. - not like Matisse's blue nude series.<\/p>", "notes": "Natalie Charkow was a sculptor who taught at the Yale School of Art. Auerbach is Frank Auerbach.", "img": ["attachments/pages/scan_1995_p010.jpg"]}, "1999-06-15_Microdomain-Computer-as-System-of-Representation": {"t": "Microdomain: Computer as System of Representation", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["technology", "cognition", "maps"], "pp": [], "body": "<p>- microdomain, <code>[above:]<\/code> life agents computer as system of representation → makes us learn about ourselves<br><code>[two compass crosses: the first with E at the top, S left, N right, W below; the second with E at the top, W left, S right, N below]<\/code><br>cardo - decumanus<br>astronauts barfing<\/p>", "notes": "Undated. The <i>cardo<\/i> and <i>decumanus<\/i> are the north–south and east–west streets of a Roman town; the two compass crosses show the axes turned around. \"astronauts barfing\" may be about losing one's sense of orientation in weightlessness.", "img": ["attachments/pages/scan_1997_2_p068.jpg"]}, "1995-04-11_Wahrnehmen-and-Sich-Bewegen": {"t": "Wahrnehmen and Sich Bewegen", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["french", "perception", "reading", "etymology", "body"], "pp": ["Merleau-Ponty"], "body": "<p>le Wahrnehmen ne <s>[?]<\/s> rejoint jamais le Sich bewegen qu'il veut saisir: il en est un autre. Mais cet échec, cet invisible, atteste précisément que Wahrnehmen est Sich bewegen, il y a là un succès dans l'échec. W échoue à saisir Sich bewegen (et je suis pour moi le zéro de mouvement même dans le mouvement, je ne m'éloigne pas de moi) justement parce qu'ils sont homogènes et cet échec est <code>[circled:]<\/code> l'épreuve de cette homogénéité: Wahrnehmen et Sich b. émergent l'un de l'autre. Sorte de réflexion par Ek-stase, ils sont la même <code>[circled:]<\/code> touffe p. 308<br>→ Wahrnehmen - act of noticing, percieving, becoming aware of<br>→ <u>Sich<\/u> <u>bewegen<\/u>.<br>↙ Yourself ↳ move, affect<br>caecus -a -um - 1. lacking sense of sight, blind.<br>punctum - 1. small hole made by pricking or piercing.<br>3b. Geometrical point - center of a circle<br>4. Infinitesimal portion of space.<\/p>", "notes": "Undated. The French passage is from Merleau-Ponty's working notes in <i>Le Visible et l'invisible<\/i> (1964), p. 308 of the Gallimard edition. The Latin definitions read like an entry from the <i>Oxford Latin Dictionary<\/i>.", "img": ["attachments/pages/scan_1995_p071.jpg"]}, "1995-02-27_Canvas-Screens-and-Light-Intensity": {"t": "Canvas Screens and Light Intensity", "d": "1995-02-27", "est": true, "w": 1995.1546, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "light", "color-theory"], "pp": ["Ron Jones"], "body": "<p><code>[top line cut off by the scan:]<\/code> [?] don't be so literal\" - Ron Says.<br><code>[sketch: a square frame split into \"orange\" above and \"cobalt\" below by a horizontal bar, with an arrow to the bar labelled \"viewing slot?\"]<\/code><br><code>[sketch: a square frame with a curved strip inside it, labelled \"canvas streatched\"]<\/code><br><code>[a long arrow from the sketches leads to:]<\/code> the world is an orange<br><code>[sketch: a box with two curved screens inside and a lamp at the foot of each]<\/code> - light under the screen / scrim. - bottom only incand. - top all sunlight.<br><code>[sketch: a circle drawn several times, with small squares around it, labelled \"36-42(?) tungsten halogen\"]<\/code> → Color Intensity Incand - 15-1600 Sunlight 52000<br><code>[sketch: two curved lines]<\/code> ← steel bar construction w/ canvas streatched over it.<br><code>[sketch: a box with curved canvas panels inside, seen in perspective]<\/code><br><code>[sketch: a circle crossed by two lines]<\/code><br><code>[sketch: a circle with three curved panels inside, seen from above]<\/code><br><code>[sketch: a rounded shape with curved panels]<\/code> - go to a store that makes awnings.<br>(I don't have time to build as quickly as I think).<\/p>", "notes": "Undated; between the 2/27 entry and the next dated entry (Ron's last lecture, 2/27). The top of the page was folded under when it was scanned, so the first line is cut off; only \"don't be so literal\" - Ron Says\" can be read. The numbers by \"Incand\" and \"Sunlight\" are probably colour temperatures or light levels. \"the world is an orange\" may echo Éluard's \"La terre est bleue comme une orange\".", "img": ["attachments/pages/scan_1995_p040.jpg"]}, "1997_p007_An-Ache-About-Painting": {"t": "An Ache About Painting", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts",
