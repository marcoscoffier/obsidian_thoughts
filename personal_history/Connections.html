"th": ["painting", "sculpture-ideas", "optics", "vocation"], "pp": [], "body": "<p><code>[sketch: a flying-saucer shape, a flat dome and a thin lens shape, seen from the side]<\/code><br><code>[sketch: a cube of vertical slices]<\/code> →focusing through space<br><code>[sketch: a square with a line across it, labelled \"waves\" with an arrow, and a long box with vertical lines]<\/code> →standing wave<\/p>\n<p>slides, serial planes.   specimen.<\/p>\n<p>Funny, there is an ache I feel in/about painting which I feel about nothing else in the world, <s>[?]<\/s> perhaps I am just too far removed.<br>* Montparnasse w/ boards<\/p>", "notes": "", "img": ["attachments/pages/scan_1997_p007.jpg"]}, "1995-02-12_Mirandas-Dance-Curtains-and-Pavilions": {"t": "Miranda's Dance: Curtains and Pavilions", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["dance", "installation", "sculpture-ideas", "studio-practice"], "pp": ["Miranda", "Renzo Piano"], "body": "<p><u>Miranda's dance<\/u>: I must find out where we are going to do this<br>- I must go to the <u>theatre store<\/u> - black paint &amp; black curtain<br>- white spray paint - black fire resistant tape for halogen<br>- look @ lights.<br>Already the priorities are getting confused, they are all a priority<br>The problem w/ all these proposals trying to get space is that they are all so concerned w/ the hardware - that is not what the art is about, I can't believe I spent time making the hook loop today which has so little to do w/ the piece. The plate and hook are to fasten the wire which holds the wall which captures the light - at least two removes from the light<br>* could we get <s>[?]<\/s> dancing Tech people to hold the curtains up on long poles - the space is organic dancing!<br><code>[sketch: two running figures holding up a striped curtain on poles]<\/code><br><code>[sketch: two poles meeting at an angle, labelled \"what is this joint\"]<\/code><br><code>[sketch: a rectangular frame braced with crossed cables, with a weight hanging at one side]<\/code> - collapseable - too hard to do in such a short time, but wow. space openning &amp; collapsing w/ the grace &amp; swiftness of a bird's wing - like one of Renzo Piano's pavillions.<br><code>[sketch: a long box labelled \"Aluminum pipes\", with arrows]<\/code> rubber stoppers on the feet - tension thing w/ cables<br><code>[sketch: a curtain hung between two pipes, labelled \"articulation\", \"2 pipes\", \"cable\", \"how to make this stable\" and \"on wheels!\"]<\/code><br><code>[sketch: a cubic frame of pipes braced with cables, labelled \"cables?\"]<\/code> - <u>super light<\/u> - collapsable easy to put together screws &amp; bolts<br><code>[in a box, written at an angle:]<\/code> <u>Tomorrow<\/u> <code>[boxed:]<\/code> Cementitious[?] - Miranda &amp; I have to play w/ halogen &amp; scrims in the room<\/p>", "notes": "Undated; it follows the 2/12 entries. The boxed word in the \"Tomorrow\" note is hard to read; \"Cementitious\" is a guess.", "img": ["attachments/pages/scan_1995_p034.jpg"]}, "1998-12-15_Breathing-Rhythms-and-White-Noise-Interaction": {"t": "Breathing Rhythms and White Noise Interaction", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["music", "sound-art", "systems"], "pp": ["Antoine Brumel", "Pérotin"], "body": "<p>-<br><code>[sketch: two overlapping arcs, the first with a row of marks like 7s labelled \"breathing\", the second with a row of Zs]<\/code><br>- Antoine BRUMMEL<br><code>[sketch: a scatter of short horizontal dashes at staggered heights, like a graphic score]<\/code><br>- poetic rhythms -<br>- On the Sensation of Tone. - - other scales - Perotin<br>Ars Nova - detonate object<br>- \"White noise interaction\" btw bits - attraction repulsion - too flat divide, too round - die<br><code>[arrows under \"flat\" and \"round\":]<\/code> sparse / large<br>temp element which takes a reading of many of these objects (sound)<\/p>", "notes": "Undated. Antoine Brumel and Pérotin are early composers (Renaissance and Notre-Dame school); <i>Ars Nova<\/i> is the 14th-century style. <i>On the Sensations of Tone<\/i> is Hermann von Helmholtz's book on acoustics (1863). The \"white noise interaction\" lines read like rules for a simulation of sound particles, in the spirit of the artificial-life notes in <span class=\"wl\" data-note=\"1998-10-15_Philosophy-of-A-Life-Boden-and-Langton\">1998 10 15_Philosophy of A Life Boden and Langton<\/span>.", "img": ["attachments/pages/scan_1997_2_p043.jpg"]}, "1998-12-15_Dream-of-a-Professor-and-a-Loaded-Word": {"t": "Dream of a Professor and a Loaded Word", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["dreams", "language", "stereotypes"], "pp": [], "body": "<p>The other day I <s>thought<\/s> dreamt <s>actually<\/s> of a proffessor who as he tried to approach a discussion of a character in a book whos name was Tina-bitch. Tried to use this term in the way I felt it was implied in the story as a jokey insult - the way two women, or homosexuals may call each other bitch, but because of how loaded the term is and because the character was black he could not get out of what had become a racial blunder.<br>The word, the lexical item, was so loaded that he could not defuse it with context or for the purpose of discussion - its mere utterance branded him as whiteman / racist.<\/p>", "notes": "Undated.", "img": ["attachments/pages/scan_1997_2_p059.jpg"]}, "1995-06-01_Cast-Acrylic-and-Transparent-Mirror": {"t": "Cast Acrylic and Transparent Mirror", "d": "1995-06-01", "est": true, "w": 1995.4167, "era": "DC, Post-College", "th": ["sculpture-ideas", "mirrors", "light"], "pp": [], "body": "<p><code>[a page of pen sketches of grids, boxes and spheres]<\/code><br><code>[sketch: a square with a smaller square inside, lamps at the four sides]<\/code><br><code>[sketch: a grid of crossing bars]<\/code><br><code>[sketch: a three-by-three grid, labelled \"each w/ 2 walls\"]<\/code><br><code>[sketch: a square with posts at the corners and arrows, a small square in the middle]<\/code><br><code>[sketch: a square with curved sides meeting at a centre point]<\/code><br>- cast <u>Acrylic<\/u><br>- coat a cast space w/ transparent mirror put a light inside - → spherical cast of TP What would reflect?<br><code>[sketch: a rounded square with circles at the corners]<\/code><br><code>[sketch: a square crossed by diagonals with a smaller square inside]<\/code><br><code>[sketch: a circle divided by curves, labelled \"w/ quarter spheres\"]<\/code><br><code>[sketch: a large square with curved, pinched sides]<\/code><br>- remake chair out of neon <code>[in blue:]<\/code> What?<br><code>[sketch: the outline of a chair drawn as a single looping line]<\/code><\/p>", "notes": "Undated sketches. \"TP\" is probably toilet paper, as in <span class=\"wl\" data-note=\"1995-01-22_Toilet-Paper-Mirrors-and-the-Platonic-Theory-of-Sight\">1995 01 22_Toilet Paper Mirrors and the Platonic Theory of Sight<\/span>. \"What?\" after the neon chair is a later addition in blue.", "img": ["attachments/pages/scan_1995_p075.jpg"]}, "1997_p034_The-World-of-Signals-and-a-Saw-Horse-Joint": {"t": "The World of Signals; a Saw-Horse Joint", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["signals", "perception", "body", "woodworking"], "pp": [], "body": "<p>The world of signals is interesting<br>Signals (comm.)   sight &amp; sound.<br>Awareness: of your body...<\/p>\n<p><code>[sketch: a large pencil drawing of a wooden joint: a horizontal beam resting on the top of a post, with a zigzag (finger) joint on one side and a bolt through the post]<\/code><br>- great joint for a saw-horse<\/p>", "notes": "In pencil, like pp. 31–33.", "img": ["attachments/pages/scan_1997_p034.jpg"]}, "1995-08-20_Blake-and-Turrell-Doors-of-Perception": {"t": "Blake and Turrell: Doors of Perception", "d": "1995-08-20", "est": true, "w": 1995.6354, "era": "DC, Post-College", "th": ["perception", "turrell", "reading-list", "sky"], "pp": ["William Blake", "Turrell", "Robert Irwin", "Edward Wortz", "Meinel", "E. C. Krupp", "Duchamp"], "body": "<p>Blake: If the doors to perception where <s>closed<\/s> cleansed, everything would appear to man as it is, infinite.<br>Turrell is a very powerful artist - I realise this again reading about his interaction w/ Irwin &amp; Wortz -<br>The US is so literal he says: has to go to moon to see infinite can't see it in a rock like the Japanese - a regular 'Japanophile (?)<br>___<br>- get a 2nd hand book on Astronomy, Navigation, Meinels, ECKrupp, Turrell, DuChamp.<\/p>", "notes": "Undated; between 8/20/95 and 8/27, and still reading the Art &amp; Technology report (<span class=\"wl\" data-note=\"1995-08-20_Out-of-Sensory-Deprivation-into-the-Real-World\">1995 08 20_Out of Sensory Deprivation into the Real World<\/span>). Blake's line is from <i>The Marriage of Heaven and Hell<\/i>. \"Wortz\" is Edward Wortz, the psychologist who worked with Irwin and Turrell. E. C. Krupp writes on archaeoastronomy. There is a stain at the top right of the page.", "img": ["attachments/pages/scan_1995_p093.jpg"]}, "1995-03-12_The-Stand-and-a-Path-of-Mirrors": {"t": "The Stand, and a Path of Mirrors", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["installation", "mirrors", "studio-practice", "project-list"], "pp": [], "body": "<p>This stand is getting me very excited to be free, show lots of small ideas - Invitation to see ... put in P.O.<br>- get those 1x1 Mirror tiles to make <u>path of mirrors<\/u>.<br>mirror vest &amp; pipe idea<br>&amp; mylar glued under the floor to give watery appearance<br>&amp; maybe make my drywalling less need to be exact finish the hall way &amp; don't care so much about <u>finish<\/u> I have to get done. The more ideas the better or I am not happy -<br>make T-M box for <u>Mon<\/u>. <code>[to the right:]<\/code> - cut part board down to size -<\/p>", "notes": "Undated. \"P.O.\" is probably the post office. The stand is the portable viewing stand of <span class=\"wl\" data-note=\"1995-03-11_A-Map-of-New-Haven-for-the-Thesis-Show\">1995 03 11_A Map of New Haven for the Thesis Show<\/span>; the T-M box is also in <span class=\"wl\" data-note=\"1995-02-12_A-Vehicle-to-Perceptual-Moments-Prioritize\">1995 02 12_A Vehicle to Perceptual Moments Prioritize<\/span>.", "img": ["attachments/pages/scan_1995_p054.jpg"]}, "1995-02-05_Lefebvre-Scales-of-Space-and-the-Maternal-Space": {"t": "Lefebvre, Scales of Space and the Maternal Space", "d": "1995-02-05", "est": false, "w": 1995.0943, "era": "Final Semester Yale 1995", "th": ["space", "scale", "literature", "light", "observation"], "pp": ["Henri Lefebvre", "Lucretius", "Dan Graham", "Saint-Exupéry", "Turrell", "Lindsay", "Megan"], "body": "<p>2/5 The <s>production<\/s> of Space Lefebvre<br>\"From... a philosophy of space revised and corrected by mathematics - the modern field of inquiry known as epistemology has inherited and adopted the notion that the status of space is that of a 'mental thing' or 'mental place'.\" p.3<br>That space is in the mind explains why / how one can switch through scales so easily. I can imagine down into the atoms which comprise the ink flowing out of the tip of my pen. I can imagine the distances from the electron clouds to the nucleus. I can also think outward - think of the tiny spek I become on the surface of the planet and how the planet itself becomes a tiny spec in the universe, not even 1/100,000th of the sun which is only a medium sized star. Science has opened our mental paths to these radical oppositions because it has managed to label &amp; to quantify these distances, these spaces, these differences. But I doubt one needed scientific proof of the atom to experience the vertiginous conceptualization of its existence. → see Lucretius<br>Dan Graham - distances -<br><u>Terre des hommes<\/u><br>They are waking the Sargent:<br>Il remua lentement, montrant son visage encore endormi et baragouinant je ne sais quoi. Mais il revint au mur ne voulant point se réveiller, se renfonçant dans les profondeurs du sommeil comme dans la paix d'un ventre maternel, comme <u>sous des eaux profondes<\/u>, se retenant des poings qu'il ouvrait et fermait, à je ne sais quelles algues noires. Il fallut bien lui dénouer les doigts. Nous nous assîmes sur son lit, l'un de nous passa doucement son bras derrière son cou, et soulera cette lourde tête en souriant. Et ce fut comme, dans la bonne chaleur de l'étable, la douceur de chevaux qui se caressent l'encolure. «Eh! compagnon!» Je n'ai rien vu dans ma vie de plus tendre. Le sergent fit un dernier effort pour rentrer dans ses songes heureux, pour refuser notre univers de dynamite, d'épuisement et de nuit glacée; mais trop tard. p. 164<br>- can one make this maternal space? using real materials, effects to [p]oint, or guide your mind <s>to<\/s> dream, or daydream. New Abstract Expressionism<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>but rather than macho personal gesture, the artist is harnessing nature's forces to present them to the viewer in a new defamiliarized way &amp; stimulating a responce in them! - could sound corny be corny until actual effect if it is right \"God Turrell's work is beautiful\" - Lindsay There is beauty. \"The world is so beautiful\" - Megan Beautiful is not passé or uninteresting - It is here waiting to be discovered.<br>As I began writing this, the Davenport chimneys which I can see from my chair were illuminated against the graying sky of tomorrow's expected snow storm by the evening sun. The color in the corner of my eye was much stronger than when I turned to look @ it. Quiet beautiful moment New Haven has been so full of lately.<\/p>", "notes": "The page was written with the notebook turned sideways. \"production\" in the title is struck through or heavily underlined; the book is Henri Lefebvre's <i>The Production of Space<\/i> (1974; English 1991). The passage is from <i>Terre des hommes<\/i>, in the chapter on the Spanish Civil War. \"soulera\" is as written (Saint-Exupéry has \"souleva\"). The first letter of \"[p]oint\" is cut off at the edge of the scan. Davenport is the Yale residential college.", "img": ["attachments/pages/scan_1995_p028.jpg", "attachments/pages/scan_1995_p029.jpg"]}, "1994-08-10_Swedish-Skiers-and-Gender-Constructs": {"t": "Swedish Freestyle Skiers & Gender Constructs", "d": "1994-08-10", "est": false, "w": 1994.608, "era": "Summer 1994, Travel and Alps", "th": ["gender", "athleticism", "body-image"], "pp": ["Katherine"], "body": "<p>I took the Funiculaire down from the Glacier after having hiked up to the Restaurant. I found myself next to two members of the Swedish women's freestyle team—both very feminine and blond. They were talking to a man (from the French freestyle team?) in English. One of them said in broken English, <i>\"When I was little, my mother would get angry because I would always play with the boys, and always had holes in my knees.\"<\/i> Granted, these women were not very big, but I respect how they take pride in what they do, which is a physical pride.<\/p>\n<p>I also read about a 40-year-old mother of a couple kids in Jersey who took up weightlifting; her trainer was an ex-Ms. Olympia or something—very inspiring. They both had very impressive physiques and took pride in how muscular they looked, yet most people would look at them as freaks.<\/p>\n<p>Katherine has ruined so many women for me. By rejecting so many \"womanly\" things—skirts, etc.—she has made me associate those things with the bad parts of the cultural construct of woman. I have rejected many \"macho\" aspects of manhood, and remember writing a paper for Lit 300 where I identified myself with the position these feminists were describing. I think that if Katherine and I continue keeping in touch, we will find that we will each swing away from identifying with the opposite sex—she will find comfort with my masculine qualities, as I will find comfort in some feminine qualities she has.<\/p>\n<p>I was thinking of taking pictures of women weightlifters' bodies—beautiful pictures about their muscularity and health, close-ups more personal than a flex pose, to help redefine the image of a woman's body.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p053.jpg", "attachments/pages/scan_1994_1_p055.jpg"]}, "1998-12-15_So-Much-Stuff-in-My-Head": {"t": "So Much Stuff in My Head", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["self-awareness", "body"], "pp": [], "body": "<p>So much stuff in my head. always swirling around enough to give me a headache like now.<\/p>", "notes": "Undated; between rules.", "img": ["attachments/pages/scan_1997_2_p051.jpg"]}, "1994-08-06_Dads-Cards-Katherines-Colors-and-Mountain-Textures": {"t": "Dad's Cards, Katherine's Colors & Mountain Textures", "d": "1994-08-06", "est": false, "w": 1994.597, "era": "Summer 1994, Travel and Alps", "th": ["father", "aesthetics", "textures", "painting-process"], "pp": ["Dad", "Katherine"], "body": "<p>Dad is not too artistic, but he cares so much. His constant cards break my heart when I think about how hard it is to communicate with him and how much he loves us.<\/p>\n<p>Katherine's card puts the reddish (earth) where one would expect the skyline, and the blue sky is reflected in the white earth of the foreground. The textures and details refine the visual impact this card has on me—I wanted to say \"beauty,\" any more, though I don't know what that means. \"Visual effect\" is more precise, maybe, but does that imply how much I was moved by this image?<\/p>\n<p>My comment about textures rings ever more true now that I have been trying to paint up in the mountains. I have taken many pictures of texture. It is much harder to throw texture in with all the other things I have to think about when making a painting.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p078.jpg"]}, "2005-03-21_Experimental-Radio-Play": {"t": "Experimental Radio Play", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["technology", "communication", "project-list"], "pp": [], "body": "<p>- Experimental Radio play -<br>Enter system: know that everything will be recorded. volunteer to start a thread - or to recieve a message on a partiular topic.<\/p>", "notes": "Undated; continues the phone and dialog project of <span class=\"wl\" data-note=\"2005-03-21_New-Start-the-Dialog-as-a-Learning-Process\">2005 03 21_New Start the Dialog as a Learning Process<\/span>. The rest of the page is blank (the faint writing is page 84 showing through).", "img": ["attachments/pages/scan_1997_2_p085.jpg"]}, "1995-03-12_A-Dictionary-Is-Amazing": {"t": "A Dictionary Is Amazing", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["language", "french", "writing-style"], "pp": [], "body": "<p>A dictionary is amazing - that its truths don't exsist except that people have already agreed upon them. A writer, which are the core examples &amp; guides of these french dictionaries - knows what words or expressions people know, everyone knows and uses them to their fullest to make them aware of what they don't know.<\/p>", "notes": "Undated; between the 3/12 entries and 3/14.", "img": ["attachments/pages/scan_1995_p054.jpg"]}, "1994-07-09_Yale-as-a-Trial-by-Fire": {"t": "Yale as a Trial by Fire", "d": "1994-07-09", "est": false, "w": 1994.5219, "era": "Yale, New Haven", "th": ["yale-culture", "fear", "criticism"], "pp": ["Ken Mayer"], "body": "<p>I wonder if this last statement can be challenged. My time at Yale has made me fearful—like a war survivor. I expect shots from all directions, especially from where I least expect them, whenever I make any kind of statement. This is good, I guess. One can always argue against any kind of trial by fire—it teaches the quickest, like my experience with Jen Mayer—but it can also destroy the insecure. The Marine type says, \"Great, only the tough will survive and they will be even tougher\"—Darwinism. But the Union member screams discrimination when a learning disabled person is denied a job in the library system. -- I'm rambling.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p102.jpg"]}, "1998-10-15_Photographs-Foreground-Material": {"t": "Photographs: Foreground Material", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["photography", "japan", "city"], "pp": [], "body": "<p>- perhaps left hand picture interests me more than panoramics right now. I really need fore ground material in the image.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p><code>[two colour prints pasted one above the other: above, a radio mast and a white house under a dark sky, the print damaged by a white glare; below, a flat landscape of empty rectangular plots or tennis courts by a river, a pylon on the horizon]<\/code><\/p>\n<p><b>Next page:<\/b><\/p>\n<p><code>[three colour prints: upper left, a road curving under the concrete columns and decks of a raised expressway, a lamp post and a blurred car; lower left, a narrow apartment block with balconies next to a small house with peeling plaster, power lines and a railway gantry behind; right, a footbridge stair beside a tall chain-link fence, a tower block behind and a bicycle in the foreground]<\/code><br><code>[beside the lower left print, in blue pen:]<\/code> ← focus<\/p>", "notes": "Undated. The remark about the \"left hand picture\" and \"panoramics\" is about these photographs, probably comparing the single prints with the joined panoramas of <span class=\"wl\" data-note=\"1998-10-15_Pasted-Photographs-Fences-and-Rooftops\">1998 10 15_Pasted Photographs Fences and Rooftops<\/span>. \"← focus\" points at the apartment-block print. The pictures look like the outskirts of Tokyo.", "img": ["attachments/pages/scan_1997_2_p023.jpg", "attachments/pages/scan_1997_2_p024.jpg", "attachments/pages/scan_1997_2_p025.jpg"]}, "1995-07-01_On-the-Plane-Home-from-Jackson": {"t": "On the Plane Home from Jackson", "d": "1995-07-01", "est": true, "w": 1995.5, "era": "DC, Post-College", "th": ["poetry", "flight", "clouds"], "pp": [], "body": "<p>On the plane home from Jackson<br>I want to<br>fall through the thick coils of air<br>wipping around my flesh<br>tugging at my hairs<br>to land in the soft white silence<br>of a cloud.<\/p>\n<p>There I could<br>tumble and scramble<br>through its billowy whiteness<br>climbing my way through<br>the bottomless formlessness<br>In sun and shadow, wind and silence<br>Alone, tired and happy.<\/p>", "notes": "Undated poem, written on a flight back from Jackson, Mississippi (see <span class=\"wl\" data-note=\"1995-07-01_Sweet-Tarts-in-Jackson-Mississippi\">1995 07 01_Sweet Tarts in Jackson Mississippi<\/span>). The top line is partly cut off by the scan. For the wish to fall, compare <span class=\"wl\" data-note=\"1995-03-12_Your-Last-Night-and-the-Dream-of-Falling\">1995 03 12_Your Last Night and the Dream of Falling<\/span>.", "img": ["attachments/pages/scan_1995_p084.jpg"]}, "1998-12-15_Incorporating-Other-Peoples-Seeing": {"t": "Incorporating Other People's Seeing", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["perception", "art-history", "knowledge"], "pp": ["De Chirico", "Giacometti", "Jean Fautrier", "Mark Tobey"], "body": "<p><code>[at the foot of an otherwise blank page, in black ink:]<\/code><br>- De Chirico<br>- Giacometti<br>- Jean Fautrier ?<br>- Mark Tobey<br>I incorporate other people's seeing into my seeing. my vision of my place in the world depends upon my incorporation of other people's <s>under<\/s> previous communicable <s>[?]<\/s> understandings.<br>This web of knowledge is very dense. ∴ —<\/p>", "notes": "Undated; in black ink, probably added later on the blank back of page 51 (the writing showing through is page 51 in mirror image). It echoes the last paragraph of <span class=\"wl\" data-note=\"1998-12-15_Dewey-Stevens-and-Drawing-in-Perspective\">1998 12 15_Dewey Stevens and Drawing in Perspective<\/span> on the facing page.", "img": ["attachments/pages/scan_1997_2_p052.jpg"]}, "1994-07-28_Sharing-Paintings-With-Women-and-Fear-of-Men": {"t": "Sharing Paintings With Women & Fear of Men (Page 85)", "d": "1994-07-28", "est": false, "w": 1994.574, "era": "Yale, New Haven", "th": ["fear-of-men", "father", "gender", "intimacy", "creativity"], "pp": ["Katherine", "Amy", "Daria", "Vanessa", "Alison", "John Hull", "Andrew", "Coach Markoff", "Roger Staubach", "Papa", "Mom"], "body": "<p>What did I accomplish this summer in which I was so excited about my creativity? I let everyone know how excited I was. Katherine is excited to see my paintings. Amy, Daria &amp; Vanessa, Alison — <code>these are all women. -&gt; all know i've talked about it w/ them all.<\/code><\/p>\n<p>Men make me afraid somehow. I was nervous about Hull's reaction. He connects to all the other men I have known: something about his tobacco chewing, comic book buying &amp; trading music w/ Andrew (always very conscious that Andrew and I where the only men in the class) connects him to Coach Markoff who can look down on everyone b/c they will never be able to be as tough as he is—doing hitting drills w/ no pads, MUP over Roger Staubach. He commands — And something about Papa who is always unapproachable &amp; ready to misunderstand &amp; fly off the handle. The number of times I have felt compassion and even pity for my father who never seems to be able to communicate, are few compared to the times I have been afraid he would start screaming about something irrational about which we could never get him to understand the rational—mom's—explanation.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p014.jpg"]}, "1998-12-15_Smithsons-Spiral-Jetty-Movie": {"t": "Smithson's Spiral Jetty Movie", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["land-art", "film", "video", "japan"], "pp": ["Robert Smithson", "Akemi"], "body": "<p>I saw Smithson's <u>Spiral Jetty<\/u> movie yesterday &amp; felt a kindred soul - It is funny how never having seen his movie I imagined it through his writing &amp; even conjured up a part of it when filming Ak @ Rainbow Bridge. I should really make more documentary type movies (video's)<\/p>", "notes": "Undated. Robert Smithson's film <i>Spiral Jetty<\/i> (1970). The Rainbow Bridge footage is in <span class=\"wl\" data-note=\"1998-12-15_Video-Edit-Notes-Rainbow-Bridge-to-St-Eustache\">1998 12 15_Video Edit Notes Rainbow Bridge to St Eustache<\/span>; \"Ak\" is probably Akemi.", "img": ["attachments/pages/scan_1997_2_p066.jpg"]}, "1995-07-25_Rooftop-Scenes-and-Sell-Myself": {"t": "Rooftop Scenes, and \"Sell Myself\"", "d": "1995-07-25", "est": false, "w": 1995.5658, "era": "DC, Post-College", "th": ["painting", "ambition", "studio-practice", "writing-process"], "pp": [], "body": "<p>7/25<br>- a series of scenes from this same roof-top painted in a similar manner to the charcoal drawings<br><code>[sketch: a rounded box with \"mess\" written around the edges and \"mess w/ focused center\" in the middle, \"quick\" at two corners]<\/code><br><s>many<\/s> diff compositions each a sight.<br>an atmosphere<br>- a moment when you are looking - v. direct, v. quick eye doesn't dawdle for too long -<br><code>[a large bracket joins the next lines:]<\/code><br><s>[?]<\/s> - So many ideas when will the action come<br>- should rate myself only on what has been produced.<br><u>THINK BEYOND<\/u> → <u>slides<\/u>, showing carefully prepared self.<br>I have to get into programs to do what I want to do<br><u>sell myself<\/u>!<br>I really like runny ball point pens, writing looks so much more dynamic<br>- nice pocket warmed capless ball point.<\/p>", "notes": "In blue ballpoint, as the last lines say. \"this same roof-top\" is probably where Marco was staying in Washington DC.", "img": ["attachments/pages/scan_1995_p090.jpg"]}, "1998-10-15_Medium-and-Dream-Coincide": {"t": "Medium and Dream Coincide", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["creativity", "studio-practice"], "pp": [], "body": "<p>You need the moment when the medium &amp; your dream / thought coincide. Split brain problem.<br>→ think of all the ideas / small impression that did not get recorded for posterity b/c the artist was using an incompatible medium<\/p>", "notes": "Undated; it follows the entry dated by the 1997 Nobel Prizes, <span class=\"wl\" data-note=\"1998-10-15_Akemis-John-Cage-Video-and-Nobel-Triplets\">1998 10 15_Akemis John Cage Video and Nobel Triplets<\/span>.", "img": ["attachments/pages/scan_1997_2_p013.jpg"]}, "1994-08-12_Mont-Pourri-Climb-and-Flight-Over-Mont-Blanc": {"t": "On the 4,000-Meter Crest & Flight Over Mont Blanc", "d": "1994-08-12", "est": false, "w": 1994.6135, "era": "Summer 1994, Travel and Alps", "th": ["mountaineering", "flight", "perspective"], "pp": ["Dad", "Laurent", "Julien", "Raymond Fiolle"], "body": "<p>The climb was excruciating. Our guide was determined to get us, his group, up the mountain before another <i>cordée<\/i> that had started at about the same time. I was walking with hot dogs [crampons?]. I was so tired. The last stretch was along a knife-like crest of ice; we felt the wind for the first time, ready to blow us off. Beyond my fatigue, I was conscious only of the incredible distance below on either side of our trail of footsteps.<\/p>\n<p>The top was one of the most incredible memories I have. The summit was no bigger than a queen-sized bed. We could not see any of the mountain we had just climbed, but could see for miles in every direction. This was the highest altitude I had ever been—we were just below the ceiling of 4,000 meters, my dad said. Another 50 meters and we would be over. I remember wanting to reach up or jump to get just those couple meters higher. The ceiling was right there above us.<\/p>\n<p>Last summer I had another incredible experience: Laurent invited me and Julien to go on a flight with his dad. He gave us a tour of the Massif du Mont Blanc. From the air, you can see the folds in the layers of earth that make up the land we live on. The mountains and their valleys are tears through this terrain where its history of evolution can be clearly seen. Being inside that tiny plane, tossed by every turbulence caused by the mountains—irritations in the smooth passage of the layers of wind—one of the most exciting moments for me was recognizing the famous climbs which I had studied in the climbing guides: Grand Dru, Petit Dru, Dent du Géant. There is something magical about looking at these vertical walls and imagining the climber's path.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p115.jpg", "attachments/pages/scan_1994_1_p116.jpg"]}, "1998-12-15_Artist-Makes-with-His-Hands": {"t": "Artist Makes with His Hands", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["craft", "art-theory"], "pp": [], "body": "<p>- artist makes w/ his hands - this is a dream somewhere<br>⇒ how artisan-craftsman becomes philosophy, intellectual movement<\/p>", "notes": "Undated; between rules.", "img": ["attachments/pages/scan_1997_2_p066.jpg"]}, "2026-11-11_Yale-Meat-Market-and-Cibone-Show": {"t": "The Yale Meat Market & Design Show at Cibone", "d": "2026-11-11", "est": false, "w": 2026.8607, "era": "Present, Therapy Notes", "th": ["yale-culture", "social-alienation", "stereotypes", "marriage-distance"], "pp": ["Miwa", "Bret Kavanaugh", "Chris Cuomo"], "body": "<p>I think what \"grosses me out\" about the girls who would flock to preppy Yale singers is that they were deluded by an image, a dream or hope, without knowing the person inside. The worst guys would take advantage of the power imbalance to debase and abuse these confused girls. The whole meat market grossed me out. I felt powerless to change it and I didn’t want to be involved. And yet still today I am thrown into the Yale preppy stereotype. Bret Kavanaugh and Chris Cuomo are despicable yet hold highly visible positions of power and influence. I have shame for those times I might have exerted a power.<\/p>\n<p>I went to a design show at Cibone with Miwa—so much posturing and posing. No interesting conversations. I feel so much distance to the fashionable. I can’t feel excited by the moods or the expensive objects—even the carefully handmade ones. Not in that vibe. I always feel so looked at, so judged. I make the wrong laughable choice. All this style is such a fad.<\/p>\n<p>We had dinner alone with Miwa afterwards. She said she was exhausted by all the social tension. I felt a bit closer to her, but with all the roiling tension I have inside, still very far.<\/p>", "notes": "", "img": []}, "2005-03-21_New-Kite": {"t": "New Kite", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["sculpture-ideas", "wind", "engineering"], "pp": [], "body": "<p><u>new kite<\/u><br><code>[pencil sketch: a row of four tall cells or tubes side by side, divided into sections, with bridle lines running from their tops to rings at their lower ends; one top is circled, and a separate panel shape to the right shows a cross-section with an arrow]<\/code><br><code>[sketch: a trapezoid panel, perhaps the shape of one cell]<\/code><\/p>", "notes": "Undated, about 2005, in pencil; a design for a cellular or parafoil-type kite. The faint writing on the right is the next page showing through.", "img": ["attachments/pages/scan_1997_2_p096.jpg"]}, "1998-10-15_Dreams-Are-Like-Saga-Video-Games": {"t": "Dreams Are Like Saga Video Games", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["dreams", "play"], "pp": ["Zeno"], "body": "<p>Dreams are like saga type video games. I dream that I am going somewhere for something. then the somewhere changes and I need to find something else - Zeno's (?) ½ + ½ of half + ½ of ½ of ½ there is always some intermediate goal put between you and your main goal, or last goal, the main goal is quickly forgotten<\/p>\n<p><b>Next page, at the foot of the page:<\/b><\/p>\n<p>The place the circumstances over whelm and you forget what you where looking for.<br><code>[an arrow down to:]<\/code> → or was never known<\/p>", "notes": "Undated. \"Zeno's (?)\" refers to Zeno's paradox of halving the distance. The continuation is written at the bottom of the next page, below the pulley sketches.", "img": ["attachments/pages/scan_1997_2_p009.jpg", "attachments/pages/scan_1997_2_p010.jpg"]}, "1995-06-01_Things-to-Do-If-I-Return-to-New-Haven": {"t": "Things to Do If I Return to New Haven", "d": "1995-06-01", "est": true, "w": 1995.4167, "era": "DC, Post-College", "th": ["project-list", "painting", "place-attachment"], "pp": ["Philip Guston", "Vanessa"], "body": "<p>Things to do if I return to New Haven for a few days.<br>- repaint my relief painting<br>- take a slide of Sun Shadow &amp; Sky Color II if it is still up.<br>- repaint &amp;/or continue Chapel York project.<br>I kind of long for New Haven these days it was so easy to do things there.<br>I need to make a huge painting like I dreamed of in the Philip Guston show w/ Vanessa.<br>issues of focusing - seeing in peripheral vision -<\/p>", "notes": "Undated. Written after leaving New Haven, so probably after graduation in late May 1995. \"Sky Color\" is the piece in <span class=\"wl\" data-note=\"1995-03-12_Boring-Lecture-and-Sky-Color\">1995 03 12_Boring Lecture and Sky Color<\/span>; \"Chapel York\" is in <span class=\"wl\" data-note=\"1995-03-11_A-Map-of-New-Haven-for-the-Thesis-Show\">1995 03 11_A Map of New Haven for the Thesis Show<\/span>.", "img": ["attachments/pages/scan_1995_p073.jpg"]}, "1998-10-15_An-Artist-Can-Be": {"t": "An Artist Can Be", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["art-theory", "play"], "pp": [], "body": "<p><code>[in black:]<\/code><br>- An artist can be someone who constantly seek the most interesting to <s>[?]<\/s> show, or just play w/<\/p>", "notes": "Undated; in black ink, perhaps added later. The sentence ends at \"play w/\".", "img": ["attachments/pages/scan_1997_2_p027.jpg"]}, "1995-02-27_Katherine-and-the-Poetic-Potential": {"t": "Katherine and the Poetic Potential", "d": "1995-02-27", "est": true, "w": 1995.1546, "era": "Final Semester Yale 1995", "th": ["katherine", "letters", "love", "memory"], "pp": ["Katherine", "Griffin", "Sabine", "Saint-Exupéry"], "body": "<p>katherine <s>[?]<\/s> didn't fall in love w/ the actual physical me, only the poetic potential we shared - Griffin &amp; Sabine or Exupéry's Lettres à <s>[?]<\/s> l'amie inventée. It is not the me physical me she loved - maybe why I felt those two parts of myself so seperate in my relationship with her.<br><code>[an arrow from the circled \"katherine\":]<\/code> → I see her name on the page &amp; I have no idea who or what it refers to for me - I wrote her letters &amp; letters we loved on paper through each other's handwriting but I don't know if we ever actually felt it when we were together - even if we had, its all a memory now.<\/p>", "notes": "Undated; it follows the 2/27 entries. <i>Griffin &amp; Sabine<\/i> (1991) is Nick Bantock's novel told in letters. Saint-Exupéry's <i>Lettres à l'amie inventée<\/i> is a collection of his letters to a young woman he never met.", "img": ["attachments/pages/scan_1995_p040.jpg"]}, "1998-08-01_Play-Until-Equality-the-Chaos-Question": {"t": "Play Until Equality: the Chaos Question", "d": "1998-08-01", "est": true, "w": 1998.5833, "era": "Paris, Beaux-Arts", "th": ["play", "systems", "mathematics"], "pp": [], "body": "<p>play as many games as it takes to have equality which ends the match<br><code>[sketch: two diagrams of arrows bouncing back and forth from a line labelled \"start/stop\", the second between \"start/stop\" and \"outer limit\"]<\/code><br>- get to <u>equality<\/u> is the goal.<br>___<br>- is it possible that this goes on forever?<br>can have situation controlled parameters (temp.) → Chaos question<br>12/0 is a much greater differance than 180/88 or 1000/988 ... the chances of 1000 → 0 are v. small.<br><code>[sketch: a branching tree of arrows spreading out from a point labelled \"st/stop\", some branches marked \"stop\", one \"continue\"; labelled \"↳ odds are to return to center\"]<\/code><br>- odds are to return to center for each bounce so as the ball gets away from the center the odds for returning the system's center are less and less<br>___<br>how to track the escapees?<\/p>", "notes": "Undated. Seems to be the rules for a game or system that runs until the two scores are equal; the next entry on the page, <span class=\"wl\" data-note=\"1998-08-01_Hofstadters-Copycat\">1998 08 01_Hofstadters Copycat<\/span>, is about the \"temperature\" parameter in Hofstadter's Copycat, which this \"(temp.)\" may refer to.", "img": ["attachments/pages/scan_1997_2_p004.jpg"]}, "1998-12-15_Sky-Shadow-Pieces-and-Embarrassment": {"t": "Sky Shadow Pieces, and Embarrassment", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["installation", "framing", "craft", "self-criticism"], "pp": [], "body": "<p>I think of the Sky shadow pieces and the intense embarassement I felt when setting them up - but also sureness of what I was doing. All of the workmanship imitating an industrial production in fact is an attempt to make the special moment I am framing seem absolutely normal. There is beauty in <s>that<\/s> normalcy. In the sky shadow piece: building the frame was a way of protecting this simple idea - protecting it from those who would laugh it off. this protection is somewhat tennuous for it may be even stupider to say look at that guy who spent so long building that thing - but that time validates an action <code>[an arrow from \"spent\", written up the margin:]<\/code> gives it valeur<\/p>", "notes": "Undated. \"Sky Shadow\" (also \"Sun Shadow\") and \"Sky Color\" were outdoor pieces from Marco's last year at Yale (1995).", "img": ["attachments/pages/scan_1997_2_p055.jpg"]}, "1995-01-22_Toilet-Paper-Mirrors-and-the-Platonic-Theory-of-Sight": {"t": "Toilet Paper, Mirrors and the Platonic Theory of Sight", "d": "1995-01-22", "est": false, "w": 1995.0575, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "mirrors", "light"], "pp": ["Plato"], "body": "<p>1/22<br><code>[sketch: two long strips hanging side by side, each with a fold near the bottom]<\/code><br>- two sheets of T.P. hanging in a black room, \"looking\" at eachother. the viewer walks in w/ a flash light. When he shines the light between them they reflect eachother infinitely very effemeral moment.<br><code>[sketch: two rounded half-shells facing each other, the left one with a window and a candle inside, an arrow running from one to the other]<\/code><br>Platonic theory of sight. Rays from inside your head <code>[sketch: two cones point to point, joined by a dotted line with arrows]<\/code> bounce &amp; return the information.<br>That is why it is so special to catch someone else's eye &amp; so arresting to look at oneself in a mirror.<br><code>[sketch: two half-shells facing each other, each with a head in profile looking in through its curved back]<\/code><br><code>[sketch: a small flashlight]<\/code> - makes the infinite possible - what does this exterior light mean.<\/p>", "notes": "\"T.P.\" is toilet paper. The sketches seem to show a viewing room for two, like <span class=\"wl\" data-note=\"1995-01-11_Room-for-Two-Viewers\">1995 01 11_Room for Two Viewers<\/span>.", "img": ["attachments/pages/scan_1995_p019.jpg"]}, "1995-09-01_Audience-and-Creator-Two-Realms": {"t": "Audience and Creator: Two Realms", "d": "1995-09-01", "est": true, "w": 1995.6667, "era": "DC, Post-College", "th": ["art-theory", "communication", "creativity"], "pp": [], "body": "<p><code>[two more cards taped onto the page, in blue ink, continuing the cards on the facing page:]<\/code><br><code>[sketch: two overlapping circles. The left one is labelled \"outside\", with a small circle in its centre labelled \"inside\" and an arrow from \"audience\" below. The right one has a small circle in its centre with an arrow from \"<s>artist<\/s> creator (not necess. a person)\". The shaded overlap is labelled \"<s>art<\/s> creation (not necessarily art)\".]<\/code><br><s>These are<\/s> the two realms where we can exist one can either strive to become the MOST receptive &amp; thus the best audience member which is a wonderful place to be (Zen monk etc.) or to be a creator - one who strives to affect <s>the<\/s> other's inner world. I find the greatest artist's to be those who most easily <s>break down<\/s> <s>the<\/s> open the flow <s>from<\/s> between audience/creator/world/ <s>object<\/s> creation<\/p>", "notes": "Undated; follows on from the cards in <span class=\"wl\" data-note=\"1995-09-01_The-Artist-Transforms-How-You-See\">1995 09 01_The Artist Transforms How You See<\/span>. The cards are water-stained.", "img": ["attachments/pages/scan_1995_p095.jpg"]}, "2005-03-21_To-Do-and-Contacts": {"t": "To Do and Contacts", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["project-list", "internet", "music"], "pp": ["Kerry", "McCarren", "Dion", "Niblock", "Josh", "Eric B.", "Graham", "Elodie"], "body": "<p><u>To do<\/u>: <code>[ticked:]<\/code> b - upload Kerry's project<br><code>[ticked:]<\/code> → add music page.<br>- update metm point to almost.<br>b - tinker w/ McCarren's page<br>___<br>→ tourist and observer -<br>- Information booth.<br><code>[to the right, set off by a line:]<\/code><br><u>Contact<\/u>. Erstwhile, - b <code>[above:]<\/code> what about festival?<br>Dion,<br>Niblock.<br>contact Josh again.<br>→ remind Eric B.<br>b - email insiders about Tues.<br>o - email Graham - ask about deflated balloon.<br>- introduce Elodie's braille proj.<\/p>", "notes": "Undated, about 2005. \"metm\" and \"almost\" are probably Marco's websites metm.org and almost-something.com. Erstwhile is an experimental-music record label; Niblock may be the composer Phill Niblock; Dion, Kerry, McCarren, Josh, Eric B., Graham and Elodie are not identified. \"b\" and \"o\" in the margin are Marco's own markers. The pink rectangle is a sticky note's shadow from page 88.", "img": ["attachments/pages/scan_1997_2_p087.jpg"]}, "1998-10-15_Terrible-Depressions-Spinning-My-Wheels": {"t": "Terrible Depressions; Spinning My Wheels", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["self-criticism", "france", "ambition"], "pp": [], "body": "<p>- I drop into terrible depressions aren't doing enough fast enough not doing the rights things in the wrong direction misguided floating - Perhaps fault of France a bit, spinning my wheels a bit, nowhere there that I really want to go and everyone once they know you have already decided your place in<br>Today I am much better. Feel like I have been productive in the last 3 years - then in a few days the feeling is gone<\/p>", "notes": "Undated. The sentence \"decided your place in\" is left unfinished.", "img": ["attachments/pages/scan_1997_2_p013.jpg"]}, "1995-01-08_Le-Doute-de-Cezanne": {"t": "Le Doute de Cézanne", "d": "1995-01-08", "est": false, "w": 1995.0192, "era": "Final Semester Yale 1995", "th": ["french", "reading", "painting-theory", "perception"], "pp": ["Merleau-Ponty", "Cézanne", "Émile Bernard"], "body": "<p>1/8/95 \"Le Doute de Cezanne\" <u>Sens et non-sens<\/u> (Nagel, 1948)<br>Il a voulu revenir à l'objet sans quitter l'esthétique impressioniste, qui prend modèle de la nature. Emile Bernard lui rappelerait qu'un tableau, pour les classiques, exige circonscription par les contours, composition et distribution des lumières. Cézanne répond: «Ils faissaient le tableau et nous tentons un morceau de nature» Il a dit des maîtres qu'ils «remplaçaient la réalité par l'imagination et par l'abstraction qui l'accompagne», - et de la nature qu'«il faut se plier à ce parfait ouvrage. De lui tout nous vient, par lui, nous existons, oublions tout le reste». Il déclare avoir voulu faire de l'impressionisme «quelque chose de solide comme l'art des musées». Sa peinture serait un paradoxe: rechercher la réalité sans quitter la sensation, sans prendre d'autre guide que la nature dans l'impression immediate, sans cerner les contours, sans encadrer la couleur par le dessin, sans composer la perspective ni le tableau. p. 22 <code>[a pink highlighter line runs down the margin, and \"De lui tout nous vient, par lui, nous existons, oublions tout le reste\" is highlighted]<\/code><br>En quittant le dessin, Cézanne se serait livré au chaos des sensations. Or les sensations feraient chavirer les objets en suggéreraient constamment des illusions, comme elles le font quelquefois, - par example l'illusion d'un movement des objets quand nous bougeons la tête, p. 23.<br>«La nature et l'art ne sont-ils pas differents?»<br>«Je voudrais les unir. L'art est une aperception personnelle. Je place cette aperception dans la sensation et je demande à l'intelligence de l'organiser en oeuvre.» p. 24<br><code>[double line in the margin:]<\/code> La perspective vécue, celle de notre perception, n'est pas la perspective géométrique ou photographique: dans la perception, les objets proches paraissent plus petits, les objets éloignés plus grands, qu'ils ne le font sur une photographie, comme on le voit au cinéma quand un train approche et grandit beaucoup plus vite qu'un train réel dans les mêmes conditions p. 25<br>Cézanne n'a jamais voulu «peindre comme une brute», mais remettre l'intelligence, les idées, les sciences, la perspective, la tradition, au contact du monde naturel qu'elles sont destinées à comprendre, confronter avec la nature, comme il le dit, les sciences «qui sont sorties d'elle». p. 25<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Unity of perceptions<br>Dans la perception primordiale, ces distinctions du toucher et de la vue sont inconnues. C'est la science du corps humain qui nous apprend ensuite à distinguer nos sens. La chose vécue n'est pas retrouvée ou construite à partir des données des sens, mais s'offre d'emblée comme le centre d'où elles rayonnent. Nous <u>voyons<\/u> la profondeur, le velouté, la mollesse, la dureté des objets, - Cézanne disait même: leur odeur. Si le peintre veut exprimer le monde, il faut que l'arrangement des couleurs porte en lui ce Tout indivisible; autrement sa peinture sera une allusion aux choses et ne les donnera pas dans l'unité impérieuse, dans la présence, dans la plénitude insurpassable qui est pour nous tous la definition du réel. p. 28 <code>[highlighted in pink from \"Si le peintre\" to \"impérieuse\"]<\/code><br><code>[bracketed in the margin:]<\/code> l'artiste lance son oeuvre comme un homme a lancé la première parole, sans savoir si elle sera autre chose qu'un cri, si elle pourra se détacher du flux de vie individuelle où elle naît et présenter, soit à cette même vie dans son avenir, soit aux monades qui coexistent avec elle, soit à la communauté ouverte des monades futures, l'existence indépendante d'un <u>sens<\/u> identifiable. Le sens de ce que va dire l'artiste <u>n'est<\/u> nulle part, ni dans les choses, qui ne sont pas encore sens, ni en lui-même, dans sa vie informulée. p. 35-36<br><code>[bracketed in the margin:]<\/code> En suivant les indications du tableau ou du livre, en établissant des recoupements, en heurtant de côté et d'autre, guidés par la clarté confuse d'un style, le lecteur ou le spectateur finissent par retrouver ce qu'on a voulu leur communiquer. <code>[\"communiquer\" is circled]<\/code> Le peintre n'a pu que construire une image. Il faut attendre que cette image s'anime pour les autres. Alors l'oeuvre d'art aura joint ces vies séparées, elle n'existera plus seulement en l'une d'elles <u>comme un rêve tenace<\/u> ou un délire <u>persistant<\/u>, <u>ou dans l'espace comme une<\/u> toile coloriée, elle habitera indivise <u>dans plusieurs esprits<\/u>, présomptivement dans tout esprit possible, <u>comme une acquisition pour toujours<\/u>. p. 37<\/p>", "notes": "Passages copied from Merleau-Ponty's \"Le Doute de Cézanne\", in <i>Sens et non-sens<\/i> (Nagel, 1948).", "img": ["attachments/pages/scan_1995_p007.jpg", "attachments/pages/scan_1995_p008.jpg"]}, "2005-04-24_Hell-Is-Eternal-Ratzinger-and-Hofstadter": {"t": "\"Hell Is Eternal\": Ratzinger and Hofstadter", "d": "2005-04-24", "est": true, "w": 2005.313, "era": "New York 2005", "th": ["religion", "cognition", "metaphor", "mortality"], "pp": ["Joseph Ratzinger", "Douglas Hofstadter"], "body": "<p>\"Hell is eternal\" quote in NYT mag by Ratzinger <s>[?]<\/s> and thinking about last week Hofstater's the soul is a pattern imprinted in the connections &amp; chemistry of the brain You can be dearly remembered or bitterly hated = heaven or hell<br>- 2nd thought how deep &amp; how confusing these abstractions which our brain readily accepts. A world w/out metaphor has less risk of confusion, <s>[?]<\/s> so what is gained by metaphor? why evolution of metaphor?<\/p>", "notes": "Undated. Joseph Ratzinger was elected Pope Benedict XVI on 19 April 2005, and the <i>New York Times Magazine<\/i> wrote about him in the following weeks, so this is probably late April 2005; the date is an estimate. Hofstadter's idea of the soul as a pattern is in <i>I Am a Strange Loop<\/i> (2007) and earlier essays.", "img": ["attachments/pages/scan_1997_2_p097.jpg"]}, "1998-10-15_Places-Remembered-Houston-Ecoles-Skye": {"t": "Places Remembered: Houston, Écoles, Skye", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["memory", "place-attachment", "city"], "pp": ["Jen Renzi"], "body": "<p><code>[bracketed:]<\/code><br>* New York - large emptiness @ west end of Houston? near Jen Rensy's<br>→ Paris - Ave des écoles vers St. Michel near Jussieu<br>→ Washington - Connecticut ave near Uptown theater.<br>New Haven only real memories are the roof tops.<br>I have a remarkably vivid memory of a tiny port in the island of Skye which you had to come down a steep, steep, tiny road w/ sheep to get to - inlet, cove, w/ bridge, horrible midges v. grey but bright, rainsliked.<\/p>\n<p><b>Next page, at the foot, in black:<\/b><\/p>\n<p>→ and also top of hill in the main town w/ view on the tiny harbor. or should I write harbour<\/p>", "notes": "Undated. \"Ave des écoles\" is the rue des Écoles in Paris. \"Jen Rensy\" is Jen Renzi. The added line about the hill and the harbour is at the foot of the next page, in a different pen.", "img": ["attachments/pages/scan_1997_2_p013.jpg", "attachments/pages/scan_1997_2_p014.jpg"]}, "1998-12-15_Dubuffet-LHomme-de-la-Rue-Tout-le-Monde-Est-Peintre": {"t": "Dubuffet: L'Homme de la Rue, Tout le Monde Est Peintre", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["french", "reading", "art-theory"], "pp": ["Jean Dubuffet", "Françoise Choay"], "body": "<p>Vol. II p. 54 √<br>p. 69 bottom<br>Un monsieur - c'est un petit monde...<br>p. 159 - topographies, texturologie<br>- prospectus aux amateurs de tout genre.<br>- l'homme de la rue<br>Choay. vol II p. 217<br>humain → inhumain. paysages géologiques, graphittiques<br>Vol I p. 14 -<br>→ si l'art n'aimait pas à coucher - dans les lits qu'on lui fait ←<br>p. 36<br>C'est à l'homme de la rue que j'en veux, moi, c'est pareil à lui que je me sens, c'est avec lui que je veux faire amitié et entrer en confiance et connivence et c'est à lui que je voudrais, par le moyen de mes ouvrages, donner de l'agrément et de l'enchantement.<br>pensez aux arts qui n'ont pas de nom.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>l'art de parler, l'art de marcher, l'art de rejeter la fumée de sa cigarette avec grâce ou desinvolture. L'art de séduire. L'art de danser la valse, l'art de rôtir un poulet. l'art de donner. L'art de recevoir.<br>- <code>[above the line:]<\/code> 1946<br>C'est triste il avait envie de simplifier sa peinture pour que de gens de tous gendres, le troupeau y trouverait plaisir comme au films de charlot.<br>p. 48<br>Faisons justice au premier lieu de cette legende absurde de l'artiste marqué par le destin d'un signe, qui vient au monde avec une palette sur la tête, et auquel seul est réservé de faire de la peinture et de comprendre et apprecier les tableaux.<br>On n'est pas peintre comme on est ventriloque.<br><u>Tout le monde est peintre<\/u> Peindre c'est comme parler ou marcher. <code>[in red, with an arrow:]<\/code> ↳ comme tout le monde est batisseur d'une ville.<br>tout le monde crayonne<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Il y a de l'art autant à parler, chacun sait bien qu'on peut raconter une histoire de manière plus ou moins plaisante, il y a des gens qu'on s'enchante à écouter dès qu'ils parlent? Mais fort heureusement on a jamais songé à faire du bavardage un grand art religieusement vénéré avec des grandes écoles, des academies et des musées, comme on fait pour la peinture<br>\"<u>Du charme, de l'art, du génie, il y en à partout, cela<\/u> <code>[double-underlined:]<\/code> <u>foisonne<\/u>\" - p 48 <code>[below:]<\/code> z contraste.<br>L'art est un domaine ouvert à tout le monde, qui ne nécessite pas du tout de dons particuliers, ni d'instruction ou d'initiation préalable: n'importe qui peut très bien l'appécier et le pratiquer. La seule chose importante est qu'il ne cherche à imiter personne mais qu'il fasse ce qu'il a envie de faire, en toute simplicité, pour son propre plaisir, et sans fausse honte. p. 53<\/p>\n<p><b>Next page, at the top:<\/b><\/p>\n<p>vol I p. 176<br>langue parlée<br>lettre a Jacques Berne.<\/p>", "notes": "Undated page references to Dubuffet's writings, <i>Prospectus et tous écrits suivants<\/i> (vols. I–IV); continues <span class=\"wl\" data-note=\"1998-12-15_Dubuffet-Psycho-Sites-and-the-Hydra\">1998 12 15_Dubuffet Psycho Sites and the Hydra<\/span>. \"L'art ne vient pas coucher dans les lits qu'on a faits pour lui\" is from Dubuffet's <i>Asphyxiante culture<\/i> and \"Positions anticulturelles\". Jacques Berne was a correspondent of Dubuffet. The red comment \"comme tout le monde est batisseur d'une ville\" ties \"tout le monde est peintre\" to the Hydra text on the city.", "img": ["attachments/pages/scan_1997_2_p040.jpg", "attachments/pages/scan_1997_2_p041.jpg", "attachments/pages/scan_1997_2_p042.jpg", "attachments/pages/scan_1997_2_p043.jpg"]}, "1999-06-15_Ambition-Theory-and-Experience-Speaker-Cone": {"t": "Ambition; Theory and Experience; the Speaker Cone", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["ambition", "epistemology", "sound", "illusion"], "pp": ["John Cage", "Niels Bohr"], "body": "<p>Must be the first to climb -<br><u>ambition<\/u> relates to human society - diff. ideas of what is most respectable<br><code>[a brace joins the next lines:]<\/code><br>- Discovering the natural laws<br>- Discovering new territory - <s>[?]<\/s> contraire? homebody <code>[below:]<\/code> Cage -<br>→ problem of art. intelligence / life<br>→ <u>genetics<\/u> it is coded.<br>Spectra → Bohr atom<br><code>[sketch: \"Experience\" and \"theory\" joined by arrows both ways through a box, labelled \"2 way street\"]<\/code> - Theory can bring about marvels in experience - television radio<br>I still find it to be a miracle that a speaker cone can produce an illusion of a real world sound.<br>- Like 2D/3D illusion.<br>or that math can represent real things about nature.<\/p>", "notes": "Undated; in black ink, continuing the thoughts on genius and the Nobel prize (<span class=\"wl\" data-note=\"1999-06-15_The-Nobel-Prize-Genius-and-Fate\">1999 06 15_The Nobel Prize Genius and Fate<\/span>).", "img": ["attachments/pages/scan_1997_2_p074.jpg"]}, "1999-06-15_Exhilaration-Reading-Pais-on-QED": {"t": "Exhilaration Reading Pais on QED", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["epistemology", "reading", "knowledge", "privilege"], "pp": ["Abraham Pais", "Paul Dirac"], "body": "<p>I have a particular exhilaration reading &amp; feeling that I understand (feeling) Pais's presentation of QED, the Dirac equations.<br>Field equations defining where particles are - <s>[?]<\/s><br>where does this exhilaration come from - genetics. A feeling that I have gained knowledge others can't? something like that.<br>I also think of the exhilaration a culture feels when it produces such thinking. There are Japanese scientists in on the discussions as early as 1909. One cannot help these exhilarations from a dominating understanding. There are no African Physics institutions in 1909 or 193...<\/p>", "notes": "Undated. Abraham Pais's history of particle physics, <i>Inward Bound<\/i> (1986), covers quantum electrodynamics and the Dirac equation. The lower half of the page is blank.", "img": ["attachments/pages/scan_1997_2_p075.jpg"]}, "1995-02-12_Showing-a-Work-I-Didnt-Build": {"t": "Showing a Work I Didn't Build", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["art-theory", "installation", "land-art", "poetry"], "pp": ["Harold Bloom", "A. R. Ammons", "Goldsworthy"], "body": "<p>What does it mean if I decide to show a work I didn't build, didn't even touch didn't even ask to have built?<br>HB says he prefers \"Corson's Inlet\" the poem to the place what If I just lead you to the place?<br>I could try to recreate, but isn't that a representation?<br>Should I make labels on the fence? Like going to the forest and labeling a tree - less even than Goldsworthy who <s>[?]<\/s> would spend hours in a place battling w/ and discovering the forces that are there.<br>But more than conceptual artists who would not even complete the <s>plans for the<\/s> pieces they had made plans for.<br>I need to take pictures. Make a drawing?<br>There &amp; on the A&amp;A roof.<\/p>", "notes": "Undated; about the fence piece, <span class=\"wl\" data-note=\"1995-02-12_Fleeting-Purple\">1995 02 12_Fleeting Purple<\/span>. HB is probably Harold Bloom; \"Corson's Inlet\" is A. R. Ammons's poem. Goldsworthy is Andy Goldsworthy.", "img": ["attachments/pages/scan_1995_p035.jpg"]}, "1995-08-01_Bike-Through-a-Long-Puddle": {"t": "Bike Through a Long Puddle", "d": "1995-08-01", "est": true, "w": 1995.5833, "era": "DC, Post-College", "th": ["poetry", "writing-process", "mountain-biking"], "pp": [], "body": "<p>I wizz over a long puddle on my bike early in the morning.<br>Early in the morning, <s>I<\/s> my bike <s>zips<\/s> through a long puddle<br><code>[boxed:]<\/code><br>Early in the morning<br>I wizz over a long puddle<br>on my bike.<br><code>[to the right:]<\/code><br>Before the low sun<br>My bike <s>rips<\/s> w[hips] through a<br>long puddle -<br><code>[crossed through with zigzags:]<\/code> <s>Sunny this morning<\/s><br><s>We wizz over a long puddle<\/s><br><s>my bike and I.<\/s><br><code>[in pencil:]<\/code><br>Early in the morning<br>my bike wizzes through<br>a long puddle.<\/p>", "notes": "Undated; drafts of a short poem, each version a rewrite of the last. The correction in \"My bike ... through\" is a \"w\" written over \"rips\", probably making \"whips\"; that reading is a guess.", "img": ["attachments/pages/scan_1995_p091.jpg"]}, "1998-12-15_Pool-of-Shadow-and-a-Hole-in-My-Note-Jotting": {"t": "Pool of Shadow, and a Hole in My Note Jotting", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["photography", "light", "writing-process", "identity"], "pp": [], "body": "<p><u>Thoughts<\/u> - \"pool of shadow\", I read in an old notebook.<br>The light falling from the enlarger onto the paper which you can block w/ your hands is actually very beautiful. I placed unsuccessfully a photo on plexi - suspended in the <s>a<\/s> vide above l'atelier du Manier so that it too would receive the light that fell on it.<br>It is unfortunate that there is such a huge hole in my note jotting in these copy books, I feel that my life these past two years has been particularly confused bearings shaken abit, but hey I'll hopefully avoid a mid-life crisis this way.<\/p>", "notes": "Undated; written after a gap of about two years in the notebook, so perhaps 1999–2000; the date is an estimate. \"l'atelier du Manier\" is probably a studio at the Beaux-Arts (Manier may be a teacher's name); \"vide\" is the open space or stairwell above it.", "img": ["attachments/pages/scan_1997_2_p046.jpg"]}, "1997_p026_Jennicam-Sin-Taxes-and-Zeppelins": {"t": "Jennicam, Sin Taxes and Zeppelins", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["internet", "intimacy", "politics", "economics", "technology"], "pp": ["Jennifer Ringley", "Rebecca Bournigault", "Jacques Chirac", "Lionel Jospin"], "body": "<p>→ Jennicam.   ultimate intime   step aside Rebecca Bournigault.<br>→ tabacco tax = poor tax = govt. hooked on \"sin\" money<br>→ micro economy builds macro<br>maj. prbl. in France - Chirac's speach against Jospin<br>→ [incentives] ← this is the key issue.<br>→ Zepplins rather than satelites   [ - www.skystation.com.<br>- www.techserver.com/newsroom/ntn/noframes.html ]<\/p>", "notes": "Jennicam was Jennifer Ringley's live webcam of her room (from 1996); Rebecca Bournigault is a French artist who filmed intimate video portraits. Chirac and Jospin were in \"cohabitation\" from June 1997, which helps date this page to the second half of 1997. Sky Station proposed telecom airships instead of satellites.", "img": ["attachments/pages/scan_1997_p026.jpg"]}, "1994-08-05_Painting-A-Rock-in-the-Sun": {"t": "Alpine Study: *“A rock in the sun w/ a stormcloud”*", "d": "1994-08-05", "est": false, "w": 1994.5943, "era": "Summer 1994, Travel and Alps", "th": ["alpine-painting", "landscape"], "pp": [], "body": "<ul><li><b>Visual Description:<\/b> A full two-page painted landscape spread inside the sketchbook depicting a sunlit rocky mountain peak on the left against a slate-blue sky, contrasted with a dark, brooding stormcloud on the upper right and green/ochre alpine slopes below, with bold gestural brushwork in the lower-left foreground.<\/li><li><b>Bottom-Right Caption:<\/b> <code>\"A rock in the sun w/ a stormcloud.\"<\/code><\/li><\/ul>", "notes": "", "img": ["attachments/Screenshot_2026-11-18_at_10.29.19_AM.png"]}, "1995-09-01_Rhythm-Notes": {"t": "Rhythm Notes", "d": "1995-09-01", "est": true, "w": 1995.6667, "era": "DC, Post-College", "th": ["music", "notation", "learning"], "pp": [], "body": "<p><u>Rhythm<\/u> -<br><code>[notation: two bars of quarter notes, then half notes and a whole note]<\/code> - beat<br><code>[notation: whole, half, quarter, eighth, sixteenth, thirty-second and sixty-fourth notes]<\/code><br>1 ½ ¼ ⅛ 1/16 1/32 1/64<br><code>[notation: a dotted half note = three quarter notes]<\/code> dot get 3 of smallest next beat<br><code>[notation: three eighth notes under a triplet bracket = a quarter note; three half notes = a whole note]<\/code><br>compound meter → whole composition in 3's - # of beats divisible by 3<br>6/8 (2) 9/8 (3) 12/8 (4) 15/8<br><code>[an arrow from 6/8 to:]<\/code> <code>[notation: two groups of three eighth notes]<\/code> - really 2 big beats<br>6/8 <code>[notation: three eighths counted \"1 2 3\", then a quarter and an eighth counted \"4\"]<\/code><br><code>[notation: a quarter, an eighth and three eighths]<\/code><br><code>[notation, in brackets: an eight-bar rhythm in 6/8 of quarter–eighth pairs and dotted quarters]<\/code><br><code>[notation: a rhythm written over the words:]<\/code> Jack and Jill went up the hill to fetch a pail of water <code>[with stress marks under \"Jack\", \"Jill\" and \"water\"]<\/code><\/p>\n<p><b>Next page:<\/b><\/p>\n<p><code>[notation: a rhythm written over the words:]<\/code> Hickory dickory dock The mouse went up the clock <code>[with stress marks]<\/code><br><code>[notation: the same rhythm without words]<\/code><br>1) complete hickory<br>2) compose 8 bar rhythym in 6/8 - 2 phrases<br>flawless at circle - of fifths.<br><code>[in red:]<\/code> the clock struck two<br><code>[in red, notation: a bar of eighths and quarters, then a bar with a triplet]<\/code><br>- 3 blind mice -<\/p>", "notes": "Undated. Notes from a music lesson or course on rhythm and compound metre, with homework (\"1) complete hickory 2) compose 8 bar rhythym in 6/8\"). The note values and rhythms are described in words, since they can't be typed; see the page images. The red ink on page 97 is a later addition, perhaps by a teacher.", "img": ["attachments/pages/scan_1995_p096.jpg", "attachments/pages/scan_1995_p097.jpg"]}, "1995-01-06_Sens-et-Non-sens-Preface": {"t": "Sens et Non-sens, Préface", "d": "1995-01-06", "est": false, "w": 1995.0137, "era": "Final Semester Yale 1995", "th": ["french", "reading", "painting-theory"], "pp": ["Merleau-Ponty", "Cézanne"], "body": "<p>1/6/95 <u>Sens<\/u> <u>et<\/u> <u>Non-sens<\/u>. Préface.<br><code>[bracketed in the margin:]<\/code> Depuis le début du siècle, beaucoup de grand livres on exprimé la revolte de la vie immédiate contre la raison. Ils ont dit, chacun à sa manière, que jamais les arrangements rationnels d'une morale, d'une politique, ou même de l'art ne vaudront contre la ferveur de l'instant, l'éclatement d'une vie individuelle, la «préméditation de l'inconnu». p. 7<br>Dans l'oeuvre d'art ou dans la théorie comme dans la chose sensible, le sens est inséparable du signe. L'expression, donc, n'est jamais achevée. La plus haute raison voisine avec la déraison p. 9.<br><code>[bracketed in the margin:]<\/code> En présense d'un roman, d'un poème, d'une peinture, d'un film valables, nous savons qu'il y a eu contact avec quelque chose, quelque chose est acquis pour les hommes et l'oeuvre commence d'emettre un message ininterompu... Mais ni pour l'artiste, ni pour le public le sens de l'oeuvre elle-même; ni la pensée qui l'a faite, ni celle qui la reçoit n'est tout à fait maîtresse de soi. On verra par l'example de Cézanne dans quel risque s'accomplit l'expression et la communication. C'est comme un pas dans la brume, dont personne ne peut dire s'il conduit quelque part. Même nos mathématiques ont cessé d'être de longues chaînes de raison. Les êtres mathematiques ne se laissent atteindre que par procédés obliques, méthodes improvisées, aussi opaques qu'un minéral inconnu. p. 8-9.<br>Comme Cézanne se demande si ce qui est sorti de ses mains offre un sens et sera compris, comme un homme de bonne volonté, considérant les conflits de sa vie, en vient à douter que les vies soient compatibles entre elles, le citoyen n'est pas sûr que le monde humain soit possible.<br>Mais l'échec n'est pas fatal. Cézanne a gagné contre le hasard. Les hommes peuvent gagner aussi, pourvu qu'ils mesurent le risque et la tâche. p. 11<\/p>", "notes": "Passages copied from the preface of Merleau-Ponty's <i>Sens et non-sens<\/i> (1948).", "img": ["attachments/pages/scan_1995_p005.jpg"]}, "1998-10-15_Smithsons-Non-Sites-and-Photography": {"t": "Smithson's Non-Sites and Photography", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["photography", "land-art", "space"], "pp": ["Robert Smithson"], "body": "<p>What is the difference btw. Smithson's non-sites &amp; photography a photography brings you to a place or time where you are not there is a sort of gap btw. the photo &amp; reality of space &amp; time. <s>[?]<\/s> sculpture object.<\/p>", "notes": "Undated. Robert Smithson's <i>Non-Sites<\/i> (1968 on) are bins of rock and earth taken from a site and shown in the gallery with maps and photographs of it.", "img": ["attachments/pages/scan_1997_2_p026.jpg"]}, "1995-01-07_A-Blank-Day": {"t": "A Blank Day", "d": "1995-01-07", "est": false, "w": 1995.0164, "era": "Final Semester Yale 1995", "th": ["writing-process", "coffee"], "pp": [], "body": "<p>1/7/95 Well, as one could probably tell by the copious amounts of writing I <s>did<\/s> did in my journal, this has not been a very thought provoking day. I am hard pressed to think of a day when my mind was such a blank. At best I can think of this day as gathering reserves for the days to come which will be wonderful, I hope - anything to counter today's lack of every thing. I can't even call it the duldrums it was so blank, blah really. Perhaps my coffee will jump start my brain.<\/p>", "notes": "", "img": ["attachments/pages/scan_1995_p007.jpg"]}, "1998-12-15_Dewey-Stevens-and-Drawing-in-Perspective": {"t": "Dewey, Stevens, and Drawing in Perspective", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["perspective", "drawing", "perception", "knowledge"], "pp": ["John Dewey", "Wallace Stevens"], "body": "<p>After a great read of Dewey's Art as Experience - I walked to the supermarket in the late evening summer sun - w/ parts of Wallace Steven's Ordinary evening in N. Haven in my mind - the sun - strong sun.<br>Steven's begins the poem very visually<br>I thought again of drawing - of the information you gain on your own visual system and of your place in the world when going through <s>the<\/s> a methodical representation of it.<br>I thought of the first users of perspective <code>[above:]<\/code> → imitation. who translated natural <code>[above:]<\/code> natural? space into the flat picture plane (there is a <s>strange<\/s> uncanny similarity btw the first perspective paintings &amp; 3D computer animation<br>I thought how the act of drawing in perspective radically changes your view of your place in the world.<br>And I thought of all this learning about seeing &amp; being that people have built up over the years &amp; how this knowledge builds on thousands of peoples experience<br><code>[a bracket and arrow in the margin:]<\/code> and how long it would take a machine to achieve these understandings<br>(see drawing in 10 pgs.)<\/p>", "notes": "Undated; a summer evening. John Dewey's <i>Art as Experience<\/i> (1934); Wallace Stevens's \"An Ordinary Evening in New Haven\", which Marco planned to put on his viewing stand in March 1995.", "img": ["attachments/pages/scan_1997_2_p053.jpg"]}, "1994-08-03_Lake-Annecy-Sparkling-Water-and-Backlit-Birds": {"t": "Sitting on a Bench at Lake Annecy: Sparkling Water & Birds (Page 101)", "d": "1994-08-03", "est": false, "w": 1994.5888, "era": "Summer 1994, Travel and Alps", "th": ["annecy", "light", "water", "solitude", "observation", "painting-subjects"], "pp": [], "body": "<p>I sat on a bench in Annecy looking at the lake from under the shade of a large tree, finally I could content myself after a long day of being w/ a group who flirted w/ experience rather than partake in it. The sun was in such a position that I could not see it, but its presence was easily percieved by the glowing outlines of some branches and leaves above me and by the flashes of light, with the sparkling feel of a discoteche casion [casino?] or christmas tree, off the ever changing water, which I thought looked like tight Saran wrap, then turmoiled mercury — then nothing so specific or so muscular. The changing nature of the waves affected the flashing sun on its surface from the frenetic excitement of a disco to erratic twinkling of an elderly matron's sequined robe. The birds would react to the changes of the wind, waves and the sun which all changed each other. When the backlit birds would land, their initial impact w/ the water would be followed by a sparkling ring of sun.<\/p>", "notes": "<i>(Right margin, sideways):<\/i> <code>this is an effect to be captured w/ a brush or a camera.<\/code>", "img": ["attachments/pages/scan_1994_2_p041.jpg"]}, "1997_p021_Devisager-Rilke-Lyotard-Lacan": {"t": "Dévisager : Rilke, Lyotard, Lacan", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["the-face", "reading-list", "mirrors", "autofiction", "french"], "pp": ["Rainer Maria Rilke", "Jean-François Lyotard", "Jacques Lacan", "Serge Doubrovsky"], "body": "<p>devisager   Rilke Les carnets de Malte Laurids Brigge<br>vis à vis   JF Lyotard faire visage - 241 Revue des sciences humaines.<br>Lacan - le stade du mirroirs . ecrits I<br>autofiction - Serge Dubrofsky<br>fils<\/p>", "notes": "A reading list on the face. \"fils\" under Doubrovsky is his novel <i>Fils<\/i> (1977), which coined \"autofiction\" (compare p. 14). A small mark over the \"r\" of \"devisager\" may be a correction.", "img": ["attachments/pages/scan_1997_p021.jpg"]}, "1994-07-31_Control-and-Batesons-Meta-Language": {"t": "Letting Go of Control & Bateson's Meta-Language", "d": "1994-07-31", "est": false, "w": 1994.5822, "era": "Yale, New Haven", "th": ["vulnerability", "control", "meta-language"], "pp": ["Gregory Bateson"], "body": "<p>I am only comfortable manipulating—or consciously feeling—whether I am aware of it or not. When I am not in control or in a position to manipulate, [I feel exposed]. Gregory Bateson speaks of meta-language.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p047.jpg"]}, "1995-03-12_Mapping-the-Sun": {"t": "Mapping the Sun", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["light", "sky", "installation", "maps", "mirrors"], "pp": ["Turrell", "Robert Gordon", "Saint-Exupéry"], "body": "<p>I thought the other day at sun-set that the sun's rays act like a lever at sun-set they find the highest point and pivot around it, or the edge of the earth if it is flat.<br><code>[sketch: a small circle labelled \"setting sun\", a line from it grazing the top of a larger circle (the earth)]<\/code><br><code>[sketch: a hill in profile, one slope hatched; labels \"rosy sun-set lit\" and \"in shade\"]<\/code><br><code>[sketch: a square with a hatched triangle of shadow, labelled \"angle changes w/ day.\" and \"build a wall ⊥ to sun's rays.\"]<\/code><br><code>[sketch: two curved, hatched surfaces facing each other, labelled sideways \"Bunch of transparent scrims - catch sun @ diff. times of the year. <u>Sun mapping<\/u>\"]<\/code><br>I saw the blue again &amp; it is <u>so<\/u> easy<br>- no longer purely optical<br>&amp; Turrell's about daydream spaces<br>→ <code>[in a loop:]<\/code> <u>Mapping the sun<\/u> | <u>Robert Gordon<\/u> → place the stand in diff. spots for the sun-set.<br>- St.Ex about being on that flat mesa.<br>- mirrors scattered on the ground. around the hill<br><code>[sketch: a line of horizon with small squares on it, labelled \"set sun hill\"]<\/code><br>put shadow fla[g?] <code>[cut off by the scan]<\/code><\/p>", "notes": "Undated. \"the blue\" is probably the blue of snow shadows from <span class=\"wl\" data-note=\"1995-02-12_Fleeting-Purple\">1995 02 12_Fleeting Purple<\/span>. Robert Gordon is not identified. \"St.Ex ... on that flat mesa\" is the plateau in <i>Terre des hommes<\/i> (see <span class=\"wl\" data-note=\"1995-03-12_Vertigo\">1995 03 12_Vertigo<\/span>). The bottom of the page was folded under when it was scanned, so the last line is cut off.", "img": ["attachments/pages/scan_1995_p058.jpg"]}, "1995-01-29_Terre-des-Hommes-and-the-Body": {"t": "Terre des Hommes and the Body", "d": "1995-01-29", "est": false, "w": 1995.0767, "era": "Final Semester Yale 1995", "th": ["perception", "literature", "flight", "body"], "pp": ["Saint-Exupéry", "Rimbaud", "Shelley", "Merleau-Ponty", "Camus"], "body": "<p>1/29 <u>Terre des hommes<\/u> -<br>Saint-Ex is always talking about his <u>death<\/u> - or the danger of piloting an airplane. And he died young. He says in <u>Vol de Nuit<\/u> that to really discover the town's secrets, he would have to \"renoncer à l'action\".<br>→ Death of the artist theme - Rimbaud, Shelley<br>↳ early<br>Saint Exupéry &amp; Merleau Ponty → though he was not terribly young.<br>I am fascinated by the dramatic changes in spacial perceptions. From the tiny fly at the beginning of the 1st story in <u>Exil et Royaume<\/u> - to the <s>[?]<\/s> far horizon she studies.<br>Ponty's Phenomenology takes into account the two extremes of the perceptual. The body and the distant world. At the same time that the 20th c. expanded our conception of space w/ air travel, and much faster travel in general - a smaller planet or access to <s>a<\/s> much larger parts of it, we have become much more conscious (or literature and the arts have become much more conscious) of the minute reality of human existence. The fact that anything we think or percieve takes place w/in our body - from which we can never escape. These tiniest events of human existence take central importance in the works of Camus &amp; Saint Exupéry:<br>\"j'avalai ma salive et me hasardai à lui demander enfin si son vol avait été dur.\" - p.12 <u>Terre des Hommes<\/u><br>The involuntary responce of the novice's nervousness, allows us to feel his situation, crawl into his body at that moment. We have all swallowed nervously. When we are lead to recall this unconscious act by the narrator we feel what he felt by reproducing the physical sensation he described in our own bodies.<\/p>", "notes": "The first story in Camus's <i>L'Exil et le royaume<\/i> (1957) is \"La Femme adultère\". The \"renoncer à l'action\" passage is copied in <span class=\"wl\" data-note=\"1995-01-09_Vol-de-Nuit-Another-Space\">1995 01 09_Vol de Nuit Another Space<\/span>. A yellow sticky note is attached to the right edge of the page.", "img": ["attachments/pages/scan_1995_p026.jpg"]}, "1995-09-01_Horizon-Notes": {"t": "Horizon Notes", "d": "1995-09-01", "est": true, "w": 1995.6667, "era": "DC, Post-College", "th": ["sky", "observation", "color-theory"], "pp": [], "body": "<p><code>[in pencil, in square brackets:]<\/code><br><u>Horizon notes<\/u>: ruddy purple → yellow → white/green → clear blue looks dark purple at top of your eyes until you move your head<\/p>", "notes": "Undated, in pencil. Compare the sunset colours in <span class=\"wl\" data-note=\"1995-08-20_Out-of-Sensory-Deprivation-into-the-Real-World\">1995 08 20_Out of Sensory Deprivation into the Real World<\/span>.", "img": ["attachments/pages/scan_1995_p095.jpg"]}
