es": "", "img": ["attachments/Screenshot_2026-11-18_at_10.26.11_AM.png"]}, "1995-02-27_Only-Happy-When-Working-a-Portable-Viewing-Stand": {"t": "Only Happy When Working; a Portable Viewing Stand", "d": "1995-02-27", "est": false, "w": 1995.1546, "era": "Final Semester Yale 1995", "th": ["studio-practice", "installation", "poetry"], "pp": ["Wordsworth"], "body": "<p>2/27. My life has been miserable. The only time I'm happy is when I'm working. Incentive to go and do. I am only happy when working on my own stuff though, not @ rehersal or at OX meetings. Must be making my mind consuming stuff.<br>Had an idea about making a portable viewing stand which I could set up for any environment - time. I was thinking of engraving lines of poetry on the rail where you put your hands. Engraved like the lines on Wordsworth's Yew Tree.<\/p>", "notes": "Wordsworth's \"Lines left upon a Seat in a Yew-tree\" (1798) were meant to be read at a seat overlooking a view. The stamps pasted at the foot of the page belong with <span class=\"wl\" data-note=\"1995-02-21_The-Stamp-on-My-Last-Letter-to-Katherine\">1995 02 21_The Stamp on My Last Letter to Katherine<\/span>.", "img": ["attachments/pages/scan_1995_p039.jpg"]}, "1995-03-12_Sunset-and-Sunrise-Pulleys": {"t": "Sunset and Sunrise Pulleys", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "light", "project-list"], "pp": [], "body": "<p><code>[sketch: a horizon line with a small sun on it]<\/code> - over the water<br><code>[sketch: a lamp shade or tiered lantern hanging from a line]<\/code><br><code>[sketch: two lamps on poles standing on a long beam, one on a pulley]<\/code><br>- 2 weeks of each \"sun set\" and \"rise\"<br><code>[sketch: two tall loops of cord over pulleys, set into a base with small objects between them]<\/code><br><code>[sketch: two hanging cords with weights at their feet]<\/code><br><code>[sketch: a single loop over a pulley above a beam, with a \"2ft\" measure below]<\/code><br>I'm thinking of putting this in my room, but the ideas in there are getting too complicated.<br><code>[at the foot of the page:]<\/code><br><code>[sketch: a pole with a weight on it, crossed out, labelled \"no\"; beside it a plain pole]<\/code><br><u>Wed<\/u>. → stand on Kline hill.<br><u>Mon<\/u>. work on room - <s>[?]<\/s> find chair<br>Tues. Morn. - Masonry &amp; Pulley place<\/p>", "notes": "Undated. The sketches seem to be lamps on pulleys that rise and set like the sun. \"Kline hill\" is probably the hill by Yale's Kline Biology Tower (Science Hill). The to-do list is at the foot of the page, below <span class=\"wl\" data-note=\"1995-03-12_Your-Last-Night-and-the-Dream-of-Falling\">1995 03 12_Your Last Night and the Dream of Falling<\/span>.", "img": ["attachments/pages/scan_1995_p060.jpg"]}, "1997_p028_What-We-Learn-Isnt-What-Were-Taught": {"t": "What We Learn Isn't What We're Taught", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["teaching", "learning", "synchronicity", "music", "dance"], "pp": ["John Cage", "Carl Jung", "John Dewey"], "body": "<p>What we learn isn't what we're taught nor what we study.<br><u>We<\/u> <u>don't know<\/u> <u>what<\/u> <u>we're<\/u> <u>learning<\/u><br>- A teacher should do <s>more<\/s> something other than fill in the gaps<br><s>what we learn isn't what<\/s><br>↳ Cage.<\/p>\n<p>\"synchronicity\" - btw. dance &amp; music<br>independant but in the same time.<\/p>\n<p>Bollingen, Wilhelm/Baynes edition w/ essay on synch. by Jung.<br>John Dewey <u>Art as experience<\/u><br>anarchic harmony   decentralized<\/p>", "notes": "The synchronicity of dance and music is Cage and Cunningham's way of working. The Bollingen edition is the Wilhelm/Baynes translation of the <i>I Ching<\/i>, which has Jung's foreword (Jung's essay on synchronicity is separate).", "img": ["attachments/pages/scan_1997_p028.jpg"]}, "1995-04-11_Rebuilding-the-Light-with-Screens-Piece": {"t": "Rebuilding the Light with Screens Piece", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "light"], "pp": [], "body": "<p>I'm thinking of re-building my light w/ screens piece.<br><code>[sketch: two tall curved screens facing each other with a bar of light between them, labelled \"make this to walk in center\"; \"27x6\"\"]<\/code><br><code>[sketch: a cluster of lamps on a pole, and a lamp with arrows pointing out in all directions on a wheeled base, labelled \"cartesian light point epicenter on wheels\"]<\/code><br><code>[sketch: a cube of grid with lamps at the crossings, labelled \"1m\"]<\/code><br><code>[sketch: a small grid, labelled \"6\"\" and \"grid marking off.\"]<\/code><br><code>[sketch: a grid of bars with crosses in the squares, \"12in\" across]<\/code><br><code>[sketch: a strip of six squares]<\/code><br><code>[sums:]<\/code> 9x3 / 27 x16 ... 12 ) 164 ... 3.5 / 36 60<br>12x12x12 / 12 / 24 / 120 / 144 x 1<br><code>[circled:]<\/code> 13.5 ft. - 2 bars<br>36 x 3 / 133 / 8 ) 1024 ft. / 14 x15 / 70 / 140 / <code>[boxed:]<\/code> $210 fuck!<br>1 sq. foot<br><code>[sketch: a spiral, and below it a small box on a post at a horizon line]<\/code><\/p>", "notes": "Undated. The sums are working out the cost of materials for the grid; the figures are copied as far as they can be read. The \"light w/ screens piece\" may be the one in <span class=\"wl\" data-note=\"1995-02-27_Canvas-Screens-and-Light-Intensity\">1995 02 27_Canvas Screens and Light Intensity<\/span>.", "img": ["attachments/pages/scan_1995_p069.jpg"]}, "1997_p001_Engineers-William-Gibson-and-Web-Addresses": {"t": "Engineers, William Gibson and Web Addresses", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["engineering", "structures", "music", "internet", "reading-list"], "pp": ["William Gibson", "Eugène Freyssinet", "Nicolas Esquillan", "Pier Luigi Nervi", "Chuck Hoberman", "Robert Le Ricolais", "Rodrigo Moynihan"], "body": "<p>→ Mountain climbing.<br>→ sun worship<br>→ squeak btw. canyons<\/p>\n<p><code>[sketch: a spiral inside a scalloped outline]<\/code> William Gibson <u>SF writer<\/u>   IDORU.<\/p>\n<p>Freyssinet. pre-contrainte<br>Nicolas Esquillan   Boulogne[?]<br>Nervi<br>Chuck[?] Hoberman<br>Robert Le Ricolais -<\/p>\n<p><code>[right margin: Etage 2 / prt 4 I 615[?] / Blanc.]<\/code><\/p>\n<p><code>[written at an angle: Rodrigo Moynihan]<\/code> <code>[sketch: two small circled marks]<\/code><\/p>\n<p>→ MEGO label   Vienna<br>-electronic, fax hiss<br>Fridge Trax FP<\/p>\n<p>mayhem.net/genitals/<br>subgenius.com<br>//gopher.well.sf.ca.us:70/1/Publications/online_zines/scam<br>parascope.com<br>teleport.com/~dkossy/<br>go2net.com/internet/useless/useless/wacko.html.<\/p>", "notes": "Probably the inside cover or first page of the notebook. \"Chuck\" is read from a word that could also be \"Anuck\"; Hoberman (the engineer of folding structures) fits the list of structural engineers (Freyssinet, Esquillan, Nervi, Le Ricolais). The address in the right margin is uncertain. Mego is the Vienna electronic-music label.", "img": ["attachments/pages/scan_1997_p001.jpg"]}, "1995-01-22_Cheating-in-the-Mind": {"t": "Cheating in the Mind", "d": "1995-01-22", "est": true, "w": 1995.0575, "era": "Final Semester Yale 1995", "th": ["religion", "intimacy", "commitment"], "pp": [], "body": "<p>- I wonder what the religions or philosophical takes are on the question of cheating in the mind vs. <s>[?]<\/s> a cheating action. <s>[?]<\/s><br>cheating / sinning / doing wrong → what defines these? Major philosophical issue I suppose.<br>Bad thought vs. bad action<br>- action is certainly the worst, but how bad can thought be?<\/p>", "notes": "Undated; it follows the 1/22 sketches on the same page. \"sinning\" and \"doing wrong\" are written under \"cheating\", with a bracket joining all three to \"what defines these?\".", "img": ["attachments/pages/scan_1995_p019.jpg"]}, "1994-07-28_Umberto-Eco-Semantics-of-Metaphor": {"t": "Umberto Eco: The Semantics of Metaphor (Page 83)", "d": "1994-07-28", "est": false, "w": 1994.574, "era": "Yale, New Haven", "th": ["semiotics", "metaphor", "metonymy", "finnegans-wake", "note-taking"], "pp": ["Umberto Eco", "James Joyce", "Pablo Picasso", "Dante Alighieri", "Galileo Galilei", "Stanislav Grof"], "body": "<p>Extensive reading notes and bracketed critiques (<code>[...]<\/code>) on **Umberto Eco's *The Semantics of Metaphor*** across notebook pp. 82v–84:<\/p>\n<h4>Key Concepts Summarized from Eco<\/h4>\n<ul><li><b>Semiotic vs. metasemiotic judgments:<\/b> Codes do not only produce tautological utterances; they let us form metasemiotic judgments that invent new semantic couplings and call the code itself into question. Every metaphor traces back to a subjacent chain of metonymic connections (even in everyday messages and philosophy, whenever culture must name something unassimilated).<\/li><li>**Joyce, <i>Finnegans Wake<\/i>, and Picasso (p. 83):** <i>Finnegans Wake<\/i> exemplifies unlimited semiosis through phonetic contiguity preceding semantic similitude. Summarizes Eco on <i>meander tale<\/i> / <i>Neanderthal<\/i> (phonetic + semantic resonance vs. \"empty modern art\" <code>'Oh yeah, so?'<\/code>) and Picasso's bicycle seat + handlebars forming a bull's head (<code>\"becomes rewarding or does it become trite?\"<\/code>), plus Eco's multidimensional <i>Ersatz<\/i> field diagram (<i>Graph p. 259<\/i>).<\/li><li><b>Schema of metaphor &amp; catachresis (p. 83v):<\/b> <code>A -&gt; k, k &lt;- D<\/code> (<code>woman -&gt; long white neck &lt;- swan<\/code>: calling a woman a swan is metaphor; when it ages into cliché like <i>neck of a bottle<\/i>, it becomes <i>catachresis<\/i>). Contrasts Dante's <i>\"dark wood\"<\/i>, Achillini's fire-heat-sweat factual comparisons, Galileo's condemnation for <i>semiotic<\/i> rather than logical contradiction with Scripture, and Joyce's <i>etyma + atom = 'abnihilation of the ethym'<\/i> (\"before nuclear fission\").<\/li><\/ul>\n<h4>Marco's Handwritten Reflections &amp; Critiques<\/h4>\n<ul><li><b>Margin notes (p. 83):<\/b><\/li><\/ul>\n<p>  &gt; <code>makes a chart to show network of meanings.<\/code><br>  &gt; <code>When a simple association can show something about an artist's entire system (assuming there is one) then it becomes more interesting<\/code><\/p>\n<ul><li><b>Pushing back on Eco's cultural-constructivism (p. 83):<\/b><\/li><\/ul>\n<p>  &gt; <code>[I don't know if I agree at all. Can't the metaphor originate from a resemblance which becomes cultural once the metaphor has been created because that resemblance existed throughout the frame of reference of culture?]<\/code> -&gt; <i>(left margin, later arrow)<\/i>: <code>No, I reconsider<\/code><br>  &gt; <code>[This argument is unprovable like those that question to what point are feminine and masculine cultural constructs.]<\/code><br>  &gt; <code>[I like this image (What are Swedish-Stall bars?)]<\/code> <i>(on \"a ratiocination that traverses the paths of the semantic labyrinth in a hurry...\")<\/i><\/p>\n<ul><li><b>On cultural distance in <code>A -&gt; k -&gt; k -&gt; D<\/code> (p. 83v):<\/b><\/li><\/ul>\n<p>  &gt; <code>[I see more clearly now why a metaphoric connection is dependant on cultural definitions.]<\/code><\/p>\n<ul><li>**Reflection on active note-taking &amp; earlier <i>Passion of the Western Mind<\/i> notes (bottom p. 83v):**<\/li><\/ul>\n<p>  &gt; <code>[I really fare better when I manage to put my thoughts which are produced by the text down—the whole process is more memorable, and if I am not understanding the text, it becomes more obvious.—same would go for class notes—and the Passion of the Western Mind notes earlier in this book—what did I get from that reading? Nothing 'till the end set my thoughts in motion: the stuff about Grof on a universal mind etc.<\/code><\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p010.jpg", "attachments/pages/scan_1994_2_p011.jpg", "attachments/pages/scan_1994_2_p012.jpg"]}, "1995-03-12_Intellectual-Space": {"t": "Intellectual Space", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["writing-process", "space", "language"], "pp": ["Natanson", "Husserl", "Saint-Exupéry", "Merleau-Ponty", "Bachelard"], "body": "<p>Intellectual space --<br>- Nathanson's passage on Husserl. - mapping int. space<br>- <u>Petit Prince<\/u> language is the connector<br>→ Ponty's passage about <code>[circled:]<\/code> sens - meaning, - perception direction<br>[look @ my reading notes from this summer<br><u>Bach<\/u>.<\/p>", "notes": "Undated; more notes for the essay in <span class=\"wl\" data-note=\"1995-03-12_The-Phenomenology-of-Space-Essay-Plan\">1995 03 12_The Phenomenology of Space Essay Plan<\/span>. \"Nathanson\" is probably Maurice Natanson, a Yale philosopher who wrote on Husserl. \"Bach\" is probably Bachelard.", "img": ["attachments/pages/scan_1995_p056.jpg"]}, "1995-04-11_Chrome-Object-in-Many-Places": {"t": "Chrome Object in Many Places", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["photography", "sculpture-ideas", "project-list"], "pp": [], "body": "<p><code>[sketch: a cube with each side labelled \"7\"]<\/code><br>¼\" ½ <code>[with a stroke of graphite beside it]<\/code><br>Measure - make sure I will get right amount.<br>- smaller squares<br>thicker I could make bigger<br><code>[sketch: a row of upright strokes, some with short tops, like poles or corner pieces]<\/code><br>take photographs of a chrome object in many different places close up &amp; in complete situations. How different can it look?<br>Series, Sequence<\/p>", "notes": "Undated. The chrome object in many places answers Collot's \"un chose n'est jamais la même\" just above it, in <span class=\"wl\" data-note=\"1995-04-11_Collot-Du-Sens-de-lEspace-a-lEspace-du-Sens\">1995 04 11_Collot Du Sens de lEspace a lEspace du Sens<\/span>.", "img": ["attachments/pages/scan_1995_p072.jpg"]}, "1994-06-22_Critique-of-Earthworks": {"t": "Critique of Earthworks (Heizer, De Maria, Smithson)", "d": "1994-06-22", "est": false, "w": 1994.4742, "era": "Yale, New Haven", "th": ["earthworks", "sculpture", "landscape", "double-bind"], "pp": ["Michael Heizer", "Walter De Maria", "Robert Smithson", "Gregory Bateson"], "body": "<p>I think that the earthworks sculptors—Heizer, De Maria, [Smithson]—[seem] absolutely trite when compared to the enormous [works built] out of necessity: highways, over-passes, cities, t[unnels]... These three have trouble finding the virgin l[andscape] because they are being crowded out by society... [Their] sculpture is so dependent on the remote locati[on—does] the object itself have something to do w/ this... of the art object becomes gross when it is [placed in a setting] of greater beauty. What aesthetic is being [served by] heavy construction equipment connecting their works to highways &amp; cities &amp; the earth materials which makes <i>Complex One<\/i> not very different from a highway underpass? The mirrors which Smithson uses seem to be a little more interesting to me, but he doesn't do anything w/ them.<br><i>(Bracketed note: <code>[see \"Existentially, the human cannot leave the field\" — Gregory Bateson \"Double Bind\" p. 10]<\/code>)<\/i><\/p>", "notes": "", "img": ["attachments/Screenshot_2026-11-18_at_10.27.18_AM.png"]}, "1995-03-12_Bishop-The-Unbeliever-and-Wordsworth": {"t": "Bishop's \"The Unbeliever\" and Wordsworth", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["poetry", "reading", "fear"], "pp": ["Elizabeth Bishop", "Wordsworth"], "body": "<p><u>The Unbeliever<\/u> E. Bishop.<br>He sleeps on the top of a mast<br>with his eyes fast closed.<br>The sails fall away below him<br>like the sheets of his bed,<br>leaving out in the air of the night the sleeper's head.<\/p>\n<p>Asleep he was transported there,<br>asleep he curled<br>in a gilded ball on the mast's top,<br>or climbed inside<br>a gilded bird, or blindly seated himself astride.<\/p>\n<p>\"I am founded on marble pillars,\"<br>said a cloud. \"I never move.<br>See the pillars there in the sea?\"<br>Secure in introspection<br>he peers at the watery pillars of his reflection.<\/p>\n<p>A gull had wings under his<br>and remarked that the air<br>was \"like marble.\" He said: \"Up here<br>I tower through the sky<br>for the marble wings on my tower-top fly.\"<\/p>\n<p>But he sleeps on top of his mast<br>with his eyes closed tight.<br>The gull inquired into his dream,<br>which was, \"I must not fall.<br>The spangled sea below <s>[?]<\/s> wants me to fall.<br>It is hard as diamonds; it wants to destroy us all.\"<\/p>\n<p><code>[to the right, joined by a line to \"his reflection\":]<\/code><br><u>Resolution and Independence<\/u> W. Wordsworth<br>IX<br>As a huge stone is sometimes seen to lie<br>Couched on the bald top of an eminence;<br>Wonder to all who do the same espy,<br>By what means it could thither come, and whence;<br>So that it seems a thing endued with sense:<br>Like a sea-beast crawled forth, that on a shelf<br>Of rock or sand reposeth, there to sun itself;<br>...<br>XI<br>Himself he propped, limbs, body and <s>[?]<\/s> pale face,<br>Upon a long grey staff of shaven wood:<br>And, still as I drew near with gentle pace,<br>Upon the margin of that moorish flood<br>Motionless as a cloud the old Man stood,<br>That heareth not the loud winds when they call;<br>And moveth all together, if it move at all<\/p>", "notes": "Undated; the page is the \"(over) →\" of the Bunyan reference in <span class=\"wl\" data-note=\"1995-03-12_Grey-Sunday-Camus-Noces-and-Quoting\">1995 03 12_Grey Sunday Camus Noces and Quoting<\/span>. Elizabeth Bishop's \"The Unbeliever\" (1946) takes its epigraph, \"He sleeps on the top of a mast\", from Bunyan. The right edge of the Wordsworth stanzas is cut off in this scan; some line ends (\"whence;\", \"sense:\", \"shelf\") show at the left edge of the next scan, and the rest are filled from the poem. The lower half of the page is blank.", "img": ["attachments/pages/scan_1995_p051.jpg"]}, "1998-10-15_Make-Your-Own-Telescope": {"t": "Make Your Own Telescope", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["sky", "project-list"], "pp": [], "body": "<p>Make your own telescope...<\/p>", "notes": "Undated; a single line at the top of the page.", "img": ["attachments/pages/scan_1997_2_p007.jpg"]}, "1994-08-01_Dream-of-Showing-Hull-Four-Wall-Cityscape": {"t": "Dream of Showing Hull a Four-Wall Cityscape Room (Page 95)", "d": "1994-08-01", "est": false, "w": 1994.5833, "era": "Summer 1994, Travel and Alps", "th": ["dream", "acceptance", "secret-work", "painting", "vocation"], "pp": ["John Hull"], "body": "<p><i>(Circled dream entry at bottom of page 95, linked visually to the painted-room sketches above it):<\/i><\/p>\n<p>I had this crazy dream about bringing Hull in to see a room where I had painted a cityscape on all 4 walls. I had built the whole room, you could see the frame work on the outside. I hadn't told anyone what I was doing. I wasted incredible numbers of hours doing it. I wasn't even taking painting, and here it was. It was crazy of me to have done this. It was too much, I had sacrificed too many other things but here it was, and I was looking for acceptance. I was laughing out of nervousness and excitement. It was wonderful.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p033.jpg"]}, "1994-07-29_Rene-Thom-From-the-Icon-to-the-Symbol": {"t": "On Plane July 29–30: René Thom's From the Icon to the Symbol", "d": "1994-07-29", "est": false, "w": 1994.5767, "era": "Summer 1994, Travel and Alps", "th": ["semiotics", "mathematics", "symbols", "language", "flight-notes"], "pp": ["René Thom", "Paul Feyerabend", "Bobby McFerrin"], "body": "<p><b>On Plane July 29–30<\/b><\/p>\n<p>Reading notes and bracketed responses on **René Thom's *From the Icon to the Symbol*** and <code>'L'espace et les signes'<\/code> (<i>Semiotica<\/i> 29-3/4 [1981] 193–208):<\/p>\n<h4>Summary of Thom Passages &amp; Marco's Bracketed Reactions<\/h4>\n<ul><li><b>Introducing a new mathematical symbol:<\/b> Thom describes how a mathematician juggling recurring expressions introduces a new symbol (creating a new semantic field to break free of \"obsessional presences\") or predicts properties a priori before constructing expressions. Marco adds:<\/li><\/ul>\n<p>  &gt; <code>[How often does this really happen? or has Thom created a good example? Did this happen, say with the creation of the integral symbol?]<\/code><br>  &gt; <code>[Feyerabend says this is what always happens]<\/code><\/p>\n<ul><li><b>Infant babbling around 18 months &amp; phonemes:<\/b> Thom compares the mathematician babbling before Mother Nature (<i>bombinans in vacuo<\/i> unless able to hear reality's response in the symbol) to a baby initially producing phonemes of every world language before narrowing to the parents' native syntax. Marco objects:<\/li><\/ul>\n<p>  &gt; <code>[I find it unfortunate that... Experimenting w/ all the different sounds one can make Bobby Mc.F. picking just those that are possible w/in the confines of one language is, well, rather confining. But those other phonemes sound foreign which unfortunately is often barbaric or terrible sounding, at least to those in the Western cultures.]<\/code><\/p>\n<ul><li><b>Also see: <code>'L'espace et les signes'<\/code> (Semiotica 29-3/4 [1981] 193–208):<\/b> Notes Thom's mutual assimilation of \"semantic\" and \"spacial\" categories—that the location of a physical object in space and of a signification in semantic space are not only genetically connected but analogous in structure and function.<\/li><\/ul>", "notes": "", "img": ["attachments/pages/scan_1994_2_p017.jpg"]}, "1995-04-11_Perceptual-and-Conceptual-Space": {"t": "Perceptual and Conceptual Space", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["space", "writing-process", "painting-theory", "language", "memory"], "pp": ["Merleau-Ponty", "Cézanne", "Bachelard", "Proust", "Saint-Exupéry", "Breton"], "body": "<p>Group μ under metaxes.<br>anacoluthon → produces through bifurcation a break in sentance-structure.<br>Literature the time art leaves traces of the past -<br><s>Art<\/s> Painting the space art ponders this intangible, invisible unknowable.<br>Painter takes this space under control - Ponty quote about the body -<br>- but can at best give a representation. <s>The<\/s> Closest another viewer can get to point of view of seer two heads looking @ mountain.<br>Painter of nature can <s>recreates<\/s> recreate his sight. And place it before your eyes.<br>His power lies in his ability to create this alterior reality.<br>the \"reality of the museums\" - Cezanne.<br>Perceptual Space → domain of the painter<br>Conceptual Space → that of the writer.<br><code>[circled:]<\/code> Real vs. \"Bachelard\" → unknowable<br><code>[circled:]<\/code> Imaginary → history, knowable or known, but untouchable.<br>touching the Madeliene unleashed Proust's <u>Rememberance<\/u><br>contemplating the void in <u>Terre des Hommes<\/u> → unleashes<br>- everything you can touch is an extension of yourself. in the present ↳ Ponty<br>→ everything else is an <u>other<\/u> Space and the past are lumped into a same category.<br>The other w/in yourself → dreams unconscious Breton<br>The others out side → here we start to unpack Bachelard's oxymoron: Intimate: Immencity.<br>odd conflation in French of sens <code>[continuing up the right margin, sideways:]<\/code> and sens. mentioned by Espace et Poesie conference and by Ponty in Phen. Percep.<\/p>", "notes": "Undated; essay notes that follow the April 11 entry. Groupe μ is the Belgian group of rhetoricians whose <i>Rhétorique générale<\/i> (1970) classes figures such as anacoluthon under \"métataxes\". Bachelard's \"immensité intime\" is a chapter of <i>La Poétique de l'espace<\/i>. \"sens and sens\" is the French <i>sens<\/i> as both \"meaning\" and \"direction\" (and \"the senses\"); see <span class=\"wl\" data-note=\"1995-03-12_Intellectual-Space\">1995 03 12_Intellectual Space<\/span>.", "img": ["attachments/pages/scan_1995_p065.jpg"]}, "1995-03-12_Full-Cast-of-My-Body-Drawing-with-Light": {"t": "Full Cast of My Body; Drawing with Light", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["sculpture-ideas", "body", "light", "project-list"], "pp": ["Leonardo", "Duchamp", "Nauman"], "body": "<p>- full cast of my body - <s>someone<\/s> viewer to step into it.<br>my body → yours as incompatible as my mind → yours just doesn't fit.<br>- acrylic rods w/ halogen spots at ends can make drawing w/ light<br>- Leonardo unceasing energy and interest: life.<br>- DuChamp<br>- Nauman<\/p>", "notes": "Undated; the last entry before the April 11 one. Nauman made casts of parts of his own body; compare \"Naumann's space under my chair\" in <span class=\"wl\" data-note=\"1995-03-12_Box-Crate-Sketches-Solitaire-Solidaire\">1995 03 12_Box Crate Sketches Solitaire Solidaire<\/span>.", "img": ["attachments/pages/scan_1995_p064.jpg"]}, "1998-10-15_Musicians-Free-Without-Becoming-Foolish": {"t": "Musicians Free Without Becoming Foolish", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["music", "sound", "sound-art", "japan"], "pp": ["Graham"], "body": "<p>Think of a poem - re organised &amp; played by max<br>Musicians don't interact as foolish people<br>2&gt; don't listen, just do<br><u>strong structure<\/u><br>→ fault?<br>does not trust musician gives <code>[circled:]<\/code> little flexibility<br>free w/out becoming foolish freedom makes them noble<br>problems become social rather than musical<br>Japan →<br>2 sounds in anechoic chamber which you have no intention of making <code>[branching to:]<\/code> intention / non-intention<br><code>[a long arrow runs down from \"musical\" to:]<\/code> no not really<br>\"just right...\" - reminds me of Graham's washington west coast innocent sounding masking intelligence<br>\"thinking cap\" corny hiding radicalism - hangs on dorky language \"white noise\"<br><code>[boxed, with an arrow looping round from the last line back to the first:]<\/code><br>fascinated by the quiet ones<br>did you hear that? they will say<br>People who truely listen to sounds are<\/p>", "notes": "Undated. These read like notes from a talk or performance about John Cage's ideas (freedom for performers, the two sounds he heard in an anechoic chamber, intention and non-intention); \"max\" may be the Max music software or a person. Graham is not identified (possibly Dan Graham).", "img": ["attachments/pages/scan_1997_2_p011.jpg"]}, "2026-10-21_Miwa-Kimono-and-Mutual-Separation": {"t": "Miwa, the Graduation Kimono & Mutual Separation", "d": "2026-10-21", "est": false, "w": 2026.8048, "era": "Present, Therapy Notes", "th": ["marriage-crisis", "separation", "identity"], "pp": ["Miwa"], "body": "<p>But I don’t want to keep secrets from my special someone. Mi feels burdened by my troubles. She often accuses me of bringing her down. I want a partner and the support to attack the world together. We mentioned this difference of opinion in couples therapy.<\/p>\n<p>I felt especially off when for our son’s graduation, instead of a cool artsy outfit from one of her designer friends, she chose to wear a traditional kimono. Rather than celebrate the cool artist mom she was to our son, she hid behind the uniform of Japanese-ness. Every other parent and teacher saw her only through this lens. She often says that she isn’t the same person from when she was young. But I didn’t sign up for a tradwife from Japan. I’m not fond of that strict sexless person.<\/p>\n<p>Spoke with Miwa on Sunday and got her to agree to see a marriage counselor; set up the meeting for next Sunday.<\/p>\n<p>I tried to speak with Miwa about a mutual separation where we both find happiness—she got so angry she was hitting me. Extricating myself will be such a mess. What's so hard is I tried to be an ally, to support the household in so many ways. I really want to see myself as the supportive head of family, loved and respected. A separation to become another loser divorced dad really hurts my image—who I want to be, how I want to be in the world. I’m quite lost really.<\/p>", "notes": "", "img": []}, "1997_p028_McCarthy-Jailhouse-Rock-and-Electricity": {"t": "McCarthy, Jailhouse Rock and Electricity", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["america", "television", "technology", "politics"], "pp": ["Joseph McCarthy", "Elvis Presley"], "body": "<p>I understood something about Macarthy <s>&amp;<\/s> last night while watching Jail-house rock @ 1am. \"plastic\" perfect sets - america of the 50's - suburbia clean in the clean rangé Apt. <s>at<\/s> in Tignes. [ Miwa and I went to Tignes for a very snowy weekend. It snowed so much we couldn't go outside. We rented a TV and watched movies.]<\/p>\n<p>- If elect. is like water it's a meta-reality. Sudanese die w/out water &amp; food. No-one dies b/c of lack of electricity.<\/p>", "notes": "Written in an apartment in Tignes, so this page may belong to a stay in the Alps rather than to Paris; the era is left as Paris / Beaux-Arts for Marco to decide.", "img": ["attachments/pages/scan_1997_p028.jpg"]}, "1995-01-05_Bachelard-Space-Is-Only-What-We-Perceive": {"t": "Bachelard: Space Is Only What We Perceive", "d": "1995-01-05", "est": false, "w": 1995.011, "era": "Final Semester Yale 1995", "th": ["space", "perception", "poetry", "space-vs-time"], "pp": ["Bachelard", "Wordsworth", "Merleau-Ponty", "Husserl"], "body": "<p>1/5/95 <s>Wordsworth and the worth of words<\/s><br>Bachelard never explores a space that does not take on the characteristics he has described for a home. The universe comes to protect once it is intimate, not the 'other' it is home-like<br>Space is relative like time is relative.<br>Space changes w/ changes in the percievers's condition<br>- 15 minutes in the <s>arms<\/s> lap of one's lover is far shorter than 15 spent sitting on a burner<br><s>[?]<\/s> The same space can <s>change a<\/s> be percieved of as being as radically different as those two spans of time.<br>Time does seem to be more akin to the art of poetry or literature - a narrative art. But <s>[?]<\/s> a single poem or poetic image can be quite easily compared to a painting. In the work of Merleau Ponty and perhaps in the poetry of the 20th c. we have a time when poetry does describe these perceptual moments and since <s>space<\/s> our concept of space is formed by these perceptions, poetry can describe <u>space<\/u> - psycological or phenomenological space.<br>↳ I'm not in a position to make this differentiation yet.<br><code>[a bracket in the margin joins this paragraph to the last line:]<\/code><br>Phenomenology or Merleau Ponty seems to take an artistic stand on theory or maybe even Philosophy - if you feel it, it is there - it is! Truth is in the moment. He begins the \"Avant-Propos\" of <u>Phenoménologie de la perception<\/u> w/:<br>Qu'est-ce que la phenomenologie? Il peut paraître étrange qu'on ait encore à poser cette question un demi-siècle après les premiers travaux de Husserl. Elle est pourtant loin d'être résolue. La phenomenolgie, c'est l'étude des essences, et tout les problèmes, selon elle, reviennent à definir des essences: l'essence de la perception, l'essence de la conscience, par example<br>nous ne trouvons dans les textes que ce que nous y avons mis...<br>-hmm...<br>→ Space is only what we percieve it to be.<\/p>", "notes": "The heading \"Wordsworth and the worth of words\" is crossed out. Bachelard's book on the home and intimate space is <i>La Poétique de l'espace<\/i> (1957). The French passage is copied from the opening of Merleau-Ponty's <i>Phénoménologie de la perception<\/i> (1945).", "img": ["attachments/pages/scan_1995_p004.jpg"]}, "1995-03-12_Boring-Lecture-and-Sky-Color": {"t": "Boring Lecture, and Sky Color", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["light", "observation", "installation", "studio-practice"], "pp": ["Michael Rock"], "body": "<p>During the painfully boring lecture<br><s>That<\/s> 2 milk cartons were backlit <s>[?]<\/s> on <s>the<\/s> very reflective surface of the table. And Michael Rock kept passing through the light behind them blending his shadow and reflection with theirs. His dark (black) pants made a blue flash in the gap between the two lamp's shadows.<br><code>[in pencil:]<\/code> The a<br>1st week - set up a piece I called Sky Color.<br><code>[in blue pen, with a curved arrow pointing into the pencil paragraph below:]<\/code> → the <u>potential<\/u> of this work is what I am so excited about is what gives it anything beyond transcendent!<br><code>[in pencil:]<\/code> I felt today that there was something careful &amp; deliberate in the way I had set this up. It made me happy to <s>think<\/s> notice how.<br><code>[in blue pen:]<\/code> I cannot <s>set<\/s> set something up so that you definitely see something - I can put out receptors captors, frames but beyond that, <s>I am out<\/s> it is out of my control. It could be that you feel nothing that I wanted you to feel, but the most exciting is that <s>I can<\/s> the work can become something I never expected or thought of - that is where it is most powerful. It opens you up to wonder and recurring newness of nature itself and life - if a manic depressive were made aware of this newness this replenishing power he would no longer have a problem.<br><code>[doodles in the lower right corner, in black and red: a stick figure at a lectern, \"BORING!\", \"help!\", \"BORING 1 hr. down, 1 hr. to go\", and a game of tic-tac-toe in a circle]<\/code><\/p>", "notes": "Undated. Three inks: the lecture observation in black, two pencil lines about \"Sky Color\", and the blue-pen paragraphs, which were probably added later around the pencil. Michael Rock is a graphic designer who taught at the Yale School of Art; he may have been the lecturer. The doodles are from the same boring lecture.", "img": ["attachments/pages/scan_1995_p063.jpg"]}, "1998-10-15_Transparence-and-Binaural-Sound": {"t": "Transparence and Binaural Sound", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["transparency", "photography", "sound-art", "technology"], "pp": ["Marie"], "body": "<p>In US research &amp; buy new computer w/ sound cards. &amp; program Max on LINUX?<br>- The sound thing.<br>I certainly like transparence. photo is a more transparent medium than painting - perhaps. w/ photo I can get to a level of transparence which pleases me much faster than w/ painting. Stereo recording is another form of transparence. <u>Bin-aural<\/u>.<br>Maybe I can borrow Marie's PAL camera one day to film on trains.<\/p>", "notes": "Undated. Marie may be the Marie of <span class=\"wl\" data-note=\"1998-10-15_Pretentious-and-Boring-Things-to-Remember\">1998 10 15_Pretentious and Boring Things to Remember<\/span>.", "img": ["attachments/pages/scan_1997_2_p027.jpg"]}, "1999-06-15_Urbanisme-Bricolage-vs-Ingenieur-Venturi": {"t": "Urbanisme: Bricolage vs. Ingénieur; Venturi", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["french", "urbanism", "coursework", "bricolage", "architecture"], "pp": ["Colin Rowe", "Robert Venturi", "Panerai"], "body": "<p>Urbanisme<br>Roukau ? → voies sont l'essentiel (commercial)<br>- Pan-ray - Ilôt -<br>- hist. art - parcel<br><code>[a bracket in the margin joins ① and ②:]<\/code><br>① <code>[above:]<\/code> bettler bricolage vs. ingenieur Colin Rowe - Cornell<br>faillit de l'urb.<br>② production urbaine. - - forme urbaine genere par graphique rapport, forme forte et forme complex dans le reale<br>Venturi - learning from the pop<br>- Levittown <code>[bracketed with the next:]<\/code> } signification.<br>- Las Vegas (1970)<br>- centre pompidou<br>___<br>Olympe - av. N↕S 7m large <code>[to the right:]<\/code> 1 îlot 35m<br>gue au 18eme → av. = 10m large.<\/p>", "notes": "Undated; probably more notes from the history-of-the-city course (<span class=\"wl\" data-note=\"1998-12-15_Histoire-de-la-Ville-Premier-Cours\">1998 12 15_Histoire de la Ville Premier Cours<\/span>). \"Pan-ray\" is probably Philippe Panerai, author with Castex and Depaule of <i>Formes urbaines: de l'îlot à la barre<\/i> (1977); \"Roukau\" is unclear. Colin Rowe (Cornell) wrote <i>Collage City<\/i> with Fred Koetter (1978), which contrasts the bricoleur and the engineer, after Lévi-Strauss (compare <span class=\"wl\" data-note=\"1998-08-01_Bricoleur-Levi-Strauss\">1998 08 01_Bricoleur Levi Strauss<\/span>). Venturi, Scott Brown and Izenour, <i>Learning from Las Vegas<\/i> (1972). \"bettler\" and \"Olympe\" are as written.", "img": ["attachments/pages/scan_1997_2_p068.jpg"]}, "1995-09-01_The-Artist-Transforms-How-You-See": {"t": "The Artist Transforms How You See", "d": "1995-09-01", "est": true, "w": 1995.6667, "era": "DC, Post-College", "th": ["art-theory", "observation", "perception", "communication"], "pp": ["Shklovsky"], "body": "<p><code>[three cards taped onto the page, written in blue ink:]<\/code><br><code>[card 1:]<\/code><br><s>The<\/s> The artist or art is the person or thing which transforms how you see your everyday common place world. Schlovsky's defn. is to literal not a poem which uses unusual <s>words<\/s> metaphors. Reading his poem will not make you think tiger every time you see a couch or whatever<br><code>[card 2:]<\/code><br>If I walk down the street, the same street I walk down every day to my home and it seems some how wonderful to me that is the presence of art - be it the left over glow of the woman I kissed the night before or just the sun casting a unique hue, you cannot separate what is going on outside<br><code>[card 3:]<\/code><br>from inside those two not completely independant systems are what produce what we know as life.<br>Art <s>[?]<\/s> plays w/ these two it affects the inner system through the same channels that the outside world can, <s>and yet<\/s> but is furthermore created and thus contains the wonder of communication.<br><code>[on the page, to the right of the first card, in black:]<\/code><br>The astronomer is a great looker or observer can the definition of artist be the one who teaches <s>[?]<\/s> you to see - helps you see.<\/p>", "notes": "Undated. \"Schlovsky\" is Viktor Shklovsky, whose essay \"Art as Technique\" (1917) defines art as defamiliarisation (<i>ostranenie<\/i>); see \"Defamiliarization\" in <span class=\"wl\" data-note=\"1995-06-01_Art-Is-Everywhere-Romance-with-the-Viewer\">1995 06 01_Art Is Everywhere Romance with the Viewer<\/span>. The cards are water-stained.", "img": ["attachments/pages/scan_1995_p094.jpg"]}, "1998-12-15_Dubuffet-Psycho-Sites-and-the-Hydra": {"t": "Dubuffet: Psycho-Sites, and the Hydra", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["french", "reading", "urbanism", "place-attachment"], "pp": ["Jean Dubuffet", "Françoise Choay"], "body": "<p>→ Non-Lieux - noir avec blanc par dessus<br>→ sites aleatoires<br>→ Mires -<br>- topologies<br>- materiaulogies.<br>Psycho-sites - un lieu - tres indéterminé, tres generale dont on ne saurait dire s'il se situe en ville ou à la campagne, en chambre ou a l'exterieure.<br><u>p. 19<\/u><br>Si on ne sait pas prendre intérêt à <s>ceux<\/s> ces lieux <s>qu'on va voir<\/s> où on se trouve on ne prendra pas intérêt non plus à ceux qu'on va voir.<br>___<br>Rendre à l'hydre ses millions de têtes. 1967-68.<br>L'idée d'une ville qui au lieu de s'être constituée séculairement peu à peu par le jeu de circonstances, a été créée tout d'un coup dans un lieu arbitraire pèse lourdement sur le bon confort du résident.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>...non-délibéré - relié au destin.<br>Trop de délibéré accable. C'est ce qui fait la difference que nous ressentons tous entre un parc fait de toutes pièces par des jardiniers et la nature sauvage, ou bien entre un site naturel dans une île déserte et une plage artificielle créée de sable d'apport.<br>Je crois bien que je me sentirais mieux à l'aise si au lieu de ce délibéré, la cité résultait de mettre tout dans un chapeau, de le lancer en l'air et de le prendre comme cela retombe. Je me sens un grand besoin de manoeuvrer sur le non-délibéré. [...] C'est à partir du chaos que la pensée fonctionne; et si on ne lui donne pas à traiter du chaos elle est <s>encore<\/s> comme une machine qu'on alimente plus.<br>D'une façon générale, l'urbanisme m'incommode pour ce qu'il m'apparaît contraire aux épanouissements de l'individualisme anarchique, si essentiel, me semble-t-il, toujours si essentiel au bon confort. Le chaos, l'anarchie sont dans notre temps des valeurs trops négligées.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>p. 26<br>Mon voeu pour la cité est qu'elle soit immense, indénombrable irrecensable. Il faut qu'elle apparaisse à son habitant comme un univers infiniment complexe, à très nombreuses clefs, impossible à jamais totalement connaître, impossible à inventorier restituant le caractère multiple, <code>[underlined in red:]<\/code> foisonnant, inépuisable du monde. Fournissant par là à son habitant le sentiment que tout ce qui existe au monde est présent dans sa ville, qu'il n'a rien à manquer à rien jamais sortir<br>p. 27<br>Simpliste m'apparaît l'idée de confier à un spécialiste sélectionné la direction de ce qui doit être fait par tous dans l'anarchie. Le courant général actuel de dirigisme qui tend, dans tous les domaines, à déposséder les foules des initiatives au profit de spécialistes sélectionnés me semble de nature à tout apauvrir et stériliser. Au contraire de souhaiter que les foules se démettent et déléguent les initiatives à des spécialistes choisis par sélection, j'aspire à l'exaltation de l'individualisme dans l'anarchie, j'aspire au discrédit des spécialistes et dirigistes et au réveil des foules pullulantes.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Renversons les rôles! Les foules qui sont aujourd'hui si instamment conviées à assumer la seule fonction passive de déférer et d'applaudir, je propose de leur donner les commandes et d'installer à leur place, aux fauteuils, à la place qui leur convient et qui est non pas d'initiateurs mais de commentateurs et applaudisseurs, les philosophes.<br><code>[a bracket and arrow in the margin mark the next paragraph:]<\/code><br>Ma proposition sera donc, pour édifier une ville, de remettre à chaque citoyen du ciment et une truelle, et d'interdire l'intervention d'aucun architecte brandisseur de plan.<br><code>[in the margin:]<\/code> <u>education<\/u><br>Attention cependant. Il faudra avant cela bien purger les foules du mal inhibiteur de l'endoctrinement auquel elles sont soumises et qui les rend pour l'heure impropres à la création individuelle. Il faudra redonner confiance et assurance à l'individu, que la propagande culturelle s'emploie si bien à lui ôter. Il faudra, par une limitation appropriée (ce serait, j'en suis sûr, vite fait), liquider l'illusoire prestige des spécialistes, s'employer à rassurer et stimuler l'individualisme et l'esprit de création individuel<\/p>\n<p><b>Page 38 is too blurred to read. Page 39:<\/b><\/p>\n<p>Il faut remettre l'hydre en possession de ses têtes, de ses millions de têtes, à la place des cent que nous lui voyons aujourd'hui et qui, de reduction en réduction, donnent à craindre pour un proche avenir la disastreuse hydre à une tête.<br>engquête menée par Françoise Choay sur \"la ville et l'imaginaire\" première partie datée du 10/12/67 est extraite d'une lettre de JD à F. Choay - en reponse d'un projet de ville nouvelle 4/3/68<br>___<br>JD. <u>Notes<\/u> p. 546.<br>Je suis émerveillé par New York, qui m'apparait constituer actuellement un phenomene historique sans précédent, un phenomène de l'histoire de l'humanité tout à fait unique et extremement exaltant.<br><u>insolites<\/u> ? déférer<br>mandarins. initiés<\/p>", "notes": "Undated. The headings are titles of Dubuffet's late series (<i>Non-lieux<\/i>, <i>Sites aléatoires<\/i>, <i>Mires<\/i>, <i>Psycho-sites<\/i>, <i>Topographies<\/i>, <i>Matériologies<\/i>); \"topologies\" is as written. \"Rendre à l'hydre ses millions de têtes\" is a Dubuffet text of 1967–68, written for Françoise Choay's survey \"La ville et l'imaginaire\" (page 39). \"JD\" is Jean Dubuffet. The Hydra passage goes on over the next three pages, and breaks off at the foot of page 37; page 38, which probably continues it, is too blurred to read; the red \"not urbanism\" on <span class=\"wl\" data-note=\"1998-12-15_Dubuffet-on-Childrens-Drawings-Graffiti-and-Invention\">1998 12 15_Dubuffet on Childrens Drawings Graffiti and Invention<\/span> may answer it. Continues <span class=\"wl\" data-note=\"1998-12-15_Dubuffet-on-Childrens-Drawings-Graffiti-and-Invention\">1998 12 15_Dubuffet on Childrens Drawings Graffiti and Invention<\/span>.", "img": ["attachments/pages/scan_1997_2_p034.jpg", "attachments/pages/scan_1997_2_p035.jpg", "attachments/pages/scan_1997_2_p036.jpg", "attachments/pages/scan_1997_2_p037.jpg", "attachments/pages/scan_1997_2_p039.jpg"]}, "1995-02-12_Fleeting-Purple": {"t": "Fleeting Purple", "d": "1995-02-12", "est": false, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["installation", "light", "observation", "perception"], "pp": ["Ron Jones", "Van Altima"], "body": "<p>2/12 I am really not being good about recording my thoughts - they are going too quickly. I Got alot of inspiration from my other notebooks on Sat. reminded of all the profitable thought I had which I can use. It would be nice to have as much profitable work. Easier said than done - right?<br>It is nice to be able to see some of my dreamings, there are many more steps to actually building the ideas, no matter how much you try to predict before you have made it.<br>Wonderful sight yesterday: I was walking by the new Henry Luce Hall - they had an orange plastic construction fence up. I have been enjoying the snow's beautiful blue shadows - and through the orange fence It looked purple! The part of the fence in the sun - made the purple. The part in shadow the snow looked its regular blue. the blue on the <s>Fence<\/s> must have mixed out any effect.<br>This moment outside of me - can I make it for somebody else? drag Ron outside.<br>- not something to make a painting about<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>circumstances<br><s>Items<\/s> needed:<br>- length of orange mesh fence.<br>- sunny day.<br>- snow on the ground.<br>- field in the sun, from which there is an obvious approach.<br><code>[to the right:]<\/code> many things have to coincide in order for there to be art at all.<br>Materials <s>Items<\/s> used <code>[in the margin]<\/code><br><u>directions<\/u> - I can give the class directions.<br>Should I build a mockup, or just guide them to it?<br>Set up 2 strips - one in the sun - one in the shade<br>- by making my own, the viewer will realize that there is something which is ment to be seen - call it fleeting purple? - point of viewing spot w/ two feet chalked in → <code>[right margin, sideways:]<\/code> but then the object attention is brought<br>small sketch on directions. (Art locator)<br><u>time of viewing<\/u>. go there as a class - or <s>[?]<\/s> given directions to go one at a time.<br>I would like to make pavillions, etc. which clearly state when they are open - <u>times<\/u> <u>change<\/u> <u>seasonally<\/u>.<br><code>[bracketed:]<\/code> <u>Materials<\/u>: <u>Fleeting Purple<\/u> - installation<br>- Sun and shadow on the snow<br>- 2 5ft lengths of orange Fence<br>- 4 Fence poles.<br><code>[in a loop:]<\/code> - talk to Van Altima<\/p>", "notes": "Henry R. Luce Hall at Yale was being built in 1995. The sideways margin note reads \"but then the object attention is brought\", with \"the object\" and \"attention\" on separate lines; it may be meant as \"but then the object is brought to attention\". \"Van Altima\" is probably the astronomer William van Altena (see <span class=\"wl\" data-note=\"1995-02-05_Roof-Top-Mirror-Floor\">1995 02 05_Roof Top Mirror Floor<\/span>).", "img": ["attachments/pages/scan_1995_p031.jpg", "attachments/pages/scan_1995_p032.jpg"]}, "1997_p030_Nouveau-Montage-Danse": {"t": "Nouveau montage danse", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["dance", "montage", "sound", "mythology"], "pp": ["Edmund Spenser", "William Shakespeare"], "body": "<p><u>Nouveau Montage danse<\/u><br>1er tab. → → mythologies   → Faerie Queen<br>→ Midsummer..<br><u>moonlight<\/u> →<br>→ voiture qui passe<br>→ hostile exterior world<br>Use voices to make entire environment<br>___<br>2eme - marche bien<\/p>", "notes": "A new edit of a soundtrack for a dance piece, in \"tableaux\". The Faerie Queene (Spenser) and A Midsummer Night's Dream are the mythologies of the first tableau.", "img": ["attachments/pages/scan_1997_p030.jpg"]}, "1995-03-12_Asking-the-Viewer-to-Do-Things-a-Tower": {"t": "Asking the Viewer to Do Things; a Tower", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "video", "nature"], "pp": ["Wordsworth", "Emerson"], "body": "<p>I am thinking of asking my viewer to do things - to copy a poem because that forces one to read it in a different way everyone reads all reading becomes skimming -<br>Artist = teacher - like Wordsworth says in the Prelude<br>could I make them get naked some where where they would never be seen, a place to experience your own envolvement w/ nature. - <u>Emerson<\/u><br>They will click the switch - in my sculpture room.<br>My hiking or biking movie that I thought of this past summer is tempting me extraordinarily - as is getting a video camera for graduation.<br>- I could show the movie in a box like those sit down video games or a passport photo booth - (o the day when I could pay someone to build me these things)<br>I want to make a tower some where where there are no high buildings. I could even put blinders on the tower so that no one could see who ever was up there unless they were a mile away or more. But the viewer would have a view of the horizon. Like being on top of a mountain. The viewer could get completely naked no one would see - but they would be there facing the world <code>[a small sketch of the blinders, two slanted strokes, beside \"were a mile away\"]<\/code><\/p>", "notes": "Undated; between the 3/12 entries and the next dated entry. \"they\" is written over \"you\". The words at the left edge of the scan (\"whence;\", \"sense:\", \"shelf\") belong to the Wordsworth stanzas on the facing page, <span class=\"wl\" data-note=\"1995-03-12_Bishop-The-Unbeliever-and-Wordsworth\">1995 03 12_Bishop The Unbeliever and Wordsworth<\/span>.", "img": ["attachments/pages/scan_1995_p052.jpg"]}, "1994-06-15_Letter-to-Edo-Part-1-Shared-Experience": {"t": "Letter to Edo (Part 1 — Shared Experience)", "d": "1994-06-15", "est": false, "w": 1994.455, "era": "Yale, New Haven", "th": ["brotherhood", "isolation", "shared-experience", "self-criticism", "family"], "pp": ["Edo", "Mom", "Richie"], "body": "<p>1) I'm not talking for Mom, or using Mom's words. Mom &amp; I are very similar, her outlook is in many respects very similar to my own.<\/p>\n<ul><li>You have no idea how much you are hurting her.<\/li><li>I hear so much about you secondhand. It is very hard not to have an intimate relationship w/ your own brother. I feel you don't tell me things, for the same reason you don't tell Mom things.<\/li><li>I understand the feeling that you want to withdraw from society &amp; do your own thing, like those guys in the cabin in Waterford—like [an] acid trip—this is for you &amp; only you; it is not a shared experience. I don't know if you are any good at the guitar at all, I've never heard you play—only mess around.<\/li><\/ul>\n<p>You are so critical of everyone, I can only imagine how critical you are of yourself. I believe that one's <i>[crossed out: your]<\/i> life doesn't really mean anything unless one has <i>[crossed out: you have]<\/i> shared it with others—the more the better.<\/p>\n<ul><li>I don't buy this \"can't grow under the shade of an oak\" shit—the you and Richie lame-out. Whatever I have done, it's no big wup (deal); hundreds of thousands of people have done more, better. The fact is that the world is so absolutely full of fascinating things to learn &amp; experience &amp; then pass on that there can never be enough people to do it. You are only on this earth for so many years. Make the most of it. Take everything that comes your way &amp; embrace it, learn from it, let it change you, don't settle on any revelation—it will get boring. Acid is not some hidden mystery, which will revolutionize the world if people would only try it.<\/li><\/ul>", "notes": "", "img": ["attachments/pages/scan_1994_1_p027.jpg"]}, "1995-03-12_Grey-Sunday-Camus-Noces-and-Quoting": {"t": "Grey Sunday: Camus' Noces, and Quoting", "d": "1995-03-12", "est": false, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["space", "literature", "quoting", "french", "installation"], "pp": ["Lois Conner", "Camus", "Bunyan", "Merleau-Ponty"], "body": "<p>3/12 <u>Grey Sunday<\/u> -<br>This break - in New Haven w/ out the students - reminds me of this summer. I am actively thinking but now I have the means to <u>do<\/u>! It is too bad that I only have another week. Then two months till the end.<br>My interest in space may have begun when Lois Conner told me to stop looking at myself &amp; see the rest of the world at my sophomore art-review. I was very upset by her comment and found it absolutely unjustified at the time. But slowly I left painting humans and then left objects at all → this may seem like a complete departure from humans but rather focusing attention on the world turns it back on us we are in the world this is what we know and are confronted with.<br><code>[left margin, sideways, beside the quotation:]<\/code> <s>opp. of absurde<\/s> - opp. of commun[?]<br>\"C'est dans la mesure où je me sépare du monde que j'ai peur de la mort, dans la mesure où je m'attache au sort des hommes qui vivent, au lieu de contempler le ciel qui dure. Créer des morts conscientes, c'est diminuer la distance qui nous sépare du monde, et entrer sans joie dans l'accomplissement, conscient des images exaltantes d'un monde à jamais perdu. <code>[right margin:]<\/code> Absurde &amp; suicide sect.<br>Camus. <u>Noces<\/u> \"Le vent à Djémila\" p. 41-2.<br><code>[a line from the circled \"dure\" leads to:]<\/code> [hard solid = last a long time - an interesting conflation I want to look it up.<br><code>[circled:]<\/code> nier - Noces Envers - endroit<br><u>still a good 1st quote<\/u><br>Dans cette splendeur aride, nous avions erré toute la journée. Peu à peu, le vent, à peine senti au début de l'après-midi, semblait grandir avec les heures et <u>remplir tout le paysage<\/u> [?] Il soufflait depuis une trouée entre les montagnes, loin vers l'est, accourait du fond de l'horizon et venait bondir en cascades parmi les pierres et le soleil. Sans arrêt, il sifflait avec force à travers les ruines, tournait dans un cirque de pierres et de terre, <code>[circled:]<\/code> baignait les amas de blocs grêlés, entourait chaque colonne de son souffle et venait se répandre en cris incessants sur <code>[boxed:]<\/code> le forum qui s'ouvrait dans le ciel. Je me sentais claquer au vent comme une <code>[circled:]<\/code> mâture. Creusé par le milieu, les yeux brûlés, les lèvres craquantes, ma peau se desséchait jusqu'à ne <u>plus être mienne<\/u>. Par elle, auparavant, je déchiffrais <u>l'écriture<\/u> du monde. Il y <code>[circled:]<\/code> traçait les signes de sa tendresse ou de sa colère, la réchauffant de son souffle d'été ou la mordant de ses dents<br><code>[right margin, circled, with an arrow up from \"traçait\":]<\/code> volume &amp; water<br><code>[an arrow from \"réchauffant\" to:]<\/code> → writing is the learning of traces - evidence of<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>I have this terrible problem when quoting, that I want to recreate for my reader the effect that the passage first had on me - I of course read it unedited from the whole book - when I try to quote I <s>[?]<\/s> am continually battling w/ the tendency to include more and more of the author's text - showing how one thing lead to another to the part that I got excited about. Editing or removing a passage from its context affects it so drastically. It transforms it really. This transformation is mine like choosing parts of the world to frame in my mirror.<br>I am very excited about my stand - I also had the idea to make a viewer through pipes each one would have a very different color and pick a very different piece of the world to highlight. - <u>shiny metal<\/u> random what it would choose - colors always changing<br><code>[sketch: a box with holes in one face]<\/code><br><code>[sketch: a tall box with rays shining out of a disc at the top, inside a large oval labelled \"window\"]<\/code><br><code>[sketch: a spiral in a circle]<\/code><br><code>[sketch: a table-like frame with a box set on it and a stick, labelled \"- top of A&amp;A\"]<\/code><br><code>[sketch: a stack of layered bricks or slats]<\/code><br><code>[right margin, sideways:]<\/code> drawing is a manifestation of the body - like Merleau.<br><code>[bracketed:]<\/code> The Unbeliever He sleeps on the top of a mast - Bunyan (over) →<br>→ de givre. Mais si longement frotté du vent, secoué depuis plus d'une heure, étourdi de résistance, <u>je perdais conscience du<\/u> <code>[boxed:]<\/code> <u>dessin que<\/u> <code>[circled:]<\/code> <u>traçait<\/u> <u>mon corps<\/u>. Comme le galet verni par les marées, j'étais poli par le vent, <u>usé jusqu'à l'âme<\/u>. <u>J'étais un peu de cette force selon laquelle je flottais, puis beaucoup, puis elle enfin<\/u>, <code>[bracketed:]<\/code> confondant les <code>[circled:]<\/code> battements de mon sang et les grands coups sonores de ce coeur partout présent de la nature. Le vent me façonnait à l'image de l'ardente <code>[boxed and circled:]<\/code> nudité qui m'entourait. Et sa fugitive etreinte me donnait, pierre parmi les pierres, la solitude d'une colonne ou d'un olivier dans le ciel d'été.<br><code>[right margin, with an arrow from \"nudité\":]<\/code> ↳ drawing is a manifestation... how can one explain nudité to describe the world<br>Ce bain violent de soleil et de vent épuisait toutes mes forces de vie. À peine en moi ce <code>[circled, joined by an arrow to the earlier \"battements\":]<\/code> battement d'ailes qui affleure, cette vie qui se plaint, cette faible révolte de l'esprit. Bientôt, répandu aux quatre coins du monde, <code>[boxed:]<\/code> <u>oublieux, oublié<\/u> de moi-même, <u>je suis ce vent et dans le vent<\/u>, ces colonnes et cet arc, ces dalles qui sentent chaud et ces montagnes pâles autour de la ville déserte. Et <u>jamais je n'ai senti, si avant<\/u>, <u>à la fois mon détachement de moi-même et ma présence au monde<\/u>.<br><code>[continuing the note from the previous page:]<\/code> of passing - record of actual things, which pass but have left their trace<\/p>", "notes": "One sitting, with the journal writing and the quotations interleaved over two pages: the <i>Noces<\/i> passage breaks off at the foot of page 49 (\"ses dents\") and picks up partway down page 50 (\"de givre\"), with the paragraph on quoting and the stand sketches written in between, and the margin note \"writing is the learning of traces - evidence of\" carries on in the last line of page 50. Both quotations are from Camus, \"Le Vent à Djémila\", in <i>Noces<\/i> (1938). Lois Conner is a photographer who taught at Yale. \"The Unbeliever\" is a character in Bunyan's <i>The Pilgrim's Progress<\/i>; the line about sleeping on the top of a mast is from Proverbs 23:34 and is quoted in Bunyan. \"nier - Noces / Envers - endroit\" pairs <i>Noces<\/i> with <i>L'Envers et l'endroit<\/i>, as in <span class=\"wl\" data-note=\"1995-02-12_Camus-Opposites\">1995 02 12_Camus Opposites<\/span>. The last word of the left-margin note is cut off.", "img": ["attachments/pages/scan_1995_p049.jpg", "attachments/pages/scan_1995_p050.jpg"]}, "1998-10-15_Pasted-Photographs-Fences-and-Rooftops": {"t": "Pasted Photographs: Fences and Rooftops", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["photography", "japan", "city", "collage"], "pp": [], "body": "<p><code>[page 19: a collage of three overlapping colour prints pasted together into one view: a chain-link fence and green railings on the left, a white building and a flat concrete rooftop or court in the middle, a green post on the right]<\/code><\/p>\n<p><code>[page 20: the same collage, photographed again from a slightly different angle]<\/code><\/p>\n<p><code>[page 21: two prints joined edge to edge into a panorama of a wide flat ground with a running track, a long low roof on the left and a pylon and white tanks or domes on the horizon]<\/code><\/p>\n<p><code>[page 22: a print cut into an irregular shape and pasted at a slant: looking up past a dark concrete overhang and a railing at a bright white sky, a small figure and a lamp post near the top; small pen ticks mark the edges of the page around it]<\/code><\/p>", "notes": "Undated photographs, probably taken in Japan (the industrial landscape and urban fringe match the photos that follow). Pages 19 and 20 are two camera shots of the same page, so the collage appears twice; page 19 could be dropped from the scan. There is no writing on these pages.", "img": ["attachments/pages/scan_1997_2_p019.jpg", "attachments/pages/scan_1997_2_p020.jpg", "attachments/pages/scan_1997_2_p021.jpg", "attachments/pages/scan_1997_2_p022.jpg"]}, "1994-07-31_Alps-Space-Stereoscopic-Boxes-and-Sound-Bike-Room": {"t": "Alps Space, Stereoscopic Boxes & Sound-Bike Octagon Room (Page 93)", "d": "1994-07-31", "est": false, "w": 1994.5822, "era": "Summer 1994, Travel and Alps", "th": ["alps", "space", "ekphrasis", "stereoscopy", "sculpture-ideas", "sound-installation", "geometry"], "pp": [], "body": "<p><b>Visual experience in Literature beyond the ekphrastic.<\/b><\/p>\n<p>A 2D picture traps space w/in it. the viewer is kept from experiencing the space in which the photographer, or painter, was standing by the edges of his image. The edges, the frame defines it as an image but the viewer cannot fly through the space on that flat plane; He is constantly grounded by the frame. It is impossible for me to convey my feeling about the Alps on paper with photo emulsion, pencil or paint b/c that experience has everything to do with the feeling of space I experience in the mountains.<\/p>\n<p><code>((<\/code> Writers can tap into this space b/c their medium is narrative. In order to experience space as space, one has to move through it. The visual experience of a flat image is static in time &amp; space. One cannot move through it, into it, but only around it. It is frozen in time.<\/p>\n<p>I did a sculpture project about stereoscopic vision last semester and the culmination of a series of investigations was a set of boxes where I cut up \"Stereoscopic\" photographs — I had taken 2 views of a still-life, right eye/left eye, I xeroxed one onto acetate on a color copier, then pasted the clear one over its partner. — I cut these photographs by object and placed them in a box at the relative distances these objects had had in the original still life. <i>[Cube box sketch with layered cutout planes inside]<\/i> I was left w/ a lot of empty space btw. these slices of picture. There was no way of looking at the box so that the pictures would come back together as one.<\/p>\n<p>Maybe it would be possible to make such a box, the viewer would have to be directed towards the particular initial viewing spot — sees flat image. Then, when he approaches it, he realizes that they are forced into space.<\/p>\n<hr>\n<h4>Hanging Maritime Garage &amp; Sound-Space Bike Room (p. 93)<\/h4>\n<p>I have returned to my idea of hanging many images of the maritime garage in a box on strings, roof top views up high, basement views down low. — should I make steps so that one is at eye level for each story<\/p>\n<p>How does one enter/exit? Does one?<br>Photos on the outside, paintings inside where people can't really go?<\/p>\n<ul><li>hand of the painter in the interior (how could I slip?)<\/li><\/ul>\n<p>All of these space projects are connected.<\/p>\n<p><b>The sound space:<\/b> I don't know if I wrote about this, but I don't know if I need the video in the hiking idea I had. I could just make a tape recording &amp; play it in a black room, put the auditors on some cart, or moving object, roller coaster, standing bike that pedals? (!!!) is that asking too much of my viewer?<\/p>\n<p>need to call someone to find out how to make drywall curve. Or I could make a hexagon / octa-<\/p>\n<p>rather than speakers I could give you a walkman w/ headphones you couldn't hear nearly as much &amp; much more personal. Feel that ocean breeze — spray salt water mist into fan.<\/p>", "notes": "<i>[Sketch of hung staggered panels beside a stepped viewer platform: <code>&lt;- viewing distance is a problem.<\/code>]<\/i><br><i>[Diagrams: <code>speakers<\/code>, <code>turn off lights<\/code> box frame with seated viewer; cylindrical black room (<code>&lt;- diameter of personal space<\/code>, <code>black &amp; speakers<\/code>) with cyclist inside; <code>engine makes wheels turn whether they pedal or not<\/code> — but this will make a noise that would combat w/ my tape's noise; <code>wind in your face = also noise.<\/code>]<\/i><br><i>[Octagon construction geometry notes at bottom of p. 93:]<\/i> <code>c=4 a=b 2a^2=16 a^2=8 a=sqrt(8)=2*sqrt(2)~=3.34<\/code>; <code>diameter = 10+ (octagon w/ 4ft sides)<\/code>; <code>180 - 45 = 135° = octagon<\/code>; <code>4 ft on inside<\/code>, <code>3.5 in.<\/code>, <code>67.5<\/code>, <code>cos 67.5 = 3.5 / x<\/code>.", "img": ["attachments/pages/scan_1994_2_p029.jpg", "attachments/pages/scan_1994_2_p030.jpg"]}, "1994-06-15_On-Katherines-Jan-94-Letter-Page-20": {"t": "On Katherine’s January 1994 Letter (Page 20)", "d": "1994-06-15", "est": false, "w": 1994.455, "era": "Yale, New Haven", "th": ["intimacy", "shared-imagination", "art-viewing", "retrospective-self"], "pp": ["Katherine", "Jan Groover", "Richard Diebenkorn"], "body": "<p>Katherine wrote to me: <i>(Jan '94)<\/i><\/p>\n<p>She believes that the two are separate. <i>[inserted: That]<\/i> Hers is different from everybody else's. I don't. I believe they are different in the specifics, but derive from the same thing. A common, united place. (Her adjectives: <i>strange, uncertain, moving places [...] in crazy inklings,... the unexplainable.<\/i>) I long to find moments when that soul/place/whatever is shared, and thus obviously <i>[arrow insertion: where I can share this w/ somebody]<\/i> would want to maintain a relationship w/ her. I long to partake in / share the experience w/ someone (which can only happen privately) → which is why I like works of art which are still accessible to me (or like the few Diebenkorn abstractions which after a small explanation became accessible to me.)<\/p>\n<p>Katherine, I guess, rejoices in the evidence of someone else's communication w/ the soul/place, but does not need or want to share it. It is personal, and I want to say that she sees the evidence of Jan Groover's <i>[inserted above: or Diebenkorn's]<\/i> communication in their work, and is moved by that rather than by the work itself, but that is no different from what I do, so once again I have come full circle to my belief that this is the same mechanism in all people.<\/p>\n<p><i>(Sideways annotation in lower right margin, with arrow pointing to the Jan Groover / Diebenkorn line):<\/i>  <br>**\"again this art referance <i>[sic]<\/i> no longer makes any sense to me\"**<\/p>", "notes": "<i>\"One of the things I like most about spending time w/ you is that I don't feel like I have to leave my poetic imagination. I think you meet me w/ your own in a way.\"<\/i>", "img": ["attachments/pages/scan_1994_1_p031.jpg"]}, "1995-06-01_The-Small-of-Her-Neck": {"t": "The Small of Her Neck", "d": "1995-06-01", "est": true, "w": 1995.4167, "era": "DC, Post-College", "th": ["intimacy", "writing-style"], "pp": [], "body": "<p>The small of her neck <code>[above and below \"smelled\", as alternatives:]<\/code> sweet / sweat smelled like fresh laundry.<\/p>", "notes": "Undated. \"sweet\" and \"sweat\" are written above and below \"smelled\" as alternative words; a blue oval drawn later loops through the line.", "img": ["attachments/pages/scan_1995_p073.jpg"]}, "1998-08-01_Images-of-Other-Materials": {"t": "Images of Other Materials", "d": "1998-08-01", "est": true, "w": 1998.5833, "era": "Paris, Beaux-Arts", "th": ["materiality", "sculpture-ideas", "project-list"], "pp": [], "body": "<p><u>IMages<\/u> of other materials<br>- chain link / orange fencing<br>bars pipes / cement / sand. / tar.<br>plexiglass sheet w/ bolts &amp; sharpie drawing<br>tech drawing on plexi → clear resin sandwitch<br>- imbedded electronics - sandwitches.<br><code>[a crossed-out word]<\/code><br><code>[sketch: a tall dark hatched block with a small figure standing at its foot, a sloping line running out from it to the right, an arrow pointing away]<\/code><br><code>[sketch: a small box on top of a tall thin post]<\/code><br><code>[sketch: three long diagonal strokes, and a bracket shape]<\/code><\/p>", "notes": "Undated. \"Chain link / orange fencing\" may recall the Fleeting Purple fence piece of February 1995.", "img": ["attachments/pages/scan_1997_2_p005.jpg"]}, "1995-01-23_Games-Habits-and-Rons-Lecture-on-Wittgenstein": {"t": "Games, Habits and Ron's Lecture on Wittgenstein", "d": "1995-01-23", "est": false, "w": 1995.0603, "era": "Final Semester Yale 1995", "th": ["art-theory", "coursework", "play", "friendship", "writing-process"], "pp": ["Wittgenstein", "Campbell", "Prog", "Lucia", "Ashley", "Beirbaum", "Erik", "Ron Jones", "Morris Weitz", "Chris Burden", "Harold Bloom", "Kosuth", "George Dickie"], "body": "<p>1/23 the non-essentialist has just expanded the idea of what can be art, what can hold the spark that some have called 'beauty' and we now call 'art'. If anyone makes a statement 'that is art or good art' or 'that is not art or bad art' he is making an essentialist's decision: An object has, or does not have a certain quality which he has called art.<br>I am very afraid of how attractive I find my reading about Wittgenstein's Aesthetics - 'game' = 'art' - or I don't know if he has come to that yet all the 'concepts' which make up a game are perenially flexible. I am reading this after my OX fun revelation we always play games, I was thinking of the joy of seeing them again at how I wanted to give Campbell and Prog hugs worth of the ones they have given me - not to mention others - Lucia has caught the same bug as me whereas Ashley, Campbell Prog, &amp; Beirbaum already have it others are in between. It is strange to think the same thing happened to Erik last year.<br>How does one reconcile the game w/ your work? Can they be the same?<\/p>\n<p><b>Next page:<\/b><\/p>\n<p><code>[top right corner: a small sketch of a box with a line running off the page]<\/code><br>I think of Ron's propencity towards laughter. (Ron - is the conventional word)<br>'There are, it seems to me, at least three very important logical kinds of concepts in aesthetics: the perennially flexible, the perenially debatable, and the irreducibly vague.' - Morris Weitz Wittgensteins Aesthe.<br>What is important is to do - regularly - to meet w/ OX twice a week is essential to what has developed. To make art continually, validates it, as does the regularity with which I have been writting in my journal. I have never been a <u>creature of habit<\/u>, but now there are habits I want to up keep. ↳ conventional lang. <code>[right margin, cut off by the scan, with an arrow pointing at the comma after \"continually\": \"← th…\"]<\/code><br>You can open yourself up completely to anyone or everyone and it doesn't really matter: they don't know you - they would never read it all nor would any one act or thing say everything about you. → Chris Burden making full financial disclosure.<br>Ron talks of looking for interesting art - 'I didn't see anything 'interesting', but there is potential'<br>Harold Bloom says, 'All bad poetry is genuine'<br>is art interesting when it does not copy? but that does not make it good.<br><code>[an arrow leads down to a column on the right:]<\/code> no one is interested. People want to feel like they are discovering a secret - like they are being told something no body knows or that they shouldn't know.<\/p>\n<p><u>Ron's lecture #2<\/u> -<br>Boundary btw. serious art &amp; not.<br>NEA will be severely crippled b/c of this question<br>not good / bad interesting / not<br>but how art at all? - Philosophers are doing most work on this question<br>Witt. Phil. Investigations - Family Resemblences &amp; Games doesn't even talk about art.<br>Games Family rather than essentialism.<br>- assault on essentialism in the hands of Witt's students<br>If there isn't one common thing <s>[?]<\/s> btw. objects, one can't give them one name take games for example.<br>did find a network of commonality no one quality <code>[\"network\" is circled several times, with a line from it to the next page]<\/code><\/p>\n<p><b>Next page:<\/b><\/p>\n<p><code>[sketch: the word NETWORK in a box, with lines branching out to smaller boxes]<\/code><br>- only one resemblence need be present in order for there to be a game.<br>Students turned game <s>made<\/s> into hammer to smash significant form.<br>No one thing in common which makes us call them all one <s>thing<\/s> name.<br><code>[left margin, about the 1/23 entry:]<\/code> is sentance doesn't mean what I want it to w/out the comma. 'Continually making art validates it.'<br>Open concept allows us to accomodate the new - what we can't <s>[?]<\/s> imagine<br>Essentialism doesn't allow you to let in something you haven't concieved of.<br>Witt not throwing the door open, rather allows you to accomodate exceptions, new examples - <u>mess of imprecision<\/u><br>Self-reflexive criticality - essential idea?<br>- open amendable accounts for imprecision → for artists<br>diff. situation for critics.<br>once accepted, to the list - the criteria is no longer open to debate. whose list? where?<br>Does this list exist in the individual? can they accept an essentialist's list.<br>Aesthetics logically impossible -<br>Essentialism just can't keep up.<br>Art - open textured concept - amendable open to revision.<br>Not written about at all - worst thing.<br>Alot of art won't ever be written about.<br>Who gets to decide? Kosuth - art as serious as Phys or Philos.<br>French Rev. Democracy → they can decide by <s>[?]<\/s> whether you are or are not informed. are or are not interested by correspondence<br>- agrarian to urban society → time when notion that anyone can judge art.<br>- people enjoy leisure - discretionary income at same time as litho. culture available to mass audience<br>people can &amp; want some pleasures of aristocracy<br>sheet music &amp; books. Prints - particularly Parisian.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>regular guy can make cultural decision.<br>- everyone thinks that they can judge art<br>how is it that they have right to begin to make decisions.<br>culture of artists under as radical change as people.<br>Academy decline w/ Church &amp; Court positions<br>- no one telling them what to do → certain freedom.<br>Not coincidence that group of artist under kind of umbrella Post-Impressionism -<br>Capitalist demand for specialization helps to answer: who decides?<br>seed for what George Dickey calls institutional aesthetics:<br>we appoint somebody to keep up w/ their specializations<br>who decides determined by institutions. - contradicts baby-boomer of Fr. Revolution who says they can decide<br>not enough to be interested &amp; informed, have to be a specialist.<br>Art as specialized and narrow doesn't include democratic spirit - this is our specialization <code>[an arrow from \"democratic\" to:]<\/code> working papers<br>What is criteria that we are going to decide on &amp; who are we? Weitz says: the critics.<br>unrecognized artists <s>[?]<\/s> make own institution<br>artists who write criticism.<br>Crucial for artists to become involved &amp; become critical.<br>Play in the culture - much more complicated → artists becoming critics.<br>Criteria ① works of art made by artists - obvious?<br>② found in museums, galleries - institutionalized.<br>③ title - name<br>- piece of Egypian pottery rare so art<br>History has dealt us a set of cards.<br>Open textured concept becomes a useful way for sorting our <s>[?]<\/s> culture.<\/p>", "notes": "One entry: the journal writing and the notes from Ron's second lecture are interleaved on the same pages, with margin notes and arrows between them, so they are kept together. \"OX\" is written as given; it seems to be a group that meets twice a week. The right edge of page 21 is cut off by the scan; the margin note there (\"← th…\") is completed on page 22 (\"is sentance doesn't mean what I want it to w/out the comma\"). Morris Weitz's essay is \"The Role of Theory in Aesthetics\" (1956); George Dickie's institutional theory of art is in <i>Art and the Aesthetic<\/i> (1974). Kosuth is Joseph Kosuth.", "img": ["attachments/pages/scan_1995_p020.jpg", "attachments/pages/scan_1995_p021.jpg", "attachments/pages/scan_1995_p022.jpg", "attachments/pages/scan_1995_p023.jpg"]}, "1994-08-04_Ecos-Finnegans-Wake-Semantic-Graph": {"t": "Umberto Eco’s *Finnegans Wake* Semantic Graph (Page 104)", "d": "1994-08-04", "est": false, "w": 1994.5916, "era": "Summer 1994, Travel and Alps", "th": ["semiotics", "finnegans-wake", "metaphor-and-metonymy"], "pp": ["Umberto Eco", "James Joyce"], "body": "<ul><li><b>Pasted Diagram:<\/b> Umberto Eco’s semantic network graph (<i>\"The Semantics of Metaphor\"<\/i>, p. 35) mapping associative nodes across <i>Finnegans Wake<\/i> (<code>MEANDER<\/code>, <code>labyrinth<\/code>, <code>maze<\/code>, <code>TAL<\/code>, <code>NEANDERTHAL<\/code>, <code>archetype<\/code>, <code>TALE<\/code>, <code>jungfrau<\/code>, <code>songe<\/code>, <code>dream<\/code>, <code>ambiguity<\/code>, <code>mensonge<\/code>, <code>confusion<\/code>).<\/li><li><b>Bottom Blue-Ink Annotation:<\/b><\/li><\/ul>\n<p>  &gt; <code>- Eco's graph of the metaphoric <i>(inserted above: &amp; metonymic)<\/i> connections between words in Finnegans Wake. The graph would make more sense, would carry more information <i>(inserted: if it were)<\/i> in 3 dimensions — but would probably be more confusing as well.<\/code><\/p>", "notes": "", "img": ["attachments/Screenshot_2026-11-18_at_10.27.46_AM.png"]}, "1994-08-04_Cubism-Acetate-Layers-Distance-and-Flashlight-Room": {"t": "Cubism, Acetate Layers, Perceived Distance & Flashlight Dark Room (Pages 103–103v)", "d": "1994-08-04", "est": false, "w": 1994.5916, "era": "Summer 1994, Travel and Alps", "th": ["cubism", "transparency", "depth-perception", "flashlight-room", "mirrors", "sculpture-ideas"], "pp": ["Rudolf Arnheim", "Mary", "Julien", "Katrine", "Childe Hassam"], "body": "<p>Notes from Arnheim (<b>pp. 132–133<\/b>) followed by Marco's observations of spatial distance and dark-room lighting installations:<\/p>\n<h4>Cubism Summary &amp; Acetate Transparency Flip-Book (p. 103)<\/h4>\n<ul><li>Summarizes Arnheim (pp. 132–133) arguing against the notion that Cubism expects viewers to fly mentally around an object from multiple angles—instead, clashing aspects exist simultaneously on a flat plane.<\/li><li><code>- Thoug
