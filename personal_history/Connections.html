outside world turns in on itself to make this inner space illusion.<br>This thought can only go so far b/c the mirror doesn't work when it is brighter outside the box.<br>I really want to talk <s>to<\/s> Steve and then Julian about the stand<br><code>[sketch: a small stand like a table, with a box on top, between curtains]<\/code><br>- has to be presented behind <code>[circled:]<\/code> curtains or dimly lit some how. → color? I see black first<br>for my room as I think of it so far:<br><code>[sketch: a tall narrow box on legs, labelled \"person single\" and \"polished aluminum\"]<\/code><br>- on top of A&amp;A @ night?<br>- steps to climb up &amp; look in?<br><code>[sketch: a square labelled \"front wall quote?.\"]<\/code><br><code>[sketch: a box with a ladder on top and a pole inside, labelled \"ladder high &amp; alone\", \"- inside pole &amp; switch in the middle switch high shoulder height\"]<\/code><br><code>[sketch: a box with a narrow entrance and a row of lights, labelled \"spot/flood\", \"entry\", \"6 lights\" and, circled, \"curtain?\"]<\/code><br>make shower cleansing blast<br>mirror covered by black cloth on ceiling which will[?] → hopefully not be visible.<br><code>[right margin, sideways:]<\/code> v. low light in the up part, your eyes really have to adjust -<\/p>", "notes": "Undated. Notes from a critique of the mirror box, and plans for the room. Ron is Ron Jones, who gave the art-theory lectures earlier in the notebook; Bob, Lisa, Steve and Julian are presumably classmates or teachers. The end of \"which will\" is cut off at the foot of the page.", "img": ["attachments/pages/scan_1995_p056.jpg"]}, "1995-09-24_Football-Bus-Nostalgia": {"t": "Football Bus Nostalgia", "d": "1995-09-24", "est": false, "w": 1995.7297, "era": "DC, Post-College", "th": ["memory", "childhood-memory", "place-attachment"], "pp": ["Richie", "Coach Markoff"], "body": "<p>9/24 - I had a strangely wonderful feeling of nostalgia this morning when I loaded onto the bus carrying Richie <s>and<\/s>, Coach Markoff and the football team to their game at a small private school 2hrs. away. The smell of the grass and the pads. The big green bus.<br>Also, being in D.C. in the fall, something which I know, but haven't experienced for the last 4 years. Its like hearing the voice of an old friend for the 1st time in a long time.<br>The changing of the seasons always makes me nostalgic.<\/p>", "notes": "Autumn 1995, back in Washington DC after the four Yale years. Richie is Marco's brother, so this is presumably his football team; Coach Markoff is not identified.", "img": ["attachments/pages/scan_1995_p098.jpg"]}, "1994-06-20_Katherines-Badlands-Postcard": {"t": "Katherine's Badlands Postcard", "d": "1994-06-20", "est": false, "w": 1994.4687, "era": "Summer 1994, Travel and Alps", "th": ["katherine", "letters", "travel", "landscape"], "pp": ["Katherine", "Lisa", "Tristan"], "body": "<p><code>[front: Badlands National Park — a cracked white mud flat in the foreground, green and dry brush in the middle, and a ridge of sharp orange-red peaks against a pale blue sky]<\/code><\/p>\n<p><code>[back, printed:]<\/code> BADLANDS NATIONAL PARK. #14727 G-2/17 Mud cracks in a dry wash illustrate the semiarid climate and highly erosive nature of Badlands rocks—two factors that help to create the spectacular Badlands scenery. Photographer—Carr Clifton<br><code>[postmark: Seattle WA, JUN 1994; 19¢ hot-air-balloon stamp]<\/code><br><code>[address:]<\/code> Marco Scoffier / PO Box 4191 Yale Station / New Haven, CT 06520 / - AIR MAIL -<\/p>\n<p>June 20 - 1AM Seattle WA youth hostel<br>Dear Marco, Lisa &amp; I had our first shower since Minnesota &amp; finally brushed our teeth. Went crazy sleeping at rest stops in the car for 3 nights in a row across the Dakota's, Wyoming, &amp; Montana. Thought you'd appreciate this postcard. <u>oh!<\/u>, the land out west is just waiting for you, Marco!<br>2 things: make sure you catch the next Letterman Show w/ the 2 Pakistani men at Mt. Rushmore. Lisa &amp; I were there which made the tourist attraction all the more exciting!<br>also, walking thru the gay district, capitol hill, in Seattle, tonite saw your fellow-SOB, Tristan sitting at an outside cafe. He definitely saw me &amp; then pretended not to when I walked by. He probably thought Lisa was my lover and that I was being mean as usual. Anyhow we didn't talk. I don't think we've officially met. (to you)<br>Hope all's well. Thought of you &amp; skiing when I ran down a steep path on a mountain in Missoula, Montana. Worked my legs hard &amp; today they hurt. Love you, Katherine<br>(should be home by this Wed.)<br><code>[beside the printed \"Interior, SD 57750\":]<\/code> (South Dakota)<\/p>\n<hr>\n<h4>Original Images<\/h4>", "notes": "A postcard from Katherine, kept in the 1994 notebook. It is the card Marco describes on 6 August 1994 in <span class=\"wl\" data-note=\"1994-08-06_Dads-Cards-Katherines-Colors-and-Mountain-Textures\">1994 08 06_Dads Cards Katherines Colors and Mountain Textures<\/span>: \"the reddish (earth) where one would expect the skyline, and the blue sky is reflected in the white earth of the foreground.\" The year comes from the Seattle postmark (June 1994). \"SOB\" is probably the Yale Society of Orpheus and Bacchus. The era follows the notebook it was kept in.", "img": ["attachments/pages/postcard_1994_katherine_front.jpg", "attachments/pages/postcard_1994_katherine_back.jpg"]}, "1995-03-12_Five-Frames-Taped-In-Slips": {"t": "Five Frames: Taped-In Slips", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["art-theory", "framing", "poetry", "collage"], "pp": ["John Cage", "Robert Wilson", "John Ruskin"], "body": "<p><code>[a page made of slips of paper taped in; read left to right, top to bottom]<\/code><br><code>[slip, top left:]<\/code><br>John Cage marvelled that the finest trained musicians would balk when he gave them <s>[?]<\/s> freedom with the score, when he released art making into their hands. When his part in the artistic process was reduced to siging his name and thus framing the experience.<br><s>He was<\/s><br>My piece can at best bring attention to what was already there. I have made nothing but five frames.<br>How can I suck the viewer in?<br><code>[slip, top right:]<\/code><br>The power of poetry is the power of life.<br>Art makes my heart beat.<br>It is hard to compare any companion to this relationship.<br>___<br>The grass shoot is never far from a companion.<br>Why must the human when he feels himself so full of life and growth Sprout so alone?<br><code>[torn spiral-notebook slip, lower right:]<\/code><br>The little details are keeping me from making magic.<br>They are annoying but they make the barely noticable but essential differenke that Robert Wilson's friend felt after Wilson had stayed in his house &amp; re-arranged the objects.<br><code>[typed slip, lower left:]<\/code><br>We<br>open our eyes and ears seeing life<br>each day excellent as it is<br>This realization no longer needs art.<br>--John Cage<br><code>[typed slip, at the foot:]<\/code><br>I believe any sensible person would change his pictures, however good, for windows.<br>--John Ruskin<\/p>", "notes": "Undated. The two typed quotations were also copied by hand in <span class=\"wl\" data-note=\"1995-03-11_A-Map-of-New-Haven-for-the-Thesis-Show\">1995 03 11_A Map of New Haven for the Thesis Show<\/span>. Printed text showing through one slip from the back reads, in mirror image, \"Sun. April 2 / Mon. April 3 / Tues. April 4\", which fits 1995 and suggests the page was made up in early April. The \"five frames\" may be the five pieces of the thesis show.", "img": ["attachments/pages/scan_1995_p062.jpg"]}, "1998-12-15_Writing-Reading-and-Aloneness": {"t": "Writing, Reading and Aloneness", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["language", "solitude", "poetry", "reading"], "pp": [], "body": "<p>writing is a particular mode of communication It is the process of reading rather (rather reading) which brings one to a level of aloneness and concentration on very specific issues, as specific as the comb of language allows -<br>Poems - readings - but readings aloud rather <code>[below:]<\/code> reading rather aloud<\/p>", "notes": "Undated. Follows the idea that literacy induces aloneness in <span class=\"wl\" data-note=\"1998-12-15_Rise-of-the-Novel-and-Art-in-the-Catalog\">1998 12 15_Rise of the Novel and Art in the Catalog<\/span>.", "img": ["attachments/pages/scan_1997_2_p057.jpg"]}, "1995-04-11_Dan-Graham-Lecture": {"t": "Dan Graham Lecture", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["art-history", "coursework", "architecture", "video"], "pp": ["Dan Graham", "Judd", "Nauman", "Sartre", "Lacan", "Venturi"], "body": "<p><code>[sketch: a tall box frame with a lamp or speaker on each face]<\/code><br>Dan Graham - Judd's writings.<br>non-anti-gallery art -<br>Advetizement.<br>Artist writer - hybrid - magazine pages &amp; art.<br>after gallery → back to the hardware store -<br>economics of mags. &amp; econ. of galleryes - now cliché.<br>utopia 1960's getting rid of value.<br>Time delay - urban arch.<br>↳ Nauman 1st -<br><u>the gaze<\/u> of the spectator - from Sartre echoing Lacan<br>Ambience <u>1976<\/u> Venice Biennial →<br>Golden mean can't be 2 squares - - acconstic window<br>Venturi - inflecting towards the other buildings<\/p>", "notes": "Undated. Notes from a talk by Dan Graham, whose address is on the inside cover (<span class=\"wl\" data-note=\"1994-12-28_Inside-Cover-Addresses-and-Contacts\">1994 12 28_Inside Cover Addresses and Contacts<\/span>). \"Sudd's\" is read as Judd's. Graham's <i>Public Space / Two Audiences<\/i> was shown in the \"Ambiente\" section of the 1976 Venice Biennale. \"acconstic\" may be \"acoustic\". The lower half of the page is blank.", "img": ["attachments/pages/scan_1995_p070.jpg"]}, "2005-04-24_Cellphone-Walking-Tour-or-Hotline": {"t": "Cellphone Walking Tour, or Hotline", "d": "2005-04-24", "est": true, "w": 2005.313, "era": "New York 2005", "th": ["communication", "technology", "project-list"], "pp": [], "body": "<p><code>[in pencil:]<\/code><br><u>Cellphone walking tour<\/u>: or <u>HOTLINE<\/u><br>for artist's &amp; network<\/p>", "notes": "Undated, in pencil; continues the phone projects of <span class=\"wl\" data-note=\"2005-03-21_Scripted-Phone-Play-Dial-og\">2005 03 21_Scripted Phone Play Dial og<\/span>. The faint writing showing through (\"Miller Theater\") is from the next page, which isn't in this scan.", "img": ["attachments/pages/scan_1997_2_p097.jpg"]}, "1997_p029_Utopia-Coomaraswamy-and-Fullers-World-Game": {"t": "Utopia, Coomaraswamy and Fuller's World Game", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["utopia", "nature", "systems", "language", "reading-list"], "pp": ["Thomas More", "Ananda K. Coomaraswamy", "Ludwig Wittgenstein", "Buckminster Fuller"], "body": "<p><s>E<\/s> Eutopia - good place   More c. 1516<br>utopia - no place → today is very much placed.<\/p>\n<p>Ananda K. Coomaraswamy<br>The Transformation of Nature in Art.<br>\"the responsibility of the artist is to imitate nature in her manner of operation.\"<\/p>\n<hr>\n<p>Wittgenstein - interrogative modeling of \"language games\"<br>Buckminster Fuller's \"<u>World<\/u> <u>Game<\/u>\"<br>- a computerized model he called \"minni-earth\" for regional planning.<br>- the entire planet = the region.<br>Fuller: <u>Utopia<\/u> <s>&amp;<\/s> or <u>Oblivion<\/u><\/p>", "notes": "", "img": ["attachments/pages/scan_1997_p029.jpg"]}, "1998-12-15_Boorstin-Paine-and-No-Finality": {"t": "Boorstin, Paine, and No Finality", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["reading", "television", "perception", "history"], "pp": ["Daniel Boorstin", "Thomas Paine", "Bill Clinton"], "body": "<p>Boorstin - printing press. 300yrs → revolution<br>→ Gov of virginia 1671 - \"bringer of heresy &amp; disobediance.<br>Tom. Paine stop a moment make it universal &amp; final<br>now ever rolling TV reality. can never stop to say Clinton purjurged - he can make a mess of it's ongoing-ness no finality -<br>stopping the moment w/ a T. Paine type speech seems silly now b/c it doesn't stop for very long - How can you capture the attention of an always flowing attention drifting spectator even Boorstin's book rushes from one amazing, life altering development to the next - no time to savour though you think - this is good I should savor it - I'll book mark it for later savoring<\/p>", "notes": "Undated. \"Clinton purjurged\" places it during the Lewinsky affair and impeachment, roughly August 1998 – February 1999; the date is an estimate. The Boorstin book is probably <i>The Discoverers<\/i> (1983); the 1671 quotation is Governor William Berkeley of Virginia on printing. The lower half of the page is blank.", "img": ["attachments/pages/scan_1997_2_p031.jpg"]}, "1999-06-15_Urbanisme-en-France-Taille-Quoi": {"t": "Urbanisme en France: Taillé Quoi?", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["french", "urbanism", "city", "nature"], "pp": ["Jean Dubuffet"], "body": "<p>En France on peut imagine un responsable qui planifie l'état remplace le roi donc les plans a vol d'oiseau peuvent prendre une immense importance<br>On parle de l'urbanisme en utilisant des mots <s>[?]<\/s> comme taillé (une place taillé dans les ilôts ou la voirie - and a smug laugh when talking about the orthogonal street plan of New York - \"oh there is no creativity<br>only from a plane is there any regularity - no street corner is<br>taillé quoi? la pierre la nature brut a besoin d'être regulé - le but de la ville c'est le foissonement<br>- jardin français vs. potager<br>↳<\/p>", "notes": "Undated; Marco's reaction, half in French, half in English, to the urbanism course of <span class=\"wl\" data-note=\"1999-06-15_Urbanisme-Bricolage-vs-Ingenieur-Venturi\">1999 06 15_Urbanisme Bricolage vs Ingenieur Venturi<\/span>. \"le foisonnement\" picks up Dubuffet's word in <span class=\"wl\" data-note=\"1998-12-15_Dubuffet-Psycho-Sites-and-the-Hydra\">1998 12 15_Dubuffet Psycho Sites and the Hydra<\/span>. The sentence \"no street corner is\" is left unfinished. The lower half of the page is blank.", "img": ["attachments/pages/scan_1997_2_p069.jpg"]}, "1995-07-06_Peace-and-Quiet-to-Think": {"t": "Peace and Quiet to Think", "d": "1995-07-06", "est": false, "w": 1995.5137, "era": "DC, Post-College", "th": ["solitude", "studio-practice"], "pp": [], "body": "<p>7/6<br>You need peace &amp; quiet in order to think. Your environment has to be conducive to your thought. I cannot clear my head in a noisy house w/ too many variables. I am too easily distracted and put ill at ease.<\/p>", "notes": "6 July 1995, after graduation; probably written in Washington DC (see <span class=\"wl\" data-note=\"1995-06-15_Letter-Draft-to-Katherine-from-DC\">1995 06 15_Letter Draft to Katherine from DC<\/span>).", "img": ["attachments/pages/scan_1995_p086.jpg"]}, "1995-02-12_Idiot-and-Genius-Evasive-Poetry": {"t": "Idiot and Genius; \"Evasive Poetry\"", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["self-criticism", "poetry", "language"], "pp": ["Shakespeare", "John Ashbery"], "body": "<p>Am I searching for something greater than the individual classes are looking for, or am I just washing them fooling myself - the line between an idiot &amp; a genius is so fine.<br><code>[circled, under \"idiot\", with an arrow:]<\/code> a fool → now Shakespeare has changed the meaning of this word.<br>\"evasive poetry\"<br>- art is a whole other language<\/p>", "notes": "Undated; between the Ashbery reading (<span class=\"wl\" data-note=\"1995-02-12_John-Ashbery-Reading\">1995 02 12_John Ashbery Reading<\/span>) and 2/15. \"evasive poetry\" may refer to Ashbery. \"washing them\" may be a slip for \"wasting them\".", "img": ["attachments/pages/scan_1995_p037.jpg"]}, "1994-07-29_Flying-Over-Clouds-Diebenkorn-Turrell-and-Earth-Flatness": {"t": "Flying Washington–NY: Clouds, Diebenkorn, Turrell & Earth's Flatness (Page 88)", "d": "1994-07-29", "est": false, "w": 1994.5767, "era": "Summer 1994, Travel and Alps", "th": ["flight", "clouds", "diebenkorn", "turrell", "flatness", "abstraction"], "pp": ["John Hollander", "Richard Diebenkorn", "Katherine", "James Turrell", "Frank Stella", "Anselm Kiefer", "Mark Rothko", "Clyfford Still", "Barnett Newman", "Robert Wilson"], "body": "<p>Flying from Washington to NY I had a window seat. It had been storming and there were many clouds of every shape and kind and color in the sky. It was really quite beautiful. The plane was flying inside these strips. There were thin black strips (pollution?—I thought they were kind of beautiful), puffy cottonny, mountainous ones and large flat scrim like ones. The earth was mostly a dark kind of greyed out purple color because for the most part someone from the ground would see complete cloud cover, he could not see the differentiation that we could from our privaledged, airborne position. We would however often see breaks in the clouds above us and the blue sunny sky (Is it comforting to think that no matter how bad the weather, it is always a sunny day if you could just fly high enough?)<\/p>\n<p>I remember Hollander mentioning that he was surprised that painters or artists had not reacted to views or visual stimulation which has been made possible by technological advances which allow humans all sorts of different views of the world. I am happy to mention that two of the artists about whom I have been most interested in the recent past, Diebenkorn and Turrell, both claim the visual experience of flying as a direct influence to their work. Diebenkorn vividly remembered his first plane flight, from New Mexico to the Bay Area (I believe) and the evidence can be seen in some of the later Berkley abstractions (50's before he switched to figuration) like the yellow one with black lines which Katherine copied. Turrell openly claims that his job as a small airplane pilot which has given him frequent views of the split heaven and earth is a direct influence to his pieces. He also mentions the multiple colors of the changing sunlight at twilight. He flew up and down the flat—and I think this is important—regions of Eastern California &amp; the West to search for Roden Crater—he seeks to make a sculpture which directly confronts the viewer with a feeling of ½ heavens ½ earth.<\/p>\n<p>I think it may be important that Diebenkorn doesn't admit to being openly influenced by anything <code>[above crossed-out: I thought of Diebenkorn's abstractions which critics have connected to what]<\/code>. He even would attack paintings, and \"ruin\" them to try to remove elements of figuration or representation which had \"appeared\" in them. Eventually, he stopped ruining pictures like that and would leave these elements as in <i>\"Motorcycle Crash\"<\/i> and <i>\"The Archer\"<\/i>. Diebenkorn doesn't want to think consciously about what goes into his abstractions and why. It is the critics who see evidences of the Ocean Park Architecture and landscape in the Ocean Park Series. I don't know if Diebenkorn is being completely honest about not thinking but I don't think one can completely eliminate the evidence of previous visual stimulae, a painter \"names\" visually even if he does not \"name\" things verbally. <code>[p. 40 *] [see the Wilson quote about memory &amp; stars]<\/code><\/p>\n<p>Flying the other day, I was thinking about how flat the landscape really is, human beings can't do anything yet to affect this phenomena (word choice?—I don't have a definite definition in mind, though I know a thorough definition would be several pages long.) This flatness is similar to a painting's flatness—there is only so thick a painting can get—Frank Stella's (3ft?), Anselm Keiffer (1.5ft?) and likewise for the landscape, the Himalayan mountain range is the largest rupture in this flatness, 28,000m = 28km how does this compare to 40,000 km (diameter or circumference) of the earth. The earth is flatter than the paintings I have mentioned. Thus the earth's surface as seen from the sky could be the perfect subject matter for an abstract painting and the obvious reason why someone like Diebenkorn, who is somehow more true to his own visual experience than other painters who have painted abstractly, comes to make paintings reminiscent of such a landscape, which he admits having been excited by at the time. He cannot shake himself from the visual baggage which he is carrying and representing it. He is representing an image which exists only in his head, but I believe he is representing it &amp; it does exist. The same sort of thing happens w/ Rothko over Still or Newman. People claim to see the sunset or the horizon or the sky in his works. He aims at a specific visual effect, his paint colors &amp; tones are so carefully balanced. When he achieves the effect he desires that could very well be when the painting has matched an image he has, no matter how vague, of a large visual effect like a sunset, or the horizon.<\/p>", "notes": "<i>[Diagram, top of p. 88]:<\/i> Cross-section of <code>Crater -&gt;<\/code> bowl with a tiny standing viewer at the bottom and dotted sightlines forming a huge circle with the caption: <code>optical effect the sky \"curves\" creates a sphere w/ the earth. new horizon<\/code>.", "img": ["attachments/pages/scan_1994_2_p019.jpg", "attachments/pages/scan_1994_2_p020.jpg", "attachments/pages/scan_1994_2_p021.jpg"]}, "1995-01-05_Seeing-Red": {"t": "Seeing \"Red\"", "d": "1995-01-05", "est": true, "w": 1995.011, "era": "Final Semester Yale 1995", "th": ["film", "synchronicity", "symbols"], "pp": [], "body": "<p>I just saw \"Red\". It was quite wonderful. Absolutely understated, but the time spent watching that movie slipped by like the time of a wonderful day when one is alone. Small coincidences or the most banal symbols like the color red - on the doors in the veterenarians office or on the wrapping paper of the 'Poire: <s>[?]<\/s> Valentine is so normal, the retired judge (Auguste Sr?) is too. The movie is understated enough to make its remarkable occurences <s>[?]<\/s> believable. ↳ make one smile, happy, in a way that is impossible to describe to anyone else. One feels like one has shared in a delightful secret - the best kind of understanding that is unexplainable. <code>[an arrow from \"Poire:\" leads to \"↳ make one smile\", the end of that sentence]<\/code><br>I think of Chp. 5 of <u>Olysseus<\/u> the 'Wandering Rocks' episode with music as its art. where the paths of all the players especially the most insiginificant are mapped synonymously.<\/p>", "notes": "Undated; it comes after the 1/5/95 entry and before 1/6/95, so it takes the 1/5/95 date. \"Red\" is Kieślowski's <i>Trois couleurs : Rouge<\/i> (1994). The film's Auguste is a young judge whose life repeats the retired judge's, hence \"(Auguste Sr?)\". The joined-up \"Valentine is so normal ... believable\" sits between \"Poire:\" and the arrowed ending, so it reads as an aside. \"Olysseus\" is Joyce's <i>Ulysses<\/i>; \"Wandering Rocks\" is its tenth episode.", "img": ["attachments/pages/scan_1995_p005.jpg"]}, "1995-02-15_The-Concrete-Floor-Flop-and-the-Frame": {"t": "The Concrete Floor Flop and the Frame", "d": "1995-02-15", "est": false, "w": 1995.1217, "era": "Final Semester Yale 1995", "th": ["studio-practice", "framing", "installation", "self-criticism"], "pp": ["Rachel", "Jason"], "body": "<p>2/15 Wow what a miserable day - ended w/ the complete dejection of the concrete mix being a total flop; not smooth, not level and a great mess, makes me feel guilty b/c I didn't ask Rachel for permission - she probably would have given me advice about what to do. now I just feel bad like I breached her confidence &amp; I have a mess on the floor - but why was I so upset when the stuff wouldn't work (besides the fact that this day has been a nightmare, so much driving for stuff - spending too much money Masco another $80 flop - that's at least three of them. and the fencing stuff - Jason said it was obvious who spent enough money on their art. I think his point is valid, but sometimes I feel like I am throwing the money into a void - lack of idea = spend some money, get some stuff. but that is not completely true. I am surrounding myself w/ tools w/ which to make magic?)<br>but the reason why I got particularly so upset about the<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>floor? why did I get so mad, or <s>[?]<\/s> would want to spend so much money on it? The floor is so important to the <s>studio<\/s> room becoming another place<br>maybe the lifted floor is an idea which combines many of the aforementioned ones<br><code>[sketch: a box-shaped room above a floor slab, labelled \"v. black floor floating.\" and \"hidden lights.\"]<\/code><br>- but yet I was thinking the floor was so important b/c it completes the frame the frame is important - It is all \"puts stuff into an art context.<br>Artist leads the viewer to situation like bringing a babe to water but can't make him drink.<br><u>FRAME<\/u><\/p>", "notes": "\"Cementitious\" in the \"Tomorrow\" note of <span class=\"wl\" data-note=\"1995-02-12_Mirandas-Dance-Curtains-and-Pavilions\">1995 02 12_Mirandas Dance Curtains and Pavilions<\/span> may be this concrete mix. Masco is a company making building and hardware products. Rachel was the TA for Ron Jones's class.", "img": ["attachments/pages/scan_1995_p037.jpg", "attachments/pages/scan_1995_p038.jpg"]}, "1997_p020_Je-le-revois-ce-soir": {"t": "Je le revois ce soir", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["speech", "sound", "french", "fragments"], "pp": [], "body": "<p>je le revoi ce soir<br>elle - disparaître<br>.. portable ..<br>longtemps heh hen hen hen.<br>je sais que ce qui dure <code>[est written above]<\/code> c'est que<br>parce que..   parce que<br><code>[sketch: two small marks under the last words]<\/code><\/p>", "notes": "Fragments of speech, perhaps copied from a recording (note the laugh \"heh hen hen hen\" and the trailing \"parce que\"). The first line could also be \"je la revoi\".", "img": ["attachments/pages/scan_1997_p020.jpg"]}, "1995-03-09_Rooftop-AandA-Piece-Microcosm-Box": {"t": "Rooftop A&A Piece: Microcosm Box", "d": "1995-03-09", "est": false, "w": 1995.1886, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "light", "sky"], "pp": ["Katherine"], "body": "<p>3/9 Rooftop A&amp;A piece: 8x8ft box made of weather proof materials large window in each side of the box which has a scrim or reflecting wall blocking the openning<br>I want to capture the different ever changing light qualities on all the sides of this box<br>enter in one of the corners<br>2½ doors.<br>432-0377 -0 <code>[a phone number]<\/code><br><code>[sketch: a box with a window in each side and a raised roof, labelled \"make an environment susceptible to exterior phenomena\", \"outdoor porch light turned upwards.\" and, in a loop, \"microcosm\"; tall shards of light come down to it from above]<\/code><br><code>[sketch: the box in section, with a figure \"5'10\" standing inside, labelled \"no ceiling?\"]<\/code><br><code>[sketch: a wall in section with arrows of light, a lamp on a stand beside it]<\/code><br><code>[sketch: a square frame of rods with guy lines, labelled \"1x1 square w/ white sheets?\"]<\/code><br><code>[sketch: a cross-shaped box in perspective]<\/code><br><code>[sketch: a long tray with light reflecting down from it, in an oval; a loop labelled \"marble dust coated paint super-reflective\"]<\/code><br>try on 4th wall @ sculpture<br>- want to get that reflected light like on the back of katherine's daydream picture<br>→ read in Artist's Materials what makes most reflective base.<\/p>", "notes": "More plans for the rooftop piece on the A&amp;A building (see <span class=\"wl\" data-note=\"1995-02-05_Roof-Top-Mirror-Floor\">1995 02 05_Roof Top Mirror Floor<\/span>). \"Katherine's daydream picture\" is not identified. \"Artist's Materials\" is probably Ralph Mayer's <i>The Artist's Handbook of Materials and Techniques<\/i>.", "img": ["attachments/pages/scan_1995_p044.jpg"]}, "1997_p016_A-Faire-U-matic-Hassel-Micro-mouche": {"t": "À faire : U-matic, Hassel, micro-mouche", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["project-list", "sound", "video", "studio-practice"], "pp": ["Monique"], "body": "<p>1) chercher cassettes U-matic → <u>son<\/u>. | <u>Dremel<\/u>.<br>b) aller Fnac service (120)<br>2) chercher Hassel. à base prêt avant 5h.<br>3) voir Monique pour garder micro-mouche.<br>4) Travailler !!.   [- montage →<br>- ecouter les sons<br>- finir fluorescent. ]<\/p>\n<p><code>[sketch: a hand holding a chisel or knife against a curved hollow set into a wall; behind the wall, a tube or projector aimed at it]<\/code><\/p>\n<hr>\n<p><s>[?] [?]<\/s><br>Many thoughts turn &amp; turn I need to work through them →<\/p>\n<p><code>[sketch: five single-line drawings: curving profiles like ramps or seats, a T-shaped plan, and a figure lying back in a reclining chair]<\/code><\/p>", "notes": "\"Hassel.\" is probably a Hasselblad camera on loan from the school's base (\"à base prêt\"); \"micro-mouche\" a small clip microphone. The crossed-out words above \"Many thoughts\" could not be read.", "img": ["attachments/pages/scan_1997_p016.jpg"]}, "1994-08-03_Instantaneous-Seeing-Valery-Page-100": {"t": "Instantaneous Seeing, Valéry & Travel Scars (Page 100)", "d": "1994-08-03", "est": false, "w": 1994.5888, "era": "Summer 1994, Travel and Alps", "th": ["museum-walks", "visual-perception", "gesture", "place-attachment", "travel-scars"], "pp": ["Katherine", "Jacques-Louis David", "Frank Auerbach", "Paul Valéry"], "body": "<p>A picture or image isn't a complete stop in time. One's eye (the viewer's and the creator's) must move around it, stopping on points of interest, comparison. The initial effect which adumbrates the rest of the viewing is instantaneous.<\/p>\n<p>I liked going to museums w/ Katherine, b/c both of us would walk through at the same speed, stopping when something caught our eye. There is no reason to go through a museum slowly. The image is all about this kind of eye-catching—there isn't too much reason for the artist to go beyond that. I would probably spend as much time in front of a David which he had spent 3 years to paint as I would before a Frank Auerbach whose entire painting had been completed in a couple hours, though it was the culmination of many sittings piled one on the other. Painting made instantaneous, like a photograph—gesture. I am much prouder of any painting I have made than any photograph.<\/p>\n<p>I look around and I see small clips of images, but often it is just what happens to be around me. I think that the circumstances surrounding the creation of an artwork of which Valéry spoke are even more ingrained in a painter's painting than in the poet's poem, because the image is about a connection to the outside world whereas the poem... I suppose this statement depends on what kind of paintings &amp; poems I am talking about: a painting about the artist's inner world is less attached to the place where it is made (I have a tendency to want to attach images to the place: collect the dirt, rocks, or plants of the place to add to the image—paint on a mirror—on the sky). Poems, too, can be about place, or position of the artist before something.<\/p>\n<p>I have always liked the collection of travel scars an object or a person can collect. People embody the place or circumstance from which they come—the carpenter's/workman's hand, the mountain guide's weather-beaten hands &amp; face are far more beautiful to me than the soft white skin of the city or of luxury which has no evidence of having done anything. The letter or the passport which collects stamps or scuff-marks from the places it has been is beautiful, as is the path which collects the footprints of the travelers who make it and maintain it. I like to look at the rock formations which fit together like puzzle pieces because any rocks that don't fit are moved on by the melting snow or gravity. The history of a rock is fascinating and beyond comprehension like Camus clouds in the beginning of <i>\"Le premier homme\"<\/i>.<\/p>\n<ul><li><i>Sou Uma Rocha<\/i><\/li><\/ul>", "notes": "", "img": ["attachments/pages/scan_1994_2_p039.jpg", "attachments/pages/scan_1994_2_p040.jpg"]}, "1995-01-22_Campbells-Room-and-Being-Socialized-Out": {"t": "Campbell's Room and Being Socialized Out", "d": "1995-01-22", "est": true, "w": 1995.0575, "era": "Final Semester Yale 1995", "th": ["language", "friendship", "yale-culture", "identity", "painting-practice"], "pp": ["Campbell", "Katherine"], "body": "<p>I went to Campbell's room tonight - fun lot's of laughter. I realize that what I had taken as laziness in the '94 class always using the same expression, is really a new form of signification. The phrase, whatever it is: \"flower penis\" \"the juice goes\" etc. represents an entire story the essence of that story and the cameraderie felt at the moment and through the repetition of the phrase are captured in the word, which is repeated carefully for best effect.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>I am socialized out. Having had too much fun this weekend I need to spend some time working stuff out alone. This is the most distant I have felt from katherine and my projects <s>[?]<\/s> yet this school year. It feels really good to hang out w/ these people I never would have met - I don't have to act anything around them and yet I am surprised at how I am acting - is this me?. Is the me I had built - the one I lost in <s>[?]<\/s> pangs of shame about my pretensiousness the week before giving my bio. gone to a new distilled me - free of some excess<br>I think it is too bad that I am no longer painting regularly the pictures are no longer a record of how I have been feeling What would I paint like now if I could be as free as I was in the night club in NY?<\/p>", "notes": "Undated; it follows the 1/22 entries after a rule and runs to the 1/23 entry. 22 January 1995 was a Sunday, which fits \"this weekend\".", "img": ["attachments/pages/scan_1995_p019.jpg", "attachments/pages/scan_1995_p020.jpg"]}, "1998-12-15_Hofstadter-Cannot-Feel-the-Difference": {"t": "Hofstadter Cannot Feel the Difference", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["poetry", "craft", "cognition"], "pp": ["Douglas Hofstadter", "Wallace Stevens", "Clément Marot"], "body": "<p>Hofstader has a problem. He cannot feel the difference btw. very strong expression &amp; craftsman<s>like<\/s> expression.<br>W. Stevens vs. Clement Marot.<\/p>", "notes": "Undated. Probably about Hofstadter's <i>Le Ton beau de Marot<\/i> (1997), a book built around many translations of Clément Marot's short poem \"Ma mignonne\".", "img": ["attachments/pages/scan_1997_2_p056.jpg"]}, "1995-01-09_Vol-de-Nuit-Another-Space": {"t": "Vol de Nuit: Another Space", "d": "1995-01-09", "est": false, "w": 1995.0219, "era": "Final Semester Yale 1995", "th": ["french", "flight", "tignes", "light", "literature"], "pp": ["Saint-Exupéry", "Fabien"], "body": "<p>1/9/95 another space<br>\"Les collines, sous l'avion creusaient déjà leur sillage d'ombre dans l'or du soir. Les plaines devenaient lumineuses mais d'une inusable lumière: dans ce pays elles n'en finissent pas de rendre leur or de même qu'apres l'hiver, elles n'en finissent pas de rendre leur neige.<br>\"Et le pilote Fabien, qui ramenait de l'extrême Sud, vers Buenos Aires, le courier de Patagonie, reconnaissait l'approche du soir aux mêmes signes que les eaux d'un port: à ce calme, à ces rides légères qu'a peine dessinaient de tranquilles nuages. Il entrait dans une rade immense et bienheureuse.\"<br>I have the flavor of the air in Tignes in my mouth as I <s>[?]<\/s> copy down these first two paragraphs of <u>Vol de Nuit<\/u>. That is where I read it last &amp; the only place I have seen the sun set on mountains and the shadows flow into the valleys.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p><code>[bracketed in the margin:]<\/code> \" On est riche aussi de ses misères, et d'être ici un homme simple, qui regarde par la fenêtre une vision désormais immuable.\" p. 19.<br>\" Fabien eût désiré vivre ici longtemps, prendre sa part ici d'éternité, car les petites villes, où il vivait une heure, et les jardins clos de vieux murs qu'il traversait, lui semblaient éternels de durer <u>en dehors de lui<\/u>. Et le village montait vers l'équipage et vers lui s'ouvrait. Et Fabien pensait aux amitiés, aux filles tendres, à l'intimité des nappes blanches, à tout ce qui, lentement, s'apprivoise pour l'éternité. Et le village coulait déjà au ras des ailes, étalant le mystère de ses jardins fermés que leurs murs ne protégeaient plus. <code>[\"Mais\" is circled]<\/code> Mais Fabien, ayant atterri, sut qu'il n'avait rien vu, sinon le mouvement lent de quelques hommes parmi leurs pierres. Ce village défendait, par sa seule immobilité, le secret de ses passions, ce village refusait sa douceur: il eût fallu renoncer à l'action pour la conquérir.\" 19-20<br><code>[bracketed in the margin, marked \"no\":]<\/code> - I think of the deep love I have of these small french towns of which I will never be a part, which I descend upon for a day at most to smell the air and eat a meal in the shade of a huge ancient fig tree, in a court yard w/ cobblestones. <s>which<\/s> The view of the street is blocked by an old stone wall w/ rounded edges which used to be puttied over <s>[?]<\/s> w/ stucco, but the sounds of the diesel engines of the tiny manual cars and velomoturs fill the air.<br><code>[bracketed in the margin:]<\/code> \" La terre était tendue d'appels lumineux, chaque maison allumant son étoile, face à l'immense nuit, ainsi qu'on tourne un phare vers la mer\" p. 21<br>Alone against the night - the person and the world are separated and that makes the night powerful and beautiful.<br><code>[bracketed in the margin:]<\/code> \" Il se pencha vers le sol: il cherchait les lumières des villages, pareilles à celles de vers luisants cachés dans l'herbe, mais rien ne brillait dans cette herbe noire.\" p. 69<br>- I wonder what this primal fall - fear / love of falling - it puts you back to the state you were in in the womb. Ever falling suspended.<br>The characters in these books are all artists really Fabien wanting to communicate w/ the distant lights is the artist's wish.<\/p>", "notes": "Passages copied from Saint-Exupéry's <i>Vol de nuit<\/i> (1931), whose pilot is Fabien. The word in the margin beside the paragraph about small French towns reads \"no\"; it may be a later mark.", "img": ["attachments/pages/scan_1995_p008.jpg", "attachments/pages/scan_1995_p009.jpg"]}, "1997_p021_Pinhole-Exposures": {"t": "Pinhole Exposures and Film", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["photography", "pinhole-camera", "studio-practice"], "pp": [], "body": "<p><u>EV<\/u>. 10.1 → full hole -   <code>[sketch: a box camera with a pinhole, arrow pointing at it]<\/code>   5min.   under exp.<br>10.1 → 4.3   evening   20 min - v. under exp.<\/p>\n<p><b>Top of the next page:<\/b><\/p>\n<p>→ like kodak Gold Max <u>800<\/u> grainy but not contrasty!<\/p>", "notes": "An exposure log, apparently for a pinhole camera (\"full hole\"). \"10.1\" and \"4.3\" may be exposure values or dates.", "img": ["attachments/pages/scan_1997_p021.jpg", "attachments/pages/scan_1997_p022.jpg"]}, "2005-03-21_Stereoscopic-Periscope-and-Binaural-Listening-Device": {"t": "Stereoscopic Periscope and Binaural Listening Device", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["perception", "sound", "optics", "sculpture-ideas"], "pp": [], "body": "<p><code>[pencil sketch: two parabolic dishes side by side labelled \"ears\", with two periscope tubes rising between them labelled \"eyes\"]<\/code><br>2 ears, 2 eyes a stereoscopic periscope and binaural distance listening device<br>- 2 large parabolic dishes w/ hoses at the focal points concentrate distant sounds into the end of a hose where the sounds are carried freely to the observer's ears<br><code>[sketch: a dish with a hose curving round to a listener's ear]<\/code><br>- 2 pipes with lenses fitted into the ends bring a distant image to a screen which provides a stereoscopic image. Like a pinhole camera, but with the lense the image is much more bright.<br><code>[sketch: a periscope tube with a \"lense\" at the top end, a \"mirror\" at each bend and a \"screen\" in front of a viewer's face]<\/code><\/p>", "notes": "Undated, about 2005, in pencil; one of the \"perceptual boxes\" of <span class=\"wl\" data-note=\"2005-03-21_Perceptual-Boxes-the-Vertigo-Box\">2005 03 21_Perceptual Boxes the Vertigo Box<\/span>.", "img": ["attachments/pages/scan_1997_2_p095.jpg"]}, "2005-03-21_Internal-Site-Leaks-and-Types-of-Critics": {"t": "Internal Site Leaks, and Types of Critics", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["internet", "criticism", "play"], "pp": [], "body": "<p><code>[two slips of paper taped onto the page, in pencil]<\/code><br><code>[upper slip:]<\/code><br>Internal site - confidential ideas &amp; projects are bandied about leak of info. means ruined project carefully prepared information leaks out,<br>beauty@almost-something.com. - anyone can sign up to discuss - place for invented sensibilities<br>insider@almost-something.com - 'top secret' plans manipulations<br><code>[lower slip, left:]<\/code><br>about <u>that<\/u> ephemeral ... defn.<br><code>[lower slip, right:]<\/code><br>types of critics: the socialite, the <s>super<\/s> <code>[above:]<\/code> self-referent, personal, the deep the pop, the all over the place,<\/p>", "notes": "Undated, about 2005; part of the same project as <span class=\"wl\" data-note=\"2005-03-21_False-Tour-Guides-and-Rumors\">2005 03 21_False Tour Guides and Rumors<\/span>. almost-something.com is Marco's website. This page was photographed with the notebook open on a table, so the black cover shows around it.", "img": ["attachments/pages/scan_1997_2_p093.jpg"]}, "1999-06-15_Genius-in-Science-and-in-Art": {"t": "Genius in Science and in Art", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["art-vs-science", "criticism", "ego", "self-criticism"], "pp": [], "body": "<p>In science genius needs no masquerade one can say one is a scientist - it is a daily activity, a result of successful completion of a type of education. Too often I confound the word artist w/ the word genius where I should say an artist of genius. In fact only an artist of genius is interesting. An artist \"tout court\" is pathetic, no use, no interest. This for me is a fundamental problem in my manuvering in my small art world. And is a fundamental chauvanism I must get over or hide.<br>___<br>My idea of genius is closer to the scientist's I think. Many people are working for a similar goal, sharing ideas &amp; results after the fact, or through constant interaction one person is considered to be a genius by the others<br>The results, the advances are elsewhere.<\/p>", "notes": "Undated. A single diagonal line runs across the page from the middle of the first paragraph to the bottom left; it does not seem to cross anything out. The writing showing through is page 73.", "img": ["attachments/pages/scan_1997_2_p072.jpg"]}, "1998-12-15_Two-Types-of-Pieces": {"t": "Two Types of Pieces", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["art-theory", "land-art", "sky"], "pp": ["Nancy Holt"], "body": "<p>Two types of pieces: ① those that marvel through some kind of trickery ← <code>[bracketed:]<\/code> smoke &amp; magic<br>② those that lead to the deepest revelations but in a way that can be passed by. - holes in a tube - come to represent a certain constellation b/c the experience of that constellation in those holes is so rare. <code>[in the margin:]<\/code> (Nancy Holt)<\/p>", "notes": "Undated. Nancy Holt's <i>Sun Tunnels<\/i> (1973–76) are concrete tubes in the Utah desert pierced with holes in the pattern of constellations.", "img": ["attachments/pages/scan_1997_2_p055.jpg"]}, "1994-06-25_Goodman-Languages-of-Art-and-Statues": {"t": "Nelson Goodman’s *Languages of Art* & Alternating Statues Idea", "d": "1994-06-25", "est": false, "w": 1994.4824, "era": "Yale, New Haven", "th": ["innocent-eye", "representation", "sculpture-concepts", "perception"], "pp": ["Nelson Goodman", "Ernst Gombrich"], "body": "<ul><li><b>Notebook Reference:<\/b> <code>Languages of Art: pgs. 7–8 (text) 18 diagram<\/code> (<code>see p. 59<\/code>).<\/li><li><b>Top Handwritten Installation Note:<\/b><\/li><\/ul>\n<p>  &gt; <code>\"a row of statues, wood blocks [making a word] but alternate btw actual statues in nooks &amp; representations of those same [statues]\"<\/code><\/p>\n<ul><li>**Pasted Clippings (Nelson Goodman, <i>Languages of Art<\/i>):**<\/li><li><i>\"The catch here, as Ernst Gombrich insists, is that there is no innocent eye. The eye comes always ancient to its work, obsessed by its own past and by old and new insinuations of the ear, nose, tongue, fingers, heart, and brain... It does not so much mirror as take and make; and what it takes and makes it sees not bare, as items without attributes, but as things, as food, as people, as enemies, as stars, as weapons. Nothing is seen nakedly or naked.\"<\/i><\/li><li><i>\"The myths of the innocent eye and of the absolute given are unholy accomplices... what has been received and what has been done to it cannot be distinguished within the finished product.\"<\/i><\/li><\/ul>", "notes": "", "img": []}, "1995-01-02_Fleeting-Perceptual-Moments": {"t": "Fleeting Perceptual Moments", "d": "1995-01-02", "est": false, "w": 1995.0027, "era": "Final Semester Yale 1995", "th": ["perception", "light", "observation"], "pp": [], "body": "<p>1/2/95<br>It is really quite wonderful to be aware of all the fleeting perceptual moments in life: A door's shadow and reflection on the floor w/ light diffracting on either side making it look like a triangle; or more special: the blue glow caught between two white walls or how the Raw/Burnt Sienna window sill in my room became a flame of cad red in the corner of my eye beside the blue outside and the softer blue reflected wall.<\/p>", "notes": "", "img": ["attachments/pages/scan_1995_p004.jpg"]}, "1997_p005_Distance-Compensated-by-Overlap-and-Les-Voutes-du-Ciel": {"t": "Distance Compensated by Overlap; Les Voûtes du Ciel", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["sculpture-ideas", "sky", "optics", "notre-dame"], "pp": [], "body": "<p>A page of pen sketches, written in several directions:<\/p>\n<ul><li><code>[sketch: a sphere drawn as a web of concentric circles and radiating lines]<\/code><\/li><li><code>[sketch: an arc over a dot, with a line cutting it]<\/code> distance/compensated by over lap. → calculate amou[?]<\/li><li><code>[sketch: spheres with arrows turning around them; an egg-shaped ellipse; a ball casting a hatched shadow]<\/code><\/li><li><code>[sketch: a circle inside a square]<\/code> <code>[Place devant N. Dame.]<\/code><\/li><li>In september I have to make tests w/ my ball<\/li><li><code>[sketch: a dense tangle of small shapes, like leaves or fragments, with stakes at the corners]<\/code> les voûtes du ciel<\/li><li><code>[sketch: a small spoked wheel or sundial on a post]<\/code><\/li><\/ul>", "notes": "The ball seems to be a piece to be tested in front of Notre-Dame in September. \"amou\" may be \"amount\" cut short.", "img": ["attachments/pages/scan_1997_p005.jpg"]}, "1995-03-12_Box-Crate-Sketches-Solitaire-Solidaire": {"t": "Box Crate Sketches: Solitaire / Solidaire", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["sculpture-ideas", "installation", "solitude", "framing"], "pp": ["Nauman", "Camus", "Saint-Exupéry"], "body": "<p><code>[a page of pen sketches of boxes, frames and a stand]<\/code><br><code>[sketch: a dark box with rods through it, circled, labelled \"box crate like to carry animals\"]<\/code><br><code>[sketch: two open box frames with rods and pipes running through them]<\/code><br><code>[in a loop, with an arrow to the frames:]<\/code> Naumann's space under my chair<br><code>[sketch: a square panel with a spiral on it]<\/code> <code>[with an arrow from \"solitude\":]<\/code> lettre a <s>[?]<\/s> amie inventée<br><code>[boxed:]<\/code> solitude ↳ Camus' painter <u>Exil et Royaume<\/u><br><code>[sketch: a frame seen from above, with a square inside, a small box labelled \"2\" and a side labelled \"3\"; along one side \"white wall w/ floods\"]<\/code><br><code>[sketch: two more box frames with rods and round fittings, one labelled \"2\"]<\/code><br>solitaire . solidaire <code>[a small circle with a squiggle in it, labelled \"warm\"?]<\/code><br><code>[sketch: a square frame]<\/code><br><code>[sketch: a large open frame on four legs, \"8\" high, over a round base, with small boxes on the ground, labelled \"white\"; lines run out to a square frame, a window, and \"3\"]<\/code><br>q floods outdoor battery?<br><code>[sketch: a rectangle divided into four, labelled \"dbl.[?] framing why?\"]<\/code><br><code>[sketch: a box with a rod rising from its top and pipes in its sides]<\/code><br><code>[sketch: a long bench or ramp, labelled \"where?\", \"window\" and \"5ft\"]<\/code><br><code>[circled:]<\/code> think nothing<br><code>[right edge, sideways:]<\/code> person single<\/p>", "notes": "Undated; a page of sketches between the 3/12 entries and 3/14. \"Naumann's space under my chair\" is Bruce Nauman's <i>A Cast of the Space Under My Chair<\/i> (1965–68). \"Camus' painter\" is Jonas, in \"Jonas ou l'artiste au travail\" from <i>L'Exil et le royaume<\/i>, whose last word, written on his canvas, is either \"solitaire\" or \"solidaire\". \"lettre a amie inventée\" is Saint-Exupéry's <i>Lettres à l'amie inventée<\/i>. \"warm\", \"q floods\" and \"dbl.\" are uncertain readings.", "img": ["attachments/pages/scan_1995_p055.jpg"]}, "1995-07-06_Make-Many-Models": {"t": "Make Many Models", "d": "1995-07-06", "est": true, "w": 1995.5137, "era": "DC, Post-College", "th": ["sculpture-ideas", "light", "studio-practice"], "pp": [], "body": "<p>Make many models:<br><code>[sketch: a figure standing on top of a tall post on a base, with guy lines running out to the sides]<\/code><br><code>[sketch: a spiral screen curling round a central pole inside a curved wall]<\/code><br><code>[sketch: two lamp shades facing each other on a hanging cord]<\/code><br>light grid w/ hanging screen spiral.<br><code>[sketch: a tall thin pole]<\/code><br><code>[sketch: a column of dashes and a long curved line]<\/code><br><code>[sketch: a curved panel with a grid of crossing lines and arrows]<\/code><\/p>", "notes": "Undated; below the 7/6 entry after a rule.", "img": ["attachments/pages/scan_1995_p086.jpg"]}, "1997_p008_Rivers-Trains-Axes-Project-List": {"t": "Rivers, Trains, Axes: Project List", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["project-list", "photography", "pixels", "sound", "installation"], "pp": ["Miwa"], "body": "<p>Rivers, trains, <u>Axes<\/u><br>→Behr 50 @ x-mas ask @ Casto. →Boutique du Spect. for 18% grey backdrop.<\/p>\n<p><s>All<\/s> day on the bd. circulaire. → up close &amp; personal<br>↳ week?<\/p>\n<p>① slice piece<br>② pixel portraits<br>③ many views of radio towers &amp; tram track fittings<br>④ voûte celeste<br>→ make a telescope<\/p>\n<p>Large drawings explaining presenting<br>Perspective drawings<br>→ explanation on video?<\/p>\n<p>recording<br>Pipe becomes <code>[sketch: a long pipe]<\/code><br>Architecture w/ mini-mike<br>sounding space<br>[→ ask Architects to draw cube<br>→ photo project w/ other people ] ?<\/p>\n<p><code>[right column:]<\/code><br>- Read, Record[?], Read<br>→ Wed. Cité des Sciences<br>↳ Miwa's DV - movie<br>[?] [?]<\/p>", "notes": "\"pixel portraits\" is a fairly sure reading (compare the pixel figure on p. 4). The last line of the right column could not be read. The faint writing at the top right shows through from the facing page.", "img": ["attachments/pages/scan_1997_p008.jpg"]}, "1998-10-15_Video-Synch-Circuit-for-Three-Tapes": {"t": "Video Synch Circuit for Three Tapes", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["video", "technology", "engineering", "installation"], "pp": [], "body": "<p>3x<br><code>[sketch: three video decks, each with \"IR in\" from a remote control and \"Audio out\" curving down; the first labelled \"IR Remote control\", \"IN: Play/Pause &amp; Rew. functions\" and \"Audio out 1000Hz, 1 Frame (beep) (or diff types) -\"]<\/code><br><code>[sketch: a box labelled \"Digital Circuit\", with \"IR OUT\" arrows rising to the decks on the left and \"Audio beep In\" arrows coming in on the right]<\/code><br>→ functions → it recognizes an <u>end of tape beep<\/u> &amp; sets machines to rewind.<br>→ Idea: each tape at the beginning has 3 beeps five sec. apart → the digital circuit can recognize 3 sets of 3 beeps and time lag btw. the beeps from each machine -<br>if time lag &lt; 1 sec O.K. ⇒ if Not then <s>[?]<\/s> rewind &amp; try again [perhaps this can be combined w/ pausing fast machine<\/p>", "notes": "Undated. A design for keeping three video players in step, probably the \"video synch. piece\" to ask Miki and Tanaka about in <span class=\"wl\" data-note=\"1998-10-15_Experiencing-Place-Public-Art-To-Do-in-Japan\">1998 10 15_Experiencing Place Public Art To Do in Japan<\/span>. The last line runs off the edge of the scan.", "img": ["attachments/pages/scan_1997_2_p018.jpg"]}, "1998-10-15_Do-Do-Do-Records-and-Roaratorio": {"t": "Do, Do, Do; Records and Roaratorio", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["music", "sound-art", "finnegans-wake", "cognition"], "pp": ["John Cage", "James Joyce", "Peter Greenaway"], "body": "<p>do, do, do - so that your thoughts are understood.<br>- music stand did not respond to his driving → that particular stand<br>- conch shells w/ water: you don't know when you will get a gurgle<br>___<br>records destroy a musical experience they make you believe you are having one when actually you are not<br>___<br>Roratorio - giving a shape (mesostic) to Finnegan's wake<br>___<br>Joyce out pouring of collected knowledge letting your brain <u>flush<\/u> of what you have collected. <u>Flush<\/u> relax<br>→ way into cognition ←<br>→ directed by Peter Greenaway<\/p>", "notes": "Undated; more notes on the Cage video of <span class=\"wl\" data-note=\"1998-10-15_Akemis-John-Cage-Video-and-Nobel-Triplets\">1998 10 15_Akemis John Cage Video and Nobel Triplets<\/span>. The conch shells filled with water are from Cage's <i>Inlets<\/i> (1977). Cage's <i>Roaratorio<\/i> is built on his mesostics on <i>Finnegans Wake<\/i>. \"directed by Peter Greenaway\" probably refers to Greenaway's 1983 film portrait of Cage in the series <i>Four American Composers<\/i>.", "img": ["attachments/pages/scan_1997_2_p014.jpg"]}, "1995-02-21_The-Stamp-on-My-Last-Letter-to-Katherine": {"t": "The Stamp on My Last Letter to Katherine", "d": "1995-02-21", "est": false, "w": 1995.1381, "era": "Final Semester Yale 1995", "th": ["katherine", "letters", "marriage-distance", "memory"], "pp": ["Katherine"], "body": "<p>2/21 Tues.<br>I can still taste the stamp I put on my last letter to katherine.<br>I sat and stared at it against the beige formica of the table in CCL. The image on the stamp glowing. The other two destined to remain un-used until they are lost are still neat &amp; crisp. I just bought them the other day - the first time I made the decision to buy a bunch at once rather than always have to wait in line when I wanted to send her a letter. My life changes too much ever to make plans for the future, Even buying stamps.<br>The letter sits here before me with <s>[?]<\/s> memorized address <s>[?]<\/s> about to embark on a journey w/ the four other letters on their way to her. They're all gonna get there in a bunch. Each one so different from the other, a document of my radically shifting feelings 'till this last one <s>[?] to tell her<\/s> which contains <s>[?]<\/s> <s>[?]<\/s> my breakdown and the subsequent cool acceptance. I do feel comfortable and good. My ego is as strong as hers. She can't get me down. She can't always deny what she let herself feel for me. I don't want <u>her<\/u> reticent love anymore.<br><code>[at the foot of the page: two unused 40¢ US Airmail stamps, \"William T. Piper, Aviation Pioneer\", pasted in]<\/code><\/p>", "notes": "The two stamps pasted at the bottom of the page are probably \"the other two destined to remain un-used\". CCL is Yale's Cross Campus Library. 21 February 1995 was a Tuesday.", "img": ["attachments/pages/scan_1995_p039.jpg"]}, "1994-07-27_Dialogues-with-Nature-Smoke-Fly-and-Squirrels": {"t": "Dialogues with Nature: Smoke, Fly & Squirrels (7/27)", "d": "1994-07-27", "est": false, "w": 1994.5712, "era": "Yale, New Haven", "th": ["nature", "music", "synchronicity", "yale", "saybrook", "perception"], "pp": ["Antonín Dvořák"], "body": "<p><b>7/27<\/b> — I remember several dialogues with nature:<\/p>\n<p>I was lying on my back in the Saybrook grass court yard listening to Dvořák's cello concerto. There was a flume of smoke rising from the dark roof, illuminated by the moon which was full, and close behind it. The plume seemed to dance as it rose. It would go from heavy to almost non-existent. The Music was happening inside my head between the two earpieces of my headphones &amp; the plume was outside in the cool night. There were times when the plume seemed to react to the music I was listening to; almost vanish with a decrescendo or dance wildly in a more vigorous part. Those moments of syncrony were wonderful and random, and wonderful for being random.<\/p>\n<p>I had the same sort of feeling watching a fly in my room. For some reason flies circle around in the very center of the room where a string hangs down from the ceiling light. Its motions were generally much quicker than the smoke's had been, but it too seemed to get some kind of rhythm or pattern from the music.<\/p>\n<p>I will never forget a wonderful day at the end of exams when I went for a long run &amp; lay down under a chestnut tree near the Divinity school. Two squirrels were playing or flirting near me &amp; at times it seemed I understood what they were communicating to each other and they felt my presence in their world.<\/p>\n<p>I think it is interesting to think of these interior/exterior running dialogues. When are they synchronized? Can they be synchronized? or are we just experiencing random connection patterns which happen to seem similar?<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p004.jpg", "attachments/pages/scan_1994_2_p005.jpg"]}, "1998-10-15_Recursive-Loop-Speaker-Sketch": {"t": "Recursive Loop Speaker Sketch", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["sound-art", "sculpture-ideas", "technology"], "pp": [], "body": "<p><code>[pencil sketch, drawn at a slant: two horn speakers marked \"R\" and \"L\" facing a central horn, with microphones and cables; labels \"gives frequency\" (an arrow to a speaker), \"recursive loop, broken by movement\" (beside a cable looping back) and \"computer controlled sweeps\" (an arrow to a small box at the bottom)]<\/code><\/p>", "notes": "Undated, in pencil. The darker writing showing through (\"too diff.\", \"YES!\", \"An artist can be…\") is ink from the back of the previous page, <span class=\"wl\" data-note=\"1998-10-15_An-Artist-Can-Be\">1998 10 15_An Artist Can Be<\/span>. The sketch seems to be a feedback piece: speakers and microphones in a loop, interrupted when someone moves between them.", "img": ["attachments/pages/scan_1997_2_p028.jpg"]}, "1994-06-06_Goodbye-to-Katherine": {"t": "Katherine Leaves & Emotional Restraint", "d": "1994-06-06", "est": false, "w": 1994.4304, "era": "Yale, New Haven", "th": ["intimacy", "emotional-restraint", "writing-process", "painting"], "pp": ["Katherine", "Daria", "Lisa", "Nira"], "body": "<p>Well, Katherine left today. I choked as I tried to say \"Bye, Babe.\" I came so close to crying as I walked back to Daria's from the curb, from where Lisa's blue station wagon pulled Katherine's ever-smiling face away from me. I can't remember ever having felt so natural and happy with someone. <\/p>\n<p><i>(Later annotation: That kind of statement is always problematic—I wonder if it will sound like the 10th grader who wrote about Nira to me someday.)<\/i><\/p>\n<p>I always wonder why I never cry. Do I rationalize my way out of it, or am I stunted emotionally? If I am deprived of the crying extreme, I must also be kept from extreme happiness. I know I don't explode into the exuberant, unrestrained laughter that Katherine does. I love that about her; she is often as emotionally free as a 5-year-old, her voice sliding through octaves and registers over which she has as little control as her toddler counterpart.<\/p>\n<p>I want to start to write regularly, so that I may work out the kinks and awkwardnesses of transcribing my thoughts. I want to try to get this process as free as Katherine's laughter, and as that loose painting stroke she so appreciates.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p048.jpg"]}, "1995-04-11_Collot-Du-Sens-de-lEspace-a-lEspace-du-Sens": {"t": "Collot: Du Sens de l'Espace à l'Espace du Sens", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["french", "poetry", "space", "reading"], "pp": ["Michel Collot", "Claude Royet-Journoud"], "body": "<p>L'espace et Poesie conf. <code>[underlined in blue:]<\/code> 1985? p. 102, <code>[in blue:]<\/code> Sorbonne?<br>Michel Collot Du sens de l'espace à l'espace du sens<br>Le poète s appréhende toutes les modifications de la chose en fonction de ses divers horizons comme autant de révélation de son identité multiple. Il ressaisit en elle sa dimension sécrète d'altérité, il la voit, non comme autre qu'elle n'est, mais, telle que les autres la font à chaque fois différente. C'est ansi que je comprends le titre d'un recueil récent de Claude Royet-Journoud: <u>Les objects contiennent l'infini<\/u>. Infiniment muable selon les aléas du voisinage, de l'heure, de la lumiere, un chose n'est jamais la même. Et chaque poème est pour elle l'occasion de changer d'horizon<\/p>", "notes": "Undated. From Michel Collot's paper \"Du sens de l'espace à l'espace du sens\" in <i>Espace et poésie<\/i> (Presses de l'École normale supérieure, 1987), the proceedings of a 1984 colloquium; the date and place are queried in blue on the page. Claude Royet-Journoud's <i>Les objets contiennent l'infini<\/i> was published in 1983. This is the \"Espace et Poesie conference\" mentioned in <span class=\"wl\" data-note=\"1995-04-11_Perceptual-and-Conceptual-Space\">1995 04 11_Perceptual and Conceptual Space<\/span>.", "img": ["attachments/pages/scan_1995_p072.jpg"]}, "1999-06-15_Grounding-Laisser-les-Gens-Faire": {"t": "Grounding: Laisser les Gens Faire", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["french", "urbanism", "craft", "bricolage"], "pp": ["Melvin Webber"], "body": "<p>Grounding.<br>les vues les plus interesante d'une ville ou un endroit sont <u>imprevus<\/u><br>il est impossible de planifiée toutes les vues de tout les utilisateurs d'un endroit qui font l'image de cette endroit.<br>Laisser les gens faire. Ils ont la meilleur idée de ce qui leur convient.<br>Il faut leur donné les moyens → bricks, connaissance de pouvoir utilisé des materiaux moins chers - contre industrie du service<br>Je peux le faire mieux pour <u>moi<\/u> si je m'occupe de moi, ma maison, ma cuisine.<br>c'est la force qu'on reve que tient l'artiste le manuel, le technitien, il peut faire, il est libre.<br>[Webber, M. - Urbanist.]<\/p>", "notes": "Undated, in blue ink. Melvin Webber was an American urban planner (\"The Urban Place and the Nonplace Urban Realm\", 1964). The ideas echo Dubuffet's \"remettre à chaque citoyen du ciment et une truelle\" in <span class=\"wl\" data-note=\"1998-12-15_Dubuffet-Psycho-Sites-and-the-Hydra\">1998 12 15_Dubuffet Psycho Sites and the Hydra<\/span>.", "img": ["attachments/pages/scan_1997_2_p079.jpg"]}, "1999-06-15_Natures-Laws-Are-Simple": {"t": "Nature's Laws Are Simple", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["epistemology", "simplicity"], "pp": [], "body": "<p>Natures essential laws are simple b/c people chose the simplest explanations to describe something - sometimes different description systems result in simpler descriptions → spherical vs. polar etc coordinates - people could chose more complicated reasons which explain equally well - but don't thus nature seems simple.<br>As a detective is likely to chose the simplest explanation for a few facts. A criminal is protected by a complicated crime.<\/p>", "notes": "Undated. \"crime\" is written below \"complicated\" as the last word.", "img": ["attachments/pages/scan_1997_2_p073.jpg"]}, "1995-01-12_Bachelard-La-Poetique-de-lEspace": {"t": "Bachelard, La Poétique de l'espace", "d": "1995-01-12", "est": false, "w": 1995.0301, "era": "Final Semester Yale 1995", "th": ["french", "reading", "poetry", "imagination"], "pp": ["Bachelard"], "body": "<p>1/12/95 Bachelard <u>La Poetique de l'espace<\/u><br>les causes alléguées par le psychologue et le psychanalyse ne peuvent jamais bien expliquer le charactère vraiment inattendu de l'image nouvelle, non plus que l'adhésion qu'elle suscite dans une âme étrangère au processus de sa création. Le poète ne me confère pas le passé de son image et cependant son image prend tout de suite racine en moi. La communicabilité d'une image singulière est un fait de grand signification ontologique. Nous reviendrons sur cette communion par actes brefs, isolés et actifs. Les images entraînent - apres coup - mais elles ne sont pas les phénomènes d'un entrainement.<br>...<br>l'acte poetique, l'image soudaine, la flambée de l'être dans l'imagination, échappent à de telles enquêtes. Il faut en venir, pour éclairer philosophiquement le problème de l'image poetique, à une phénoménologie de l'imagination. Entendons par là une étude du phénomène de l'image poétique quand l'image émerge dans la conscience comme un produit direct du coeur, de l'âme, de l'être de l'homme saisi dans son actualité. p. 2.<\/p>", "notes": "Passages copied from the introduction to Bachelard's <i>La Poétique de l'espace<\/i> (1957).", "img": ["attachments/pages/scan_1995_p013.jpg"]}, "1995-08-27_Jono-Laughs-Without-a-Sound": {"t": "Jono Laughs Without a Sound", "d": "1995-08-27", "est": false, "w": 1995.6546, "era": "DC, Post-College", "th": ["friendship", "childhood-memory"], "pp": ["Jono", "Dave", "Schwartz"], "body": "<p>8/27 I love when Jono laughs so hard that he makes no sound; he rocks way backwards or forwards in his chair opens his mouth wide &amp; his eyes squint up but he makes no sound at all. I was very happy to go to the Brickskellar last night w/ Dave, Jono &amp; Schwartz - re telling stories from high-school asking a waitress for a beer we used to get, which they haven't had since she <s>was<\/s> has been working there - which we used to get there when we were 16.<\/p>", "notes": "The Brickskeller was a beer bar in Washington DC; Jono is a friend from high school; Dave and Schwartz seem to be high-school friends too.", "img": ["attachments/pages/scan_1995_p093.jpg"]}, "1995-02-09_Heat-Waves-and-a-Mirage": {"t": "Heat Waves and a Mirage", "d": "1995-02-09", "est": false, "w": 1995.1053, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "sound", "light"], "pp": ["Nike"], "body": "<p>2/9<br><code>[sketch: a box-shaped room with a heater high on the left wall (\"heat\"), an air-conditioning unit low on the right (\"A/C unit\") and wavy currents of air between them; an arrow asks \"where are air flows?\"]<\/code><br>match them w/ light<br>talk about ephemeral<br>heat low: A/C high?<br>circular mvt. -<br>plane where heat waves are seen<br>- can one make a mirage? <code>[sketch: a raised flat surface with heat waves rising from it]<\/code> - high surface which is heated A/C on in room. control environment<br><code>[bracketed:]<\/code> - Can Nike #1 sing in my space &amp; find its resonances? make a recording which plays during viewing?<\/p>", "notes": "\"Nike #1\" is not identified; it may be a person or a group.", "img": ["attachments/pages/scan_1995_p030.jpg"]}, "2005-03-21_Scripted-Phone-Play-Dial-og": {"t": "Scripted Phone Play: Dial-og", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["technology", "communication", "play", "project-list"], "pp": [], "body": "<p>→ You get a call w/ a statement - you can respond to it.<br>→ You may get a response back in another phone call.<br>- more personal than email. More direct -<br>- scripted phone play - spread over time<br>low barrier to entry - just a phone call<br>If you would like to respond to this comment now please press [1] if you would like to respond later call 1800... and type extention [123] → voice mailboxes. - looking for fish to bite.<br>dial-a-skeptic. don't want shout outs, discussion of popstars_ closer to Eliza - \"How are you?\" \"What's the matter?\"<br>dial-log <code>[boxed:]<\/code> dial-og<br>dia-log<br>dial-og<br>If you would like to respond and continue this discussion press [1] goes back to original poster. If you would like to start a new comment<\/p>\n<p><b>At the foot of the next page:<\/b><\/p>\n<p>Press [2] If you are done w/ this conversation please Press 3<\/p>", "notes": "Undated; it belongs with the dialog project on the next page, which is tabbed \"New start. Mar 21 2005\", so it takes that date as an estimate. ELIZA is Joseph Weizenbaum's 1966 chatbot therapist. The last line, at the foot of page 84, is partly cut off by the scan.", "img": ["attachments/pages/scan_1997_2_p083.jpg", "attachments/pages/scan_1997_2_p084.jpg"]}, "1995-02-05_Roof-Top-Mirror-Floor": {"t": "Roof-Top Mirror Floor", "d": "1995-02-05", "est": true, "w": 1995.0943, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "mirrors", "sky"], "pp": ["Van Altima"], "body": "<p><u>Roof-top<\/u>: <u>mirror floor<\/u>. <u>blank<\/u> <u>walls<\/u> which block your view of the city and that <s>[?]<\/s> capture the changing light.<br>- the walls could have light comming through them or cast across them - I might not be able to have light at all → no electricity<br><u>grid<\/u> - somehow mapping your perception of space making a <s>[?]<\/s> unit of measure<br><u>Scrims<\/u> - on many roof tops -<br>steel rods connected w/ rope <code>[circled:]<\/code> welded? → doubtful how to get up there? or to weld up there<br><code>[sketch: an open frame of rods over a square, labelled \"mirror tile grid\", with guy ropes running out to stakes]<\/code><br><code>[sketch: the same frame from above, a square labelled \"white\" with ropes running out from its corners]<\/code><br><code>[sketch: a long box with a figure lying on a sheet in the middle and its mirror image below, dotted, labelled \"reflection\"]<\/code><br><code>[sketch: a cubic frame on a base, labelled \"particle board / white walls\", \"sitting / standing hole\", \"TP roof\", \"4×4\", \"mirror world\", \"plywood floor\", \"entrance through Tunnel underneath\", \"8ft\" on two sides, \"cube = neutral space\", \"lights shine through a gap btw mirror &amp; wall\", and a compass: \"orient: E, S, W, N (?)\"]<\/code><br>- mirrors like kerns.<br><code>[sideways:]<\/code> 120 min 270 slides<br><code>[in a loop:]<\/code> <u>Talk to Astro guy<\/u>. Van Altima<\/p>", "notes": "Undated; it follows the 2/5 entry after a rule. These are plans for the rooftop piece on the A&amp;A building (see <span class=\"wl\" data-note=\"1995-01-29_Infinitely-Deep-Box-and-the-AandA-Roof-Piece\">1995 01 29_Infinitely Deep Box and the AandA Roof Piece<\/span>). \"TP roof\" is probably a toilet-paper roof, as in <span class=\"wl\" data-note=\"1995-01-22_Toilet-Paper-Mirrors-and-the-Platonic-Theory-of-Sight\">1995 01 22_Toilet Paper Mirrors and the Platonic Theory of Sight<\/span>. \"kerns\" may mean cairns. The \"Astro guy\" is probably the Yale astronomer William van Altena; the name is written \"Van Altima\".", "img": ["attachments/pages/scan_1995_p029.jpg"]}, "1994-06-15_Letter-to-Edo-Part-2-Yale-and-Individuation": {"t": "Letter to Edo (Part 2 — Yale & Individuation)", "d": "1994-06-15", "est": false, "w": 1994.455, "era": "Yale, New Haven", "th": ["brotherhood", "yale-culture", "risk-taking", "individuation"], "pp": ["Edo", "Mom"], "body": "<p>Question everything, which is so in your nature it sounds silly to tell you this—I have learned from you to question many things I may have taken for granted.<\/p>\n<p>I get slammed every day at Yale—that's how I'm learning. Let yourself get slammed, admit that you have been slammed in front of a huge crowd and fucked up even though you were trying your hardest. Know that you did the best you could, and sucked. It doesn't mean you suck. Find out why people thought you sucked and you learn more, quicker, than any other way. It's very easy to convince yourself, with any group of people that love you or are your friends, that you are great.<\/p>\n<p>Someday I hope that whatever decision you make in your life, you would be able to come back to anyone that thought you were doing the wrong thing and prove that they were wrong—to show them up, whoever they are.<\/p>\n<p>Mom objects to drugs. You choose to use them for whatever reasons—they make you happy, more receptive to music. Prove to Mom that it's your right decision. It's not going to happen if you hang around burnouts... Believe me, you are so fucking smart you surprise me. I would count you smarter, more perceptive, and more constantly thinking than 90% of the people at Yale. Why would Yale not accept you? Believe me, it's not that you couldn't handle it.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p028.jpg", "attachments/pages/scan_1994_1_p029.jpg"]}, "1998-08-01_Write-Essays-Offerings-Vacuum-Cube": {"t": "Write Essays; Offerings; Vacuum Cube", "d": "1998-08-01", "est": true, "w": 1998.5833, "era": "Paris, Beaux-Arts", "th": ["project-list", "writing-process", "sculpture-ideas", "japan"], "pp": ["Andy Goldsworthy"], "body": "<p><code>[in red-brown ink:]<\/code> 1) write essays.<br>- bricoleur<br>- space<br>&gt; shorter less pretentious things.<br>___<br>(Balinese) Offering - Andy Goldsworthy traditionalised layering / vertical planes / repitition<br>___<br>Hゆか[?]は とても あいらしい です ね<br>___<br>My Art history ↺<br>___<br>Vaccum <u>cube<\/u> <code>[sketch: a glass cube joined by a tube to a \"pump\"]<\/code> → Black box exp.<br><u>creation<\/u><\/p>", "notes": "Undated. The essay topics are the bricoleur (<span class=\"wl\" data-note=\"1998-08-01_Bricoleur-Levi-Strauss\">1998 08 01_Bricoleur Levi Strauss<\/span>) and space. The Japanese line reads roughly \"H-yuka wa totemo airashii desu ne\", \"H-yuka is very lovely, isn't she\"; the name and its first character are uncertain, and は is written over a crossed-out kanji.", "img": ["attachments/pages/scan_1997_2_p006.jpg"]}, "1997_p019_Max-Spatialisation-et-Modeles-Physiques": {"t": "Max, spatialisation et modèles physiques", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["sound", "computer-music", "spatialisation", "french", "coursework"], "pp": ["Giovanni Gabrieli", "John Chowning"], "body": "<p><u>Max<\/u> - gestion des evenements midi dans le temps<br><code>[sketch: a clock-like diagram: four small squares around a centre, two hands, tick marks around the edge and a dotted arc]<\/code><\/p>\n<p><b>Next page, below the line:<\/b><\/p>\n<p>Gabrielli eglise St.Mark. à Venise<br>Chowning (197?)<br><code>[sketch: four triangles (loudspeakers) at the corners of an X, a sound source at the centre]<\/code><br>panpot = 4 fonce[?] déphasés 90°<br>Dist = r<br>gain = 1/r<br>gain reverb = 1/√r² ?<\/p>\n<p>physical approach<br>modèle l'espace.   coef.<br>Spatialiser → perceptual<br>source.   spaçialisateur s'adapte.<\/p>\n<p>Modèle physique - Interface textuelle.<br>cord - 40 harmonique modes w/ 40 mode shapes<br>young - change l'harmonicité de la corde dans les hautes harm.<br>2 objets en movement.   Objets, connections, controlleur<\/p>", "notes": "Notes from a class on computer music, probably at IRCAM: Max (the patching software), sound spatialisation (Gabrieli's antiphonal choirs at St Mark's, Chowning's moving sound sources in the 1970s) and physical-model synthesis (\"objets, connections, controlleur\" is how Modalys describes an instrument; \"young\" is Young's modulus). The year after Chowning is unclear.", "img": ["attachments/pages/scan_1997_p019.jpg", "attachments/pages/scan_1997_p020.jpg"]}, "2005-03-21_Rothko-Sized-Photographs-with-Call-In-Audio": {"t": "Rothko-Sized Photographs with Call-In Audio", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["photography", "installation", "communication", "project-list"], "pp": ["Mark Rothko", "Robert Whitman"], "body": "<p>New project → Rothko sized photographs: <s>[?]<\/s> and audio from the place - any one can call in a report on the conditions<br>ref: Robert Whitman -<br><code>[sketch, in blue: a tall panel under a hanging lamp, with a figure standing beside it for scale, and a second panel seen at an angle]<\/code><\/p>", "notes": "Undated, about 2005. Robert Whitman's <i>Local Report<\/i> (2005) had people phone in reports from around a place, which may be the reference. The rest of the page is blank.", "img": ["attachments/pages/scan_1997_2_p089.jpg"]}, "1994-07-31_Mortality-Andre-Diard-and-Tignes": {"t": "Mortality, André Diard & Summers in Tignes", "d": "1994-07-31", "est": false, "w": 1994.5822, "era": "Summer 1994, Travel and Alps", "th": ["mortality", "memory", "tignes", "childhood-summers", "flight"], "pp": ["André Diard", "Richie", "Laurent", "Mr. Pèremezelle", "Mom"], "body": "<ul><li>This journal and any art possibly can be seen as a fight against death. I want to maximize my time before death—do the most w/ my life &amp; thoughts, &amp; possibly leave something worthwhile behind.<\/li><\/ul>\n<p><b>7/31/94<\/b>  <br>André Diard died this winter. He was a key figure in the town of Tignes and a fixed memory since he ran the rental of our apartment at Les Chaudes Almes. I will always remember being on the American team golfing into the inflatable baby pools anchored off the dock of Le Terrachu <i>(name of the almost lost dialect of the region)<\/i>. His ringing voice (and laugh), his sharply pointed eyebrows &amp; permanent dark tan will never be completely gone.<\/p>\n<p>I remember how sad we were when the Diards gave up running Le Terrachu. All the wonderful nights we had spent there (and delicious dinners we had been served) would be a memory. Our summers were never quite the same, but we would still see the Diards now and then and Mr. Diard would ring out w/ <i>\"Salut les Américains\"<\/i> and always have a chum(b)ly relationship w/ Richie.<\/p>\n<p>As we were coming up the stairs just now I mentioned my plane flight last summer w/ Laurent's Dad (Mr. Pèremezelle(?)). <i>\"I never went up w/ André,\"<\/i> Mom said—Mr. Diard took passengers for sight-tours in his small 4-seater. <i>\"That is something I will always regret...\"<\/i><\/p>", "not
