n line with this type of effect—his Roden Crater is not so much about leaving his mark on the landscape as it is about bringing the viewer to experience the landscape's magical properties. Heizer is scarring the landscape, leaving his mark like a circle in the desert made with a motorcycle track.<\/p>\n<p>I remember a quote by action/adventure photographer Galen Rowell, something like: <i>\"Go into nature, leave it untouched, return with nothing\"<\/i>—only taking a fraction of a second's worth of light. As Calvino wrote in <i>Invisible Cities<\/i>: <i>\"Memories' images, once they are fixed in words, are erased.\"<\/i><\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p129.jpg", "attachments/pages/scan_1994_1_p130.jpg"]}, "1997_p007_Trace-Other-Paths-from-Paris": {"t": "Trace Other Paths from Paris", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["maps", "urbanism", "social-art", "paris"], "pp": ["William Wordsworth", "Princess Diana"], "body": "<p>Trace other paths from Paris.<br>map to fill in areas.<br>→Urbanists look/follow growth development<br>→one could use these techniques to look @ the opposite.<\/p>\n<p><code>[right: → Book on <u>Social<\/u> consciousness in art → <u>1780's<\/u> - Wordsworth - Lithography]<\/code><\/p>\n<p>→ Lady Di &amp; the lepers, aids patients<br>→use of monarchy bring light to a subject, artistic,<\/p>", "notes": "", "img": ["attachments/pages/scan_1997_p007.jpg"]}, "2005-03-21_New-Start-the-Dialog-as-a-Learning-Process": {"t": "New Start: the Dialog as a Learning Process", "d": "2005-03-21", "est": false, "w": 2005.2215, "era": "New York 2005", "th": ["language", "writing-process", "technology", "project-list"], "pp": [], "body": "<p><code>[a blue sticky tab at the top right:]<\/code> New start. Mar 21 2005.<br>- a dialog is actually a brilliant way of structuring a learning process. In pre-literate socratic times this would be obvious. but today w/ book based literacy so fundamental to much of the educative process the power of the dialog is not so obvious.<br>___<br>The other strength of the dialog is that not everything must be expressed some <code>[above:]<\/code> can be simply implied, perhaps the two characters have understood but has the audience?<br>___<br>Problem is really that the reader of a dialog is a 3rd person who has no place really. A fly on the wall a hopeless outsider.<br>___<br>dialog project - each person gets only their part to read a kind of karaoke - lights up when it is your turn to read - [cell phone radio play.]<br>___<br><code>[bracketed:]<\/code> People talk at the same time - emptiness btw. words - meaning btw the cracks. Dialog btw all my journal notes? → Text-to speech? ← cell phone - blog -<\/p>", "notes": "The sticky tab \"New start. Mar 21 2005\" marks Marco taking the notebook up again after a gap of several years. The phone-menu note <span class=\"wl\" data-note=\"2005-03-21_Scripted-Phone-Play-Dial-og\">2005 03 21_Scripted Phone Play Dial og<\/span> belongs to the same project; its last line is at the foot of this page.", "img": ["attachments/pages/scan_1997_2_p084.jpg"]}, "1995-10-01_Labeling-an-Office-Building": {"t": "Labeling an Office Building", "d": "1995-10-01", "est": true, "w": 1995.75, "era": "DC, Post-College", "th": ["installation", "signs", "observation"], "pp": [], "body": "<p>10/1 I think of labeling a building, an office building whose spaces and aspects pass numbly before the eyes of the workers who enter it every day - simple literal signs.<br>\"Un painted door w/ delicate wood grain patterns.<\/p>", "notes": "The date reads \"10/1\", but the entries around it are from February and March 1995 (2/12 before, 2/21 two pages later), so it was probably written on 1 October 1995 (the date of the last entry, <span class=\"wl\" data-note=\"1995-10-01_Something-So-Easy-About-Painting\">1995 10 01_Something So Easy About Painting<\/span>) in a space left blank in February; the year is estimated. It follows on from the idea of labelling the fence in <span class=\"wl\" data-note=\"1995-02-12_Showing-a-Work-I-Didnt-Build\">1995 02 12_Showing a Work I Didnt Build<\/span>.", "img": ["attachments/pages/scan_1995_p035.jpg"]}, "1998-12-15_Crack-of-Sky-in-a-Sky-Map-and-Triangulations": {"t": "Crack of Sky in a Sky Map, and Triangulations", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["sky", "maps", "photography", "project-list"], "pp": [], "body": "<p><code>[sketch: a circular sky map with a grid of lines converging upward, a large black wedge (the building) cutting into it from the top right, and two small doorways at the edges]<\/code><br>- here it is that small crack of sky in a sky map.<br>- but so many stars even for Paris I was impressed.<br>- This is just what I have been developing w/ photography for the last few years<br>- I was thinking of small LED's in the photos near <s>[?]<\/s> where the people make triangulations. - like some subway maps that light up your journey.<br>- puddle pictures. &amp; still life photos which make very clear where the lense is physically w/ respect to the other objects. - Triangulations w/ lights?<br>- Marouflage de papier sur medium.<br>- drawing w/ video -<\/p>", "notes": "Undated; follows the \"crack of sky between the buildings\" in <span class=\"wl\" data-note=\"1998-12-15_The-House-Makes-Noise-and-Silent-Clouds\">1998 12 15_The House Makes Noise and Silent Clouds<\/span>. <i>Marouflage<\/i> is mounting paper or canvas onto a support, here MDF (\"medium\").", "img": ["attachments/pages/scan_1997_2_p061.jpg"]}, "1998-12-15_The-House-Makes-Noise-and-Silent-Clouds": {"t": "The House Makes Noise, and Silent Clouds", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["sound", "sky", "clouds", "observation"], "pp": [], "body": "<p>I woke up very early this saturday morning. I heard some noises I guess and thought some one was trying to steal our bikes. The house makes so much noise when there is no other noise, the doors squeak the floor <s>squeaks<\/s> creaks. Even when I am not moving in the cold outside looking up at <s>[?]<\/s> the stars through a crack of sky between the buildings I can hear the tings of metal expanding as the morning warms it slightly and of course I can hear the whole building sleeping.<br>Some of the magic of clouds is that they make no noise even when moving very swiftly.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>- What noise the Eiffel Tower must make as all that metal expands with the morning.<\/p>", "notes": "Undated; a Saturday morning in winter. The rest of page 60 is blank (the writing showing through is page 59).", "img": ["attachments/pages/scan_1997_2_p059.jpg", "attachments/pages/scan_1997_2_p060.jpg"]}, "1994-07-27_Hull-Studio-Visit-Two-Hour-Paintings-and-Hanging-Site": {"t": "Hull's Studio Visit, 2-Hour Paintings & Hanging 3D Site Idea (7/27)", "d": "1994-07-27", "est": false, "w": 1994.5712, "era": "Yale, New Haven", "th": ["painting-practice", "critique", "time-limits", "installation", "3d-space"], "pp": ["John Hull", "Frank Auerbach", "Robert Lytle"], "body": "<p><b>7/27<\/b> <i>got a new pen @ Charette!<\/i><\/p>\n<p>Hull came to see my paintings today. I was a little disappointed. He still likes a long skinny one I did from the model in 50 mins. He mentioned seeing the artist's excitement in the paint. I haven't been able to convert [above: <i>convey<\/i>] my excitement of the landscape into paintings that are exciting. He suggested &amp; I'm definitely going to do it, limiting my time say to 2 hrs. &amp; knowing I am going to make one 2hr painting a day for 2 weeks - or the whole time I'm in France. I hope being w/ my family won't curb my activity, but I'm sure it will.<\/p>\n<p>He mentioned Frank Auerbach who repaints the whole image every day he approaches it again.<\/p>\n<p>I had a vision while Hull was talking to me of making a huge free painting then on another day going in w/ life &amp; excitement to get one part of the painting much more carefully detailed. Something would have to be going on between the free &amp; the detailed so that the image wouldn't fall apart. Also, I thought of all the paintings I have seen within the larger landscapes I did or all the paintings that can be found in a particular sight [above: <i>site<\/i>] <code>[staple canvas to big board. For the smaller paintings, make them on new pieces of canvas stapled on]<\/code>.<\/p>\n<p>I could recreate that site w/ multiple still images until I had created a 3 dimensional view of it. I could hang the boards on fishing wire in appropriate spots to create a space (of different snapshots, w/ my different moods &amp; the changing weather) over a specific period of days. That way the many quick images which could quickly become junk, could hold together in some larger whole.<\/p>\n<p>2-sided boards could most easily be viewed hanging from the ceiling. I like this better than on a pedestal like a sculpture.<\/p>", "notes": "<i>(Left margin annotation, arrow to \"2 hrs.\"):<\/i> <code>(I forgot about this &amp; made paintings that were too long in Lytle's class.)<\/code>", "img": ["attachments/pages/scan_1994_2_p005.jpg", "attachments/pages/scan_1994_2_p006.jpg"]}, "1994-08-04_Giotto-Picasso-on-Resemblance-and-Drawing-a-Circle": {"t": "Giotto, The Ambassadors & Picasso on Drawing a Perfect Circle", "d": "1994-08-04", "est": false, "w": 1994.5916, "era": "Summer 1994, Travel and Alps", "th": ["arnheim", "picasso", "illusion", "anamorphosis", "personality", "signs"], "pp": ["Giovanni Boccaccio", "Giotto", "Zeuxis", "Pliny", "Rudolf Arnheim", "Pablo Picasso", "Hans Holbein"], "body": "<p>Observations from Boccaccio, perspective viewing angles, and Arnheim (<b>pp. 137–138<\/b>, leading directly into page 104):<\/p>\n<ul><li><code>[Boccacio's Decameron(e) speaks of Giotto - highly stylized = super reality -&gt; like Zeuxis story of grapes in Pliny.]<\/code><\/li><li>Reflects on how a 2D painting hanging on a wall among 3D objects depicts 3D space yet remains flat—even viewed from sharp angles, the rectangle warps (<code>[4 trapezoid/parallelogram sketches]<\/code>) without forming composite spatial depth: <code>Take photographs of paintings from sharp angles to get warped images — like \"Ambassadors\"<\/code>.<\/li><li><b>Arnheim, p. 137 (cultural style &amp; illusion):<\/b> Summarizes Arnheim's note that actual illusions are rare mainly because each culture perceives its own familiar style of representation directly as a faithful reproduction of the object.<\/li><li><b>Picasso (1966 / p. 138):<\/b><\/li><li>Notes Picasso's 1966 remark that he aims at resemblance—observing nature while never confusing it with painting, since nature is translatable into painting only <i>\"by signs.\"<\/i><\/li><li>Notes Picasso's advice on striving for perfection: try to draw a perfect circle and the involuntary flaw reveals your personality, whereas trying deliberately to draw an imperfect, personal circle bungles the whole thing (<code>- p. 138<\/code>). <i>(Leads directly to Arnheim p. 138 on originality vs. personal style on notebook page 104.)<\/i><\/li><\/ul>", "notes": "", "img": ["attachments/pages/scan_1994_2_p046.jpg"]}, "1995-02-12_A-Vehicle-to-Perceptual-Moments-Prioritize": {"t": "A Vehicle to Perceptual Moments; Prioritize!", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["perception", "installation", "studio-practice", "project-list"], "pp": [], "body": "<p><s>I am trying to capture<\/s><br>I feel that the most exciting visual effects I would notice while painting are ones which lose their effect in a representation. I am trying to recreate or capture or simply frame these actual visuals in a way where they can become accessible to my viewer<br><code>[bracketed:]<\/code> I am not so interested in objects as I am in the relationships between them - How different colored lights mix in their shadows. how light reflects through different surfaces.<br>I want to become a vehicle for the viewer to these perceptual moments.<br><u>PRIORITIZE!<\/u><br>I need major documentation - photographs &amp; sketches not of the pieces as much as of the data I want<br>I should photograph the fence - prepare the \"frame\"<br><u>mental path = frame<\/u> for fence piece - (fleeting purple)<br>- I give my viewers a map.<br>- either the least egotistical or the most egotistical thing an artist can do.<br>- take pictures from the roof of A&amp;A &amp; finish a drawing<br><u>complete a proposal<\/u> - which can be included in the show even if I do not build it<br>- my affinity for conceptual art meets my love of nature &amp; visuals.<br><code>[bracketed:]<\/code> I should make the T.M. box w/ the light as a demo - the switch pull makes the effect. → <u>miniature<\/u><\/p>", "notes": "Undated; it follows the 2/12 entries. The fence piece is <span class=\"wl\" data-note=\"1995-02-12_Fleeting-Purple\">1995 02 12_Fleeting Purple<\/span>. \"T.M. box\" is not explained; it may be the toilet-paper-and-mirror piece of <span class=\"wl\" data-note=\"1995-01-22_Toilet-Paper-Mirrors-and-the-Platonic-Theory-of-Sight\">1995 01 22_Toilet Paper Mirrors and the Platonic Theory of Sight<\/span>.", "img": ["attachments/pages/scan_1995_p033.jpg"]}, "1995-03-12_Space-Is-More-Primary-Than-Light": {"t": "Space Is More Primary Than Light", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "light", "space", "project-list"], "pp": ["Steve", "Nauman"], "body": "<p>- build a window around the window.<br><code>[sketch: a tall box frame with a small round light at the top]<\/code><br><code>[sketch: a door-like frame with a cross-hatched scrim in its upper half and a small switch at the side]<\/code> - light scrim: click the switch &amp; you can see through.<br>need a bulb w/ ↓ color intensity v. warm for highest contrast<br><code>[sketch: a narrow tapering shape on a stand]<\/code> I wonder what night time colors will look like?<br><code>[sketch: a tall box draped in cloth]<\/code> ← free standing behind a black curtain<br><code>[written at an angle, above the list:]<\/code> - wierd to think which is most powerful. it really depends on the moment. <s>[?]<\/s> In what terms are you thinking them<br>1) mirror box<br>2) Pipe box → cement w/ tubes<br>3) large map w/ sun tracing ↳ roof stand.<br><code>[circled:]<\/code> 4) window pre-fab<br><code>[boxed, with two arrows up to it:]<\/code> space under my chair -<br>Space is more primarly than light -<br>at most light comes from the sun which we can concieve of circling around the earth - we can map it. Space, however, is inconcievably enourmous. <s>[?]<\/s> There is only space really if one could leave <s>the<\/s> our solar system<br>I want to present my light <code>[an arrow to \"weight\", written above]<\/code> ephemeral infinite space<br><u>low<\/u> so you have to lean over it<br><code>[sketch: a man bending over a waist-high box, his hand on top; labels \"maybe lower\", \"waist high. lean over it to click the switch\"]<\/code><br><code>[sketch: a small box raised high, with lines of sight running up to it from four sides; labels \"eyelevel: so you can peer inside it\" and \"high\"]<\/code><br>- what about Steve's idea ← opposites in a way → \"space under my chair\"<br><code>[sketch: a tall frame with a lamp at the top, hung with scrims]<\/code> - what is it about looking through these scrims?<\/p>", "notes": "Undated. The four numbered pieces seem to be the plan for the thesis show. \"space under my chair\" is Bruce Nauman's cast, as in <span class=\"wl\" data-note=\"1995-03-12_Box-Crate-Sketches-Solitaire-Solidaire\">1995 03 12_Box Crate Sketches Solitaire Solidaire<\/span>. Steve's idea is not described here.", "img": ["attachments/pages/scan_1995_p059.jpg"]}, "1994-06-26_Rooms-Mirrors-and-Installation-Concepts": {"t": "Thoughts During a Reading of *Languages of Art*", "d": "1994-06-26", "est": false, "w": 1994.4852, "era": "Yale, New Haven", "th": ["sculpture", "installation", "perception", "mirrors", "space"], "pp": ["Nelson Goodman"], "body": "<p>Make a room, or set of walls with openings—make them nicely with drywall, sharp corners, putty, painted. Surround each opening with a picture frame (only on one side). Could I use one-way mirrors? From one side people make their own image; from the other they see the same.<\/p>\n<p>My other idea: a box, a setup still life (with Playmobil?). Two openings in the box: on one end have a picture frame with an empty opening inside to see the actual setup; from the other, have a photograph of the setup from that side. <\/p>\n<p>What about two-way mirrors, one on each side with the mirror side facing inwards? How about an entire box with all sides made with one-way mirrors facing inwards—you see an infinite space of which you are not a part. Could I put an object inside these reflections? Another form of infinity: a frame, painting of a frame, of a photograph of a framed painting of a photograph.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p080.jpg"]}, "1998-12-15_Dewey-Personal-Medium-and-Science-States-Meanings": {"t": "Dewey: Personal Medium, and \"Science States Meanings\"", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["reading", "art-theory", "photography", "representation"], "pp": ["John Dewey"], "body": "<p>\"If literal reproduction is signified by \"representative\" the the work of art is not of that nature, for such a view ignores the uniqueness of the work due to the personal medium through which scenes and events have passed. -<br>working on the camera and the way in which it represents is <s>[?]<\/s> is important even if the final product is flat.<br>___<br>- <s>express ultimate<\/s><br>- Science states meanings; art expresses them. p. 84<\/p>", "notes": "Undated. Both quotations are from John Dewey, <i>Art as Experience<\/i> (1934), which Marco was reading in <span class=\"wl\" data-note=\"1998-12-15_Dewey-Stevens-and-Drawing-in-Perspective\">1998 12 15_Dewey Stevens and Drawing in Perspective<\/span>.", "img": ["attachments/pages/scan_1997_2_p055.jpg"]}, "1997_p015_Song-of-Myself-Fragments-Smashed-by-Proximity": {"t": "Song of Myself: Fragments Smashed by Proximity", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["poetry", "collage", "fragments", "simultaneity", "recording"], "pp": ["Walt Whitman"], "body": "<p>Song of Myself. - W Whitman.<br>① → grouping by association<br>② → one <s>does not<\/s> is not used to each sentance being in a completely different place ____\"____ fragments are smashed into a relationship by proximity<br>- somewhere between these two impulses lies the power of this technique. The simultaneity he is appropriating<\/p>\n<p>Explanation w/in the piece, undifferentiated from other elements <s>[?]<\/s> in it.<\/p>", "notes": "Goes with the recording project on p. 13 (\"Song of myself at diff times, in different places\"). The last sentence is in a different pen.", "img": ["attachments/pages/scan_1997_p015.jpg"]}, "1998-10-15_Experiencing-Place-Public-Art-To-Do-in-Japan": {"t": "Experiencing-Place Public Art; To Do in Japan", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["public-space", "project-list", "japan", "technology", "sound-art"], "pp": ["Miki", "Tanaka", "Akemi"], "body": "<p>I've been thinking about experiencing place type public art pieces -<br>→ DVD rom - internet search<br>I - buy MD w/ cravate mic <code>[underlined:]<\/code> audio tech - spinning noises - motors<br>→ <s>Nikon<\/s> 500mm ?<br>→ ask about <u>video synch. piece<\/u> → Miki, Tanaka<br>- need list of names of Jap. photographers to lookup @ Musabi<br>- old woman in the street - 2 canes - 4 steps - she's in another world.<br>- whole (tibania sleeps...) &amp; <u>Max programs<\/u> for demo<br>- buy <u>O'Reilly<\/u> computer program guides. (not in Japan) C, C++, Java, Lisp.<br>→ double video → <u>ask Tanaka san<\/u>.<br><code>[boxed:]<\/code> - sound of breathing MD on Akemi<br>↳ other sounds? mix on camera w/<br>- Statistics &amp; brownian motion - such a key part of experimental physics.<\/p>", "notes": "Undated; written in Japan. \"Musabi\" is Musashino Art University in Tokyo. \"MD w/ cravate mic\" is a MiniDisc recorder with a tie-clip microphone. The sound-of-breathing idea goes back to the acoustic dome of July 1995. \"tibania sleeps\" is unclear. Miki and Tanaka are not identified.", "img": ["attachments/pages/scan_1997_2_p016.jpg"]}, "1995-07-23_Surprise-Flashes-Picabias-570-Spotlights": {"t": "Surprise Flashes; Picabia's 570 Spotlights", "d": "1995-07-23", "est": true, "w": 1995.5603, "era": "DC, Post-College", "th": ["installation", "light"], "pp": ["Picabia"], "body": "<p>random pattern of suprise flashes un-expected violent &amp; gone before the viewer can figure out what happened.<br>hide wall of watt-age behind scrim or black cloth glued onto plexiglass w/ acrylic medium → hard<br>Picabias 570 spot-lights → Flood/Shock of light<br>Éblouisant.<br><code>[sketch: an empty square]<\/code><\/p>", "notes": "Undated; between the July 23 and 7/25 entries. Francis Picabia's set for the ballet <i>Relâche<\/i> (1924) was a wall of some 370 metal reflectors with bulbs, which dazzled the audience; \"570\" may be a misremembered figure.", "img": ["attachments/pages/scan_1995_p090.jpg"]}, "1995-01-17_A-New-Essentialism": {"t": "A New Essentialism", "d": "1995-01-17", "est": false, "w": 1995.0438, "era": "Final Semester Yale 1995", "th": ["art-theory", "light", "observation"], "pp": ["Diebenkorn", "Turrell"], "body": "<p>1/17 I think that I will come up w/ a new type of essentialism, \"convert them or fuck them\" - who cares. If they don't see it, then that's their <s>[?]<\/s> tough. In the fine line of Diebenkorn, Turrell.<br>I write this on the metal steps of Hammond Hall where the sun has just pierced a cloudy sky making 2 telephone wires very red, a van electric green and a couple houses wonderfully bright against the dark sky.<br>I accept exceptions. I just don't concern myself w/ them.<\/p>", "notes": "A reply to the previous day's lecture on essentialism, <span class=\"wl\" data-note=\"1995-01-16_Art-Major-Meeting-Essentialism\">1995 01 16_Art Major Meeting Essentialism<\/span>. Hammond Hall is a Yale building on Mansfield Street.", "img": ["attachments/pages/scan_1995_p017.jpg"]}, "1995-01-29_In-Love-with-Katherine-and-the-World": {"t": "In Love with Katherine, and the World", "d": "1995-01-29", "est": true, "w": 1995.0767, "era": "Final Semester Yale 1995", "th": ["katherine", "love", "travel"], "pp": ["Katherine"], "body": "<p>I am in love w/ katherine. Her memory will have a stronger place in my mind than anyone else I have ever met yet the excitement of visiting the world is too much to keep me grounded.<\/p>", "notes": "Undated, in a different pen from the 1/29 entry above it.", "img": ["attachments/pages/scan_1995_p026.jpg"]}, "1999-06-15_Yagi-Antenna-Drawing-and-Pictures-in-a-Box": {"t": "Yagi Antenna Drawing, and Pictures in a Box", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["drawing", "photography", "project-list", "tignes", "technology"], "pp": [], "body": "<p>→ large drawing of YAGI Antenna. charcoal on heavy paper<br>→ color copies of tignes Radio antenna.<br>→ maybe other pictures in a box <code>[sketch: a grid of small squares, the top-left and bottom-right ones blacked in, with arrows running along each row and a loop from the end back to the start; the bottom-right one labelled \"important ground maybe\"]<\/code><br><code>[sketch: a small grid of squares, some of them tumbling out of place]<\/code><br><code>[in blue ink, with an arrow up to the grid:]<\/code> do this &amp; Japan plant picture quickly.<\/p>", "notes": "Undated. A Yagi antenna is the common directional TV or radio aerial. \"tignes Radio antenna\" is probably a photo from Tignes, where Marco spent time in the Alps. The Japan \"plant picture\" may be the industrial-plant photographs pasted in earlier (<span class=\"wl\" data-note=\"1998-10-15_Pasted-Photographs-Fences-and-Rooftops\">1998 10 15_Pasted Photographs Fences and Rooftops<\/span>).", "img": ["attachments/pages/scan_1997_2_p077.jpg"]}, "1994-06-09_Retrospective-Annotation-on-Letter-to-Edo": {"t": "Retrospective Annotation on Letter to Edo (June 9, 1999)", "d": "1994-06-09", "est": false, "w": 1994.4386, "era": "Yale, New Haven", "th": ["retrospective-self", "individuation", "poetic-imagination"], "pp": ["Edo", "Katherine", "Cy Twombly", "Jackson Pollock", "Immanuel Kant", "Friedrich Schiller"], "body": "<p>This page has become really problematic. There are very few pages in this book where I really have no idea what I was thinking about, but this is one. The throes of passion or pain had thrown me to rather illogical conclusions.<\/p>\n<p>After having thought beyond the Kant/Schiller universals - I realize the importance of seeing these things as specific to individuals—you respect that person more by trying to discover their particular experience, than by simply assuming theirs is the same as yours. The mechanisms may be the same, we are all humans, but all with very different experiences; those that mean the most are the most personal. <i>(See page 52 about my change of heart over Twombly and Pollock—coming to understand what they are doing and grow to repsect and admire it even if it is originally very alien. I am growing to love<\/i><\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p030.jpg"]}, "1995-01-26_Croce-and-the-Undiscussable": {"t": "Croce and the Undiscussable", "d": "1995-01-26", "est": false, "w": 1995.0685, "era": "Final Semester Yale 1995", "th": ["art-theory", "criticism", "communication"], "pp": ["Arlene Croce", "Cage", "Duchamp"], "body": "<p>1/26 - we talked about Arlene Croce's \"Discussing the Undiscussable\" NYorker Jan 5 '95 In sculpture all day yesterday. I think that it is quite interesting to <s>compare<\/s> discuss in referance to the art is a <s>[?]<\/s> satellite idea. When Cage or DuChamp remove the <s>viewer<\/s> artist from the work of art. The viewer can 'not care' and nothing exists. Croce removes the viewer from a work which is all artist - she questions whether there is work (art) there at all.<br>I like the belief that art is about communication, the artist convey's his feelings hoping to hit a resonance. Is a comedian an artist? He has an instant acceptance gauge - laughter.<br>Can the audience be considered crippling to the true artist? I think the artist should have an audience in mind. He can pick the one he wants. → lover, friend, Muse <code>[a wavy line under \"true\"; an arrow from \"mind.\" leads to a question mark]<\/code><\/p>", "notes": "Arlene Croce's \"Discussing the Undiscussable\" appeared in <i>The New Yorker<\/i> at the turn of 1994–95; in it she declined to review Bill T. Jones's <i>Still/Here<\/i>, calling it \"victim art\".", "img": ["attachments/pages/scan_1995_p024.jpg"]}, "1994-12-28_Inside-Cover-Addresses-and-Contacts": {"t": "Inside Cover: Addresses and Contacts", "d": "1994-12-28", "est": true, "w": 1994.9906, "era": "Final Semester Yale 1995", "th": ["address-book", "light", "installation"], "pp": ["Katherine", "John Shozawa", "Turrell", "Dan Graham", "Robert Irwin", "Michel Verjux", "Julien Laverdiere", "Jesse Kline", "Neil White"], "body": "<p><s>- katherine @ Vancouver<\/s><br><s>1-(604)-322-7494<\/s><br><code>[boxed, crossed through:]<\/code> <s>c/o John Shozawa<\/s><br><s>7475 Alberta St<\/s><br><s>Vancouver BC<\/s><br><s>V5X-2Y3<\/s><\/p>\n<p><code>[top right:]<\/code> Please Return to:<br><s>Marco Scoffier<\/s><br><s>Apt. A3<\/s><br><s>318 Elm Str<\/s><br><s>New Haven CT<\/s><br><s>06520[?]<\/s><br><s>(203)562 7452<\/s><br>3111 Idaho Ave NW<br>Wash. DC 20016<\/p>\n<p><code>[boxed, joined by a line to the return address:]<\/code><br>→ Turrell<br>Box 725<br>Flagstaff Arizona<br>86002<\/p>\n<p>→ Dan Graham <code>[to the right:]<\/code> - No way drugy<br>84 Eldridge Street<br>New York, New York<br>10002<\/p>\n<p>→ Robert Irwin<br>1220 Rosecrans Street<br>Apt. 300<br>San Diego CA<br>92106<\/p>\n<p>Il faut dix ans pour avoir une idée bien à soi - dont on puisse parler.<br>p. 38<\/p>\n<p>Michel Verjux<br>- boring<br>- show in NY<\/p>\n<p>Julien Laverdiere<\/p>\n<p><code>[a slip of paper taped on:]<\/code><br>Jauchum + Meeh<br>43 Bridge St.<br>Bklyn N.Y. 11201<br>(718)875-0140<br>- PYROTECHNICS<br>+<br>- THEATRICAL LIGHTING EFFECTS<br>THE <u>EXPLORITORIUM<\/u> - SAN FRAN<br>- Jesse Kline (415)824 0987<br>THE LIBERTY SCIENCE CENTER<br>NEIL WHITE<\/p>\n<p><code>[boxed, with an arrow pointing at the slip:]<\/code> Arts &amp; Technology<\/p>", "notes": "The inside front cover. The New Haven return address is crossed out and replaced by the Washington DC one, so the DC address was probably added later, after Yale. The New Haven zip code reads \"06570\" or \"06520\" (Yale's zip code is 06520). Shozawa is Katherine's last name, so the Vancouver address is her family's. Turrell is James Turrell, whose Roden Crater studio was in Flagstaff; Dan Graham and Robert Irwin are artists. \"Jauchum + Meeh\" is the Brooklyn special-effects firm Jauchem &amp; Meeh. The French quotation's source (\"p. 38\") isn't given. Undated: the notebook's first entry is 12/28/94.", "img": ["attachments/pages/scan_1995_p001.jpg"]}, "1995-01-06_Emerson-Art-Life-and-Love": {"t": "Emerson: Art, Life and Love", "d": "1995-01-06", "est": true, "w": 1995.0137, "era": "Final Semester Yale 1995", "th": ["art-theory", "love", "writing-process", "reading-list"], "pp": ["Emerson", "Katherine", "Wordsworth", "Plato", "Donald McQuade", "Warhol", "Cage", "Bachelard", "George J. Leonard", "Mark C. Taylor"], "body": "<p>If art = life then it doesn't by any means guarantee happiness.<br>Emerson's 'eternal picture which nature paints in the street' is not happy or good or pleasant. It can very easily be horrible, or unpleasant. Does this art movement remove emotion from any moment in life? Has humanity just hyped up emotions raised the good and <s>just<\/s> made the bad worse when it could just live at a pleasant flatline espoused by spirituals <s>[?]<\/s> many religions?<br>Why did katherine and I go so crazy over each other? do we both have a wish to be so happy or is it a natural human desire? Are we addicted to passion?<br>Why is there joy in the peceptual moments I mentioned a page back and which Emerson leads the way in saying once they are noticed one doesn't need art anymore?<br>Even Emerson seems to say there is a joy in those moments, but what if there is not? - then can art be used to create happiness despite a forlorn nature.<br>\"For the <u>time<\/u> <u>being<\/u> art objects have a particular office to fill. That office, Emerson was writing in 1841, was to \"educate us to the perception of beauty.\" Art is not an end, but an education. \"What we have loved, others will love, and we will teach them how,\" Wordsworth - whom Emerson shares more with than with Plato - had <s>completed<\/s> concluded his life-work. p. 13-14.<br>Emerson: Selected writings Donald McQuade (NY Random 1981)<br>\"Art\"<br><code>[a pink highlighter line across the page]<\/code><br>Emerson's theory clearly implies a communication of a love, and this is where the issue lies w/ modern art w/ the Pop artist's and the Cage's.<br>Does Warhol love his Brillo boxes &amp; Campbell soup cans? If I don't initially can I ever learn to?<br>Cage cannot, certainly, be guaranteed of loving every performance of 4'33\" unless he is completely indifferent to sounds and has substituted indifference for love. <code>[the words \"performance\", \"indifference\", \"for\" and \"love\" are circled and joined]<\/code><br>It is impossible to love at all times (?) Does love imply an elevated state? and thus that there is an equally depreciated state to balance things out? <s>or<\/s> or can this dialectic be abolished Energy / Matter becomes one and the same. The exchanged 'flatline' is acceptable (I cannot say one is content w/ etc.) <s>[?]<\/s> compared to the roller coaster. One picks one or the other. Bhuddism has picked the former. Western capitalist culture (lottery driven) has picked the latter.<br>I am wondering whether it would be possible to write an essay where one is not sure of the end result - like the best process of painting. I have a feeling that that is what Bachelard did <s>and<\/s> though he seems to have edited his notes to fit what looks like a finished orderly system of thoughts. He completes so many tangents though, which are the moments I most appreciate. I would like it if my essay could come directly from these notes where I am learning as I go, finding what I want to say and what I think as I go. This is a healthy creative process.<br><code>[bracketed in the margin:]<\/code> Emerson 'The Divinity School Address (HB: the 'greastest document of American religion)<br>'the word miracle' as concieved by Christian churches, 'gives us a false impression; it is Monster.' Their misuse of the concept for what is merely <u>unusual<\/u> distracts us from noticing that 'man's life [is] a miracle, and all that man doth...\" Their kind of miracle is 'not one with the blowing clover and the fallen rain.\" p. 19<br>↑ <u>Into<\/u> <u>the<\/u> <u>Light<\/u> <u>of<\/u> <u>Things<\/u> George J. Leonard U. of Chicago 1994<br>The Art of the Commonplace from Wordsworth to John Cage<br>find. Mark C Taylor Disfiguring: Art, Arch., Religion.<\/p>", "notes": "Undated; it follows the 1/6/95 entry. The quotations and page numbers come from George J. Leonard's <i>Into the Light of Things: The Art of the Commonplace from Wordsworth to John Cage<\/i> (1994), cited at the bottom. \"HB\" is probably Harold Bloom.", "img": ["attachments/pages/scan_1995_p006.jpg"]}, "1995-01-18_Framing-Off-a-Section-of-the-World": {"t": "Framing Off a Section of the World", "d": "1995-01-18", "est": false, "w": 1995.0466, "era": "Final Semester Yale 1995", "th": ["framing", "dreams", "social-alienation", "turrell"], "pp": ["Garth", "Graham", "Turrell"], "body": "<p><s>[?]<\/s> 1/18 Framing off a section of <s>[?]<\/s> the world. Isolating it, diluting it. <s>[?]<\/s> Perhaps I can arrive at creating the mental image. Recreating the visuals I had in the dream about falling.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>- Garth and Graham both said that upon first meeting me I did not seem to be the most friendly person. They were both put off by me really. I feel people stay away from me, you know. I feel that they find me off putting. I am <u>not<\/u> always ready to be sociable.<br>The realization that I am here - right now. In the L&amp;B room, at Yale, during the day a day... That is the feeling I want to get w/ the pieces, like I got w/ Turrell @ MOMA.<\/p>", "notes": "The top of page 18 has no date of its own; it is put with the 1/18 entry, which ends at the foot of page 17, and runs up to the 1/21 entry. A rule separates the paragraph about Garth and Graham from \"The realization\", so they may have been written at different times. Compare the thoughts on falling in <span class=\"wl\" data-note=\"1995-01-09_Vol-de-Nuit-Another-Space\">1995 01 09_Vol de Nuit Another Space<\/span>. \"L&amp;B room\" is probably the Linonia and Brothers reading room in Sterling Library.", "img": ["attachments/pages/scan_1995_p017.jpg", "attachments/pages/scan_1995_p018.jpg"]}, "1995-10-01_Something-So-Easy-About-Painting": {"t": "Something So Easy About Painting", "d": "1995-10-01", "est": false, "w": 1995.75, "era": "DC, Post-College", "th": ["painting-process", "creative-flow"], "pp": [], "body": "<p>10/1 - There is something so easy about painting you do not think, you just <u>do<\/u>. There is no stress of responcibility and decisions, just try to faithfully reproduce my experience, my sight.<\/p>", "notes": "The last dated entry in the notebook. The out-of-place \"10/1\" entry on page 35, <span class=\"wl\" data-note=\"1995-10-01_Labeling-an-Office-Building\">1995 10 01_Labeling an Office Building<\/span>, may have been written the same day in a space left blank in February.", "img": ["attachments/pages/scan_1995_p098.jpg"]}, "2005-03-21_False-Tour-Guides-and-Rumors": {"t": "False Tour Guides and Rumors", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["criticism", "play", "installation"], "pp": ["John Cage"], "body": "<p><code>[a sheet taped onto the page]<\/code><br>- \"tour guides\" - not w/ little follow me flag. but rather starts up casual conversation &amp; gives you false information about the works \"did you know that the artist has a twin brother Yes in fact the real artist is very shy he stays at home and works, sends his twin to the openings.\" etc.<br>- scripts are given to certain insiders want to spread rumors in the most <s>believable<\/s> <s>yet<\/s> deliberate yet believable ways.<br>___<br>Cage's indeterminacy stories &amp; Zen koans.<br>___<br>Task for the critics, embalm these works in criticism, contextualize &amp; recontextualize high art critique, dirty daily rag, gawker, overheard opinions, all strong, contradicting &amp; correct. Can the work stand-up?<br>Does it need the context? can you just scrub it all away? and get magic?<\/p>", "notes": "Undated, about 2005. \"insiders\" may be the \"insiders\" Marco planned to email in <span class=\"wl\" data-note=\"2005-03-21_To-Do-and-Contacts\">2005 03 21_To Do and Contacts<\/span>. Gawker, the New York gossip blog, started in 2002. \"embalm\" is a reading of a hard word (\"cabalm\").", "img": ["attachments/pages/scan_1997_2_p092.jpg"]}, "1999-06-15_Relevant-and-Irrelevant-Information": {"t": "Relevant and Irrelevant Information", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["knowledge", "epistemology", "perception"], "pp": ["John R. Pierce"], "body": "<p>The world <code>[above:]<\/code> at any time. is a mixture of relevant &amp; irrelevant information - what is interesting is that at any moment each person's mixture of relevant &amp; irrelevant is different, and at two different times your own idea of what is relevant changes.<br>___<br>→ Rearrange your ideas of relevance ←<br>to? I?<br>\"A mathematical theory which seeks to explain and to predict the events in the world about us always deals w/ a simplified model of the world, a mathematical model in which only things pertinent to the behavior under consideration enter [...]<br>The great beauty and power of a mathematical theory or model lies in the separation of the relevant from the irrelevant, so that certain observable behavior can be related &amp; understood w/out the need of comprehending the whole nature <s>[?]<\/s> and behavior of the universe.<br><code>[in blue ink:]<\/code> (where is this from?)<\/p>", "notes": "Undated, in black ink, with the question \"(where is this from?)\" added later in blue. The quotation is from John R. Pierce, <i>An Introduction to Information Theory: Symbols, Signals and Noise<\/i> (1961/1980), chapter 2. The faint pencil drawing at the right edge and the writing below are page 82 showing through.", "img": ["attachments/pages/scan_1997_2_p081.jpg"]}, "1998-12-15_Wave-Mechanics-and-Someone-Not-Here": {"t": "Wave Mechanics, and Someone Not Here", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["epistemology", "imagination", "memory"], "pp": [], "body": "<p>e⁻ - can be in a variety of different places, at once (described by a wave function) until you measure it → then it collapses to one place. Like anything really, when someone is not here you can imagine them in a variety of places depending on what you know about them - until you find them and this variety collapses down to one physical location.<br><u>Wave mechanics<\/u><\/p>", "notes": "Undated. e⁻ is an electron.", "img": ["attachments/pages/scan_1997_2_p057.jpg"]}, "1995-03-11_Merleau-Ponty-Phenomenologie-and-Existentialism": {"t": "Merleau-Ponty: Phénoménologie, and Existentialism", "d": "1995-03-11", "est": true, "w": 1995.1941, "era": "Final Semester Yale 1995", "th": ["french", "reading", "perception", "literature", "writing-process"], "pp": ["Merleau-Ponty", "Camus", "Saint-Exupéry", "Cézanne", "Heraclitus", "Plato", "Ruskin", "Karl Jaspers", "Monika M. Langer", "Feyerabend", "Von Staden"], "body": "<p>La phénomenologie, c'est l'étude des essences<br>l'essence de la perception, l'essence de la conscience<br>mais c'est aussi une philosophie qui replace les essences dans l'existence et ne pense pas qu'on puisse comprendre l'homme et le monde autrement qu'à partir de leur «facticité». ... C'est aussi une philosophie <s>[?]<\/s> pour laquelle le monde est «toujours déjà là» avant la réflexion, comme une présence inaliénable, et dont tout l'effort est de retrouver ce contact naïf avec le monde pour lui donner enfin un statut philosophique.\" - Avant-propos.<br>un compte rendu de l'espace, du temps, du monde «vécus».<br>Il s'agit de décrire, et non pas d'expliquer ni d'analyser,<br>\"Tout ce que je sais du monde, même par la science, je le sais à partir d'une vue mienne ou d'une experience du monde sans laquelle les symboles de la science ne voudraient rien dire. Tout l'univers de la science est construit sur le monde vécu et si nous voulons penser la science elle-même avec rigueur, en apprécier exactement<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>le sens et la portée, il nous faut réveiller d'abord cette experience du monde dont elle est l'expression seconde. La science n'a pas et n'aura <s>[?]<\/s> n'aura jamais le même sens d'être que le monde perçu pour la simple raison qu'elle en est une détermination ou un explication<br><u>The same can be said of literature<\/u> and we must be very aware that in looking at the passages of Camus and Exupéry that we are never given the experience même, just a description of it - to see <s>what<\/s> Ponty talks about <s>these<\/s> the best which can be brought out of art or one of the secondary experiences with the world in \"Le doute\". <s>Where<\/s> Cezanne describes the best painting as the one which can be tasted. Camus' writing is tasty in this <s>[?]<\/s> way - if I try to show you passages which I find particularly evokative it may very well be that you do not find them so Everyone must remember the passages in <u>L'etranger<\/u> where the heatt and the sun drive <s>him<\/s> the protagonist to slaughter the Arab.<br><s>[?]<\/s> <u>solipcism<\/u> -<br>- je suis la source absolue, mon existence ne vient pas de mes antécédents, de mon entourage physique et social, elle va vers eux et les soutient, car c'est moi qui fais être pour moi (et donc être au seul sens que le mot puisse avoir pour moi) cette tradition que je choisis de reprendre ou cet horizon dont la distance à moi s'effondrerait, puisqu'elle ne lui appartient pas comme une propriété, si je n'étais là pour la parcourir du regard.<br>Le réel est un tissu solide, <s>[?]<\/s> il n'attend pas nos jugements pour s'annexer les phénomènes les plus vraisemblables. La perception n'est pas une science du monde, ce n'est pas même un acte, une prise de position délibérée, elle est le fond sur lequel tous les actes se détachent et elle est présupposée par eux [les actes - perception is presupposed by the acts of which it is the base from which all acts detach themselves]<br>Le monde n'est pas un objet dont je possède par devers moi la loi de constitution, il est le milieu naturel et le champ de toutes mes pensées et de toutes mes perceptions explicites. La vérité n'«habite» pas seulement l'«l'homme interieure» (1), ou plutôt il n'y a pas d'homme interieure, l'homme est au monde, c'est dans le monde qu'il se connaît.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>I like how Merleau-Ponty writes. He <s>always<\/s> allows himself to rephrase what he says in the middle of the sentence. It is not polished, he sounds like he is trying to make sense to you as though he were talking to you. I think this method allows <s>[?]<\/s> the writer to get alot more out of the language he does not have to rely apon the conventions which inform the reader about the meanings of words or constructions - he can let the reader see inside them, at a deeper meaning he is trying to <s>[?]<\/s> communicate <s>one<\/s> which conventional language may not be equipped to communicate - push the bubble!<br>Heraclitus warming himself at the stove:<br>'There are Gods present even here', <s>says<\/s> \"thereby tacitly urging his visitors to reflect on their assumption that philosophizing demands a turning aside from daily life.... the little story captures perfectly the core of exitentialist philosophy in its emphasis on concrete thinking. In focusing on the actual human situation as the starting point for any authentic philosophy, this ancient anecdote implicitly counters the assumption that genuine thinking must be abstract. It thus stresses the central importance of pondering the meaning of our being-in-the-world and points out the general alienation from such concrete philosophizing.<br>Existentialist philosophy challenges the contention that philosophy is inherently high-flown; that the search for truth requires a turning away from the world of our concrete experience, as Plato's cave allegory would have us believe<br>Existentialism allows art - not a Ruskin swing to Art of the Common place<br>modern technology is profoundly dehumanizing - the reality of the world cannot be evaded - un-natural to stay up till 2 or 3 and sleep till noon - unnatural to sit at a desk or in a car for more hours than you walk or run during a day 'The significance of entering into the world constitutes the value of philosophy' - Jaspers 1931 Man in the Modern Age p. 144-8<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>existentialist philosophy is highly critical of any 'thinking which looks on from above'.<br><u>Ph. of Percep<\/u>: comprehensive philosophical foundation for <code>[an arrow loops back to \"thinking which looks on from above\"]<\/code><br>Ponty: all knowledge takes place within the horizons opened up by perception, that the primordial structures of perception pervade the entire range of reflective and scientific experience, and that all forms of human co-existence are based on perception. Phenomenology's concern therefore must be with the pre-reflective world which is the background of all reflection. Merleau-Ponty argues that the perciever is not a pure thinker but a body-subject, and that any act of reflection is based on that pre-personal, anonymous consciousness which <u>is<\/u> incarnate subjectivity. There can be no sphere of absolutely self-sustaining thought; the only foundation for knowledge is our concrete inherence in the world. The entire universe of science is thus built upon the life-world which it takes for granted. \" Preface \" Guide &amp; Commentary Ph. of P. Monika M. Langer p. xv.<br>↳ this is big. Much bigger than I need for my essay. I don't need to take apart science as I have tried to do before w/ Feyerabend after Von Staden's class.<br>As genuinely radical reflection, phenomenology recognizes that our primordial relationship <s>with<\/s> to the world 'is not a thing which can be any further clarified by analysis; the dynamic, internal relation between body-subject and world can only be brought to our attention. This bringing to attention is itself, however, a 'creative act' which brings truth into being by disclosing behind reflection that mysterious perceptual realm which is our very 'access to truth'. Ibid. xvii<\/p>", "notes": "Undated; it follows the 3/11 entry and runs over four pages. The French passages are from the Avant-propos of Merleau-Ponty's <i>Phénoménologie de la perception<\/i> (1945). The commentary is Monika M. Langer, <i>Merleau-Ponty's Phenomenology of Perception: A Guide and Commentary<\/i> (1989); the Heraclitus and existentialism passages on page 47 seem to come from the same book. Karl Jaspers's <i>Man in the Modern Age<\/i> was published in 1931. Von Staden is probably Heinrich von Staden, who taught history of science at Yale. The \"Le doute\" passages are in <span class=\"wl\" data-note=\"1995-01-08_Le-Doute-de-Cezanne\">1995 01 08_Le Doute de Cezanne<\/span>.", "img": ["attachments/pages/scan_1995_p045.jpg", "attachments/pages/scan_1995_p046.jpg", "attachments/pages/scan_1995_p047.jpg", "attachments/pages/scan_1995_p048.jpg"]}, "1998-10-15_Bricoleur-Pidgin-and-Creole-Languages": {"t": "Bricoleur, Pidgin and Creole Languages", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["language", "bricolage", "body"], "pp": [], "body": "<p>Many many thoughts. lets see if I can get them <s>[?]<\/s> down.<br><u>Bricoleur<\/u> &amp; Pidgin &amp; Creole languages.<br>- each individual is a master of the language he speaks - his language. He knows how to manipulate it &amp; use it, what <s>belongs<\/s> is inside &amp; what is not. He has the power to change it Humour, analogy <s>[?]<\/s> etc.<br>One should have this power in all the domains of life. cooking, taking care of ones body, exercise, cleaning etc. medicine to a far greater extent than it is. technology This is not a renaissance but living. Zeuthing off the east.<\/p>", "notes": "Undated. Follows on from the bricoleur notes at the start of the notebook (<span class=\"wl\" data-note=\"1998-08-01_Bricoleur-Levi-Strauss\">1998 08 01_Bricoleur Levi Strauss<\/span>). The last words, \"Zeuthing off the east\", are hard to read; it may be \"feeding off the east\" or \"learning off the east\".", "img": ["attachments/pages/scan_1997_2_p023.jpg"]}, "1998-12-15_Mixing-Paint-Materness": {"t": "Mixing Paint; Materness", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["painting-process", "materiality"], "pp": [], "body": "<p>- Mixing paint → approaching the material.<br>- materness, objectness - laquéness<\/p>", "notes": "Undated; between rules. \"laquéness\" (lacquered-ness) is as written.", "img": ["attachments/pages/scan_1997_2_p051.jpg"]}, "1995-02-12_John-Ashbery-Reading": {"t": "John Ashbery Reading", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["poetry", "reading-list"], "pp": ["John Ashbery"], "body": "<p><u>John Ashbery Reading<\/u><br>Wow he really opened up in the one that ended w/ \"I am both bogus &amp; bold not to put too fine a point on it <code>[the end of the quotation is circled, with a note:]<\/code> - is there a period?<br>So much more relaxed listening here<br>Philosophy of Life -<br>That pink stucco skyscraper poem made much more sense today - people where quiet - no more of that nervous stupid laughter.<br><code>[bracketed:]<\/code> I have to get this volume now that I have heard him read from it twice<\/p>", "notes": "Undated. \"Philosophy of Life\" may be the title of a poem or book heard at the reading; Ashbery's <i>And the Stars Were Shining<\/i> (1994) was his recent volume. The overlapping top of this crop shows the end of the dance notes, in <span class=\"wl\" data-note=\"1995-02-12_Dance-Space-and-Mirror-Panels\">1995 02 12_Dance Space and Mirror Panels<\/span>.", "img": ["attachments/pages/scan_1995_p036.jpg"]}, "1997_p027_Multiple-Meaning-Words-and-Chaucer": {"t": "Multiple-Meaning Words and Chaucer", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["language", "etymology", "literature"], "pp": ["Geoffrey Chaucer"], "body": "<p>multiple meaning words : hir, list... hight (called)<br>exchange words already deeply in language w/ Chaucer<br>Chaucer was a staple merchant tax official.<\/p>", "notes": "", "img": ["attachments/pages/scan_1997_p027.jpg"]}, "1995-04-11_History-Space-and-the-Now": {"t": "History, Space and the Now", "d": "1995-04-11", "est": false, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["space", "time", "language"], "pp": ["Giacometti", "Max Ernst"], "body": "<p><u>Apr 11<\/u>.<br>Experience the now occurs on a plane<br><code>[sketch: two lines crossing in an X, the left end labelled \"History\", the right end \"space\", with a dotted vertical line through the crossing labelled \"now\"]<\/code><br>like standing on the middle of a palindrome (palimsest?)<br><u>bab<\/u> seeing ob in<br><u>civic<\/u><br>anapodoton. exemplified by the Princeton Encycl. under Ellipsis. \"If you do it all will be well, if not <code>[circled:]<\/code> ...\"<br><code>[under \"If you do it all will be well\", underlined:]<\/code> History <code>[under the circled \"...\":]<\/code> space the unknowns the future<br><code>[to the right:]<\/code> <u>Chiasmus<\/u>.<br>replace the space inside with that which is outside massive dreamspace.<br>Giacometti <s>Max Ernst<\/s> quote: <s>roof of<\/s> immense vault of a human head.<\/p>", "notes": "\"bab\" is written over \"bob\"; the point is the \"o\" or \"a\" at the centre of a palindrome, as \"v\" in \"civic\". Anapodoton (a sentence left unfinished) is defined under \"Ellipsis\" in the <i>Princeton Encyclopedia of Poetry and Poetics<\/i>. The Giacometti quotation was first attributed to Max Ernst, then corrected.", "img": ["attachments/pages/scan_1995_p064.jpg"]}, "1997_p009_Ingenuity-of-the-Individual-Shanties-Bricolage-and-Public-Space": {"t": "The Ingenuity of the Individual: Shanties, Bricolage and Public Space", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["public-space", "urbanism", "bricolage", "architecture", "individuality"], "pp": ["Andrea Palladio", "Robinson Crusoe"], "body": "<p>→ Small town studies →<br>→shanty: when not in misery there is beauty.<br>-expo @ Nat. Build. museum on homeless habitats → great innovation &amp; beauty<br>↳ lack of means isn't un-beautiful<br>deliberately living under <code>[below written above \"under\"]<\/code> ones means is though.<\/p>\n<p><u>Medieval urbanism<\/u> → not the walls of the fortress but the houses inside,<br>→individuals building re-building their residences to their own convenience<br>&amp; finding their own ingenious solu's to bizarre problems, own beauty, own life → before the boredom of a Palladio.<\/p>\n<p><u>Bricoleur<\/u> → détournement<br>It's not the cheapness of means which is attractive (junk collecting etc.) but the ability to transform objects (personal power) w/in one's own means.<br>- Robinson Crusoe<\/p>\n<p><u>Public space<\/u> - always planned, by someone → unfortunately too often <s>[?]<\/s> the planners aren't invested, they don't live there - don't even go there<br>many forgotten spaces that individuals don't have the means (financial, physical, mechanised building etc.) to transform.<br>How could <s>[?] [?] [?]<\/s><br>public space actually become public → not planned for the public — but created, mutated by <s>them<\/s>. it<\/p>\n<p><u>Playground Arch.<\/u>: There was an article in the Smithsonian mag about child psych. architects who observe playground behaviour. Most used &amp; essent element → moveable, transformable stuff, sticks, <u>SAND<\/u>, dirt etc. The planned stuff →steering wheels etc. <s>[?]<\/s> go virtually un-used except when its function is completely deturned (new thing to hang from, alien base etc.)<\/p>\n<p><u>Traditional cuisine<\/u>: Nutritionists find that a french balance of high-fat &amp; tannin in red wine actually fights off heart disease → similar wonders in Eastern trad. cuisines. The human body naturally automatically → certainly un-logically - knows what is best for it.<\/p>\n<p>I have a deep conviction in the ingenuity of the individual human being; a deep regret for any system which hampers this.<\/p>", "notes": "One entry across three pages: p. 10 ends \"How could\" and p. 11 goes on \"public space actually become public\". The scan of p. 10 is blurred (the phone moved), so a few words there are read from their shapes; it is worth rescanning. \"it\" after \"them\" is a later correction in a different pen.", "img": ["attachments/pages/scan_1997_p009.jpg", "attachments/pages/scan_1997_p010.jpg", "attachments/pages/scan_1997_p011.jpg"]}, "1995-02-05_David-Pease": {"t": "David Pease", "d": "1995-02-05", "est": true, "w": 1995.0943, "era": "Final Semester Yale 1995", "th": ["yale", "criticism"], "pp": ["David Pease"], "body": "<p><u>David Pease<\/u><br><s>What is significant? How<\/s> →<br>condescending beyond belief.<br><s>personal usefulness<\/s>.<\/p>", "notes": "Undated; it sits above the 2/5 entry at the top of the page, which was written with the notebook turned sideways. David Pease was dean of the Yale School of Art.", "img": ["attachments/pages/scan_1995_p028.jpg"]}, "1994-08-10_Later-Annotation-Male-Fantasies-and-Lucy": {"t": "Later Annotation: Male Fantasies & Lucy vs. Katherine", "d": "1994-08-10", "est": false, "w": 1994.608, "era": "Summer 1994, Travel and Alps", "th": ["intimacy", "social-validation", "retrospective-self"], "pp": ["Katherine", "Lucy", "Sarah"], "body": "<p><i>(Later annotation: I hate this page and want to tear it out. I have not given Sarah—or anybody who would fall into that category for me—a thought in quite a long time. I think of those fantasies I had as painful to a relationship I really care about, the way I would like to care about a relationship. It is about people and not genitalia. I find these male fantasies as painful as I found my singing group congratulating me for having gotten together with Lucy, when they never said anything about Katherine. I guess Katherine was more invisible to them because our relationship was so private.)<\/i><\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p057.jpg"]}, "1995-04-11_Scaffolding-Room-and-Wire-Rope": {"t": "Scaffolding Room and Wire Rope", "d": "1995-04-11", "est": true, "w": 1995.2774, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "reading-list"], "pp": ["Kirk J. Schneider", "Hitchcock"], "body": "<p><code>[sketch: a tall frame of pipes on a base, labelled \"fill these pipes w/ cement\"]<\/code><br><code>[sketch: a post with an arm and a stay, and a small clamp]<\/code><br><code>[sketch: a room seen in perspective with a window in its far wall, its corners tied off with \"wire rope\" to cinder blocks; labelled \"Build this out of scaffolding impermanent not mine not structure experience\"]<\/code><br>material that stops light; but not wind?<br><code>[sketch: a square canopy held up at the corners, labelled \"1 arm's length.\" and \"tension?\", with a lamp hanging inside]<\/code><br>- curtains pull up w/ board.<br><code>[sketch: a square with one corner hatched, labelled \"light metal grid can't see through but can stand on\"]<\/code><br><code>[sketch: a tall box frame with stays out to the ground]<\/code><br><u>luminous<\/u><br><code>[sketch: a rectangle labelled \"7x4\" and \"28\" and \"x 4ft\"]<\/code><br>Kirk J Schneider \"Hitcock's vertigo: An existential view of Spirituality\" Journal of Humanistic Psych. Vol 33 (2) 1993 p. 95<\/p>", "notes": "Undated; between the April 11 entries. The reference is Kirk J. Schneider, \"Hitchcock's <i>Vertigo<\/i>: An Existential View of Spirituality\", <i>Journal of Humanistic Psychology<\/i> 33(2), 1993; it follows up the vertigo question in <span class=\"wl\" data-note=\"1995-03-12_Vertigo\">1995 03 12_Vertigo<\/span>. \"luminous\" is a reading of a hard word.", "img": ["attachments/pages/scan_1995_p066.jpg"]}, "1998-12-15_Dubuffet-on-Childrens-Drawings-Graffiti-and-Invention": {"t": "Dubuffet on Children's Drawings, Graffiti and Invention", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["reading", "drawing", "language"], "pp": ["Jean Dubuffet", "Matisse", "Chagall", "Klee"], "body": "<p><u>Dubuffet<\/u>. <u>Children<\/u><br><code>[a bracket in the margin joins this paragraph to the next, with an arrow from the title]<\/code><br>\"I don't like children. They don't really seem to exist they are like mirrors, small imitators. They are all monkeys, imitating whatever you do. One child copies the art of the other. I've seen exhibitions of children's drawings, especially in England, in which each school is recognisable; Matisse in one, Chagall in another.<br>In 1942 I was looking at the drawings of children alot. I was influenced by them, now less so. You see, I realized that children have an appetite for the civilization of adults. They want to be adults. Their art comes, in time, to express a cultural transcription of the word: a house, a tree, a sun, a dog. I feel, their art depicts <u>language<\/u>, the language of their elementary vocabulary, and not what they are really concerned with. They aren't actually interested in houses etc. The painting of children is completely \"dictionary\". p. 43 vol. IV<\/p>\n<p><b>Next page:<\/b><\/p>\n<p><u>Graphitti<\/u>: In 1944 I was interested in old walls, and the drawings on them. But much of it is useless, mere copying. Graphitti is only of interest <s>when it is done<\/s> the first time it is done. For me, there is only one art; when you have invention! this is the real creativity, to recreate the world entirely with one's own hands, which Klee began.<br><u>p. 55<\/u><br>Art consists in constructing or inventing a mirror in which all the universe is reflected. An artist is a man who creates, or recreates, a parallel universe, who doesn't want an imposed universe inflicted upon him. He wants to do it himself, like a fish who excretes the water in which he swims. I believe that the creation of art is intimately linked w/ the spirit of revolt, a refusal to adopt things given by custom. That is <s>the<\/s> a true definition of insanity <code>[in red, with a bracket round the passage:]<\/code> not urbanism<br>___<br>p57 There is nothing worse for art and creativity than the critical approach. Comparison is dangerous and destructive. Art is unique and not to be compared. If I'm looking at <s>the<\/s> Mont Blanc, I don't want to compare it to other mountains<\/p>", "notes": "Undated. A quotation from Jean Dubuffet, probably translated by Marco from his collected writings (<i>Prospectus et tous écrits suivants<\/i>, vol. IV); the opening quotation mark is not closed on the page. The red \"not urbanism\" beside the passage on revolt is a later comment.", "img": ["attachments/pages/scan_1997_2_p032.jpg", "attachments/pages/scan_1997_2_p033.jpg"]}, "1995-01-11_Art-Is-Not-Dead-Cezannes-Letters": {"t": "Art Is Not Dead; Cézanne's Letters", "d": "1995-01-11", "est": false, "w": 1995.0274, "era": "Final Semester Yale 1995", "th": ["art-theory", "painting-theory", "observation", "reading"], "pp": ["Cézanne", "Émile Zola", "John Rewald"], "body": "<p>1/11/95. I think it is stupid for someone to say art is dead. It has been exploded open. No matter how far we go, there will always be that unknown place where the artist must wearily take a step to that ephemeral tingling sensation where, if he is lucky, the light shines on him and his step for a second or so and he becomes frozen in <s>[?]<\/s> tradition - and his step seems, <u>to his successors, as obvious<\/u>, as it did seem extreme to his contemporaries.<br>To Emile Zola, Aix n.d. ~19 Oct 1866 <s>[?]<\/s> Paul Cezanne Letters Rewald (London: Cassirer, 1941)<br>\"But you know all pictures <s>inside<\/s> painted inside, in the studio, will never be as good as the things done outside. <s>[?]<\/s> p. 74.<br>I am progressing very slowly, for nature reveals herself to me in very complex forms; and the progress needed is incessant. One must see one's model correctly and experience it in the right way; and furthermore express oneself forcibly and with distinction.<br>Taste is the best judge. It is rare. Art only addresses itself to an excessively small number of individuals.<br>The artist must scorn all judgement that is not based on an intelligent observation of character. He must beware of the literary spirit (narrative painting?) which so often causes painting to deviate from its true path - the concrete study of nature - to lose itself <s>out<\/s> too long in the intangible speculations.<br>The Louvre is a good book to consult but it must only be an intermediary. The real and immense study that must be taken up is the manifold picture of nature. (235-6)<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>To achieve progress nature alone counts, and the eye is trained through contact with her. It becomes concentric by looking and working. I mean to say that in an orange, an apple, a bowl, a head, there is a culminating point; and this point is always in spite of the tremendous effect of light and shade and colorful sensations - the closest to our eye; the edges of the object recede to a center on our horizon. With a small temperament one can be very much a painter. One can do good things w/out being very much of a hormonist or a colorist. It is sufficient to have a sense of art - and this sense is doubtless the horror of the bourgeois. Therefore institutions, pensions, honors can only be made for cretins, rogues and rascals. <u>Do not be an art critic, but paint, therein lies salvation.<\/u> p. 239.<br>Now being nearly 70 years old, the sensations of color, which give light, are the reasons for the abstractions which prevent me from either covering my canvas or continuing the delimitation of the objects when their points <s>drop off<\/s> of contact are fine and delicate; from which it results that my image or picture is incomplete. <s>On the other hand,<\/s> p. 251-2.<br>I am becomming more clearsighted in front of nature, but that with me the realization of my sensations is always very difficult. I cannot attain the intensity that is unfolded before my senses. I have not the magnificent richness of coloring that animates nature. <s>Here on the<\/s> Here on the edge of the river, the motifs are very plentiful, the same subject seen from a different angle gives a subject for study of the highest interest and so varied that I think I could be occupied for months without changing my place, simply bending a little more to the right or left. p. 262.<br>{ He gave up <s>[?]<\/s> on painting too, really though he was still doing it the gaps, unpainted areas are <s>though<\/s> those he felt too weak to tackle. I can be so happy just seeing noticing nature's visual presents. Hopefully I can make someone else aware of these instants<\/p>", "notes": "The quotations are from <i>Paul Cézanne: Letters<\/i>, edited by John Rewald (London: Cassirer, 1941). On page 10, one diagonal line runs through the paragraph from \"progressing\" to \"forcibly\"; it may be a stray stroke or may cross the paragraph out.", "img": ["attachments/pages/scan_1995_p010.jpg", "attachments/pages/scan_1995_p011.jpg"]}, "1997_p031_Scientific-Objects-and-Gadgetry": {"t": "Scientific Objects and Gadgetry", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["sculpture-ideas", "sound", "scientific-objects", "notebook"], "pp": [], "body": "<p><code>[in pencil, at the foot of the page:]<\/code><br>Make &amp; collect many different (scientific) objects<br><code>[sketch: two curved brackets facing each other]<\/code> - resonance shells<br><code>[sketch: a post with two arrows pointing up]<\/code> lifting platform.<br>- cubes   sound controllers<\/p>\n<p><b>Next page, in pencil:<\/b><\/p>\n<p>This book is a note pad. →<br><code>[left margin, sideways: Yes the gadgetry is important.]<\/code><\/p>\n<p><code>[sketch: a large pencil drawing of rings or domes linked by lines and small nodes, like a network of hanging spheres; at the bottom left, two arcs meeting at a point, labelled \"gate / frame\" with arrows]<\/code><\/p>", "notes": "", "img": ["attachments/pages/scan_1997_p031.jpg", "attachments/pages/scan_1997_p032.jpg"]}, "1998-12-15_Video-Edit-Notes-Rainbow-Bridge-to-St-Eustache": {"t": "Video Edit Notes: Rainbow Bridge to St-Eustache", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["video", "installation", "japan", "studio-practice"], "pp": [], "body": "<p>Ak ① Rainbow bridge<br>start w/ 1st train. - leave more bumps @ <u>end<\/u><br>sit far from scre[en]<br>② - <s>only hands<\/s>.<br>③ only hands in wire. - Ionize noise (no feet?)<br>④ Yokohama <code>[above:]<\/code> 1 $2 $3 - Ionize out camera hum in the sound.<br>- normalise everything<br><code>[a bracket in the margin, joined to ③ and ④:]<\/code> cut only w/ <s>fades<\/s> crossfades<br>* projection works great.<br>I like that you can see the thought about what it is to make a movement to make a piece - you can see the construction @ St Eustache there will be lots of noise too mixing w/ video -<br>there is always more to see in the world - that's why an abundance You don't have to watch it all, &amp; you can't<\/p>", "notes": "Undated. Editing notes for a video of train and city footage shot in Tokyo and Yokohama (Rainbow Bridge), to be shown at Saint-Eustache in Paris. \"Ak\" may stand for Akemi. \"Ionize\" is a noise-reduction tool. \"1 $2 $3\" is unclear.", "img": ["attachments/pages/scan_1997_2_p048.jpg"]}, "1994-07-26_Hulls-Knife-Edge-Between-Artist-and-Nature": {"t": "Hull's Knife Edge Between the Painter and Nature", "d": "1994-07-26", "est": false, "w": 1994.5685, "era": "Yale, New Haven", "th": ["painting-theory", "nature", "gesture", "observation", "abstract-expressionism"], "pp": ["John Hull"], "body": "<p>Hull mentioned in class yesterday—about having a relationship w/ nature—no relationship is interesting if one party always wins—the relationship will either end altogether or be terribly unhappy.<\/p>\n<p>The relationship of a painter w/ nature is that between that which is going on in his head—gestures, expression &amp; that which he gathers from nature. If nature always wins (trompe l'oeil [or] other forms of direct copying)—then the work gets boring—as does Abstract expressionism or another form which is all about the artist. I like to try to walk this knife edge, mixing the gesture, small recognitions or reminiscences w/ a careful comparison to what I see before me.<\/p>\n<p>I'm not quite sure what I am saying, my argument kind of unraveled as I wrote it down &amp; I feel that I am left w/ a handful of string.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p004.jpg"]}, "1995-03-12_Vertigo": {"t": "Vertigo", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["fear", "language", "sky", "literature"], "pp": ["Hitchcock", "Saint-Exupéry"], "body": "<p>Vertigo = thought you can feel running up behind you, ready to tackle you into the void.<br>It is almost hard to keep oneself back from jumping off a cliff or infront of an oncoming subway train. I always thought that the word \"vertigo\" included this attraction but every dictionary &amp; encyclopedia entry I have found can't seem to get by passing vertigo off as a dizzyness or queasy feeling <s>[?]<\/s> associated w/ motion or heights. This is not what I have ever thought vertigo meant. I imagine that reading criticism on Hitchcock's movie would fill in some gaps between the dictionary definition and the <s>word<\/s> meaning I am looking for.<br>When the narrator in <u>Terre des hommes<\/u> lies on his back on the top of an isolated plateau in the desert, he feels a vertiginous attraction to the stars. he feels <s>a<\/s> <s>[?]<\/s> force pulling up wards or off the planet into the universe<\/p>", "notes": "Undated; the follow-up to \"look up Vertigo\" in <span class=\"wl\" data-note=\"1995-03-12_The-Phenomenology-of-Space-Essay-Plan\">1995 03 12_The Phenomenology of Space Essay Plan<\/span>.", "img": ["attachments/pages/scan_1995_p057.jpg"]}, "1995-06-01_Two-Infinities-in-the-Same-Box": {"t": "Two Infinities in the Same Box", "d": "1995-06-01", "est": true, "w": 1995.4167, "era": "DC, Post-College", "th": ["mirrors", "perspective", "sculpture-ideas", "optics"], "pp": [], "body": "<p><code>[a page of pen sketches of boxes and mirror arrangements]<\/code><br><code>[sketch: a square with posts at the corners and curved arrows bouncing between them]<\/code><br><code>[sketch: a door in a box frame]<\/code><br><code>[sketch: a hatched box with a smaller box set into it, labelled \"mirror\"]<\/code><br><code>[sketch: four corner marks]<\/code><br><code>[sketch: a square of four quarters, two hatched, one with a hole, labelled \"see you\" and \"see in\"]<\/code><br><code>[sketch: a box with a smaller box and a circle inside it, labelled \"two diff. sized infinities in the same box!\"]<\/code><br><code>[sketch: a square of four panes with wavy lines]<\/code><br><code>[sketch: a tall rectangle with a small square in its lower corner]<\/code><br><code>[sketch: a frame divided into three]<\/code><br><code>[sketch: a strip divided into five]<\/code><br>- optics &amp; reflection<br>- at what rate do things recede?<br>I could <s>manipulate<\/s> contrast \"normal\" feeling perspective w/ <u>abnormal<\/u><br>can one get the perspective in these <s>[?]<\/s> reflected infinities to feel \"real\"<br><code>[sketch: a box with a hole, labelled \"still life in the box.\" and \"view through hole painted on canvas.\"]<\/code><\/p>", "notes": "Undated sketches of mirror boxes. The faint writing showing through is the facing page, <span class=\"wl\" data-note=\"1995-06-01_Things-to-Do-If-I-Return-to-New-Haven\">1995 06 01_Things to Do If I Return to New Haven<\/span>.", "img": ["attachments/pages/scan_1995_p074.jpg"]}, "1995-01-21_Art-Is-High-Stakes": {"t": "Art Is High Stakes", "d": "1995-01-21", "est": false, "w": 1995.0548, "era": "Final Semester Yale 1995", "th": ["memory", "intimacy", "ambition", "childhood-memory"], "pp": [], "body": "<p>1/21 An artist has to get under your skin. You have to know how to approach him or her.<br>Art is truely high stakes. Either you have everything, or nothing: either you have managed to slip into a sphere above <s>[?]<\/s> normal people are the most powerful (?) or you are nothing - at the bottom - no money job anything.<br>There is something so special about holding your lover's hand - so much is said - shared. Other wise there is such an enourmous distance btw. you and everyone else you pass for an instant, a train ride etc. What instants gel - till you remember them forever? I remember sitting in our downstairs bath room at home and thinking I could remember this moment for ever if I want to, and that my <s>[?]<\/s> act of thinking that would do it. I don't remember the particularities of <s>thinking it<\/s> what was going on the smell, breeze etc. but one can't remember those, I remember the thought.<br>- one can't remember a feeling, smell, color, taste only when they are tasted again are they recalled. This sets them quite apart from the visual &amp; verbal world.<\/p>", "notes": "\"are the most powerful\" is written above \"normal people\", as an insertion.", "img": ["attachments/pages/scan_1995_p018.jpg"]}, "1995-01-11_Rothko-The-Romantics-Were-Prompted": {"t": "Rothko: \"The Romantics Were Prompted\"", "d": "1995-01-11", "est": true, "w": 1995.0274, "era": "Final Semester Yale 1995", "th": ["art-theory", "reading", "poetry"], "pp": ["Mark Rothko", "Herschel B. Chipp", "Emerson", "Valéry"], "body": "<p>Mark Rothko, \"The Romantics Were Prompted.\" 1947<br>\"The unfriendliness of society to his activity is difficult for the artist to accept. Yet this very hostility can act as a lever for true liberation. Freed from a false sense of security and community, the artist can abandon his plastic bank book, just as he has abandoned other forms of security. Both the sense of community and of security depend on the familiar. Free of them, transcendental experiences become possible - Theories of Mod. Art Herschel B Chipp. (U.C. Berkely, 1968) p. 548.<br><code>[bracketed in the margin:]<\/code> The most important tool the artist fashions through constant practice is faith in his ability to produce miracles when they are needed. Pictures must be miraculous: the instant one is completed, the intimacy between the creation and the creator is ended. He is an outsider. The picture must be for him, as for anyone experiencing it later, a revelation, an unexpected and unprecedented resolution of an eternally familiar need. Ibid. p. 549. (see Emerson, \"Divinity School\" quote about miracles)<br>\"Pour un poète, il ne s'agit jamais de dire qu'il pleut. Il s'agit... de créer la pluie.\" Valery<\/p>", "notes": "Undated; it follows the 1/11/95 entry. The Emerson \"Divinity School\" quotation about miracles is in <span class=\"wl\" data-note=\"1995-01-06_Emerson-Art-Life-and-Love\">1995 01 06_Emerson Art Life and Love<\/span>.", "img": ["attachments/pages/scan_1995_p012.jpg"]}, "1998-12-15_Lindifference-et-la-Colere": {"t": "L'Indifférence et la Colère", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["french", "emotional-distance"], "pp": [], "body": "<p>- l'indifference peut être plus fort que la colère.<br>- <s>[?]<\/s> On est en colère quand quelqu'un a transgresser quelque chose qu'on aime.<\/p>", "notes": "Undated, in black ink.", "img": ["attachments/pages/scan_1997_2_p066.jpg"]}, "1994-07-09_Painting-on-Chapel-York-Garage": {"t": "Painting on Chapel-York Garage & How Art Transforms Space", "d": "1994-07-09", "est": false, "w": 1994.5219, "era": "Yale, New Haven", "th": ["painting-process", "ekphrasis", "space-vs-poetry"], "pp": ["Harold Bloom", "A.R. Ammons"], "body": "<p>I spent the day, Saturday, painting on top of the Chapel-York Garage. I almost gave up early in the day, exasperated at how quickly the acrylics would dry in the sun. I couldn't get the right color for the shadows a sand colored building—everything was too dark or too green. But stuck with it and changed to a flexible small flat brush, soft like a watercolor brush. Finally, I forgot about the time while I was  painting. That hasn't happened in the longest time. I mixed cerulean blue and cadmium orange to get a light grey for the sandy shadows. Hopefully it will be sunny again tomorrow so I can go finish it.<\/p>\n<p>While I was out there I thought of what in the world someone else would see if they came up. The top of a parking garage—not very exciting. I remembered Harold Bloom telling us about when Archie [A.R.] Ammons took him to the part of the Jersey Shore which inspired <i>\"Corson's Inlet.\"<\/i> Bloom, in his usual exasperated sarcasm, said that his trek through those bleak sand-dunes added nothing to the poem; all he wanted was to find the closest coffee house. No wonder the man's body is about to fail him completely at 64.<\/p>\n<p>This brings up a similarity between painting and poetry. Both transform the space which inspired them. They change this space for the viewer/reader, or present them with something that doesn't need the association to the space, though the artist needed this association to inform the work. This sounds like it could be validation for abstract poetry, but even the most \"realistic\" painting or photograph changes the space. One cannot escape the mediation of the artist—especially a good artist, who will tend to leave his imprint on his representation. This imprint is recognized and cherished.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p100.jpg", "attachments/pages/scan_1994_1_p102.jpg"]}, "1995-03-12_Crit-Notes-the-Mirror-Room-and-the-Stand": {"t": "Crit Notes: the Mirror Room and the Stand", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["studio-critique", "mirrors", "installation", "light"], "pp": ["Bob", "Lisa", "Ron Jones", "Steve", "Julian"], "body": "<p><u>crit notes<\/u>: I liked Bob's comment about <u>peering over the edge of a building<\/u>.<br>I also liked Lisa's comment that it made her question infinity b/c it was so contained &amp; measured → this is <u>not<\/u> really infinity<br>liked Ron's inversion of the world<br>what originally reflected everything in the
