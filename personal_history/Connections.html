, "1994-06-26_Collage-Project-Studio-Photos-Page-27": {"t": "Collage Page 27: Studio Photographs & Margin Reflection", "d": "1994-06-26", "est": false, "w": 1994.4852, "era": "Yale, New Haven", "th": ["collage", "studio-practice", "self-awareness", "creative-flow"], "pp": [], "body": "<ul><li><b>Visual Collage:<\/b> Three black-and-white photographs pasted vertically down the center of page 27 (with a blue/clear slide box marked <code>4902<\/code> visible above the notebook):<\/li><\/ul>\n<p>  1. <b>Top:<\/b> A close-up of a person holding a paintbrush in front of a tilted canvas stretcher.<br>  2. <b>Middle:<\/b> A cluttered studio worktable with a white paint bucket, glass bottles, jars, brushes, and rags beneath a window.<br>  3. <b>Bottom:<\/b> A close-up of legs wearing ripped jeans standing on a paint-spattered studio floor.<\/p>\n<ul><li><b>Right-Margin Handwritten Note:<\/b><\/li><\/ul>\n<p>  &gt; <code>- beginning of collage project<\/code>  <br>  &gt; <code>- what is it doing to be so aware of what I am doing? Will I stifle the flame?<\/code><\/p>", "notes": "", "img": []}, "1995-08-01_Garcia-Marquez-on-Poets": {"t": "García Márquez on Poets", "d": "1995-08-01", "est": true, "w": 1995.5833, "era": "DC, Post-College", "th": ["poetry", "literature"], "pp": ["Gabriel García Márquez"], "body": "<p>There is no one with more common sense, no stonecutter more obstinate, no manger more lucid or dangerous than a poet.<br>Gabriel Garcia Marquez <u>Love in the time of cholera<\/u>.<\/p>", "notes": "Undated, in blue ink; between 7/25 and 8/20/95. \"manger\" is as written; the published translation reads \"no manager more lucid\".", "img": ["attachments/pages/scan_1995_p091.jpg"]}, "1995-07-06_Paintings-with-an-Eye-Hole-and-Slides-to-Take": {"t": "Paintings with an Eye Hole, and Slides to Take", "d": "1995-07-06", "est": true, "w": 1995.5137, "era": "DC, Post-College", "th": ["painting-concepts", "installation", "photography", "public-space"], "pp": ["Caspar David Friedrich", "Cage"], "body": "<p>paintings w/ eye hole in the center: w/ 3D real space inside which echoes aspects of that world represented in the image -<br><code>[sketch: a framed square set into a wall with a small hole in the centre, labelled \"space of undefined size inside the wall\"]<\/code><br><code>[ruled off in the margin:]<\/code> Approach a painting in normal room, light situation changes behind painting &amp; in room see museum space, public space - in a new light<br>→ Shock - makes you blink look again, but really not that different heat sensor - light switch.<br><u>Slides<\/u> - another of someone's finger on the switch of light box<br>- person w/ walk around <s>[?]<\/s> mirror<br>- close up of goggles<br>- person @ Stand in New Haven. - another Friedrich wanderer picture<br>- make the model -<br>I want to move beyond the isolated modern viewer to Cagean - communal s<br>- start to by setting up experience for a series of viewers who will hopefully leave affected by their experience.<br><u>Public Art<\/u> → Exploratoreum.<\/p>", "notes": "Undated; after the 7/6 entry. \"3D\" is a reading of a word partly written over; \"real\" is added above it. The slides list is of photographs still to take of the thesis-year pieces; the \"Friedrich wanderer\" is Caspar David Friedrich's <i>Wanderer above the Sea of Fog<\/i>. The Exploratorium contact is on the inside cover, <span class=\"wl\" data-note=\"1994-12-28_Inside-Cover-Addresses-and-Contacts\">1994 12 28_Inside Cover Addresses and Contacts<\/span>.", "img": ["attachments/pages/scan_1995_p087.jpg"]}, "2026-10-03_Frog-in-the-Boiling-Water": {"t": "Frog in the Boiling Water", "d": "2026-10-03", "est": false, "w": 2026.7555, "era": "Present, Therapy Notes", "th": ["dissociation", "trapped", "childhood-echo", "marriage-crisis"], "pp": [], "body": "<p>I’m not doing well. I don’t want to go home. There is nowhere for me to go.<\/p>\n<p>I feel like when I was a child—confused, vaguely angry, and lost.<\/p>\n<p>I don’t want to be the frog in the boiling water. I see what is happening. It's just when I’m out of the pot, I’m lost. Everything I know and have built is in the pot. I don’t want to be in the pot or out. I don’t know what I want. I just know I’m not happy.<\/p>", "notes": "", "img": []}, "1995-03-11_A-Map-of-New-Haven-for-the-Thesis-Show": {"t": "A Map of New Haven for the Thesis Show", "d": "1995-03-11", "est": false, "w": 1995.1941, "era": "Final Semester Yale 1995", "th": ["installation", "maps", "light", "observation"], "pp": ["John Cage", "Wordsworth", "Ruskin"], "body": "<p>3/11 I am going to make my portable stand - and set it up for six weeks detailing every spot on <s>[?]<\/s> where it sits <s>[?]<\/s> <s>first<\/s> then to present these @ the Thesis show I want to get an enourmous <code>[boxed:]<\/code> map of New Haven which would include all these sites and I will beef each spot up w/ pictures drawings and descriptions of the light situation, and have the box on the roof of the A&amp;A or of Chapel York - where the two projects can converge. -<br>We<br>open our eyes and ears seeing life<br>each day excellent as it is<br>This realization no longer needs art.<br>- John Cage.<br>Alas! Ages must pass away before men will have their eyes open to the beauty and majesty of Truth, and will be taught to venerate Poetry no further than as she is a handmaid....<br>Up! up! my friend, and quit your books.... - William Wordsworth<br>I believe any sensible person would change his pictures, however good, for windows - John Ruskin.<\/p>", "notes": "The portable stand is the one in <span class=\"wl\" data-note=\"1995-02-27_Only-Happy-When-Working-a-Portable-Viewing-Stand\">1995 02 27_Only Happy When Working a Portable Viewing Stand<\/span>; the box on the roof is <span class=\"wl\" data-note=\"1995-03-09_Rooftop-AandA-Piece-Microcosm-Box\">1995 03 09_Rooftop AandA Piece Microcosm Box<\/span>. \"Chapel York\" is probably the corner of Chapel and York Streets, near the A&amp;A. \"Up! up! my friend, and quit your books\" opens Wordsworth's \"The Tables Turned\".", "img": ["attachments/pages/scan_1995_p045.jpg"]}, "1995-03-12_Your-Last-Night-and-the-Dream-of-Falling": {"t": "Your Last Night, and the Dream of Falling", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["mortality", "fear", "solitude", "dreams"], "pp": ["Camus"], "body": "<p><code>[in pencil:]<\/code> It is your last night You have been convicted of a crime you are not guilty of and condemned to death. The prison guards have allowed you one last wish, to run on an empty beach in the evening They have left you for your last few minutes of freedom.<br>Falling makes the decision for you. p. 138 \"mythe...\"<br><s>[?]<\/s> dream to fall is the completed death wish w/out the decision.<br>I wonder if it is the same impulse: when no one is there to help you when you are down - you have tons of friends when you are happy, as that no one will really miss you when you die Millions will live on for thousands of years.<\/p>", "notes": "Undated. The first paragraph is in pencil. \"mythe\" is probably Camus's <i>Le Mythe de Sisyphe<\/i>, which opens on suicide; the page reference is to Marco's edition. On falling, compare <span class=\"wl\" data-note=\"1995-03-12_Vertigo\">1995 03 12_Vertigo<\/span>.", "img": ["attachments/pages/scan_1995_p060.jpg"]}, "1995-01-23_Box-Sketch": {"t": "Box Sketch", "d": "1995-01-23", "est": true, "w": 1995.0603, "era": "Final Semester Yale 1995", "th": ["sculpture-ideas", "drawing"], "pp": [], "body": "<p><code>[sketch: an open box seen from above, with a stepped edge down one side and an object lying inside it, a flat sheet floating above it; an arrow points to the sheet, labelled \"dbl.\"]<\/code><\/p>", "notes": "Undated; it sits at the top of page 24, between the 1/23 entry and the 1/26 entry. \"dbl.\" may mean \"double\".", "img": ["attachments/pages/scan_1995_p024.jpg"]}, "1997_p002_Arles-Photograph-and-Map": {"t": "Arles: Photograph and Map", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["arles", "maps", "photography", "travel"], "pp": [], "body": "<p><b>Page 2:<\/b> A colour photograph pasted on the right half of the page: a close-up of someone's neck and open shirt collar, with the word <code>ARLES<\/code> written on the skin of the neck; a finger points to it. Around it, light pencil sketches: a winding line like a road or river, small buildings, a cylinder, and at the bottom a street with rows of windows. One tiny label near the middle: <code>[Peretures[?] assés[?] 4]<\/code>.<\/p>\n<p><b>Page 3:<\/b> A pencil map of Arles, with a route drawn in pen down the left side.<\/p>\n<ul><li><b>Pen route (top to bottom):<\/b> <code>la mer<\/code> → <code>Arles<\/code> → <code>[sketch: a heart]<\/code> <code>paris<\/code> → <code>Caen[?] Lyon<\/code> → <code>Normandi<\/code><\/li><li><b>Pencil map:<\/b> <code>Gare monoprix<\/code> along a railway line at the top; <code>la Rhone<\/code> curving down the page; <code>ARENES<\/code> (an oval); <code>Amphitheatre<\/code>; a square marked <code>place<\/code> with <code>café café café café<\/code> around it; <code>TOMBES<\/code>; a dot with <code>You are here!<\/code><\/li><\/ul>", "notes": "The photograph and the map seem to belong together (Arles written on the neck, and the map of Arles on the facing page). \"Caen\" is uncertain; the word could be \"Cagen\". The faint writing showing through page 3 is from the next page.", "img": ["attachments/pages/scan_1997_p002.jpg", "attachments/pages/scan_1997_p003.jpg"]}, "1994-06-07_Writing-as-a-Companion-for-Memory": {"t": "Writing as a Companion for Memory", "d": "1994-06-07", "est": false, "w": 1994.4331, "era": "Yale, New Haven", "th": ["memory", "writing-process"], "pp": ["Umberto Eco", "Paul Valéry"], "body": "<p>Well, this is my second straight day of recording my thoughts. I feel like this book has become a sort of companion for my brain. It records the flotsam and jetsam of my thoughts that would otherwise disappear into the ocean of forgotten things. When these thoughts are collected and kept, they can be built upon and stimulate other thoughts. I can then start the rewriting, revising, rethinking which Valéry claimed was essential to making a work of art. There is no one author, he claimed, because the author returns to the work (latent as a closed book) and revises it. The work cannot be isolated from the ongoing flow of the author's mind and life.<\/p>\n<p>I wonder if this process will be similar to what I read in <i>The Idea of Music<\/i> about some Greek philosopher [Socrates] who opposed writing things down because that would mean one wouldn't have to remember—writing, he said, was the first step toward weakening one's memory. I wonder if the narrator of <i>The Name of the Rose<\/i> could actually remember all the lists and details which he restates in his retelling of conversations he witnessed, or if these lists were a means of scholastic pyrotechnics, which Eco says can lead to endless contemplation.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p049.jpg", "attachments/pages/scan_1994_1_p050.jpg"]}, "1998-12-15_Gardner-The-Minds-New-Science-Rationalists-and-Empiricists": {"t": "Gardner, The Mind's New Science: Rationalists and Empiricists", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["reading", "cognition", "epistemology", "language", "play"], "pp": ["Howard Gardner", "Descartes", "Plato", "Locke", "Kant", "Steven Pinker", "Bertrand Russell", "Alfred North Whitehead", "Wittgenstein", "W. V. O. Quine"], "body": "<p>v. short history of Philosophy from Howard Gardner's <u>The Mind's New science<\/u>. Basic Books, 1987<br><u>Descartes<\/u> - he is in someways a throwback to that confident reliance on one's own intuitions, that commitment to the centrality of mathematical thinking, that belief in innate ideas which we associate w/ the Greeks. p. 50<br>- 2 distinct entities - a rational mind &amp; a mechanical body<br>___<br>he devised models of how mental states could exist in a world of sensory experience<br>___<br>Two distinct themes in philosophy ① rationalist - persuasion believe that the mind exhibits powers of reasoning which it imposes upon the world of sensory experience<br><code>[left margin, bracketed:]<\/code> Plato, Descartes - <u>Language Instinct<\/u>. our reality is inherited somehow<br>② empiricists believe that mental processes either reflect, or are constructed on the basis of external sensory impressions.<br><code>[left margin:]<\/code> - sense experience <s>reality<\/s> of nature is in the brain b/c we have learned everything from that <s>reality<\/s> sense experience<br><u>Empiricists<\/u> &lt; relation to phenomenology ?<br><u>Locke<\/u> - sensory experience is the only reliable source of <s>experience<\/s> knowledge.<br>⇒ process by which words come to stand for ideas and make possible abstract or general ideas - ex. general idea of triangle from (or opposed to) a specific triangle.<br>\"Empiricists were suspicious of <u>a priori<\/u> statements and proofs (which they dismissed as unrevealing tautologies), while the rationalists searched for universal principles embodied in pure thought.<br>Kant a kind of grand synthethis.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Russell &amp; Whitehead Logical Empiricism -<br>\"Indeed, this program was in part explicitly anti-kantian for the philosophers wanted to discredit the synthetic a priori notion of mathematical knowledge as being dependent upon experience.\"<br>* Mathematics is based on the general laws of Logic. p. 61<br>thus they propose that it should be possible to give an account of the external world by means of a logical construction from sensory data.<br>Wittgenstein tries in Tractatus <code>[above:]<\/code> to demonstrate logical structure implicit in language.\"<br>___<br>Quine: \"the notion of meaning itself is not clear enough to justify the attribution to certain <s>elements<\/s> statements of \"true by virtue of meaning alone\" or \"true by definition.\" p. 65<br>ex. Euclid seems apriori until<br>* \"Indeed, once one is confronted by others who do not share one's intuitions, there is no way to establish which truths are due to language, which to common experience.\" p. 66.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Wittgenstein - <u>later<\/u>.<br>Now... saw language itself as the spawner of problematic issues, and the exercise of coming to understand how we use language as the therapy for philosophical problems. In his later work Witt. did not try to solve problems but tried rather to show that they arise from a network of terms that have evolved in such a way as to make their disentanglement extremely difficult. As he once commented, his aim in philosophy was <u>to show the fly the way out of the fly-bottle<\/u>. p. 68<br>- language is inherently public or communal.<br>\"it is instructive to think of language as a set of games: we proceed from the fact that we are always involved in many language games - interactions with other individuals in which we move around sets of linguistic counters; and like a set of games each of these little <code>[circled:]<\/code> en counters has its own set of rules. But it is not easy to ferret out these rules b/c they overlap w/ one another; the language games constantly mesh. To add to this tangled state of affairs, words do not have clear, <code>[above:]<\/code> unambiguous meanings, <s>with no definition ever sufficent to account for all and only all, games.<\/s><br><code>[a double line in the margin:]<\/code> The word game itself has a family of meanings, with no definition ever sufficient to account for all and only all, games.<\/p>", "notes": "Undated. Reading notes on Howard Gardner, <i>The Mind's New Science: A History of the Cognitive Revolution<\/i> (Basic Books, 1985/1987). <i>The Language Instinct<\/i> is Steven Pinker's 1994 book. The Wittgenstein pages echo Ron Jones's 1995 lecture on Wittgenstein's games.", "img": ["attachments/pages/scan_1997_2_p063.jpg", "attachments/pages/scan_1997_2_p064.jpg", "attachments/pages/scan_1997_2_p065.jpg"]}, "1999-06-15_A-Day-Without-Time-Figures-in-the-Stars": {"t": "A Day Without Time; Figures in the Stars", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["time", "sky", "history"], "pp": [], "body": "<p>A day w/out time -<br>- The Romans divide the day into AM &amp; PM only<br>-<br>- seeing figures in the stars.<\/p>", "notes": "Undated, in black ink. The third dash is left empty. The faint mirror-writing is page 78 showing through.", "img": ["attachments/pages/scan_1997_2_p077.jpg"]}, "1999-06-15_The-Nobel-Prize-Genius-and-Fate": {"t": "The Nobel Prize, Genius, and Fate", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["ambition", "art-vs-science", "ego"], "pp": ["Albert Einstein", "Niels Bohr"], "body": "<p>[ - Nobel prize on works in genetics that proves the innate unbelievable similarity between human beings. ]<br>The Nobel prize picks a certain genius - like a star who is just like the rest of us. Einstein is a more pleasing character for fame than Bohr because he floats through the world - he forgets. Bohr is a family man who made his own institution.<br><code>[an arrow from the margin:]<\/code> → a sort of subversion of the idea of the Nobel - of rewarding outstandingness<br><u>genius / monster<\/u><br><u>outstanding / rediculous<\/u><br><code>[to the right, with an arrow:]<\/code> <u>fate<\/u> how much does one really accomplish beyond what one's situation has decided?<\/p>", "notes": "Undated; continues the thoughts on genius in <span class=\"wl\" data-note=\"1999-06-15_Genius-in-Science-and-in-Art\">1999 06 15_Genius in Science and in Art<\/span>.", "img": ["attachments/pages/scan_1997_2_p073.jpg"]}, "1999-06-15_Hyper-Media-Text-Etudiant-a-lENSBA": {"t": "Hyper-Media Text; Étudiant à l'ENSBA", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["french", "internet", "technology", "music", "writing-process"], "pp": [], "body": "<p>- <u>Hyper-media text<\/u><br>Toujours interessé par l'informatique j'ai completer dans les deux derniers année plusieurs installation audio-visuel piloté (assisté) par ordinateur. (Max operant sur Macintosh). <code>[an arrow to the margin, written diagonally:]<\/code> j'ai trouver une enorme quantités d'information, le renseignements technique qui m'ont permis de realiser ces projets sur l'internet<br>Je pense beaucoup a l'hypertext sur l'internet comme moyen de diffuser, une quantité d'idées disparatee que je collectionne en cahiers ecrit depuis toujours à la main.<br>La creation d'un ou de CD Rom m'interesse enormement comme moyen de relier des tentatives auditif, visuelle et textuel.<br>Etudiant à l'ENSBA depuis 3 ans, <s>[?]<\/s> je travaille principalement dans les bases techniques de son, video et photo.<br>Intelligent Interfaces<br>Intelligent <s>[?]<\/s> inovative yet parametered music composition<br>to make the bridge from computer world to real world -<\/p>", "notes": "Undated. A draft, in French, of a statement for an application (perhaps for a course, a grant or a job in multimedia). \"Étudiant à l'ENSBA depuis 3 ans\" — at the École nationale supérieure des Beaux-Arts for three years — dates it to about 1999 (Marco started there in 1996); the date is an estimate. The English lines at the bottom are notes for the same statement.", "img": ["attachments/pages/scan_1997_2_p067.jpg"]}, "1997_p030_An-Environment-of-Pressures": {"t": "An Environment of Pressures", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["installation", "sensors", "interactivity", "sound", "immersion"], "pp": [], "body": "<p>Not one captor = one action → only though it could.<br>an environment of pressures which will model an evironment of differences<br>possibilities → ① open door / closed dor<br>② standing in a particular spot (wisper arch phen.)<br>③ number of people in the room.<br>④ certain objects<br>⑤ roaving random wariors.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>→ sense of warmth, danger &amp; nostalgia, diff groups of poems images. Diff. types of immersion.<br>Web of connections → closed door likes open book<br>- temperature<br>- time of year, weather<br>→ control radio → channels, volume<br>spacialization<br>→ building sounds - own making - hammering<br>large wall projection<br>→ Something rare large &amp; beautiful, sunset blue<\/p>", "notes": "Plans for a room whose sound responds to sensors (\"captor\", from the French <i>capteur<\/i>): doors, where people stand, how many there are. \"wisper arch phen.\" is the whispering-gallery effect.", "img": ["attachments/pages/scan_1997_p030.jpg", "attachments/pages/scan_1997_p031.jpg"]}, "1995-07-01_Sweet-Tarts-in-Jackson-Mississippi": {"t": "Sweet-Tarts in Jackson, Mississippi", "d": "1995-07-01", "est": true, "w": 1995.5, "era": "DC, Post-College", "th": ["poetry", "travel"], "pp": [], "body": "<p>Travelling is so wonderful, for some reason it frees your thoughts.<\/p>\n<p>Pocahantas<br>Sweet-Tarts<br>Bought at Wal-Mart<br>In Jackson, Mississippi<br>More candy than I could ever eat myself<br>for <s>$<\/s> 68 <s>¢<\/s> cents<br>I got to share them with others<br>and watch the grimaces as<br>the Disney caracters were<br>cracked between teeth<br>painfull but fulfilling<br>I like that: Sweet-Tart<\/p>", "notes": "Undated. Disney's <i>Pocahontas<\/i> came out in June 1995, which fits a summer 1995 trip to Jackson, Mississippi.", "img": ["attachments/pages/scan_1995_p084.jpg"]}, "1998-08-01_Bricoleur-Levi-Strauss": {"t": "Bricoleur - Lévi-Strauss", "d": "1998-08-01", "est": true, "w": 1998.5833, "era": "Paris, Beaux-Arts", "th": ["french", "bricolage", "reading", "art-theory"], "pp": ["Lévi-Strauss"], "body": "<p>Bricoleur - Levy Strauss.<br>→ celui qui dévie l'usage d'un univers clos d'instruments<br>«son univers instrumentale est clos»<br>s'arranger avec les \"moyens du bord\"<br>résultat contingent de toutes les occasions qui se sont presentées de renouveler ou dénrichir le stock ou de l'entretenir avec les résidus de constructions et de destructions anterieures. «ça peut toujours servir».<\/p>\n<p>percepts / concepts.<br>entre image et concept : c'est le signe. (un lien)<br>\"ces (du bricoleur) possibilités demeurent toujours limitées par l'histoire particulière de chaque piece, et par ce qui subsiste en elle de prédéterminé, dû à l'usage originel pour lequel elle a été conçu.<br>→ bricoleur dans l'age industriel ←<br>faire avec ce que fourni l'industrie. <code>[under \"avec\", an insertion mark:]<\/code> art?<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>les éléments que collectionne et utilise le bricoleur sont «précontraints» → mais l'ingenieur aussi.<br>tous dépends sur où sont placé les limites - est ce qu'on veut dépassé ses moyens<br>le bricoleur est plus proche de l'experimentation l'ingenieur de l'application.<br>le savant ne dialogue jamais avec la nature pure, mais avec un certain état du rapport entre la nature et la culture.<br><code>[bracketed, with a question mark in the margin:]<\/code> ingenieur cherche toujours à s'ouvrir un passage et à se situer <u>au-dela<\/u>, tandis que le bricoleur de gré ou de force demeure <u>en deçà<\/u><br>Ingenieur n'interroge pas l'univers, le scientiste peut-être. Ing. utilise les découvertes des scientistes. Donc l'ingenieur s'adresse à une collection de residus de découvertes humaines.<\/p>", "notes": "Undated. Reading notes on the \"bricoleur\" in Claude Lévi-Strauss, <i>La Pensée sauvage<\/i> (1962), chapter 1, mixed with Marco's own comments (\"→ mais l'ingenieur aussi\", \"Donc l'ingenieur…\").", "img": ["attachments/pages/scan_1997_2_p002.jpg", "attachments/pages/scan_1997_2_p003.jpg"]}, "1999-06-15_Navigateur-Proust-et-le-Monde-Sensible": {"t": "Navigateur; Proust et le Monde Sensible", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["french", "reading", "literature", "perception", "art-theory"], "pp": ["Jean-Pierre Richard", "Marcel Proust", "Georges Poulet", "Andy Warhol", "Dechimère", "Brillat-Savarin", "Voltaire", "Michel Foucault", "Roland Barthes"], "body": "<p>navigateur: <code>[sketch: a sailboat with an arrow showing the wind and another its course]<\/code> il faut trouver <code>[above:]<\/code> le meilleur l'angle <code>[below:]<\/code> de la voile pour avancer<br>art: combinaison entre sensible et idées → singularisation<br><u>Proust et le monde sensible<\/u> - JP Richard<br>soulevement oblique - ce n'est qu'une petite chose la minuscule liberté de quelqu'un ecrasé par sa culture.<br>Poulet - <u>La distance Interieur<\/u> <code>[to the right, in darker ink:]<\/code> Warhol - Starburst.<br>ressort qui s'échappe<br>poudrement de la star dans toutlemonde - artistamo<br>- Dechimere - je <s>suis<\/s> veux être dans le monde mais pour y être je dois le détruire.<br><s>Brillatt<\/s> Savarin. Physiologie du Goût.<br>Calas - Voltaire / Damien - Foucault <u>Surveillance<\/u> etc<br>volonté - involonté - Proust Barthes -<\/p>", "notes": "Undated; reading notes in French, probably for a course or seminar. Jean-Pierre Richard, <i>Proust et le monde sensible<\/i> (1974); Georges Poulet, <i>La Distance intérieure<\/i> (1952); Brillat-Savarin, <i>Physiologie du goût<\/i> (1825). Voltaire defended Jean Calas; Foucault opens <i>Surveiller et punir<\/i> with the execution of Damiens. \"Dechimère\" and \"artistamo\" are as written and not identified.", "img": ["attachments/pages/scan_1997_2_p076.jpg"]}, "1998-10-15_Track-and-Pulley-Machine-Sketches": {"t": "Track and Pulley Machine Sketches", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["sculpture-ideas", "engineering"], "pp": [], "body": "<p><code>[sketch: a figure standing on a box on a sloped base, under a frame with two pulleys and a belt; a funnel on a tall line at the top, an arrow pointing down]<\/code><br><code>[sketch: a rectangular frame of vertical bars, labelled \"supporting structure\" and \"tracks (circular tube)\"]<\/code><br><code>[sketch: a post with pulleys at the top and bottom, a diagonal brace, and an arm with a weight]<\/code><br><code>[sketch: two right-angled frames with rows of wheels along their base, an arrow between them]<\/code><\/p>", "notes": "Undated; drawings only, like the pulley sketches in <span class=\"wl\" data-note=\"1998-10-15_Pulley-and-Frame-Sketches\">1998 10 15_Pulley and Frame Sketches<\/span>.", "img": ["attachments/pages/scan_1997_2_p017.jpg"]}, "1998-10-15_Hong-Kong-and-First-Thoughts-of-Japan": {"t": "Hong Kong, and First Thoughts of Japan", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["travel", "japan", "television", "turrell", "solitude"], "pp": ["Agus", "Turrell", "Miwa"], "body": "<p>-<br>Hongkong very clean very modern - I unfortunately didn't eat very well nor did I get the picture of the shipping docks w/ all of HK's exports, which you can see best from the over pass on the way to the airport<br><code>[in blue:]<\/code> The senses full - Agus w/ both TV &amp; Radio on at full blast. <s>[?]<\/s> Mid day super sugar 4 preadolescent girls doing doing-bop video w/ every video effect, imaginable<br>Insane Japanese television - w/ stars appearing on contest shows and ex-famous athletes who are now comedians preparing &amp; to participate in an aerobics championship semi-real semi-planned <code>[in the margin:]<\/code> televised pool tournament between music stars.<br>Screech Parlor of Japanese women singers<br>Japanese TV is very funny - and the Japanese are very friendly similar - freek show Barbie boy surgery &amp; the S. American mini-dwarf<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>went to Turrell exhibition in Tokyo. not a great way to see his pieces. Japanese are very noisy. Museum experience doesn't work you really need quiet or the bubble is burst - is this a weakness?.<br>I thought of <s>[?]<\/s> home or street alterings which one could notice or love even w/ a crowd of people doing thinking other things around you. You have to love something in commotion, in <u>different types of commotion<\/u> - and they are all different - in order to be happy in the world. The poor person who wanders around looking for places where they can be absolutely alone, quiet to their own thoughts, only to have this peace and stillness shattered by any individual just going about his own business, will be unhappy. - Does this thought doom nature?<br>1st thoughts of Japan - heated toilet seat w/ water spray and automated lighting system in Miwa's parent's house. And a cement floored cave w/ railings &amp; piped in music w/ titles such as \"moon landscape\", and \"old man's staff\" painted on marble plaques.<\/p>", "notes": "Undated; a trip through Hong Kong to Japan, the first in this notebook. The Hong Kong paragraph is in black, the rest in blue. Agus is not identified. Miwa's parents' house is mentioned again on the next pages. Turrell had several exhibitions in Tokyo in the 1990s; which one this was isn't said.", "img": ["attachments/pages/scan_1997_2_p007.jpg", "attachments/pages/scan_1997_2_p008.jpg"]}, "1995-03-12_Stevens-on-the-Stand": {"t": "Stevens on the Stand", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["installation", "poetry", "perspective", "light"], "pp": ["Wallace Stevens"], "body": "<p>I want to put Steven's' poem \"An Ordinary Evening in New Haven\" ch. IX on my stand on the roof of the A&amp;A. I want to put two scrims on buildings where the sun rises to catch its light &amp; glow.<br><code>[sketch: two lines meeting at an angle, like a view from a point]<\/code> perspective - I can get you to see what I want you to see if I know where you are going to stand.<\/p>", "notes": "Undated. Section IX of Wallace Stevens's \"An Ordinary Evening in New Haven\" (1950) begins \"We keep coming back and coming back / To the real\".", "img": ["attachments/pages/scan_1995_p057.jpg"]}, "1998-12-15_The-Artist-Like-Part-of-a-Cell": {"t": "The Artist Like Part of a Cell", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["art-theory", "systems", "meaning-in-art"], "pp": [], "body": "<p>The artist like a part of a cell the lowly doer. But someone else (makes) meaning <code>[below, as an alternative:]<\/code> creates - divulges meaning<br>in the same way that no one knows <s>[?]<\/s> where to draw the line for the life of a cell, or simple organism <s>so<\/s> one <s>knows<\/s> cannot <s>where to<\/s> draw the line for the life of a meme<\/p>", "notes": "Undated. \"in the same way\" and \"draw the line for\" are written above the line as insertions.", "img": ["attachments/pages/scan_1997_2_p050.jpg"]}, "1994-07-21_Problem-with-Pre-Recorded-Music-in-Art": {"t": "The Problem with Pre-Recorded Music in Art", "d": "1994-07-21", "est": false, "w": 1994.5548, "era": "Yale, New Haven", "th": ["sound-art", "music", "reference-frames"], "pp": [], "body": "<p>The problem with using music in an installation is that it connotes so many other things: the instruments, the time when the composer lived, previous associations about this music by the listener, the performance, the recording, the stereo. Should I write the sound myself, or look at some modern composers who are obscure enough as not to have created a reference frame?<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p119.jpg"]}, "1994-07-30_Clouds-Screens-Colored-Filters-and-Shadow-Rooms": {"t": "Cloud Spaces, Screens & Colored Filter Shadow Room", "d": "1994-07-30", "est": false, "w": 1994.5795, "era": "Summer 1994, Travel and Alps", "th": ["sculpture-ideas", "clouds", "screens", "light-and-shadow", "color-filters", "installation"], "pp": ["Erica", "Albert Camus"], "body": "<p>I was excited by the feeling I got in the plane when we were inside the cloud layers. I thought right away of ways I could recreate such a feeling in a sculpted space.<\/p>\n<p>My first idea was rather basic: room full of cloud like materials which the viewer can pass through. <i>[Sketch of cube room]<\/i> I would especially like the effect of passing through a cloud, not under, over or around a cotton representation of one—that is a marvelous feature of clouds, that one can never experience their surface, it does not exist up close, only from afar. Even if a parachuter jumped from the plane onto the soft white billowing surface he would go right through and never be quite sure at what point he passed through what he had thought was a surface. If someone in a plane took a movie of his jump they could approximate maybe even name a point to a certain degree of accuracy at which he actually penetrated that surface, but everything in which I am interested lies in that degree of accuracy.<\/p>\n<p><b>My second idea (warmer):<\/b><br>When you look at it from afar, it looks like a solid wall — but when you approach it you realize that it is actually possible to pass right through.<\/p>\n<ul><li>What about the wood slats?... <code>&lt;- SCREENS!<\/code> — ocean waves.<\/li><li>This is about the excitement I had about layers, textures on top <i>[crosshatch sketch]<\/i> — ocean waves w/ wind, earth layers evident in mountains etc &amp; even about Erica's photographs of the chalk boards which have their own kind of history of layered sediment (marks representing thought or all kinds of diagrams really—which stimulate thought?)<\/li><li>The beginning of <i>Le Premier Homme<\/i>.<\/li><\/ul>\n<p>I remember when I was much younger, erasing all the smudges and stray marks off of a drawing I had done &amp; not liking it anymore, it became stale to me. I then remember making drawing where I would intentionally smudge things and leave stray marks because I wanted it to have the same feel as the drawing I had ruined by cleaning up. I didn't like this second drawing either because the smudges etc. were contrived &amp; didn't add to the life of the drawing (<code>; (these are words<\/code> <code>[unclear/edge clipped] now I wouldn't have used them<\/code>).<\/p>\n<h4>Translucent Slats, RGB Filters &amp; the Black Wall<\/h4>\n<p>The shadows would multiply &amp; get complicated in the crossings of slated planes, it could become dense enough that it would be impossible to see through, or completely dark in the back from a lighted front.<\/p>\n<p>Layers of plastic of different colors could create complete blackness. It would require a passage through these films to realize that the piece was made up of many colored translucent sheets. I just screwed [my] red &amp; green filters together which created a beautiful brown (warm)—I would need blue to make it black (or grey). I could not tell, once screwed together which side was red &amp; which green. I took them apart and held them in line about an inch apart so that I saw only brown through one eye, and noticed that the light, which was on an angle cast the shadows of green &amp; red of the individual filters — might be possible to make a thick frame around each one which would make it impossible to see the color of the gels except by the shadows that would be cast — I might build a special shadow capturer.<\/p>\n<ul><li>w/ my room w/ lattice layers, shall I paint the back wall black? Or... just got a great idea, viewer enters the dark area sees black wall but as he works his way through to the front, it is illuminated by a large window, and the visual effect from the beginning is no longer evident, it has been made evident.<\/li><\/ul>", "notes": "<i>[Diagrams: <code>Front<\/code> square view of wave/horizon strips -&gt; <code>Side<\/code> staggered vertical hanging strips; <code>I could maybe achieve such an effect with glass.<\/code> -&gt; <code>Front<\/code> horizon panel -&gt; angled layered glass partitions &amp; snaking visitor path diagram; <code>more layers would probably be needed to have this effect at all<\/code>]<\/i><br><i>[Diagram: <code>light -&gt;<\/code> shining at an angle across four framed colored sheets (<code>looks black<\/code>) casting separated <code>rainbow shadows<\/code> below.]<\/i>", "img": ["attachments/pages/scan_1994_2_p021.jpg", "attachments/pages/scan_1994_2_p022.jpg", "attachments/pages/scan_1994_2_p023.jpg"]}, "1995-01-11_Room-for-Two-Viewers": {"t": "Room for Two Viewers", "d": "1995-01-11", "est": true, "w": 1995.0274, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "intimacy"], "pp": [], "body": "<p><code>[sketch: a small room with high windows and two chairs facing each other, each inside an oval, a red hanging on the wall to the left and a light hanging from the ceiling between them]<\/code><br>← high windows.<br>- Comfortably small. You shouldn't feel like you are in a place that is to vast for intimate conversation<br>red wall hanging → to make even sharper the green out line on each person.<br>space for two viewers<br>scrim? - to block window light - confessional?<br>↓<br>But no hierarchy no side is weighted.<\/p>", "notes": "Undated; it follows the 1/11/95 entry. \"The green out line on each person\" may refer to the afterimage a red wall leaves around a figure.", "img": ["attachments/pages/scan_1995_p012.jpg"]}}, "conns": [{"a": "1994-07-09_Yale-as-a-Trial-by-Fire", "b": "2026-11-11_Yale-Meat-Market-and-Cibone-Show", "label": "Yale social tension & judgment across decades", "source": "timeline", "color": "2", "also": ""}, {"a": "1994-07-31_Control-and-Batesons-Meta-Language", "b": "2026-10-21_Dread-of-Being-Seen", "label": "Echo (32 yrs): control, manipulation & dread of being seen", "source": "timeline", "color": "1", "also": ""}, {"a": "1994-08-06_Dads-Cards-Katherines-Colors-and-Mountain-Textures", "b": "2026-10-21_Dads-Super-8s-and-Lana", "label": "Father bond & distance across decades", "source": "timeline", "color": "6", "also": ""}, {"a": "1994-08-20_Draft-Letter-to-Katherine", "b": "2026-10-21_Miwa-K const N = DATA.notes, C = DATA.conns;

const SOURCE = {timeline: "drawn on the timeline canvas", notes: "linked in the notes", themes: "suggested: written far apart, sharing uncommon themes"};
const span = c => N[c.b].w - N[c.a].w;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fdate(n) {
  const m = n.d.match(/^(\d{4})(?:-(\d{2})-(\d{2}))?/); if (!m) return n.d;
  const s = m[2] ? `${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}` : m[1];
  return n.est ? s + " (estimated)" : s;
}
function fgap(y) {
  if (y >= 1.5) return Math.round(y) + " yrs";
  if (y >= 0.95) return "1 yr";
  if (y >= 0.08) return Math.round(y * 12) + " mo";
  const d = Math.round(y * 365); return d <= 0 ? "same day" : d + (d === 1 ? " day" : " days");
}
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

// ---------- state

C.forEach(c => { (byNote[c.a] ||= []).push(c); (byNote[c.b] ||= []).push(c); });
function visible() {
  const q = state.q.toLowerCase();
  return C.filter(c => (state.src === "all" || c.source === state.src) && span(c) >= state.span &&
    (!q || (c.label + " " + c.also + " " + N[c.a].t + " " + N[c.b].t + " " + N[c.a].body + " " + N[c.b].body).toLowerCase().includes(q)));
}

// ---------- timeline scale: each year with notes gets room; empty stretches are squeezed
const years = {}; Object.values(N).forEach(n => { const y = Math.floor(n.w); years[y] = (years[y] || 0) + 1; });
const ys = Object.keys(years).map(Number).sort((a, b) => a - b);
const segs = []; let pos = 0;
ys.forEach((y, i) => {
  if (i && y !== ys[i-1] + 1) { segs.push({brk: true, x0: pos, from: ys[i-1] + 1, to: y - 1}); pos += 0.7; }

const TOTAL = pos;
function xOf(w) { const y = Math.floor(w), s = segs.find(s => s.y === y); return s ? s.x0 + (w - y) * s.w : 0; }

    const d = Math.abs(x2 - x1), h = Math.min(base - 6, 6 + d * 0.32), k = keyOf(c);
    const cls = "arc" + (k === selKey ? " sel" : visKeys.has(k) ? "" : " dim");
    out += `<path class="${cls}" data-i="${i}" stroke="${color(c)}"${c.source === "themes" ? ' stroke-dasharray="4 3"' : ""} d="M${x1},${base} C${x1},${base - h} ${x2},${base - h} ${x2},${base}"/>`;
  });
  Object.entries(N).forEach(([stem, n]) => {
    const on = state.sel && (state.sel.a === stem || state.sel.b === stem);
    out += `<circle class="dot${on ? " sel" : ""}" cx="${X(n.w)}" cy="${base}" r="${on ? 4.5 : 2.2}"/>`;
  });
  svg.innerHTML = out;
}

// ---------- list
function drawList(vis) {
  const L = document.getElementById("list");
  if (!vis.length) { L.innerHTML = `<div class="empty">No connections match.</div>`; return; }
  const selKey = state.sel && keyOf(state.sel);
  L.innerHTML = vis.map(c => `<div class="item${keyOf(c) === selKey ? " sel" : ""}" data-i="${C.indexOf(c)}">
      <div class="lab"><span class="swatch" style="background:${color(c)}"></span><span class="gap">${fgap(span(c))}</span>${esc(c.label || "(no label)")}</div>
      <div class="dates">${fdate(N[c.a])} → ${fdate(N[c.b])}</div></div>`).join("")
    + `<div class="hint">↑ ↓ or j k to move through the list</div>`;
  const s = L.querySelector(".sel"); if (s) s.scrollIntoView({block: "nearest"});
}

// ---------- the pair
function pane(stem, other) {
  const n = N[stem];
  const links = (byNote[stem] || []).filter(c => keyOf(c) !== keyOf(state.sel))
    .map(c => { const o = c.a === stem ? c.b : c.a;
      return `<button data-i="${C.indexOf(c)}" title="${esc(c.label)}"><span class="g">${fgap(span(c))}</span>${esc(N[o].t)} · ${fdate(N[o]).replace(" (estimated)", "")}</button>`; }).join("");
  return `<div class="meta">${fdate(n)}${n.era ? " · " + esc(n.era) : ""}</div>
    <h2>${esc(n.t)}</h2>
    <div class="chips">${n.th.map(t => `<span class="chip">${esc(t)}</span>`).join("")}${n.pp.length ? `<span class="chip">👤 ${esc(n.pp.join(", "))}</span>` : ""}</div>
    ${links ? `<div class="others">Also connected to:<br>${links}</div>` : ""}
    <article>${n.body}</article>
    ${n.notes ? `<details><summary>Transcription notes</summary><div class="callout">${n.notes}</div></details>` : ""}
    ${n.img.length ? `<details class="scan"><summary>Show the scanned page${n.img.length > 1 ? "s" : ""}</summary>${n.img.map(p => `<img loading="lazy" src="${esc(p)}" alt="">`).join("")}</details>` : ""}`;
}
function drawPair() {
  const c = state.sel, B = document.getElementById("bridge");
  if (!c) { B.innerHTML = ""; document.getElementById("left").innerHTML = document.getElementById("right").innerHTML = ""; return; }
  B.innerHTML = `<div class="lab"><span class="swatch" style="background:${color(c)}"></span>${esc(c.label || "(no label)")}</div>
    <div class="sub">${fgap(span(c))} apart · ${SOURCE[c.source]}</div>
    ${c.also ? `<div class="also">In the note: ${esc(c.also)}</div>` : ""}`;
  for (const [id, stem, other] of [["left", c.a, c.b], ["right", c.b, c.a]]) {
    const P = document.getElementById(id); P.innerHTML = pane(stem, other); P.scrollTop = 0;
    P.querySelectorAll(".wl").forEach(w => {
      const t = w.dataset.note, hit = (byNote[stem] || []).find(x => x.a === t || x.b === t);
      if (hit) { w.classList.add("go"); w.onclick = () => select(hit); }
    });
  }
}

// ---------- wiring
function select(c) { state.sel = c; history.replaceState(null, "", "#" + encodeURIComponent(keyOf(c))); render(); }
function render() {
  const vis = visible();
  document.getElementById("count").textContent = `${vis.length} of ${C.length} connections`;
  drawList(vis); drawTimeline(vis); drawPair();
}
document.getElementById("list").addEventListener("click", e => { const it = e.target.closest(".item"); if (it) select(C[+it.dataset.i]); });
document.getElementById("panes").addEventListener("click", e => { const b = e.target.closest(".others button"); if (b) select(C[+b.dataset.i]); });
const svg = document.getElementById("svg"), tip = document.getElementById("tip");
svg.addEventListener("click", e => { const a = e.target.closest(".arc"); if (a) select(C[+a.dataset.i]); });
svg.addEventListener("mousemove", e => {
  const a = e.target.closest(".arc");
  if (!a) { tip.style.opacity = 0; return; }
  const c = C[+a.dataset.i], r = document.getElementById("timeline").getBoundingClientRect();
  tip.innerHTML = `<b>${fgap(span(c))}</b> · ${esc(c.label || "(no label)")}<br>${esc(N[c.a].t)} → ${esc(N[c.b].t)}`;
  tip.style.left = Math.min(e.clientX - r.left + 12, r.width - 350) + "px"; tip.style.top = (e.clientY - r.top + 12) + "px"; tip.style.opacity = 1;
});
svg.addEventListener("mouseleave", () => tip.style.opacity = 0);
document.querySelectorAll("#src button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#src button").forEach(x => x.setAttribute("aria-pressed", x === b));
  state.src = b.dataset.v; render();
});
document.getElementById("span").onchange = e => { state.span = +e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const vis = visible(); if (!vis.length) return;
  const i = vis.findIndex(c => state.sel && keyOf(c) === keyOf(state.sel));
  if (e.key === "ArrowDown" || e.key === "j") { select(vis[Math.min(vis.length - 1, i + 1)]); e.preventDefault(); }
  if (e.key === "ArrowUp" || e.key === "k") { select(vis[Math.max(0, i - 1)]); e.preventDefault(); }
});
window.addEventListener("resize", () => drawTimeline(visible()));
const fromHash = decodeURIComponent(location.hash.slice(1));
state.sel = C.find(c => keyOf(c) === fromHash) || C[0];
render();
</script>
</body>
</html>
