<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connections across time</title>
<style>
:root {
  --bg: #f7f5f0; --panel: #fffdf9; --ink: #26231f; --muted: #7a736a; --faint: #e7e2d9;
  --line: #d9d2c6; --accent: #8a5a2b; --chip: #efe9df; --sel: #fbf1e3;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1a18; --panel: #232220; --ink: #ece6dc; --muted: #a39b8f; --faint: #34312d;
          --line: #46423c; --accent: #e0a96d; --chip: #34312d; --sel: #3a3128; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; overflow: hidden; }

header { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding: 12px 20px 8px; }
header h1 { font: 600 19px/1.2 var(--serif); margin: 0; letter-spacing: .01em; }
header .count { color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-left: auto; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 5px 10px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select, input[type=search] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 8px; }
input[type=search] { width: 200px; }
.controls label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

#timeline { padding: 0 20px; position: relative; }
#timeline svg { width: 100%; height: 150px; display: block; }
.arc { fill: none; stroke-width: 1.4; opacity: .55; cursor: pointer; }
.arc:hover { opacity: 1; stroke-width: 2.6; }
.arc.dim { opacity: .08; }
.arc.sel { opacity: 1; stroke-width: 3.2; }
.dot { fill: var(--muted); }
.dot.sel { fill: var(--accent); r: 4.5; }
.axis { stroke: var(--line); }
.yr { fill: var(--muted); font-size: 11px; text-anchor: middle; }
.brk { fill: var(--muted); font-size: 11px; text-anchor: middle; }
#tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px;
  padding: 5px 8px; border-radius: 6px; max-width: 340px; opacity: 0; transition: opacity .1s; }

main { display: grid; grid-template-columns: 290px 1fr; min-height: 0; border-top: 1px solid var(--line); }
#list { overflow-y: auto; border-right: 1px solid var(--line); padding: 4px 0; }
.item { padding: 9px 14px 9px 16px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--faint); }
.item.sel { background: var(--sel); border-left-color: var(--accent); }
.item .gap { font: 600 12px var(--sans); color: var(--accent); margin-right: 6px; }
.item .lab { font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .dates { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.empty { padding: 20px; color: var(--muted); font-size: 14px; }

#pair { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
#bridge { padding: 12px 22px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
#bridge .lab { font: 500 17px/1.35 var(--serif); }
#bridge .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
#bridge .also { color: var(--muted); font-size: 12.5px; margin-top: 4px; font-style: italic; }
#panes { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { overflow-y: auto; padding: 18px 26px 40px; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane .meta { color: var(--muted); font-size: 12.5px; letter-spacing: .02em; }
.pane h2 { font: 600 21px/1.3 var(--serif); margin: 4px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.chip { background: var(--chip); border-radius: 20px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
.others { margin: 10px 0 4px; font-size: 12.5px; color: var(--muted); }
.others button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 6px; padding: 3px 8px; margin: 3px 4px 0 0; cursor: pointer; text-align: left; }
.others button:hover { border-color: var(--accent); }
.others button .g { color: var(--accent); font-weight: 600; margin-right: 4px; }
article { font: 17px/1.62 var(--serif); margin-top: 14px; }
article p { margin: 0 0 .85em; }
article h4 { font: 600 15px var(--sans); margin: 1.2em 0 .4em; }
article ul { padding-left: 1.2em; margin: 0 0 .85em; }
article code { font: 14px/1.4 ui-monospace, Menlo, monospace; background: var(--chip); padding: 0 3px; border-radius: 3px; color: var(--muted); }
article hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.wl { border-bottom: 1px dotted var(--accent); }
.wl.go { cursor: pointer; color: var(--accent); }
details { margin-top: 16px; font-size: 14px; color: var(--muted); }
details summary { cursor: pointer; }
details .callout { margin-top: 8px; line-height: 1.5; }
details img { width: 100%; margin-top: 10px; border-radius: 4px; }
.hint { color: var(--muted); font-size: 12px; padding: 8px 16px 14px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } #list { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #panes { grid-template-columns: 1fr; } .pane + .pane { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Connections across time</h1><span class="count" id="count"></span>
  <div class="controls">
    <div class="seg" id="src">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="timeline" aria-pressed="false">Timeline canvas</button>
      <button data-v="notes" aria-pressed="false">Links in notes</button>
      <button data-v="themes" aria-pressed="false">Suggested</button>
    </div>
    <label>Apart by <select id="span">
      <option value="0">any time</option><option value="0.08">a month or more</option>
      <option value="1">a year or more</option><option value="10">ten years or more</option></select></label>
    <input type="search" id="q" placeholder="Search labels and text">
  </div>
</header>
<div id="timeline"><svg id="svg"></svg><div id="tip"></div></div>
<main>
  <div id="list"></div>
  <section id="pair"><div id="bridge"></div><div id="panes"><div class="pane" id="left"></div><div class="pane" id="right"></div></div></section>
</main>
<script>
const DATA = {"notes": {"1998-12-15_Hong-Kong-River-and-the-Loneliness-of-Picture-Taking": {"t": "Hong Kong River, and the Loneliness of Picture Taking", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["photography", "memory", "solitude", "city"], "pp": [], "body": "<p>I recall more often than any other memory of my few days in Hongkong - a scene by a river between tall housing projects - but not crowded by them - many boys were fishing in this green seen filled cement trough of a river - I watched the fishing for <s>[?]<\/s> quite a while maybe 45 minutes but never took the picture - the scene wasn't dense enough for a photo.<br>- like the rue des Ecoles when biking back from Bastille, like Connecticut avenue near <code>[above:]<\/code> the begining of the uptown, there is something too spread out about these places -<br>There is a deep loneliness in picture taking<br>- Underlines perhaps how singular everyones view point really is - by showing us the singularity of the photographer's vision - his vision is condensed - b/c a photo condenses What was in front of his eyes becomes condensed &amp; small what was behind becomes enourmous and empty. <code>[a bracket in the right margin, with:]<\/code> needs further explanation.<br>When I take a picture the whole 360° of spherical experience is around me - This is condensed into the visual part that fits into a picture. I take this picture and place it on a white wall w/ enourmous amounts of white space around it &amp; behind me when I look at it on this wall. The viewer steps into the photographer's loneliness. when he moves before the image<\/p>", "notes": "Undated. The Hong Kong trip is in <span class=\"wl\" data-note=\"1998-10-15_Hong-Kong-and-First-Thoughts-of-Japan\">1998 10 15_Hong Kong and First Thoughts of Japan<\/span>; the rue des Écoles and Connecticut Avenue also appear in <span class=\"wl\" data-note=\"1998-10-15_Places-Remembered-Houston-Ecoles-Skye\">1998 10 15_Places Remembered Houston Ecoles Skye<\/span>. \"seen filled\" is probably \"scum filled\" or \"weed filled\".", "img": ["attachments/pages/scan_1997_2_p054.jpg"]}, "1995-07-01_Pocahontas-the-Perfect-Crush": {"t": "Pocahontas, the Perfect Crush", "d": "1995-07-01", "est": true, "w": 1995.5, "era": "DC, Post-College", "th": ["poetry", "mass-culture", "technology"], "pp": ["Beethoven", "O. J. Simpson"], "body": "<p>Pocahantas<br>The perfect crush<br>Ethnic and athletic<br>a tom-boy woman<br>out for her own<br>in nature<br>perfectly attractive in her unattainableness<br>The bright colored computer generated<br>character opens your heart your imagination<br><s>You have<\/s> Yet the image remains of the fat animator<br>at his computer choosing the perfect<br>colors and calculating the cuteness<br>factor in large eyes or a head that<br>is too big for her body, but<br>for some reason when you are<br>off your guard, she gets you<br>like she gets millions like you<br>somehow Disney knows something<br>human they've converted it into pixels and charts<br>but it works, cause they've targeted<br>your soft-spot and you don't have<br>enough defense to ward off all<br><s>the onslaughts of commercialism<\/s><br><s>pointed<\/s> <s>towards<\/s> <s>mass<\/s> <s>mentality<\/s><br>of commercialism's pointed onslaughts<br><s>to create mass mentality<\/s><br>and you are caught in the flow<br>of mass mentality<br><code>[right margin, written at an angle, with an arrow from \"somehow Disney knows something human\":]<\/code> The same human something that is responcible for the increased sale of white Ford Bronco's after the OJ trial or that human something Beethoven was after? can they be separated?<\/p>", "notes": "Undated poem draft, following on from <span class=\"wl\" data-note=\"1995-07-01_Sweet-Tarts-in-Jackson-Mississippi\">1995 07 01_Sweet Tarts in Jackson Mississippi<\/span>. Disney's <i>Pocahontas<\/i> was released in June 1995; the O. J. Simpson trial ran through 1995 (the white Ford Bronco was from the June 1994 chase). \"Ford Bronco's\" is partly cut off at the edge of the scan.", "img": ["attachments/pages/scan_1995_p085.jpg"]}, "1998-10-15_Orbit-Sketches": {"t": "Orbit Sketches", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["drawing", "geometry", "sculpture-ideas"], "pp": [], "body": "<p><code>[sketch ①: an egg-shaped loop with two points on its rim, curved lines fanning between them, and an arrow rising vertically from one point]<\/code><br><code>[sketch: a tall ellipse with a point at top and bottom and a vertical axis line, an arrow rising beside it]<\/code><br><code>[sketch: an egg shape on a vertical axis with two small circles at the top and a long curve sweeping down from it]<\/code><br><code>[sketch: a large circle with a smaller circle joined to it by two lines, like a lever or crank, an arrow showing rotation]<\/code><br><code>[sketch: an ellipse with a small figure at its left end, a point on its long axis, and a rod and lever reaching to a wheel on the right]<\/code><\/p>", "notes": "Undated; drawings only. They may be diagrams of orbits or of mechanisms; the pulley sketches on the next page (<span class=\"wl\" data-note=\"1998-10-15_Pulley-and-Frame-Sketches\">1998 10 15_Pulley and Frame Sketches<\/span>) are similar in style.", "img": ["attachments/pages/scan_1997_2_p009.jpg"]}, "1994-07-26_James-Turrell-Sacred-Architecture-and-Roden-Crater": {"t": "James Turrell, Sacred Architecture & Roden Crater (Pages 78–79)", "d": "1994-07-26", "est": false, "w": 1994.5685, "era": "Yale, New Haven", "th": ["architecture", "land-art", "roden-crater", "sky", "space", "solitude"], "pp": ["James Turrell", "Marcel Proust", "Roberto Crippa"], "body": "<p>Pasted essay pages (likely Giuseppe Panza di Biumo on James Turrell) paired with Marco's handwritten margin annotations across notebook pages 78–79:<\/p>\n<h4>Summary of Pasted Essay (Pages 78–79)<\/h4>\n<ul><li>Surveys monumental sites sited in relation to nature and sky: Celtic stone circles in England and Scotland, Toltec sanctuaries at Monte Albán near Oaxaca, the Parthenon emerging above the Aegean Sea, the Egyptian pyramids, the twin towers of Chartres Cathedral rising above golden wheat fields, Le Nôtre's 17th-century gardens for Louis XIV, and Roman consul Lucio Cornelio Silla's temple to Fortuna Primigenia overlooking Rome.<\/li><li>Contrasts pre-industrial monuments oriented toward cosmic forces with 19th-century railway stations and 20th-century skyscrapers, leading into American desert works and <b>James Turrell<\/b> as a way to experience the sky directly rather than through memory, imagination, or illusion.<\/li><li>Describes Turrell returning to Varese with light projectors and conceiving a giant elliptical sky-view bowl with a clean horizon rim joining earth and sky into an apparent sphere—searching Western states on a Guggenheim grant by small plane (contrasted with Italian painter-pilot <b>Roberto Crippa<\/b>, who died flying acrobatics), and trekking up the 900-foot soft cinder slope of an extinct volcano overlooking the Painted Desert (<b>Roden Crater<\/b>) until sunset overhead opens from finite earth walls to infinite sky.<\/li><\/ul>\n<h4>Handwritten Margin Annotations (Marco)<\/h4>\n<ul><li><b>Page 78 (top right):<\/b><\/li><\/ul>\n<p>  &gt; - Hellenistic temple on Lindos -<br>  &gt; - a church steeple is built up high the highest point [crossed out: part] of most small European towns. Proust wrote about the steeple.<\/p>\n<ul><li><b>Page 79 (top left):<\/b><\/li><\/ul>\n<p>  &gt; He sounds like the little prince<\/p>\n<ul><li><b>Page 79 (top right):<\/b><\/li><\/ul>\n<p>  &gt; \"now<\/p>\n<ul><li><b>Page 79 (left margin, arrow from Roberto Crippa):<\/b><\/li><\/ul>\n<p>  &gt; adult: flying for acrobatics.<\/p>\n<ul><li><b>Page 79 (right margin, trimmed edge alongside crater bowl passage):<\/b><\/li><\/ul>\n<p>  &gt; much digging out... neither side... is all about [s]pace - the... about leaving his... but about... 's wonders... is under... a tunne[l] you... the sky or...<\/p>\n<ul><li><b>Page 79 (below pasted paragraph / lower right):<\/b><\/li><\/ul>\n<p>  &gt; of pp. 80-88.<br>  &gt;<br>  &gt; you cannot see someone to have a solitary experience.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p002.jpg", "attachments/pages/scan_1994_2_p003.jpg"]}, "1999-06-15_Bent-Aluminium-Bar-and-Resonator-Yagi-Antenna": {"t": "Bent Aluminium Bar and Resonator; Yagi Antenna", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["sound", "sculpture-ideas", "technology", "sound-art"], "pp": [], "body": "<p><s>bent<\/s> aluminium <code>[above:]<\/code> bar bent to isolate and visualise the vibrations which become sound waves<br>resonator - box with an 'empty volume and opening such that the volume of air vibrates in sympathy w/ the bar and to amplify these sound waves.<br>: Double made visible - bending &amp; volume of box.<br><code>[lower on the page:]<\/code><br>→ YAGI (?) Antenna - <code>[above \"makes\":]<\/code> is makes the form which best catches the intended signal. Thus one can visualise these wavelengths - (is it the carrier signal we want to isolate)<br>→ time wave cesium atom clock vibrations sent to sycronise television stations all over the world.<\/p>", "notes": "Undated, in blue ink; a piece made from a bent aluminium bar over a resonating box, continuing the transducer idea of <span class=\"wl\" data-note=\"1999-06-15_Working-on-Transducers\">1999 06 15_Working on Transducers<\/span>, and notes on the Yagi antenna of <span class=\"wl\" data-note=\"1999-06-15_Yagi-Antenna-Drawing-and-Pictures-in-a-Box\">1999 06 15_Yagi Antenna Drawing and Pictures in a Box<\/span>. \"is\" is written above \"makes\" as a correction. The space between the two parts is blank (the faint writing is page 77 showing through), so they are kept as one note.", "img": ["attachments/pages/scan_1997_2_p078.jpg"]}, "1994-06-27_Mental-Range-DC-to-New-Haven-and-Atomic-Scale": {"t": "Mental Range, D.C. to New Haven & Atomic Scale", "d": "1994-06-27", "est": false, "w": 1994.4879, "era": "Yale, New Haven", "th": ["cognition", "scale", "maps", "perception", "memory"], "pp": ["Khalil Gibran"], "body": "<p>...change in [...] as any sharpness; [...] allowed to occur over a wider range than mental lines can keep:<\/p>\n<ul><li>Mental range must frame off a section of the world/Universe. It cannot grasp it all. If one tries to conceive of the trip from D.C. to New Haven, one can recall particular images of rest stops, toll booths, bridges, but in no way can remember each sequence; instead one has to resort to the image of a map or a diagram. The range is too great—it must be simplified to fit w/in the scope of what can be understood.<\/li><\/ul>\n<p>The same goes for imagining the atoms that make up the molecules in our hand, or this pen which is recording my thoughts. I can start w/ the atom or cell, but there is a large bridge to be gapped before I can imagine the solidity of my hand, or the different cells which make up the muscle, bone, skin etc. Even from the atom to the cell, one diagram to the other, from the nucleus w/ e⁻'s to any solid is a conceptual leap too great for the limited range of our conceptions.<\/p>\n<p><i>(Bottom note: <code>[see Khalil Gibran Mountain from the plain]<\/code>)<\/i><\/p>", "notes": "", "img": []}, "1995-02-05_Lefebvre-Mental-and-Real-Space": {"t": "Lefebvre: Mental and Real Space", "d": "1995-02-05", "est": true, "w": 1995.0943, "era": "Final Semester Yale 1995", "th": ["space", "reading", "epistemology", "sculpture"], "pp": ["Henri Lefebvre", "Lorentz"], "body": "<p>Production of space.<br>\"The quasi-logical presupposition of an identity between mental space (the space of philosophers and epistemologists) and real space creates an abyss between the mental sphere on one side and the physical and social spheres on the other. From time to time some intrepid funambulist will set off to cross the void, giving a great show and sending a delightful shudder through the on-lookers.\" p. 6<br>Relativity is dominated by time thinking - time stops at the speed of light. Two rockets traveling in opposite directions...<br>Violate temporal causality is easier to concieve of than spacial.<br>→ how does one rocket judge the other's movement? → light rays which travel @ the speed of light. When the theoretical rocket's speeds are near the speed of light - the time of perception becomes an important factor.<br><code>[sketch: two arrows pointing away from each other, labelled \".9v\" and \".6v\"]<\/code><br>Lorenz transforms don't take into account the fact that the ships &amp; the viewer's can rely on anything faster than light to detect these movements. <u>What?<\/u><br>\"intellectual labor, <s>is subject<\/s> like material labour, is subject to endless division\" - p. 8 - comes in discussion of how all these overlapping \"spaces\" are suspect. \"the very multipicity of these descriptions &amp; sectionings makes them suspect.<br>Inner space vs. outer: in sculpture.<br>communication space?<\/p>", "notes": "Undated; more notes on Lefebvre's <i>The Production of Space<\/i>, continuing <span class=\"wl\" data-note=\"1995-02-05_Lefebvre-Scales-of-Space-and-the-Maternal-Space\">1995 02 05_Lefebvre Scales of Space and the Maternal Space<\/span>. \"can rely\" probably means \"can't rely\". Lorenz is Lorentz.", "img": ["attachments/pages/scan_1995_p030.jpg"]}, "1995-02-15_Gone-Poof": {"t": "Gone Poof", "d": "1995-02-15", "est": true, "w": 1995.1217, "era": "Final Semester Yale 1995", "th": ["distance", "endings", "light", "installation"], "pp": [], "body": "<p>Why does it feel so permanent? I don't understand. How can this whole thing collapse like a house of cards. It was <s>huge &amp; imposing<\/s> <s>[?]<\/s> wonderful &amp; ephemeral, and <s>[?]<\/s> now gone poof.<br>Camera Obscura - difference in light - two spaces of different light intensity.<br><code>[sketch: a flat platform on a post with a smaller box set into it]<\/code><br><code>[sketch: a box frame in perspective on a slab]<\/code><br><code>[sketch: a box seen from the side, with lamps shining in from the left (\"bright\"), a dark space above (\"dark\"), and labels \"square of lights\" and \"dark - mirrored world.\"]<\/code><br><code>[an arrow runs from \"now gone poof\" down to:]<\/code> It's so rediculous. The distance just allows it to vanish. There wasn't really anything there except a happiness behind - a glow<\/p>", "notes": "Undated; after a rule following the 2/15 entry. What \"this whole thing\" is isn't said; the distance may be the distance from Katherine (the next entry, 2/21, is about a letter to her), but that is a guess.", "img": ["attachments/pages/scan_1995_p038.jpg"]}, "1994-08-20_Draft-Letter-to-Katherine": {"t": "Draft Letter to Katherine: Vocation & Companionship", "d": "1994-08-20", "est": false, "w": 1994.6354, "era": "Summer 1994, Travel and Alps", "th": ["intimacy", "vocation", "identity", "uncertainty", "letters"], "pp": ["Katherine", "Daria"], "body": "<p>My language is so tense (my handwriting so small). I feel that things changed so much, I'm not sure how to address you. What are you thinking, feeling? What will your first letter to me be like?<\/p>\n<p>I'm feeling very much out on my own—detached from home, and my friends so far, and from you. I'm trying to figure myself out. What do I want to do? Do I gear myself up for some kind of profession? Further studying? A life of academia? What about art? Am I more of an artist at heart? If so, more conceptual? Emotional? A painter? I can't really start planning any life till I know some kind of answer to these questions.<\/p>\n<p>Should I include you in some sort of plan? It seems that if we wanted to see each other for anything more than a short period—which can't be satisfying in the long term, and I feel that is a weak situation for a relationship, though it is well praised by romance novels—on the other hand, I think that I will think of you in many situations in my life even if we are not together.<\/p>\n<p>Which brings me to my next thought: I think that what we began to cultivate (our relationship) was really incredible. I've never felt so natural and empowered. You became a true companion. I'm not trying to say that we should be friends—I loved sharing everything with you: the double sleeping bags and waking up late in the woods, Shalimar, and several nights at Daria's. The essence of our relationship, I think, is a similarity of spirit and thought.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p054.jpg"]}, "1995-02-09_Stasis-and-Commitment": {"t": "Stasis and Commitment", "d": "1995-02-09", "est": true, "w": 1995.1053, "era": "Final Semester Yale 1995", "th": ["katherine", "love", "commitment", "risk-taking"], "pp": ["Alison", "Katherine"], "body": "<p>You always need to ruin things - Alison tells me.<br>I hate stasis, nothing scares me more.<br>Want new adventure - being on the edge in whatever way and yet there are levels of <s>[?]<\/s> caring that imply a commitment which requires a limit <s>on<\/s> new experience.<br>katherine, you've got to know how much I love you - but like you felt last year - are you the only person I love? No that would be dangerous. Do I love you most? As far as I can tell.<\/p>", "notes": "Undated; it falls between the 2/9 sketches and the 2/12 entry. The first word reads \"Yoh\" or \"You\".", "img": ["attachments/pages/scan_1995_p031.jpg"]}, "1995-01-29_Infinitely-Deep-Box-and-the-AandA-Roof-Piece": {"t": "Infinitely Deep Box and the A&A Roof Piece", "d": "1995-01-29", "est": true, "w": 1995.0767, "era": "Final Semester Yale 1995", "th": ["installation", "sculpture-ideas", "mirrors", "sky", "turrell"], "pp": ["Turrell", "Amy", "Katherine"], "body": "<p>I just thought of a space which <s>[?]<\/s> seems infinitely deep - painted box so that the edges read as flat - or one is confused by what one is percieving.<br>↳ try this model <code>[a double line with an arrow runs down beside the next lines]<\/code><br>- the transparent mirror poses no confusion but both point - or do they?<br>The mirror points to infinite space, but also to flatness the infinite is contained yet present.<br>The ganz? field is what it is: it doesn't point.<br>- When Turrell manipulates the sky is he using it to point to something else, or a <s>part of<\/s> certain a quality which it already possesses?<br>- Amy pointed to the sky - hung things on it, I liked that.<br>I feel that I am slipping back into that world of books &amp; uncertain places where I am so happy - where k. and I met and from which I have been at a remove.<br><code>[sketch: a box seen in perspective, with a smaller box (②) floating inside it under an opening at the top (①), and the room around it (③); labels: \"sizes?\" at the top, \"distance?\" at the bottom left, \"entrance?\", and \"bed: high enough that one feels one is floating when on it. <s>How<\/s> I can make the base emphasize this\" pointing to the inner box]<\/code><br>light?<br><s>[?]<\/s> can use outside ③<br>- am interested in diff. btw ① &amp; ②<br>what about btw ② &amp; ③?<br>can ① &amp; ③ be the same?<br><code>[sketch: a plan of a room with a rectangle in it, a corridor and doors, labelled \"empty space\", \"door (?)\", \"coridor\", \"wall w/ lights?\" and \"door\"]<\/code><br><code>[sketch: a flat slab on a single post]<\/code><br>I love to capitalize on the feeling of vertigo looking into space.<br>mirrors on the floor for the A&amp;A piece<br>- can I use the wind to make patterns, ripples, waves - make itself evident? wind &amp; sound are important considerations. I am in the city - on top of the A&amp;A not on West Rock<br>how can I invite the viewer to lie splayed before the stars<br>what does light shone on the sheets <s>look<\/s> <s>light<\/s> like? - can I use lights at all: electricity?<br>I like the idea of a pool. Plexiglass box filled w/ water - a drain.<\/p>", "notes": "Undated; it follows the 1/29 entries. \"ganz? field\" is the Ganzfeld, the even, featureless field of view Turrell uses. The A&amp;A is Yale's Art &amp; Architecture building, whose roof seems to be the site for this piece; West Rock is the ridge outside New Haven.", "img": ["attachments/pages/scan_1995_p027.jpg"]}, "1994-08-04_Arnheim-on-Originality-vs-Personal-Style": {"t": "Rudolf Arnheim on Originality vs. Personal Style (Page 104)", "d": "1994-08-04", "est": false, "w": 1994.5916, "era": "Summer 1994, Travel and Alps", "th": ["originality", "necessity-vs-style", "art-theory"], "pp": ["Rudolf Arnheim"], "body": "<ul><li>**Top Handwritten Quote (Rudolf Arnheim, <i>Art and Visual Perception<\/i>, p. 138):**<\/li><\/ul>\n<p>  &gt; <code>\"Originality is the unsought and unnoticed product of a gifted [?] artist's successful attempt to be honest and truthful, to penetrate to the origins [modern], the roots, of what he sees. The deliberate search for a personal style inevitably interferes w/ the validity of the work, because it introduces an element of arbitrariness into a process that can be governed only by necessity.\" — p. 138.<\/code><\/p>", "notes": "", "img": ["attachments/Screenshot_2026-11-18_at_10.27.46_AM.png"]}, "2026-10-21_Dads-Super-8s-and-Lana": {"t": "Dad's Super 8s & Svetlana \"Lana\" (10/14 Notes)", "d": "2026-10-21", "est": false, "w": 2026.8048, "era": "Present, Therapy Notes", "th": ["father", "memory", "job-search"], "pp": ["Dad", "Svetlana \"Lana\"", "Mom"], "body": "<p><i>(10/14 notes):<\/i> Had an exploratory call for a job interview; having difficulty motivating for anything. Went through my dad’s photos and organized his Super 8s to send to Kodak. I think he was really smitten by Svetlana \"Lana\"—she had a female first on Demavand with him. Blonde like my mom.<\/p>", "notes": "", "img": []}, "1994-06-22_Catachresis-and-Quillian-Semiotic-Model": {"t": "Catachresis, Quillian Semiotic Model & Writing Reflection (Page 39)", "d": "1994-06-22", "est": false, "w": 1994.4742, "era": "Yale, New Haven", "th": ["semiotics", "metaphor-and-metonymy", "writing-criticism"], "pp": ["Umberto Eco"], "body": "<p>catachreses = metaphor turned into culture<br>...metaphors tend to resist acquisition (like factual information). If they are inventive (and thus original) they cannot be easily accepted; the system tends not to absorb them.<\/p>\n<p>The Quillian model: a mass of nodes interconnected by different types of associative links. For the meaning of <i>[continues onto yellow sticky note, left]<\/i>: every lexeme, memory should contain a node which has as its 'patriarch' the term to be defined here called <i>type<\/i>. The configuration of the meaning of the lexeme is given by the multiplicity of its links with several tokens each of which becomes, in its turn, a <i>type B<\/i>. Type B is the patriarch of a new configuration.... \"The overall structure of the complete memory forms an enormous aggregation of planes, each consisting entirely of token nodes except for its 'head' node.\" This model therefore anticipates the definition of every sign, thanks to its interconnection with the universe of all other signs that function as its interpretants, each of which is ready to become <i>[continues onto yellow sticky note, right]<\/i> a sign interpreted by all the others. The model, in its complexity, is based on a process of unlimited semiosis. Starting with a sign that is considered a 'type', one can retrace, from the center to the extreme periphery, the entire universe of cultural units. Each of these can in turn become the center and generate infinite peripheries.<br><i>(Handwritten note at bottom of right yellow note: \"— Sounds like a thesaurus on a Mac.\")<\/i><\/p>\n<p><i>(Handwritten note on upper-left yellow sticky note):<\/i><br><code>metaphor (selection &amp; similarity) vs. metonymy (combination &amp; contiguity)<\/code><br><code>Gestalt theory of perception — look up in dictionary.<\/code><br><code>[Xerox p. 254]<\/code><\/p>", "notes": "<i>[Bracketed Self-Reflection — Upper Right]:<\/i><br>\"I am getting very angry at the weaknesses in my writing. I can no longer forgive the misspellings &amp; weak formations, and general looseness I have always forgiven myself because I thought it was a key part of being me—whatever that means.\"", "img": ["attachments/Screenshot_2026-11-18_at_10.27.18_AM.png"]}, "2005-03-21_Perceptual-Boxes-the-Vertigo-Box": {"t": "Perceptual Boxes: the Vertigo Box", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["installation", "mirrors", "perception", "technology", "sculpture-ideas"], "pp": [], "body": "<p><u>Perceptual Boxes<\/u><br>- the you can fly <u>vertigo box<\/u><br><code>[pencil sketch: a shallow open box seen in perspective, with a smaller box inside it holding a viewer's head; labels \"laptop screen\" (at the back wall) and \"transparent mirror\" (an angled pane); below, a small hand controller with arrow buttons on a cord]<\/code><br>- create movement<br>- count down 10...9...8... until the blast off is you leave the box. Real world is the<\/p>", "notes": "Undated, about 2005, in pencil. The sentence \"Real world is the\" is left unfinished. A blank yellow sticky note is stuck at the lower left. The faint writing on the right is page 95 showing through. Compare the much earlier mirror boxes and vertigo notes of 1995.", "img": ["attachments/pages/scan_1997_2_p094.jpg"]}, "1998-10-15_Pretentious-and-Boring-Things-to-Remember": {"t": "Pretentious and Boring; Things to Remember", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["travel", "japan", "craft", "studio-critique"], "pp": ["Marie", "Bustamante", "Miwa"], "body": "<p>pretentious and boring is the worst possible combination of personality traits and ever present at the Beaux-Arts<br>[l'Art pour l'art mentioned by Marie (of course) at Bustamente's openning as in the Japanese don't have concept of l'art pour l'art - they are so connected to craftsmanship (Busta.) was about the limit of what I could handle in that one of the worst most pretentiously boring shows I have ever visited.<br>Things to remember:<br>- Bankok rivers<br>- The toilet seat at Miwa's parents, the smell of tatami, the light switches<br>- heat humidity and <u>smell<\/u> in Bali &amp; Bankok.<br>- Japanese saw and the neatness, with which things are made, placed even the fish under plastic in the supermarket somehow less obssesive than german exactitude, less heavy<\/p>", "notes": "Undated; written back in Paris at the Beaux-Arts after a trip to Japan, Bali and Bangkok (see <span class=\"wl\" data-note=\"1998-10-15_Hong-Kong-and-First-Thoughts-of-Japan\">1998 10 15_Hong Kong and First Thoughts of Japan<\/span>). \"Bustamente\" is probably the artist Jean-Marc Bustamante; Marie is not identified.", "img": ["attachments/pages/scan_1997_2_p012.jpg"]}, "1998-10-15_First-DAT-Max-Compositions-and-Video": {"t": "First DAT; Max Compositions and Video", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["sound-art", "music", "video", "technology", "japan"], "pp": [], "body": "<p>Listening to 1st DAT what a great idea to buy this.<br>\"Canned music\" sounds much more interesting than metronome sounds - full many resonances.<br>\"boat engines\" good good sound also<br><u>Max compositions<\/u> maybe w/ somewhat <s>[?]<\/s> explanitory graphic or <u>video<\/u> when there is a pro DVD player and a writer. I will be very happy - piece for DVD drive.<br>- edit on computer from mini-DV → write to DVD &amp; play<br>Maybe I need to do a train video project - or bring the camera w/ me - not photo.<br>- bicycle projects along あらかわ. vid. &amp; DAT.<br>- bicycle wheel stereo recording.<br>- I can record the airplane flight on DAT!<\/p>", "notes": "Undated. あらかわ is the Arakawa river in Tokyo. DAT is digital audio tape; Max is the music programming software. The wish for \"a pro DVD player and a writer\" and editing from mini-DV suggest this may be later than 1997, perhaps 1998–2000; the date is an estimate from the entries before it.", "img": ["attachments/pages/scan_1997_2_p026.jpg"]}, "1995-09-01_Building-with-a-Wraparound-Balcony-Park": {"t": "Building with a Wraparound Balcony Park", "d": "1995-09-01", "est": true, "w": 1995.6667, "era": "DC, Post-College", "th": ["architecture", "urbanism"], "pp": [], "body": "<p><code>[two cards taped onto the page, in blue ink:]<\/code><br>Make a building w/ a huge wrap around balcony park for employee walks &amp; views Walkways through large Atrium spaces are nice but how about combining this w/ a parrallel or rather synthetised out door balcony system - <s>[?]<\/s> pleasant thouroughly integrated spaces to move up &amp; through to increasingly spectacular views - kind of Pueblo construction<\/p>", "notes": "Undated; on two water-stained cards, like those on the two pages before.", "img": ["attachments/pages/scan_1995_p096.jpg"]}, "1994-06-27_Gibrans-Mountain-and-The-Problem-of-Quoting": {"t": "Gibran's Mountain & The Problem of Quoting", "d": "1994-06-27", "est": false, "w": 1994.4879, "era": "Yale, New Haven", "th": ["perspective", "quoting", "maps"], "pp": ["Khalil Gibran", "Cara"], "body": "<p>From Khalil Gibran (which I quoted from Cara's yearbook page):<\/p>\n<p>Gibran has reversed what I normally think: the plain is clearer from the mountain. Even the climber must spend more time at his home than on the mountain, and I don't know if the mountain really becomes clearer—it becomes conceivable as a block rather than as a series of images of hand- and footholds, or of paths through changing territory. The view of the city from the plane (not plain) does not add anything to the city-goer's knowledge of the flowers in the shop or the trash in the drain; rather, it creates a map where these events can be put in a relationship.<\/p>", "notes": "<i>\"When you part from your friend, you grieve not; for that which you love most in him may be clearer in his absence, as the mountain to the climber is from the plain.\"<\/i>", "img": ["attachments/pages/scan_1994_1_p044.jpg"]}, "2005-03-21_Open-Question-1-Call-Threads": {"t": "Open Question 1: Call Threads", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["communication", "systems", "project-list"], "pp": [], "body": "<p>open-question 1<br><code>[diagram: circles A and B with arrows between them; then C passing to D and E]<\/code> ] input phone # to participate.<br><code>[a long arrow across the page]<\/code><br><code>[at the foot of the page: two small diagrams of circles joined by arrows, one a single chain going down, the other one circle branching to four]<\/code><\/p>", "notes": "Undated diagrams of how calls might pass between participants in the phone project (<span class=\"wl\" data-note=\"2005-03-21_Scripted-Phone-Play-Dial-og\">2005 03 21_Scripted Phone Play Dial og<\/span>): a chain versus a branching tree. The faint writing on the right is page 87 showing through.", "img": ["attachments/pages/scan_1997_2_p086.jpg"]}, "1994-07-28_Reversal-During-Hulls-Studio-Visit": {"t": "The Reversal During Hull's Visit (Page 82)", "d": "1994-07-28", "est": false, "w": 1994.574, "era": "Yale, New Haven", "th": ["insecurity", "ego", "studio-critique", "meaning-in-art"], "pp": ["John Hull", "Omar", "Alison"], "body": "<p>It is incredible the type of reversal that occured when Hull came to look at my paintings. I was no longer knowledgeable, experienced and giving advice like I had been w/ Omar, or the senior who would pop into drawing class &amp; make paintings. I felt like I really didn't have very much to show for all the excitement I had had. Hull mentioned None of the special revelations I had had, the red shadow on the door in Alison's room, the surface of the rock making clouds. He did mention the green shirt next to the red ear—he had seen it happen &amp; was impressed that day of the big-ego boost—Nothing else moved him like that. Once again I can't help but feel that painting doesn't ever directly translate, people don't just fall in love w/ your work, or a work until they know something to make it mean something to them. For me it is something <code>[right margin, sideways: first or the making.]<\/code><\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p009.jpg"]}, "1997_p022_Histoire-du-Musee-du-Mouseion-a-Kahnweiler": {"t": "Histoire du musée : du Mouseion à Kahnweiler", "d": "1997", "est": false, "w": 1997.5, "era": "Paris, Beaux-Arts", "th": ["museums", "collecting", "art-history", "french", "coursework"], "pp": ["Strabon", "Ptolémée", "Charles Patin", "François Ier", "Paolo Giovio", "Giorgio Vasari", "Charles Le Brun", "Rodolphe II", "Giuseppe Arcimboldo", "Isabelle d'Este", "Mazarin", "Edme-François Gersaint", "Antoine Watteau", "Walter Benjamin", "Joseph Paxton", "Napoléon III", "Édouard Manet", "Gustave Courbet", "Paul Durand-Ruel", "Eugène Delacroix", "Ambroise Vollard", "Daniel-Henry Kahnweiler", "Guillaume Apollinaire", "Paul Guillaume"], "body": "<p>Mouseion   lieu à Alexandrie dans textes de Strabon.<br>↳ palais Royale de Ptolémé<br>- savants de tout le bassin Mediterr<br>pretres Paye la vie des savants<br>↳ premier meçenât   origine Royale et Religieuse.<br>Lieu centrale au monde de l'epoque<br>Labo. d'astronomie<br>+ bibliotheque.   400BC - tous les textes du monde.<br>48BC - détruit <s>par<\/s> dans bataille con Caesar<br>___<br>Grece - philosophie dans lieu publique<br>↳ à Mouseion   privé + publier<br>Labo d'anatomy, Jardin botanique zoologique.<br>↳ Lieu clos.<br>Art plastiques = arts mecanique<\/p>\n<p><u>9 muses<\/u>. filles de mnemosyne et de Zeus.<br>Calliope - poesie epique, Clio → histoire, Euterpe à la poesie lyrique<br>Polymnie → l'hymne, Erato → poesie amoureuse, Thalie → comédie,<br>Melpomène → Tragedie, Uranie → l'astronomie, Terpsichore → danse<br><u>Fêtes<\/u> de la Mouseia - monstration.<br>___<br>14eme siecle → collectionneurs   dévaliser pour appropriér   sacager pour ré-intégrer<br>mode de collections - 1er vestiges Romains - 1er recherches archaeologique<br>petites antiquités, grandes → oeuvre d'art → canon corporel<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Antiquitaires -<br>- pas claire<br>- faux<br>Fouille en Italie<br>Vend à Anvers<br>Grandes collections surtout antiquailles. - cabinet des medailles.<br>conservation ← ↳ classification.<br>Charles Patin <s>1665<\/s> - Intro. à l'histoire par la connaissance des medailles<br>Competitions entre grandes familles Romaines. Borghese, Farnese<br>↳ pour collections<br>1528 - François 1er - cree la petite Italie (du Nord) à Fontainebleau<br>→ faire des <u>copies<\/u>   marché de copies.<br>on orne des palais.<br>1550 - Côme - Paolo Giovio - medecin humaniste erudit<br>37 ans 45 ouvrages → histoire de mon temps   &gt; bibliographies<br>Vasari - Les Vies.   ↳ portrait peint, bustes.<br>↳ reunir les pieces dans un lieu speciale<br>↳ dédier à Apollon<br>↳ <s>appeler<\/s> appelé le musée<br>- faire un Musée = discuter.<br>publique → que à la Revolution Française.<br>Lebrun et Louis XIV[?] → idee du mouseion - revanche des arts plastique<br>↳ Academie - après concours artiste libere de soucis economique<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>À Epoque de Paolo Giovio à Côme<br>→ kunst und wunderkammer - Tyrol - <s>[?]<\/s><br>Rudolph II à Prague<br>- curiosités naturelles   Archimboldo.<br>- animaux vivant[?]   - objets virtuoses.<br>objets étrange - exotique<br>Ferdinand[?] a des voyageurs pour collectionner tous ce qui est bizarre.   valeur d'emerveillement<br>= valeur premier<br>↳ non plus collection, conservation<br><u>Italie<\/u><br>Theatrum mundi.<br>- lieu privé - meditation contemplation<br>↳ magnifiques<br>Cabinet de curiosités. espace intime, aucun oeuvre scientifique<br>Jardin secret - Labyrinth puis grotta meditation<br>↳ Isabel D'Este<br>Tourisme culturelle pour la cour.<br>à l'image de Strabon - image du monde dans espace minuscule<br><u>Hinz<\/u> - plaisir d'emerveillement<br>Mazarin - grand collectionneur Français envie des Rois<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Gersaint → uniquement oeuvres de leur temps.<br>Watteau.<br>1789 - Rev. Française - ouvre le Louvre et Versailles au public<br>monstration → associe le grand public<br><u>Louvre<\/u> reuni tous les oeuvres Fontainebleau &amp; Versailles<br>↳ - nouveau genre peinture de musée : recopier les oeuvres.<br>premiers <s>personnes<\/s> organisateurs du louvre prennent Rome pour example.<br>ouverture du Louvre ⇒ ouverture de toutes les collections<br>↳ souci d'accumulation.   - cabinet de curiosités.<br>1880 - Fr. &amp; Angleterre → grands magasins inspire les accrochages<br>↳ capitalisme bourgeoise.<br>Grand magasins → W. Benjamin : Paris capitale du XIXe<br>↳ Paxton → grandes Expositions.<br>→ Artisanat, Art, Industrie -<br>Nap. III - 1er faciste. emprise sur la culture<br>↳ marché fluorissante.<br>Nieverkerke   - ressistance dans la creation → impressionistes.<br>Manet et Courbet - histoire des scandales - shocké<br>- marchands   - oeuvres censuré<br>defends les artistes dans un acte de ressistance. → Durand-Ruel<br>- artistes invendable   ↳ internationale - Londres New York<br>fortune de son père qui été antiquitaire.<br>Galeries → ateliers de photographe.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>Atelier de Delacroix - accrochage spectaculaire et intime.<br>___<br>Orsay - 45-50 lieu de rencontre de prisonniers familles perdus.<br>av. Mattignon. Bernheim.   Vollard. - vends 1ers Cezannes<br>cofelix ?   - vernissages.<br>- catalogues : Mallarmé, autres... écrivains<br>Kahnweiler - espace neutre, ascetique<br>↳ Protestant ?<br>Appolinaire sugère à Paul Guillaume de presenté les arts Africains avec cubistes.<br>- gallerie musée, hotel musée → tout a vendre.<\/p>", "notes": "Lecture notes on the history of museums and collecting, over five pages. \"Côme\" is Como, where Paolo Giovio built his museum. The king with Le Brun is written over and could be XIII or XIV (Le Brun worked for Louis XIV). \"Ferdinand\" (Archduke Ferdinand of Tyrol, whose Kunstkammer was at Ambras) is a guess from a hard word. \"cofelix ?\" under Bernheim is unclear. \"Nieverkerke\" is Nieuwerkerke, Napoléon III's superintendent of fine arts.", "img": ["attachments/pages/scan_1997_p022.jpg", "attachments/pages/scan_1997_p023.jpg", "attachments/pages/scan_1997_p024.jpg", "attachments/pages/scan_1997_p025.jpg", "attachments/pages/scan_1997_p026.jpg"]}, "1994-07-30_Bateson-Theory-of-Play-and-Fantasy": {"t": "Notes on Semiotics: Bateson's Theory of Play & Fantasy (Page 90)", "d": "1994-07-30", "est": false, "w": 1994.5795, "era": "Summer 1994, Travel and Alps", "th": ["semiotics", "bateson", "play", "metacommunication", "framing", "perfume"], "pp": ["Gregory Bateson", "Dia Moore", "Antoine de Saint-Exupéry"], "body": "<p>**Notes on Semiotics: Bateson, *Theory of Play &amp; Fantasy***<\/p>\n<h4>Summary of Bateson Excerpts<\/h4>\n<ul><li>Contrasts involuntary animal mood-signs (sexual odor) with human cosmetics and perfumes worn voluntarily, which nevertheless produce automatic/auto-suggestive effects even on the wearer; links this evolutionary threshold—eating of the Tree of Knowledge to discover that <i>signals are signals<\/i>—to human language, empathy, identification, and multiple levels of abstraction.<\/li><li>Outlines <b>metalinguistic<\/b> messages (about language, e.g. <code>\"the word 'cat' has no fur and cannot scratch\"<\/code>) vs. <b>metacommunicative<\/b> messages (about the speakers' relationship, e.g. <code>\"This is play\"<\/code>, mostly implicit), where <code>\"This is play\"<\/code> expands to the paradox that these actions do not denote what they would denote.<\/li><li>Notes that inside a dream, the dreamer lacks the concept <code>\"untrue\"<\/code> and cannot normally frame the dream, while schizophrenic <code>\"word salad\"<\/code> omits the <code>\"as if\"<\/code> frame-setting message, acting out metaphors literally.<\/li><\/ul>\n<h4>Marco's Handwritten Reflections &amp; Examples<\/h4>\n<ul><li><b>On perfume signals &amp; Dia Moore (<code>[but this isn't what I'm concerned w/...]<\/code>):<\/b><\/li><\/ul>\n<p>  &gt; <code>[I'm glad I re-wrote the top paragraph, because at first I was going to take it that once the man recognizes the sign as a voluntary signal, he is no longer moved by it. e.g. I myself am usually greatly turned-off by perfume and make-up. But I will always remember Dia Moore's perfume (Opium I think). And, a woman's signals can be involuntary and seductive &amp; voluntary which sets the wheels rolling (this is crude lang)]<\/code><\/p>\n<ul><li><b>Margin question on <code>\"This is play\"<\/code>:<\/b><\/li><\/ul>\n<p>  &gt; <code>\"Is this play?\" - hazing rituals<\/code><\/p>\n<ul><li>**Connection to <i>The Little Prince<\/i> (p. 90v):**<\/li><\/ul>\n<p>  &gt; <code>[The little prince is like the schizophrenic. In his waking moments he reads first the drawing as a live object then the box w/ holes as the best drawing of his sheep.<\/code><\/p>", "notes": "", "img": ["attachments/pages/scan_1994_2_p024.jpg", "attachments/pages/scan_1994_2_p025.jpg"]}, "1998-12-15_Rise-of-the-Novel-and-Art-in-the-Catalog": {"t": "Rise of the Novel, and Art in the Catalog", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["reading", "art-theory", "semiotics", "solitude"], "pp": ["Ian Watt", "Hal Foster", "Frank Stella"], "body": "<p>In the <u>Rise of the Novel<\/u>. the writer speaks of how literacy induces <u>aloneness<\/u>. In reading a book I enter a separate world, a world where certain issues become more important than others - there is a type of modern art which is more important and more interesting in a catalog than in the <u>real<\/u>. Almost in the way that a photograph can make a moment - a catalog can make an artwork <s>[?]<\/s> Hal Foster says that Stella or another artist in the 70's separates the sign from the signified but this is an action designated by the critic. I wonder how conscious the artist actually is: In the case of many, I doubt there is any consciousness at all → of his relationship w/ the sign<\/p>", "notes": "Undated. <i>The Rise of the Novel<\/i> is Ian Watt's 1957 study. Hal Foster is the art critic.", "img": ["attachments/pages/scan_1997_2_p050.jpg"]}, "1995-06-01_Art-Is-Everywhere-Romance-with-the-Viewer": {"t": "Art Is Everywhere; Romance with the Viewer", "d": "1995-06-01", "est": true, "w": 1995.4167, "era": "DC, Post-College", "th": ["art-theory", "mirrors", "writing-process"], "pp": ["Wordsworth", "Ruskin", "Cage"], "body": "<p>- Art is Everywhere - Art of the Commonplace Wordsworth - Ruskin - Cage<br>- Romance w/ the viewer<br>- making the pieces for this imaginary viewer who is at the same time absolutelly personal, absolutely mine and in everyone: universal.<br><u>Defamiliarization<\/u>:<br>- mirrors<br>wonder of mirrors in \"homey\" - simple objects<br>- chosen for their plainness &amp; optimal viewing of the effect I wanted<\/p>", "notes": "Undated. This reads like an outline for writing about the thesis show, looking back on it (\"the effect I wanted\"), so it is probably from after the April 11 entries, perhaps late April or May 1995. \"Art of the Commonplace\" is the subtitle of Leonard's <i>Into the Light of Things<\/i>.", "img": ["attachments/pages/scan_1995_p073.jpg"]}, "1998-10-15_Geese-in-V-Formation-Simple-Rules": {"t": "Geese in V-Formation; Simple Rules", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["systems", "nature", "cognition"], "pp": [], "body": "<p>There is something in the physical make up of geese that makes them comfortable in a V-formation - where the eyes are - perhaps a blind spot - local influences the global.<br>It is fascinating to think that rules which much be simple to be stored in any finite form can produce every type of cell which knows to be which type - due to ? and <s>[?]<\/s> can map - the opposite of map actually - in to behaviors like desire which then return nutrients to original molecules - I can't explain this realization<br><code>[pencil sketch: two circles, the left one filled with dots, an arrow running from the right one into it]<\/code><br>The socks on the fox -<br>The hat on the cat.<\/p>", "notes": "Undated; follows the artificial-life reading notes in <span class=\"wl\" data-note=\"1998-10-15_Philosophy-of-A-Life-Boden-and-Langton\">1998 10 15_Philosophy of A Life Boden and Langton<\/span>. \"The socks on the fox / The hat on the cat\" echo Dr. Seuss (<i>Fox in Socks<\/i>, <i>The Cat in the Hat<\/i>).", "img": ["attachments/pages/scan_1997_2_p030.jpg"]}, "1995-02-12_Nothing-I-Can-Be-Freely-Joyous-About": {"t": "Nothing I Can Be Freely Joyous About", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["fear", "katherine", "studio-practice"], "pp": ["Katherine"], "body": "<p>There is nothing I can be freely joyous about - all these art projects are butting against one another - even the fence thing - I'm all worried about b/c I might get <s>into<\/s> in trouble for having taken it esp. setting it up so near to the site.<br>can't even be free w/ katherine like before.<\/p>", "notes": "Undated; after a rule following the 2/12 entries. \"the fence thing\" is <span class=\"wl\" data-note=\"1995-02-12_Fleeting-Purple\">1995 02 12_Fleeting Purple<\/span>.", "img": ["attachments/pages/scan_1995_p032.jpg"]}, "1995-03-12_The-Phenomenology-of-Space-Essay-Plan": {"t": "The Phenomenology of Space: Essay Plan", "d": "1995-03-12", "est": true, "w": 1995.1968, "era": "Final Semester Yale 1995", "th": ["writing-process", "space", "perception", "solitude"], "pp": ["Camus", "Merleau-Ponty", "Bachelard"], "body": "<p><u>The Phenomenology of Space<\/u> - is bold but it's my title. I need to write a paper worthy of it - <u>nope<\/u><br>- The <code>[boxed:]<\/code> <u>mapping stuff<\/u> goes w/ the observation from the aircraft. - Put that <s>first<\/s> → not really phenomenology.<br>- Me on mountain w/ <code>[circled:]<\/code> <u>Noces<\/u> → what a great passage<br>need to discuss <code>[circled:]<\/code> <u>phenomenology<\/u> beginnings → beginnings of book<br>→ <u>aloneness<\/u> of perception<br>A thought one needs to be truely alone to understand.<br>↳ vs. communication<br><code>[a line from \"phenomenology\" leads to:]<\/code> → need more Ponty &amp; <u>Bachelard<\/u><br><code>[boxed:]<\/code> I haven't sat down for a several hour streatch to think about this in so <code>[circled:]<\/code> long<br>- look up <u>Vertigo<\/u> primal feeling -<\/p>", "notes": "Undated. Plans for the essay whose title is \"The Phenomenology of Space\". The <i>Noces<\/i> passage is the one copied in <span class=\"wl\" data-note=\"1995-03-12_Grey-Sunday-Camus-Noces-and-Quoting\">1995 03 12_Grey Sunday Camus Noces and Quoting<\/span>; \"look up Vertigo\" is followed up on page 56.", "img": ["attachments/pages/scan_1995_p054.jpg"]}, "1994-06-18_Thoughts-on-Semiotics": {"t": "Thoughts on Semiotics: Signifiers & Context", "d": "1994-06-18", "est": false, "w": 1994.4632, "era": "Yale, New Haven", "th": ["semiotics", "language"], "pp": ["Garth", "Amy"], "body": "<p>When I called Garth this weekend he wasn't home:<br>\"Hi, this is Marco.\"<br>\"Hi, it's Amy.\"<br>Doesn't this message tell me anything? I did not know of course which Amy it was—the only two girls in the apartment are called Amy. Garth is talking about the two girls named Amy whom he lives with; without thinking about it, he uses the same signifier. She also mentioned the McDonald's Quarter Pounder—in places where they don't measure things in pounds [e.g., <i>Royale with Cheese<\/i> / metric countries], you don't always connect the name \"Quarter Pounder\" with the fact that it is a burger with 1/4 lb of meat, but rather it stands for this particular McDonald's sandwich and its look or wrapping.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p061.jpg", "attachments/pages/scan_1994_1_p062.jpg"]}, "1999-06-15_Working-on-Transducers": {"t": "Working on Transducers", "d": "1999-06-15", "est": true, "w": 1999.455, "era": "Paris, Beaux-Arts", "th": ["sound", "technology", "engineering"], "pp": [], "body": "<p>- working on transducers -<br>vibrating matter produces sound, thus if I can make a piece of matter vibrate in a way that imitates the vibration of another piece of matter<br>- alchemy more than a miracle<\/p>", "notes": "Undated, in blue ink; a later addition below the speaker-cone note in <span class=\"wl\" data-note=\"1999-06-15_Ambition-Theory-and-Experience-Speaker-Cone\">1999 06 15_Ambition Theory and Experience Speaker Cone<\/span>.", "img": ["attachments/pages/scan_1997_2_p074.jpg"]}, "1998-12-15_Natural-Selection-and-Intentionality": {"t": "Natural Selection and Intentionality", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["cognition", "nature"], "pp": [], "body": "<p>Natural Selection and Intentionality<br>The ultimate goal that the mind was designed to attain is maximizing the number of copies of the genes that created it.<br>how did natural selection come about? <s>what is it's<\/s> <s>[?]<\/s> intentional<\/p>", "notes": "Undated. \"The ultimate goal that the mind was designed to attain is maximizing the number of copies of the genes that created it\" is a quotation from Steven Pinker, <i>How the Mind Works<\/i> (1997).", "img": ["attachments/pages/scan_1997_2_p046.jpg"]}, "1994-10-05_Kant-and-Batesons-Double-Bind": {"t": "Kant & Bateson's Double Bind", "d": "1994-10-05", "est": false, "w": 1994.761, "era": "Yale, New Haven", "th": ["epistemology", "double-bind", "perception"], "pp": ["Immanuel Kant", "Gregory Bateson", "Carl Jung", "Stanislav Grof"], "body": "<p>Kant articulated a profound problem: the human mind can have no direct, mirror-like knowledge of the objective world, for the object it experiences has already been structured by the subject's own internal organization. The human being knows not the world-in-itself, but rather the world-as-rendered-by-the-human-mind (much like the mediation of the artist, especially with photography).<\/p>\n<p>Substitute \"world\" for \"mother\" and \"human being\" for \"child\" in Gregory Bateson's \"double bind\" (which eventually leads a person to become schizophrenic):<br>1. The human being's relation to the world is one of vital dependency, making it critical to assess the nature of that world accurately.<br>2. The human mind receives contradictory or incompatible information about its situation with respect to the world, rendering its inner psychological and spiritual sense of things incoherent with scientific meta-communication.<br>3. Epistemologically, the human mind cannot achieve direct communication with the world.<br>4. Existentially, the human being cannot leave the field.<\/p>", "notes": "", "img": ["attachments/pages/scan_1994_1_p015.jpg", "attachments/pages/scan_1994_1_p016.jpg"]}, "1998-12-15_Shadow-on-the-Metro-Stairs-at-Pyrenees": {"t": "Shadow on the Metro Stairs at Pyrénées", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["light", "city", "maps", "photography"], "pp": [], "body": "<p><code>[sketch: a small framed picture of a figure's shadow on a stairway]<\/code><br>- photo at entré du metro Pyrennes<br>- every year from Apr to June on any sunny day btw. 11 and 3 you can watch your shadow descend the stairs of the metro.<br>___<br>I need to map these events.<\/p>", "notes": "Undated. Pyrénées is a Métro station in the 20th arrondissement of Paris.", "img": ["attachments/pages/scan_1997_2_p056.jpg"]}, "1994-06-15_Corsons-Inlet-and-Ekphrasis-Page-21": {"t": "A.R. Ammons’s *“Corson’s Inlet”* & Ekphrasis Margin Notes (Page 21)", "d": "1994-06-15", "est": false, "w": 1994.455, "era": "Yale, New Haven", "th": ["ekphrasis", "painting-terms", "naming-vs-generalizing", "mirror-vs-window"], "pp": ["A.R. Ammons", "Immanuel Kant"], "body": "<h4>Margin &amp; Bracket Annotations<\/h4>\n<ul><li><b>Left Vertical Margin:<\/b> <code>\"— ekphrasis of place —\"<\/code><\/li><li>**Middle Bracket (next to <i>\"mirroring mind\"<\/i>):** <code>\"Kant p. 10 — even mirror is a representation etc. etc.\"<\/code> → <code>[mirror this environment in words &amp; phrases the way a painter would mirror w/ strokes &amp; colors —]<\/code><\/li><li>**Lower Right (next to <i>\"predominantly reeds\"<\/i>):** <code>\"- is this about naming. He can pick the view apart, naming each plant or generalize. Paint it all in w/ one stroke.\"<\/code><\/li><li>**Bottom Right (below <i>\"separating inside from outside\"<\/i>):** <code>\"→ what was my thought here? / mirror vs. window: in mind vs. real world.\"<\/code><\/li><\/ul>", "notes": "<b>Corson's Inlet:<\/b>  <br>I was released from forms,  <br>from the perpendiculars  <br>straight lines, blocks, boxes, binds  <br>of thought  <br>into the hues, shadings, rises, flowing bends and blends  <br>of <b>sight<\/b> <i>(circled → \"painting terms\")<\/i><br>I allow myself eddies of meaning:  <br>yield to a direction of significance  <br>meaning  <br>like a stream through the geography of my work:  <br>you can find  <br>in my sayings swerves of action  <br>like the inlet's cutting edge:  <br>there are dunes of motion,  <br>organizations of grass, white sandy paths of remembrance  <br>in the overall wandering of <b>mirroring<\/b> <i>(circled)<\/i> mind<br>in nature there are few sharp lines: there are areas of  <br>primrose  <br>more or less dispersed;  <br>disorderly orders of bayberry; between the rows  <br>of dunes,  <br>irregular swamps of reeds  <br>though not reeds alone, but grass, bayberry, yarrow, all...  <br>predominantly <b>reeds<\/b> <i>(boxed)<\/i><br>I have reached no conclusions, have created no boundaries,  <br>shutting out and shutting in, <b>separating inside<\/b>  <br><b>from outside<\/b>: I have  <br><b>drawn no lines<\/b> → as", "img": []}, "1995-06-15_Letter-Draft-to-Katherine-from-DC": {"t": "Letter Draft to Katherine, from DC", "d": "1995-06-15", "est": true, "w": 1995.455, "era": "DC, Post-College", "th": ["katherine", "letters", "endings", "job-search"], "pp": ["Katherine"], "body": "<p><code>[the whole draft is struck through with large X's in blue pen, added later; comments in the same blue pen are marked below]<\/code><br>katherine,<br>I am at a loss to understand what has happened between us the last couple of months. There is always something which doesn't add up, or makes no sense. When I fell in love with you, you slipped in to warm innumerable <s>[?]<\/s> spots inside me I didn't know existed, now I am left with holes I don't know how to heal. <code>[right margin, in blue:]<\/code> lame I can only hope that you are happier because of this mess, if not all this would <s>really<\/s> <u>make no sense at all<\/u>. There is a retension, repression and forcing in you which I can't understand at all. <u>It doesn't make sense<\/u>. The signals I recieve, what I feel, and what is going on don't add up.<br>I have been relatively busy. It turns out that I have quite a few friends living in D.C. this summer so I am rarely at a loss of things to do or people to see. I am trying to find a cheap studio to rent for a few months which would make me very happy - to have <s>[?]<\/s> my own small private space. I need to paint and build some more sculpture rooms or pieces. For now I am working at the NEA - I just walked in and volunteered. It is quite fun, the people there are wonderfully friendly &amp; amazing, there are quite alot of very <code>[underlined in blue:]<\/code> attractive women who work there too. <code>[right margin, in blue:]<\/code> that's nice I almost got a job at a photo developing lab for professionals where they do all sorts of neat processes including film, but the guy decided that he wanted a full-time<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>employee and I want to keep working at the NEA. I <code>[circled in blue:]<\/code> might <s>[?]<\/s> try some more with a theatrical lighting company - or machine shop to give me sculpture experience but I <code>[circled in blue:]<\/code> might start being a bicycle messenger which is no experience at all but makes <u>tons<\/u> of money (which is always nice) and would be quite a work out. Any plans beyond that are completely up in the air - though I'm probably going to France in September to try to set up that grant w/ the artisans and then vacation some by myself - I want to go to Florence, and Rome to see museums, and galleries (which aren't open in the summer)<br>I got your card and the photos which were interesting to see - it's kind of funny how much awkwardness or frustration can be read in our faces. I was scared to death to open your envelope, scared that you would upset the tide of my dialy life, ruin the calm I have been struggling to keep which even if it is not happiness, is more comfortable when it is managable. All I can say is your letter didn't disturb me, it didn't really move me either way, which I thank you for. I'm afraid that this letter though certainly not <code>[circled in blue, with a question mark:]<\/code> a bomb-shell is <s>much<\/s> less careful. I too am at a loss <s>[?]<\/s> how to end this letter but <s>think<\/s> feel it is less condecending just to leave it blank.<br>Marco<\/p>", "notes": "A draft of a letter to Katherine, written in Washington DC in summer 1995 while Marco was volunteering at the NEA (compare <span class=\"wl\" data-note=\"1995-06-01_NEA-Visual-Arts-Funding-Meeting-Notes\">1995 06 01_NEA Visual Arts Funding Meeting Notes<\/span>). The blue X's and the comments \"lame\" and \"that's nice\" are in a different pen and were probably added on rereading; they may not be from 1995. Whether the letter was sent, in this or another form, isn't known. \"the artisans\" grant in France is not explained.", "img": ["attachments/pages/scan_1995_p082.jpg", "attachments/pages/scan_1995_p083.jpg"]}, "2026-10-21_Dread-of-Being-Seen": {"t": "Dread of Being Seen (10/14 After Session)", "d": "2026-10-21", "est": false, "w": 2026.8048, "era": "Present, Therapy Notes", "th": ["vulnerability", "shame", "invisibility", "masculinity"], "pp": [], "body": "<p><i>(10/14 after session):<\/i> For some reason turning the light on “what I want” makes me very uncomfortable. A feeling like fear or dread in the pit of my stomach that I associate with “shopping for clothes” or “asking out the girl on whom I have a crush” or some interviews gone bad. I’m embarrassed for being seen—embarrassed for sharing too much. I feel like I want to disappear and take up less space. (Masculine fantasy: Jack Ryan.)<\/p>", "notes": "", "img": []}, "1994-08-01_Turrell-Water-Wave-Dome-and-Big-Dipper-Room": {"t": "Turrell Respect for Nature, Water-Wave Dome & Big Dipper Room", "d": "1994-08-01", "est": false, "w": 1994.5833, "era": "Summer 1994, Travel and Alps", "th": ["turrell", "installation", "water-reflections", "candle-shadows", "mirrors", "big-dipper", "optics"], "pp": ["James Turrell"], "body": "<p>Turrell mentions not making a trompe-l'oeil sort of illusion which is what I was kind of aiming at w/ the 3D image painted in a corner. He is respectful of nature: \"It is always a little bit suspect to look at something really beautiful like an experience in nature and want to make it into art.\" He wants to set up a situation to which he takes you and lets you see.<\/p>\n<p>I have had two thoughts today:<\/p>\n<h4>1) Water Surface Dome (<i>Under Prospect - old train tracks<\/i>)<\/h4>\n<p>1) To continue w/ an earlier idea of the \"illusion of an unbroken plane through which people may walk, but make the surface out of water from which light reflects and creates the wave patterns (I noticed from the plane) on the ceiling\"<\/p>\n<h4>2) Candle Shadows &amp; Transparent Mirror Pedestal<\/h4>\n<p>2) use a candle — flickering light — to create shadow patterns of grids etc. on the wall, (2D) — have to guess at 3D configuration — maybe put it on a dropped ceiling above where the light &amp; object can't be seen — à la movie theatre projector. Viewer is confronted w/ walls on which the shadows play — combine w/ nocturnes (?)<\/p>\n<ul><li>What if I put my transparent mirror object in this room? w/ a screen inside, one flat piece that would reflect into a complex illusion of 3D. Curved forms in the flickering shadows vs. angular in the mirror?<\/li><\/ul>\n<h4>Upside-Down Mirror Path &amp; Hanging \"Big Dipper\" Lights (p037)<\/h4>\n<p>we see the world differently upside down. I wonder if a path could be made towards the water sculpture w/ mirrors on the floor (raised so that they are not the floor — but art object) It is essential that the mirrors should be set up in a path b/c the observation intended is about the <i>passage<\/i> of the branches at different speeds corresponding to their distance from the ground — which necessitates a movement of the viewer past the mirrors.<\/p>\n<p>for the light's in dark idea: what about inside the dark inner space hanging tiny lights so that at the very narrow opening at which you had to stop you saw the big dipper, But when you went in, you could tell that, in fact, the lights were hung at different distances and only produce the big dipper when viewed from the entrance.<\/p>", "notes": "<i>[Perspective cutaway of an arched tunnel/dome over a shallow water basin, with pump/trough detail:]<\/i><br>• <code>water right up to the surface<\/code><br>• <code>trough for runoff, need a pump to put water back into the pool &amp; create the waves / need.<\/code><br>• <code>I'm interested in the acoustic qualities the dome would have and the sound off the water.<\/code><br>• <code>How would I light this? I would have to experiment w/ what configurations would create the right effect.<\/code><br>• <code>Under Prospect - old train tracks<\/code><br><i>[Sketches on scan_1994_2_p036–p037: <code>everything painted black<\/code>, <code>feels space small under low ceiling<\/code>, <code>shadows<\/code>, plus top views on p037: <code>shadows on walls — have to turn back around to see small internally lit transparent mirror object on pedestal<\/code>, <code>have to pass through<\/code>.]<\/i><br><i>[Bottom diagram: <code>Front<\/code> constellation projection of 7 <code>x<\/code> points vs. <code>Side<\/code> dotted sightlines showing lights staggered at varying depths.]<\/i>", "img": ["attachments/pages/scan_1994_2_p036.jpg", "attachments/pages/scan_1994_2_p037.jpg"]}, "1998-10-15_Akemis-John-Cage-Video-and-Nobel-Triplets": {"t": "Akemi's John Cage Video, and Nobel Triplets", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["music", "sound-art", "perception", "mass-culture"], "pp": ["Akemi", "John Cage"], "body": "<p>Saw Akemi's John Cage video <s>[?]<\/s> musicircus and roratorio <u>1979<\/u> - everyone speaks, sings plays at once, no one stands really. there can be many facinating and skilled people today but our expanded immediate awareness of events on the entire planet detract attention from any one event There can no longer be the small town or small world facination w/ any single event or person Even nobel prizes are given to <s>threes<\/s> triplets this year no single genius, just a sort of mass hysteria<\/p>", "notes": "Cage's <i>Musicircus<\/i> (1967) and <i>Roaratorio<\/i> (1979). The 1998 Nobel Prizes in physics and in medicine were each shared by three people, which fits October 1998, during the stay in Japan (September–December 1998); the date is estimated. Akemi is not identified.", "img": ["attachments/pages/scan_1997_2_p012.jpg"]}, "2005-03-21_Wearable-Computing-Project-Tune-the-Conversation": {"t": "Wearable Computing Project: Tune the Conversation", "d": "2005-03-21", "est": true, "w": 2005.2215, "era": "New York 2005", "th": ["technology", "communication", "internet", "city"], "pp": [], "body": "<p><code>[two cards taped onto the page]<\/code><br><code>[left card:]<\/code><br>Wearable computing proj. tune the conversation to the person. Two people might be interested in a common friend but a third (or fourth) person who doesn't know the friend is not interested that is. seems very bloggish until you can add the poetry<br><code>[right card:]<\/code><br>What if you could tune the volume on <s>[?]<\/s> the conductor's announcements. Or tune the amount of signage you need to get around. A tourist needs more information about where he is but even the long time resident would be interested in historical, or even weblog-like information about the place where he is.<\/p>", "notes": "Undated, about 2005. Compare \"tourist and observer - Information booth\" in <span class=\"wl\" data-note=\"2005-03-21_To-Do-and-Contacts\">2005 03 21_To Do and Contacts<\/span>.", "img": ["attachments/pages/scan_1997_2_p090.jpg"]}, "1995-08-20_Out-of-Sensory-Deprivation-into-the-Real-World": {"t": "Out of Sensory Deprivation into the Real World", "d": "1995-08-20", "est": false, "w": 1995.6354, "era": "DC, Post-College", "th": ["installation", "perception", "turrell", "photography", "sky"], "pp": ["Robert Irwin", "Turrell", "Hyon In-Sung", "Tina", "Aden Meinel", "Marjorie Meinel"], "body": "<p>8/20/95<br>- I was reading <u>Art &amp; Tech<\/u> catalogue I got today and was thinking of bringing a viewer from the anewhatever (sensory deprivation) space into the real world Not into a Ganzfield environment like Irwin &amp; Turrell <s>where<\/s> were thinking about. I would want to make their process much simpler - take away all perceptions from the viewer so that when they are brought back to the world they just left, it seems brilliant.<\/p>\n<p><b>Next page:<\/b><\/p>\n<p>- I'm thinking of my isolation tower again<br>- and still thinking about the audio feedback -<br>→ sensory<br>Ganzfield which appears &amp; disappears depending on your body rhythyms - brain wave - alpha - detector - Hewlett/Packard.<br>I was also thinking of continuing painting &amp; photo but separating their functions -<br>- paint <u>effect<\/u> w/ a sharp point of focus<br>↳ something looks brighter or darker when it is in the periphery of your vision.<br>→ photography is a different kind of instantaneous sees w/ its own eye which you can control, but is not like yours. The human eye only focuses on less than 5% of viewing field, <s>[?]<\/s> which is much wider than photography I like how photography can be just a simple framing of the world - does not put anything there which isn't there to begin with, only presents it to you in the photographer's way.<br>I wish I had a photo of the rock I was lying next to @ the beach and of Hyon In-Sung &amp; Tina in the light of the gas station with the pale late twilight behind them. I need to look up in Meinel &amp; Meinel what that green stripe, w/ red next to it was up from the spot where the sun set<br><code>[sketch: a horizon with the setting sun and rays rising from it, labelled \"green\" and \"sunset\"; to the right, three heads under a tall light pole, labelled \"gas station lights on faces\"]<\/code><\/p>", "notes": "The \"Art &amp; Tech\" catalogue is probably <i>A Report on the Art and Technology Program of the Los Angeles County Museum of Art, 1967–1971<\/i>, in which Irwin and Turrell worked with the psychologist Edward Wortz on perception; \"anewhatever\" is probably a stab at \"anechoic\" (an anechoic chamber). The isolation tower is the one in <span class=\"wl\" data-note=\"1995-03-12_Asking-the-Viewer-to-Do-Things-a-Tower\">1995 03 12_Asking the Viewer to Do Things a Tower<\/span>. \"Meinel &amp; Meinel\" is Aden and Marjorie Meinel's <i>Sunsets, Twilights, and Evening Skies<\/i> (1983); the green stripe is probably the green flash. Hyon In-Sung and Tina are not identified.", "img": ["attachments/pages/scan_1995_p091.jpg", "attachments/pages/scan_1995_p092.jpg"]}, "1998-10-15_Photo-Day-Electric-Poles-and-Shinagawa": {"t": "Photo Day: Electric Poles and Shinagawa", "d": "1998-10-15", "est": true, "w": 1998.7884, "era": "Japan", "th": ["photography", "japan", "city", "project-list"], "pp": [], "body": "<p><u>Photo<\/u> day ① 500 ~ 1000mm. abstract <s>poles<\/s> electric poles wires etc. nice sun.<br>↳ Ochanomisu green bridge - just look for the wiring.<br>② night shots into offices, transparent quality of office building w/ so many <u>fluorescents<\/u>. - <code>[in black:]<\/code> too difficult.<br>- perhaps buy 500mm <u>Nikon<\/u> as last purchase. (lighter &amp; crisper than USSR model.)<br>↳ maybe I want slide film. w/ Mamiya: unfortunate that I don't have the zoom.<br>[Near Shinagawa is actually quite ripe w/ material. <code>[in black:]<\/code> YES!<\/p>", "notes": "Undated; Tokyo. Ochanomizu and Shinagawa are districts of Tokyo. \"too difficult\" and \"YES!\" are added in black.", "img": ["attachments/pages/scan_1997_2_p027.jpg"]}, "1998-12-15_Garfield-Citation-Index-and-Scandal": {"t": "Garfield, the Citation Index, and Scandal", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["reading", "criticism", "systems"], "pp": ["Eugene Garfield", "Arlene Croce", "Bill T. Jones", "Leo Egghe", "Ronald Rousseau"], "body": "<p>Information Scientist Eugene Garfield<br>→ Science Citation Index → essentially judges a publication by the number of citations it receives -<br>⇒ Scandal problematic - increases worth, importance (beauty) of a scandal<br>⇒ A. Croce - choosing not to see Bill T Jones.<br>- <u>Introduction to Informetrics<\/u> (Elsevier Science Pub, 1990) Leo Egghe &amp; Ronald Rousseau<\/p>", "notes": "Undated. Arlene Croce declined to see Bill T. Jones's <i>Still/Here<\/i> before writing about it (1994); Marco wrote about the same affair in January 1995 (\"Croce and the Undiscussable\").", "img": ["attachments/pages/scan_1997_2_p051.jpg"]}, "1995-02-12_Camus-Opposites": {"t": "Camus' Opposites", "d": "1995-02-12", "est": true, "w": 1995.1135, "era": "Final Semester Yale 1995", "th": ["literature", "space", "project-list"], "pp": ["Camus"], "body": "<p>Perhaps I can do something w/ Camus' opposites: <u>L'Exil et le Royaume<\/u> and <u>L'Envers et l'endroit<\/u> = self / space: 1/0<\/p>", "notes": "Undated; between rules after the 2/12 entry.", "img": ["attachments/pages/scan_1995_p032.jpg"]}, "1998-12-15_Artist-and-Scientist-Understanding-Complexity": {"t": "Artist and Scientist: Understanding Complexity", "d": "1998-12-15", "est": true, "w": 1998.955, "era": "Paris, Beaux-Arts", "th": ["art-vs-science", "knowledge", "communication"], "pp": [], "body": "<p>Perhaps an artist can present to someone a problem in all it's complexity without <s>realising<\/s> necessarily understanding it's details in a way that another person can understand through feeling the complexity of this problem also w/out understanding its details.<br>The scientist builds by completely understanding innumerable details an understanding of the complex problem.<\/p>", "notes": "Undated. \"completely\" is written above the line.", "img": ["attachments/pages/scan_1997_2_p056.jpg"]}, "1994-07-22_Michael-Heizer-vs-James-Turrell": {"t": "Michael Heizer vs. James Turrell", "d": "1994-07-22", "est": false, "w": 1994.5575, "era": "Yale, New Haven", "th": ["land-art", "landscape", "photography", "memory"], "pp": ["Michael Heizer", "Walter De Maria", "James Turrell", "Count Panza", "Italo Calvino"], "body": "<p>There is something I don't like about Michael Heizer's constructions—his holes and objects. He doesn't have a respect for the land or the place where he is building <i>Double Negative<\/i> (exploding huge areas of earth). I am sure that if I were to go visit that work, I would prefer a view further down the canyon where no one could imagine the object, so I could enjoy nature for its own sake.<\/p>\n<p>Count Panza described how the approach to a Greek temple purposely limits your view so that when you finally get to the temple, you turn around (or go beyond it) and are confronted by the view which inspired its construction. Turrell seems i
