# Settings for build_vault.py. Edit, then re-run the script.

source = "~/Pictures/Papa"        # slide rolls (Papa_-_*) and Super8_clips live here
skip = ["Super8", "Super8_quire", "photo-matching"]

# Words that mark a caption sentence as describing the background (see [[themes]]).
background = 'background|distance|distant|horizon|behind|beyond|far|further off'
# Phrases removed before matching themes: the dog is not a shepherd, pigeons
# taking flight are not a plane, a portrait of the Shah on the wall is not a
# portrait theme, a town under a snowy peak (sommet enneigé) is not an expedition.
ignore = ['German shepherd', 'German shepherds', 'taking flight', 'takes flight', 'take flight',
          'flight of steps', 'construction camp', 'portrait of the Shah', "Shah's portrait",
          'framed portrait', 'portrait chah', 'mollah portrait', 'sommet enneige',
          'Speedboat on a lake']

# Rolls where another version of each slide should be shown instead of the scan.
# {stem} is the slide's file name without .jpg, as listed in the README.
[variants]
"Papa_-_1962_Q4_Ekta" = "colorized/{stem}_semantic.jpg"

# Periods: long stretches of time. A roll or reel gets the first period whose
# years include its year, unless `rolls` names it explicitly.
[[periods]]
name = "Afghanistan 1951–52"
years = [1951, 1952]
match = "Afghanistan"             # regex on the folder name

[[periods]]
name = "Rome and Paris 1952"
years = [1952, 1952]
match = "Rome|Paris"

[[periods]]
name = "Iran 1955–65"
years = [1955, 1965]

[[periods]]
name = "Later years"
years = [1966, 1999]

# Themes cut across rolls. They are kept strict on purpose: a slide only gets a
# theme when its caption or file name is clearly about it. Better to add a tag
# by hand than to wade through wrong ones.
#
# A slide or clip gets a theme when:
#   - one of `words` is in its file name (the names describe the main subject), or
#   - one of `words` is in a sentence of its English caption that doesn't also
#     contain `background` words (so "mountains in the distance" doesn't count), or
#   - all the words of one `together` group are in the caption, or
#   - the English caption starts with `starts` (a regex), e.g. "A man in…".
# ...unless one of `unless` appears anywhere (water skiing isn't mountains).
# Matching is case-insensitive and on whole words.
#
# Removing a theme tag from a note sticks: the script won't put it back. Adding
# one by hand sticks too. `themes_status: reviewed` freezes a note's themes.

[[themes]]
name = "Road trips"
words = ['road trip', 'convoy', 'ferry', 'ferried', 'citroën', 'citroen', 'ds', 'beetle', 'mercedes', 'jeep', 'bac', 'col', 'voiture', 'camion']
together = [['car', 'road'], ['car', 'track'], ['truck', 'road'], ['car', 'parked', 'pass']]

[[themes]]
name = "Mountains"
words = ['summit', 'peak', 'glacier', 'damavand', 'demavend', 'alam kuh', 'tochal', 'ski', 'skiing', 'skier', 'skiers', 'ski tow', 'climbing', 'climber', 'climbers', 'mountain pass', 'mountain road', 'mountain walk', 'montagne', 'montagnes', 'sommet', 'col']
unless = ['waterski', 'water ski', 'water-ski', 'water skiing', 'water-skiing', 'water skier', 'ski nautique', 'nautique']

[[themes]]
name = "Markets"
words = ['market', 'markets', 'bazaar', 'bazaars', 'souk', 'market stall', 'market stalls', 'shopkeeper', 'merchant', 'merchants', 'vendor', 'vendors', 'carpet seller', 'marche', 'bazar', 'boutique', 'marchand']

[[themes]]
name = "Locals"
words = ['turban', 'turbans', 'turbaned', 'traditional robes', 'traditional dress', 'traditional clothing', 'traditional clothes', 'villager', 'villagers', 'nomad', 'nomads', 'nomadic', 'chador', 'chadors', 'locals', 'local men', 'local women', 'porter', 'porters', 'tribesmen', 'peasant', 'peasants', 'shepherd', 'camel driver', 'kuchi', 'turkomans', 'villageois', 'paysan', 'paysans']

[[themes]]
name = "Sheep herders"
words = ['sheep', 'shepherd', 'shepherds', 'moutons', 'mouton', 'berger', 'bergers']

[[themes]]
name = "Airplanes"
words = ['plane', 'planes', 'airplane', 'aeroplane', 'aircraft', 'airliner', 'airport', 'airfield', 'aerodrome',
         'runway', 'tarmac', 'apron', 'cockpit', 'wing', 'wing tip', 'wing strut', 'flight', 'flying over',
         'from the air', 'constellation', 'dc-3', 'dc 3', 'convair', 'finnair', 'iran air',
         'avion', 'aeroport', 'aéroport', 'vue aerienne', 'aile']

# Being on the mountain or the trek (camps, climbs, summits, mule caravans),
# not looking at one from the road; that's "Mountains".
[[themes]]
name = "Expeditions"
words = ['expedition', 'trek', 'trekking', 'hike', 'hiking', 'hiker', 'hikers', 'climber', 'climbers',
         'mountaineer', 'mountaineers', 'ascent', 'base camp', 'camp', 'campsite', 'camp site', 'summit',
         'summit ridge', 'crater', 'glacier', 'moraine', 'ice axe', 'penitentes', 'mule caravan', 'pack mule',
         'pack mules', 'rucksack', 'rucksacks', 'backpack', 'cairn', 'scramble', 'trails',
         'expédition', 'randonneur', 'randonneurs', 'randonnee', 'marcheurs', 'alpiniste', 'alpinistes',
         'escalade', 'sommet', 'sommital', 'sommitale', 'eboulis', 'cratere', 'penitents', 'mulets',
         'muletier', 'sac a dos', 'bivouac', 'refuge', 'skieur', 'skis']
together = [['mules', 'gorge']]
unless = ['mast', 'pylone', 'waterski', 'water ski', 'nautique', 'lift', 'chairlift', 'ski lift', 'ski tow',
          'téléski', 'teleski']

# One person or a few as the subject: a caption that starts with them, or says
# portrait / posing / smiling, or names Svetlana, Marcel or Nina. Not crowds.
[[themes]]
name = "Portraits"
words = ['portrait', 'portraits', 'poses', 'posing', 'posed', 'smiling', 'smiles', 'facing the camera',
         'to the camera', 'to camera', 'into the camera', 'couple', 'svetlana', 'marcel', 'nina']
starts = '(an? |the |the same )?(smiling |young |old |bearded |blonde |local )*(man|woman|boy|girl|child|couple|family|shepherd|farmer|cleric|(two|three|four) (men|women|people|children|boys|girls)|group portrait|svetlana|marcel|nina)'
unless = ['crowd', 'crowds', 'foule']

