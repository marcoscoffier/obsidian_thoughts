         'from the boat', 'from a boat', 'from the ferry', 'from the deck', 'from the ship', 'from the sea',
         'from the river', 'onboard', 'outboard motor', 'sightseeing boat', 'boat tour', 'boat trip', 'cruise', 'at sea', 'underway', 'bow', 'funnel', 'funnels',
