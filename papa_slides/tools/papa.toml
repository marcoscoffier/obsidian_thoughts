         'waterski', 'water ski', 'water-ski', 'water skiing', 'water-skiing', 'water skier', 'water skiers',
         'ski nautique', 'kite skiing', 'speedboat', 'speedboats', 'motorboat', 'outboard motor', 'onboard views']
unless = ['antenna', 'antenne', 'mast', 'pylone', 'transmitter', 'engineering', 'radio']

# Being on a boat: ferries, the 1959 sea voyage, the SS France, sightseeing boats
# in New York, the Norwegian cruise, sailing in Lebanon. Not boats seen from the shore.
[[themes]]
