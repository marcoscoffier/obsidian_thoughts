         'swim', 'swims', 'swimming', 'swimmer', 'swimmers', 'bather', 'bathers', 'bathing', 'baigneur', 'baigneurs',
         'baigneuse', 'baignade', 'swimsuit', 'swimsuits', 'swimwear', 'bikini', 'bathing suit', 'maillot',
