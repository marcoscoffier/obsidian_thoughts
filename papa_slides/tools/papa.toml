words = ['antenna', 'antennas', 'antennae', 'antenne', 'lattice mast', 'antenna mast', 'pylone', 'guy wires', 'haubans',
         'transmitter', 'transmitters', 'emetteurs', 'emetteur', 'radio station', 'radio site', 'station radio', 'site radio',
         'microwave relay', 'relay', 'control room', 'salle controle', 'telephone exchange', 'central telephonique',
         'dam', 'dams', 'barrage', 'power station', 'power plant', 'centrale electrique',
         'railway construction', 'railway works', 'railway viaduct', 'track-laying', 'track laying', 'laying railway',
         'pose voie', 'sleepers', 'viaduct', 'viaduc', 'rail welding', 'soudure rail',
         'road works', 'under construction', 'chantier', 'construction']
unless = ['ski lift', 'ski tow', 'lift', 'waterski', 'water-skiing', 'water skiing', 'pedal boats', 'bathers',
          'construction crane', 'band-e amir', 'band e amir']

# Beaches, swimming (sea, rivers, pools), water skiing and the speedboat at Karaj. A pool alone (a garden
