# Places that build_vault.py looks for. Edit, then re-run the script.
#
# A slide gets a place when one of its `aliases` appears in its English caption,
# its box caption or its file name (clips: description, title, tags). A name
# followed by "?" or "(?)", or after "possibly"/"perhaps"/"probably", goes in
# `places_maybe` instead of `places`. A place found only in a file name is
# uncertain too when the roll's README only ever names it with a "?".
# A slide that names no place takes its roll's place, when the roll's title,
# box text or folder name names exactly one place (`place_source: roll`).
#
# Captions are matched case-sensitively; file names and clip tags in lower case,
# except for aliases listed in `exact` (words that are also ordinary words).
# A place with `country = ""` is left without a country; Jerusalem and
# Bethlehem are like that because who held them changed over the years.

exact = ["Nice", "Nil", "Rey", "Seine"]

