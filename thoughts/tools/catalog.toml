# What tools/build_vault.py knows about each text in metm.org/marco/thoughts.
#
# Per text:
#   file     the original file (Mac Roman text, never changed)
#   title    from the text's own title line where it has one
#   skip     how many non-blank lines at the top are a cover sheet (name, teacher,
#            course, date, title). They are kept, verbatim, in a "Cover sheet" box.
#   date     only when it is written on the page; otherwise year + dated = "estimated"
#   themes   strict: only when the theme is what the text is about (see [[theme]])
#   group    texts that are versions or parts of the same piece link to each other
#
# Edit this file and rerun build_vault.py; notes you have edited in Obsidian are
# left alone (see the script).

source = "/home/marco/Projects/obsidian/metm.org/marco/thoughts"

# ---------------------------------------------------------------- themes

[[theme]]
name = "Experiencing space"
about = "How space, depth and distance are lived rather than measured: the senior essay on Merleau-Ponty, Bachelard, Camus and Saint-Exupéry, its notes and fragments, and the art texts that come out of the same question."
not = "Pictorial space in paintings (Hopper, Diebenkorn) is left out: that is space on a canvas, not space experienced."

[[theme]]
name = "Seen from the air"
about = "The view from a plane as a new way of seeing: Saint-Exupéry, the mountain climbed versus the mountain flown around, the ocean crossing in the senior essay notes."
not = "The Meinel letter mentions an observer aloft only as a point in a refraction diagram."

[[theme]]
name = "Light, sky and shadow"
about = "Sunlight, sky colour, twilight and shadow as subject matter: the 1995 installations, the quotations gathered for them, the letter on atmospheric refraction, the sunlit bathroom of the sculpture notes."

[[theme]]
name = "Installations and studio work"
about = "Texts that belong to his own art: printed directions handed to viewers, labels, sketches for pieces, notes toward sculpture, the Beaux-Arts statement."
not = "'Transparency' (two words) may belong here, but nothing in it says so."

[[theme]]
name = "Mirrors and reflection"
about = "Mirrors, looking-glasses and reflections as the thing being thought about: Woolf's looking-glass, Hoffmann's glass darkly, Ashbery's convex mirror and Merrill's mirror, confession held up as a mirror, the mirrored installations."

[[theme]]
name = "Word and image"
about = "Poetry and painting (and music, and film) set side by side: ekphrasis, the Word and Image papers, Hegel's ranking of the arts, the writer's domain against the painter's."

[[theme]]
name = "Reality and representation"
about = "The gap between a real experience and what a poem, a story or a memory can make of it: Wordsworth's leech-gatherer, Stevens's 'poem of pure reality', Woolf's and Hoffmann's glasses, Proust's goodnight kiss, a happy morning that a poem could not convey."
not = "Ulysses ends on 'a type of simulated reality', but the paper is about repetition; left out."

[[theme]]
name = "Avant-garde and abstraction"
about = "Twentieth-century art against or after the avant-garde: Malevich, Duchamp and Cage, Dubuffet's radicalism, Diebenkorn leaving abstraction, Hopper and Covert against Greenberg."

[[theme]]
name = "What art is"
about = "What makes something art, or someone an artist, and how a work is judged: the essay on the word 'artist', Balzac's unknown masterpiece, Gautier's theory, Kant's taste, Hegel's ranking, Lu Chi's poetics, Proust's artistic process, the Beaux-Arts statement of motives."

[[theme]]
name = "Icons made human"
about = "Religious images looked at for their humanity: the ivory Christ whose lost arms make him more human, Taddeo's veiny John the Baptist against Nardo's, Giovanni da Milano's emotional Joachim and Anna."

[[theme]]
name = "Language and mind"
about = "The Language and Mind course (Pinker, Jackendoff, Lakoff): how words, grammar and categories live in the mind."

[[theme]]
name = "Gender and desire"
about = "Sex, gender and desire as the subject: the male feminist critic, women and the imagination in Don Quixote, Balzac's comparison of paintings and women."

